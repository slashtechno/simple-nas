[defaults]
# roles_path: ~/.ansible/roles = Galaxy-installed roles (not committed to git)
#             roles             = our custom roles (committed to git)
# Ansible searches left to right when resolving a role name.
roles_path = ~/.ansible/roles:roles

# remote_user is intentionally NOT set here.
# Set ansible_user per host in inventory/hosts.yml — Pi OS forces a custom username on first boot.

inventory = inventory/hosts.yml
result_format = yaml
collections_path = ~/.ansible/collections
# Fixed instead of auto-discovered: every host is Debian-family (site.yml asserts it), where this path exists.
# Stops the "discovered Python interpreter" warning when a host's Python version changes.
interpreter_python = /usr/bin/python3

[privilege_escalation]
# Every task runs as root via sudo — you never see sudo in task files.
become = True
become_method = sudo

[ssh_connection]
# Runs modules over the existing SSH connection instead of copying a file per task: faster deploys.
pipelining = True
# Every deploy runs as root, so a host's SSH key is checked: accept-new saves the key of a host seen for the first time, and
# refuses one whose key changed (a reinstalled host: ssh-keygen -R <ansible_host>). The other options are Ansible's own defaults.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
