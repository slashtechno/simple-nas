---
# Full deployment playbook.
# Run with: ansible-playbook site.yml --ask-vault-pass
#
# Two plays: every server gets the base roles, then the NAS group gets storage, services and backups.
# To deploy one host only:     --limit pi4
# To deploy one service only:  --tags immich
# To disable services permanently, set <name>_enabled: false in group_vars/nas/vars.yml

- name: Base setup for every server
  hosts: servers
  become: true

  pre_tasks:
    - name: Check the host runs a Debian-family OS
      ansible.builtin.assert:
        that: ansible_facts['os_family'] == "Debian"
        fail_msg: "{{ inventory_hostname }} is {{ ansible_facts['os_family'] }}; the roles use apt and need Debian, Raspberry Pi OS or Ubuntu."
        quiet: true
      tags: [always]

    # The Docker role installs Docker Engine from Docker's apt repo; a snap Docker next to it
    # would be a second daemon with its own storage and confusing socket paths.
    - name: Look for a Docker snap
      ansible.builtin.stat:
        path: /snap/bin/docker
      register: docker_snap
      tags: [always]

    - name: Check Docker is not installed as a snap
      ansible.builtin.assert:
        that: not docker_snap.stat.exists
        fail_msg: >-
          Docker is installed as a snap on {{ inventory_hostname }}. Remove it (sudo snap remove docker)
          and let this playbook install Docker from Docker's apt repo.
        quiet: true
      tags: [always]

  roles:
    - role: common
      tags: [common]

    - role: tailscale
      tags: [tailscale]

    - role: network
      tags: [network]

- name: Deploy NAS
  hosts: nas
  become: true

  pre_tasks:
    # Catches a missing or incomplete vault.yml. (An encrypted vault with no password given
    # fails earlier, when Ansible loads the variables: use --ask-vault-pass or `just deploy`.)
    - name: Check the vault is loaded
      ansible.builtin.assert:
        that: vault_restic_password is defined
        fail_msg: "vault_restic_password is not defined: group_vars/nas/vault.yml is missing or incomplete. Copy vault.yml.example and fill it in."
        quiet: true
      tags: [always]

  roles:
    - role: storage
      tags: [storage]
      when: storage_enabled | default(true)

    - role: tailscale_funnel
      tags: [tailscale]

    - role: immich
      tags: [immich]
      when: immich_enabled | default(true)

    - role: copyparty
      tags: [copyparty]
      when: copyparty_enabled | default(true)

    - role: gitea
      tags: [gitea]
      when: gitea_enabled | default(true)

    - role: homebridge
      tags: [homebridge]
      when: homebridge_enabled | default(true)

    - role: pics
      tags: [pics]
      when: pics_enabled | default(false)

    - role: crafty
      tags: [crafty]
      when: crafty_enabled | default(false)

    - role: cloudflared
      tags: [cloudflared]
      when: cloudflared_enabled | default(true)

    - role: garage
      tags: [garage]
      when: garage_enabled | default(false)

    - role: backup
      tags: [backup]
      when: backup_enabled | default(true)

    - role: backup-status
      tags: [backup-status]
      when: backup_status_enabled | default(true)

- name: Ad-hoc app platform for general servers
  hosts: servers_general
  become: true

  roles:
    - role: dockge
      tags: [dockge]
      when: dockge_enabled | default(true)

    - role: caddy
      tags: [caddy]
      when: caddy_enabled | default(false)
