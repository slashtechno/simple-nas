---
# Full deployment playbook.
# Run with: ansible-playbook site.yml --ask-vault-pass
#
# One play over every server. The base roles (drives, packages, Docker, Tailscale, network) run
# everywhere; each service role runs where `<name>_enabled` is true, which group_vars or host_vars set
# (default: false, in group_vars/all/vars.yml).
# To deploy one host only:     --limit pi4
# To deploy one service only:  --tags immich
# To stop deploying a service: set <name>_enabled: false for the host or group.

- name: Deploy every server
  hosts: servers
  become: true

  pre_tasks:
    - name: Check the host runs a Debian-family OS
      ansible.builtin.assert:
        that: ansible_facts['os_family'] == "Debian"
        fail_msg: "{{ inventory_hostname }} is {{ ansible_facts['os_family'] }}; the roles use apt and need Debian, Raspberry Pi OS or Ubuntu."
        quiet: true
      tags: [always]

    # The Docker role installs Docker Engine from Docker's apt repo; a snap Docker next to it
    # would be a second daemon with its own storage and confusing socket paths.
    - name: Look for a Docker snap
      ansible.builtin.stat:
        path: /snap/bin/docker
      register: docker_snap
      tags: [always]

    - name: Check Docker is not installed as a snap
      ansible.builtin.assert:
        that: not docker_snap.stat.exists
        fail_msg: >-
          Docker is installed as a snap on {{ inventory_hostname }}. Remove it (sudo snap remove docker)
          and let this playbook install Docker from Docker's apt repo.
        quiet: true
      tags: [always]

  tasks:
    # Drives first: docker_data_root (common) may sit on one, and Docker waits for its mount.
    - name: Mount the drives
      ansible.builtin.import_role:
        name: storage
      tags: [storage]
      when: storage_enabled | bool

    - name: Install the base packages and Docker
      ansible.builtin.import_role:
        name: common
      tags: [common]

    - name: Install Tailscale
      ansible.builtin.import_role:
        name: tailscale
      tags: [tailscale]

    - name: Set up the Docker network and the direct link
      ansible.builtin.import_role:
        name: network
      tags: [network]

    # Docker restarts here, before any service container exists.
    - name: Apply the base roles' handlers
      ansible.builtin.meta: flush_handlers

    # The funnel publishes Copyparty, and needs Tailscale joined (by hand, docs/networking.md).
    - name: Tailscale Funnel for Copyparty
      ansible.builtin.import_role:
        name: tailscale_funnel
      tags: [tailscale]
      when: copyparty_enabled | bool

    - name: Deploy immich
      ansible.builtin.import_role:
        name: immich
      tags: [immich]
      when: immich_enabled | bool

    - name: Deploy copyparty
      ansible.builtin.import_role:
        name: copyparty
      tags: [copyparty]
      when: copyparty_enabled | bool

    - name: Deploy gitea
      ansible.builtin.import_role:
        name: gitea
      tags: [gitea]
      when: gitea_enabled | bool

    - name: Deploy homebridge
      ansible.builtin.import_role:
        name: homebridge
      tags: [homebridge]
      when: homebridge_enabled | bool

    - name: Deploy pics
      ansible.builtin.import_role:
        name: pics
      tags: [pics]
      when: pics_enabled | bool

    - name: Deploy crafty
      ansible.builtin.import_role:
        name: crafty
      tags: [crafty]
      when: crafty_enabled | bool

    - name: Deploy dockge
      ansible.builtin.import_role:
        name: dockge
      tags: [dockge]
      when: dockge_enabled | bool

    - name: Deploy caddy
      ansible.builtin.import_role:
        name: caddy
      tags: [caddy]
      when: caddy_enabled | bool

    - name: Deploy cloudflared
      ansible.builtin.import_role:
        name: cloudflared
      tags: [cloudflared]
      when: cloudflared_enabled | bool

    - name: Deploy garage
      ansible.builtin.import_role:
        name: garage
      tags: [garage]
      when: garage_enabled | bool

    - name: Deploy backup
      ansible.builtin.import_role:
        name: backup
      tags: [backup]
      when: backup_enabled | bool

    - name: Deploy ntfy
      ansible.builtin.import_role:
        name: ntfy
      tags: [ntfy]
      when: ntfy_enabled | bool

    - name: Deploy backup-status
      ansible.builtin.import_role:
        name: backup_status
      tags: [backup_status]
      when: backup_status_enabled | bool
