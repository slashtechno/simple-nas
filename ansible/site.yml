---
# Full deployment playbook.
# Run with: ansible-playbook site.yml --vault-password-file .vault-pass
#
# One play over every server. The base roles (common, network) run everywhere, and so do storage and Tailscale unless their switches
# (storage_enabled, tailscale_enabled; default true) are off; each service role runs where `<name>_enabled` is true, which host_vars/<host>/vars.yml sets
# (default: false, in group_vars/all/defaults-flags.yml).
# To deploy one host only:     --limit pi4
# To deploy one service only:  --tags immich
# To stop deploying a service: set <name>_enabled: false for the host.

- name: Deploy every server
  hosts: servers
  become: true

  pre_tasks:
    - name: Check the host runs a Debian-family OS
      ansible.builtin.assert:
        that: ansible_facts['os_family'] == "Debian"
        fail_msg: "{{ inventory_hostname }} is {{ ansible_facts['os_family'] }}; the roles use apt and need Debian, Raspberry Pi OS or Ubuntu."
        quiet: true
      tags: [always]

    # The Docker role installs Docker Engine from Docker's apt repo; a snap Docker next to it
    # would be a second daemon with its own storage and confusing socket paths.
    - name: Look for a Docker snap
      ansible.builtin.stat:
        path: /snap/bin/docker
      register: docker_snap
      tags: [always]

    - name: Check Docker is not installed as a snap
      ansible.builtin.assert:
        that: not docker_snap.stat.exists
        fail_msg: >-
          Docker is installed as a snap on {{ inventory_hostname }}. Remove it (sudo snap remove docker)
          and let this playbook install Docker from Docker's apt repo.
        quiet: true
      tags: [always]

    # A web service needs a host port, or a Caddy name (caddy_enabled, a private domain and a subdomain); with neither, nothing can reach it.
    - name: Check every web service has a host port or a Caddy name
      ansible.builtin.assert:
        that: >-
          lookup('ansible.builtin.vars', item.key ~ '_port', default='') != ''
          or (caddy_enabled | bool and caddy_private_domains | length > 0 and lookup('ansible.builtin.vars', item.key ~ '_subdomain', default='') != '')
        fail_msg: >-
          {{ item.name }} has no host port ({{ item.key }}_port: "") and no Caddy name. Give it a port, or turn on
          caddy_enabled and caddy_private_domains and keep {{ item.key }}_subdomain non-empty (docs/caddy-reference.md).
        quiet: true
      loop: "{{ web_services | rejectattr('port', 'defined') | list }}"
      loop_control:
        label: "{{ item.name }}"
      when: lookup('ansible.builtin.vars', item.key ~ '_enabled', default='') | bool
      tags: [always]

    # An app that signs in through Tinyauth needs the login page's name (Tinyauth with Caddy and a private domain) and
    # the client secret Tinyauth checks (oidc in services.yml, docs/auth-reference.md#sign-in-with-tinyauth-oidc).
    - name: Check every app that signs in through Tinyauth has what it needs
      ansible.builtin.assert:
        that:
          - tinyauth_enabled | bool
          - caddy_enabled | bool
          - caddy_private_domains | length > 0
          - lookup('ansible.builtin.vars', item.oidc_secret, default='') != ''
          - item.oidc | select('search', '://[.]') | list | length == 0   # an empty subdomain or private domain
        fail_msg: >-
          Signing {{ item.name }} in through Tinyauth needs tinyauth and caddy switched on with a caddy_private_domains
          entry, and {{ item.oidc_secret }} in the vault that applies to {{ inventory_hostname }}
          (vault.yml.example says how to make it).
        quiet: true
      loop: "{{ services | selectattr('key', 'in', oidc_service_keys) | list }}"
      loop_control:
        label: "{{ item.name }}"
      tags: [always]

  tasks:
    # Drives first: docker_data_root (common) may sit on one.
    - name: Mount the drives
      ansible.builtin.import_role:
        name: storage
      tags: [storage]
      when: storage_enabled | bool

    - name: Install the base packages and Docker
      ansible.builtin.import_role:
        name: common
      tags: [common]

    - name: Tune a Raspberry Pi
      ansible.builtin.import_role:
        name: pi
      tags: [pi]
      when: pi_enabled | string | lower != 'false'

    - name: Set up zram swap
      ansible.builtin.import_role:
        name: zram
      tags: [zram]
      when: zram_enabled | bool

    - name: Install Tailscale
      ansible.builtin.import_role:
        name: tailscale
      tags: [tailscale]
      when: tailscale_enabled | bool

    - name: Set up encryption
      ansible.builtin.import_role:
        name: encryption
      tags: [encryption]

    - name: Set up the Docker network and the direct link
      ansible.builtin.import_role:
        name: network
      tags: [network]

    - name: Deploy or remove the connectivity watchdog
      ansible.builtin.import_role:
        name: connectivity_watchdog
      tags: [connectivity_watchdog]

    # Docker restarts here, before any service container exists.
    - name: Apply the base roles' handlers
      ansible.builtin.meta: flush_handlers

    # Before the services: an app that signs in through Tinyauth fetches the login page's settings as it starts
    # (roles/gitea/tasks/sso.yml), and Caddy's first build compiles Caddy and takes 20+ minutes on a small host.
    - name: Deploy caddy
      ansible.builtin.import_role:
        name: caddy
      tags: [caddy]
      when: caddy_enabled | bool

    - name: Deploy tinyauth
      ansible.builtin.import_role:
        name: tinyauth
      tags: [tinyauth]
      when: tinyauth_enabled | bool

    - name: Deploy immich
      ansible.builtin.import_role:
        name: immich
      tags: [immich]
      when: immich_enabled | bool

    - name: Deploy copyparty
      ansible.builtin.import_role:
        name: copyparty
      tags: [copyparty]
      when: copyparty_enabled | bool

    - name: Deploy gitea
      ansible.builtin.import_role:
        name: gitea
      tags: [gitea]
      when: gitea_enabled | bool

    - name: Deploy homebridge
      ansible.builtin.import_role:
        name: homebridge
      tags: [homebridge]
      when: homebridge_enabled | bool

    - name: Deploy pics
      ansible.builtin.import_role:
        name: pics
      tags: [pics]
      when: pics_enabled | bool

    - name: Deploy crafty
      ansible.builtin.import_role:
        name: crafty
      tags: [crafty]
      when: crafty_enabled | bool

    - name: Deploy dockge
      ansible.builtin.import_role:
        name: dockge
      tags: [dockge]
      when: dockge_enabled | bool

    - name: Deploy homepage
      ansible.builtin.import_role:
        name: homepage
      tags: [homepage]
      when: homepage_enabled | bool

    - name: Deploy cloudflared
      ansible.builtin.import_role:
        name: cloudflared
      tags: [cloudflared]
      when: cloudflared_enabled | bool

    - name: Deploy garage
      ansible.builtin.import_role:
        name: garage
      tags: [garage]
      when: garage_enabled | bool

    - name: Deploy backup
      ansible.builtin.import_role:
        name: backup
      tags: [backup]
      when: backup_local_enabled | bool or backup_cloud_enabled | bool

    - name: Deploy dozzle
      ansible.builtin.import_role:
        name: dozzle
      tags: [dozzle]
      when: dozzle_enabled | bool

    - name: Deploy scrutiny
      ansible.builtin.import_role:
        name: scrutiny
      tags: [scrutiny]
      when: scrutiny_enabled | bool

    - name: Deploy ntfy
      ansible.builtin.import_role:
        name: ntfy
      tags: [ntfy]
      when: ntfy_enabled | bool

    - name: Deploy backup-status
      ansible.builtin.import_role:
        name: backup_status
      tags: [backup_status]
      when: backup_status_enabled | bool
