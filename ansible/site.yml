---
# Full deployment playbook.
# Run with: ansible-playbook site.yml --vault-password-file .vault-pass
#
# One play over every server. The base roles (drives, packages, Docker, Tailscale, network) run
# everywhere; each service role runs where `<name>_enabled` is true, which host_vars/<host>/vars.yml sets
# (default: false, in group_vars/all/defaults.yml).
# To deploy one host only:     --limit pi4
# To deploy one service only:  --tags immich
# To stop deploying a service: set <name>_enabled: false for the host.

- name: Deploy every server
  hosts: servers
  become: true

  pre_tasks:
    - name: Check the host runs a Debian-family OS
      ansible.builtin.assert:
        that: ansible_facts['os_family'] == "Debian"
        fail_msg: "{{ inventory_hostname }} is {{ ansible_facts['os_family'] }}; the roles use apt and need Debian, Raspberry Pi OS or Ubuntu."
        quiet: true
      tags: [always]

    # The Docker role installs Docker Engine from Docker's apt repo; a snap Docker next to it
    # would be a second daemon with its own storage and confusing socket paths.
    - name: Look for a Docker snap
      ansible.builtin.stat:
        path: /snap/bin/docker
      register: docker_snap
      tags: [always]

    - name: Check Docker is not installed as a snap
      ansible.builtin.assert:
        that: not docker_snap.stat.exists
        fail_msg: >-
          Docker is installed as a snap on {{ inventory_hostname }}. Remove it (sudo snap remove docker)
          and let this playbook install Docker from Docker's apt repo.
        quiet: true
      tags: [always]

    # A web service needs a host port, or a Caddy name (caddy_enabled, a private domain and a subdomain); with neither, nothing can reach it.
    - name: Check every web service has a host port or a Caddy name
      ansible.builtin.assert:
        that: >-
          lookup('ansible.builtin.vars', item.key ~ '_port', default='') != ''
          or (caddy_enabled | bool and caddy_private_domains | length > 0 and lookup('ansible.builtin.vars', item.key ~ '_subdomain', default='') != '')
        fail_msg: >-
          {{ item.name }} has no host port ({{ item.key }}_port: "") and no Caddy name. Give it a port, or turn on
          caddy_enabled and caddy_private_domains and keep {{ item.key }}_subdomain non-empty (docs/caddy-reference.md).
        quiet: true
      loop: "{{ web_services | rejectattr('port', 'defined') | list }}"
      loop_control:
        label: "{{ item.name }}"
      when: lookup('ansible.builtin.vars', item.key ~ '_enabled', default='') | bool
      tags: [always]

    # Runs on every deploy, even with --tags: a service role writing into a locked folder would fill the empty
    # directory under the mount point, and that data would be hidden at the next unlock.
    - name: Check the encrypted folders are set up and unlocked
      when: encryption_enabled | bool
      tags: [always]
      block:
        # Separate from the loop below: a loop over an empty list runs nothing and would pass.
        - name: Check there is at least one encrypted folder
          ansible.builtin.assert:
            that: encrypted_folders | length > 0
            fail_msg: encryption_enabled is true but encrypted_folders is empty (docs/encryption.md).
            quiet: true

        - name: Check each encrypted folder has two different folders
          ansible.builtin.assert:
            that:
              - item.cipher_dir is defined and item.mount is defined
              - >-
                encrypted_folders | selectattr('cipher_dir', 'equalto', item.mount) | list | length == 0
                and not item.cipher_dir.startswith(item.mount ~ '/')
                and not item.mount.startswith(item.cipher_dir ~ '/')
            fail_msg: >-
              Each encrypted_folders entry needs a cipher_dir and a mount, and the two must be
              different folders, neither inside the other (docs/encryption.md).
            quiet: true
          loop: "{{ encrypted_folders }}"
          loop_control:
            label: "{{ item.mount | default('?') }}"

        - name: Look for .mounted in each encrypted folder
          ansible.builtin.stat:
            path: "{{ item.mount }}/.mounted"
          register: encrypted_mounted
          loop: "{{ encrypted_folders }}"
          loop_control:
            label: "{{ item.mount }}"

        - name: Check each encrypted folder is unlocked
          ansible.builtin.assert:
            that: item.stat.exists
            fail_msg: >-
              {{ item.item.mount }} is locked, or was never set up (no .mounted file inside it). Run
              sudo {{ scripts_dir }}/unlock.sh on {{ inventory_hostname }}, or create the folder first (docs/encryption.md#create-a-folder).
            quiet: true
          loop: "{{ encrypted_mounted.results }}"
          loop_control:
            label: "{{ item.item.mount }}"

  tasks:
    # Drives first: docker_data_root (common) may sit on one.
    - name: Mount the drives
      ansible.builtin.import_role:
        name: storage
      tags: [storage]
      when: storage_enabled | bool

    - name: Install the base packages and Docker
      ansible.builtin.import_role:
        name: common
      tags: [common]

    - name: Install Tailscale
      ansible.builtin.import_role:
        name: tailscale
      tags: [tailscale]
      when: tailscale_enabled | bool

    - name: Set up encrypted folders
      ansible.builtin.import_role:
        name: encryption
      tags: [encryption]
      when: encryption_enabled | bool

    - name: Set up the Docker network and the direct link
      ansible.builtin.import_role:
        name: network
      tags: [network]

    # Docker restarts here, before any service container exists.
    - name: Apply the base roles' handlers
      ansible.builtin.meta: flush_handlers

    - name: Deploy immich
      ansible.builtin.import_role:
        name: immich
      tags: [immich]
      when: immich_enabled | bool

    - name: Deploy copyparty
      ansible.builtin.import_role:
        name: copyparty
      tags: [copyparty]
      when: copyparty_enabled | bool

    - name: Deploy gitea
      ansible.builtin.import_role:
        name: gitea
      tags: [gitea]
      when: gitea_enabled | bool

    - name: Deploy homebridge
      ansible.builtin.import_role:
        name: homebridge
      tags: [homebridge]
      when: homebridge_enabled | bool

    - name: Deploy pics
      ansible.builtin.import_role:
        name: pics
      tags: [pics]
      when: pics_enabled | bool

    - name: Deploy crafty
      ansible.builtin.import_role:
        name: crafty
      tags: [crafty]
      when: crafty_enabled | bool

    - name: Deploy dockge
      ansible.builtin.import_role:
        name: dockge
      tags: [dockge]
      when: dockge_enabled | bool

    - name: Deploy homepage
      ansible.builtin.import_role:
        name: homepage
      tags: [homepage]
      when: homepage_enabled | bool

    - name: Deploy caddy
      ansible.builtin.import_role:
        name: caddy
      tags: [caddy]
      when: caddy_enabled | bool

    - name: Deploy cloudflared
      ansible.builtin.import_role:
        name: cloudflared
      tags: [cloudflared]
      when: cloudflared_enabled | bool

    - name: Deploy garage
      ansible.builtin.import_role:
        name: garage
      tags: [garage]
      when: garage_enabled | bool

    - name: Deploy backup
      ansible.builtin.import_role:
        name: backup
      tags: [backup]
      when: backup_local_enabled | bool or backup_cloud_enabled | bool

    - name: Deploy ntfy
      ansible.builtin.import_role:
        name: ntfy
      tags: [ntfy]
      when: ntfy_enabled | bool

    - name: Deploy backup-status
      ansible.builtin.import_role:
        name: backup_status
      tags: [backup_status]
      when: backup_status_enabled | bool
