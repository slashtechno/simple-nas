---
# Fetches the plugins listed in `plugins` (group_vars/all), checks them together with the ones kept in plugins/, and writes
# group_vars/all/plugins.yml. Run it with `just plugins` to see what the plugins would do; site.yml and teardown.yml run the same
# tasks (plugins_prepare.yml) before anything else. The plugin docs: docs/writing-a-plugin.md.
- name: Fetch and check the plugins
  hosts: localhost
  connection: local
  gather_facts: false
  become: false   # ansible.cfg turns it on for every play, and sudo would ask for a password here
  tasks:
    - name: Fetch, check and write the plugins
      ansible.builtin.import_tasks: plugins_prepare.yml
