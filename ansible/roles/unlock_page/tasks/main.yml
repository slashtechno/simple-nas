---
# A web page that shows, unlocks and locks the encrypted folders of this host (docs/encryption.md#unlock-page). It has no SSH key and no
# passphrase: it connects to a socket that only root can use, and a small script on the host runs the fixed unlock.sh command.
- name: Check the page has a login and a name
  ansible.builtin.assert:
    that:
      - tinyauth_enabled | bool
      - caddy_enabled | bool
      - caddy_private_domains | length > 0
    fail_msg: >-
      unlock_page_enabled needs tinyauth_enabled, caddy_enabled and caddy_private_domains on {{ inventory_hostname }}:
      the page has no login of its own, and anyone who reaches it can unlock and lock the folders.
    quiet: true

- name: Check there is something to unlock, and the passphrase to do it with
  ansible.builtin.assert:
    that:
      - encrypted_folders | length > 0
      - vault_encryption_passphrase is defined
    fail_msg: >-
      unlock_page_enabled needs encrypted_folders on {{ inventory_hostname }}, and vault_encryption_passphrase in
      group_vars/all/vault.yml (docs/encryption.md#unlock-page).
    quiet: true

# Root only: unlock.sh reads it. It is not in the compose directory, which is the image's build context.
- name: Write the passphrase where only root can read it
  ansible.builtin.copy:
    content: "{{ vault_encryption_passphrase }}"
    dest: "{{ unlock_passphrase_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Install the request script
  ansible.builtin.template:
    src: unlock-page-request.sh.j2
    dest: "{{ scripts_dir }}/unlock-page-request.sh"
    owner: root
    group: root
    mode: "0750"

- name: Install the socket and its service
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [unlock-page.socket, unlock-page@.service]

- name: Listen on the socket, now and at every boot
  ansible.builtin.systemd:
    name: unlock-page.socket
    enabled: true
    state: started
    daemon_reload: true

- name: Create the page's directory
  ansible.builtin.file:
    path: "{{ services_dir }}/unlock-page"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Deploy the page's files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ services_dir }}/unlock-page/{{ item }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  loop:
    - app.py
    - Dockerfile

- name: Render the page's docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ services_dir }}/unlock-page/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0640"

# build: always rebuilds the image from the copied files, and compose recreates the container when the image or the
# compose file changed.
- name: Build and start the unlock page
  community.docker.docker_compose_v2:
    project_src: "{{ services_dir }}/unlock-page"
    state: present
    build: always
