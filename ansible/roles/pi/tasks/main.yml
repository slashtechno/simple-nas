# Raspberry Pi tweaks (pi_enabled). auto, the default, runs them on a Pi and skips any other host; false never gets here.
# Add a new Pi-only tweak as a task in the block below.
- name: Check pi_enabled is auto or false
  ansible.builtin.assert:
    that: pi_enabled | string | lower == 'auto'
    fail_msg: "pi_enabled is {{ pi_enabled }}; use auto, or false to skip the Pi tweaks (docs/memory.md)."
    quiet: true

- name: Read the board model
  ansible.builtin.command: cat /proc/device-tree/model
  register: pi_model
  changed_when: false
  failed_when: false
  check_mode: false

- name: Note whether this host is a Raspberry Pi
  ansible.builtin.set_fact:
    pi_is_raspberry: "{{ 'Raspberry Pi' in pi_model.stdout }}"

- name: Tune a Raspberry Pi
  when: pi_is_raspberry
  block:
    - name: Look for the firmware command line file
      ansible.builtin.stat:
        path: "{{ pi_cmdline_file }}"
      register: pi_cmdline_stat

    - name: Check the firmware command line file exists
      ansible.builtin.assert:
        that: pi_cmdline_stat.stat.exists
        fail_msg: >-
          {{ inventory_hostname }} is a Raspberry Pi without {{ pi_cmdline_file }}. Set pi_cmdline_file to where its image keeps
          the file, or pi_enabled to false (docs/memory.md).
        quiet: true

    # Pi firmware passes cgroup_disable=memory to the kernel, so Docker cannot enforce mem_limit. Adding the arguments in
    # pi_cmdline_args to the file's single line turns the controller on at the next boot. The file is one line: a stray
    # newline can stop the Pi booting, so the arguments are joined with spaces and one newline ends the line; backup keeps
    # the old file beside it. Arguments already there are not added twice.
    - name: Read the firmware command line
      ansible.builtin.slurp:
        src: "{{ pi_cmdline_file }}"
      register: pi_cmdline

    - name: Turn on the memory cgroup (applies after a reboot)  # noqa: risky-file-permissions (FAT boot partition: mount options set the mode)
      vars:
        pi_words: "{{ (pi_cmdline.content | b64decode).split() }}"
        pi_missing: "{{ pi_cmdline_args | difference(pi_words) }}"
      ansible.builtin.copy:
        content: "{{ (pi_words + pi_missing) | join(' ') }}\n"
        dest: "{{ pi_cmdline_file }}"
        backup: true
      when: pi_missing | length > 0
