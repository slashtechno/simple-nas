# Raspberry Pi only (pi_enabled). Each task edits a firmware file that exists only on a Pi; add a new Pi-only tweak as a task here.
- name: Read the board model
  ansible.builtin.command: cat /proc/device-tree/model
  register: pi_model
  changed_when: false
  failed_when: false
  check_mode: false

- name: Look for the firmware command line file
  ansible.builtin.stat:
    path: "{{ pi_cmdline_file }}"
  register: pi_cmdline_stat

- name: Refuse to run on anything but a Raspberry Pi
  ansible.builtin.assert:
    that:
      - "'Raspberry Pi' in pi_model.stdout"
      - pi_cmdline_stat.stat.exists
    fail_msg: >-
      {{ inventory_hostname }} is not a Raspberry Pi running with {{ pi_cmdline_file }}. Set pi_enabled to false for
      this host (docs/memory.md).
    quiet: true

# Pi firmware passes cgroup_disable=memory to the kernel, so Docker cannot enforce mem_limit. Adding these two arguments to
# the file's single line turns the controller on at the next boot. The file is one line: a stray newline can stop the Pi booting,
# so the line is trimmed and one newline added; backup keeps the old file beside it.
- name: Read the firmware command line
  ansible.builtin.slurp:
    src: "{{ pi_cmdline_file }}"
  register: pi_cmdline

- name: Turn on the memory cgroup (applies after a reboot)  # noqa: risky-file-permissions (the boot partition is FAT: its mount options set owner and mode)
  ansible.builtin.copy:
    content: "{{ pi_cmdline.content | b64decode | trim }} cgroup_enable=memory cgroup_memory=1\n"
    dest: "{{ pi_cmdline_file }}"
    backup: true
  when: "'cgroup_enable=memory' not in (pi_cmdline.content | b64decode).split()"
