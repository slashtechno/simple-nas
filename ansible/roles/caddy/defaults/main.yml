---
# Names Caddy serves for containers of your own roles, as site address: upstream, where the upstream is a
# container name and its port on the services network (example: docs/networking.md#names-for-apps-caddy_private_domains).
# A name under a caddy_private_domains entry gets a Let's Encrypt certificate. An app you run yourself
# (Dockge stacks) takes a name with labels instead (docs/caddy-reference.md); use this for the roles here.
caddy_sites: {}

# Redirect a bare app name (http://webtop/) to its full name. Needs the private domain in Tailscale's search
# domains (docs/networking.md#short-name).
caddy_bare_names_enabled: false
