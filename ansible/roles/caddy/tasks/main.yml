---
- name: Create Caddy data directory
  ansible.builtin.file:
    path: "{{ caddy_data_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Create Caddy compose directory
  ansible.builtin.file:
    path: "{{ services_dir }}/caddy"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Copy the Dockerfile
  ansible.builtin.copy:
    src: Dockerfile
    dest: "{{ services_dir }}/caddy/Dockerfile"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

# Holds the Cloudflare token when caddy_private_domains is set, so the file stays out of --diff.
- name: Render Caddy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ services_dir }}/caddy/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0640"
  diff: false

# With no zones and no private domains there is nothing to manage. Private domains with no zones fail the first check.
# With zones, this also deletes the records of a domain that was taken out of caddy_private_domains.
- name: Make Cloudflare DNS match caddy_private_domains
  ansible.builtin.import_tasks: private_domains.yml
  when: cloudflare_zones | length > 0 or caddy_private_domains | length > 0

# After the DNS records, so the names resolve when Caddy first asks Let's Encrypt for their certificates.
- name: Build and start Caddy
  community.docker.docker_compose_v2:
    project_src: "{{ services_dir }}/caddy"
    state: present
    build: always
