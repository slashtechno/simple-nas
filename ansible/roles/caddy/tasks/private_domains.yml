---
# For each caddy_private_domains entry: DNS-only A records <domain> and *.<domain> pointing at this host's Tailscale address.
# Every record carries the comment caddy_dns_comment, which is how a later deploy knows it is its own.
# A name that already has a record without that comment stops the deploy; nothing foreign is overwritten.
# Records with the comment whose domain is not in the list are deleted.
#
# Every API call runs on your computer (delegate_to: localhost), so the token never reaches a server.
# Tasks marked `check_mode: false` only read, so they run with --check; the plan is shown either way.
- name: Start the name list (it stays empty when caddy_private_domains is empty)
  ansible.builtin.set_fact:
    caddy_names: []

# zone_ids: the cloudflare_zones domains the name belongs to (cloudflare_zone_ids_of_name, derived.yml).
- name: Pair each name with its zone (the domains and their wildcards)
  ansible.builtin.set_fact:
    caddy_names: "{{ caddy_names + [{'name': item, 'zone_ids': zone_ids}] }}"
  vars:
    zone_name: "{{ item }}"
    zone_ids: "{{ cloudflare_zone_ids_of_name }}"
  loop: "{{ caddy_private_domains + (caddy_private_domains | map('regex_replace', '^', '*.') | list) }}"

- name: Check that each private domain matches exactly one domain in cloudflare_zones
  ansible.builtin.assert:
    that: item.zone_ids | length == 1
    fail_msg: "{{ item.name }} must equal, or be a subdomain of, exactly one domain in cloudflare_zones (group_vars/all/vars.yml)."
    quiet: true
  loop: "{{ caddy_names }}"
  loop_control:
    label: "{{ item.name }}"

- name: Read this host's Tailscale address
  ansible.builtin.command: tailscale ip -4
  register: caddy_tailscale_ip
  check_mode: false
  changed_when: false
  failed_when: false   # the next task explains the failure
  when: caddy_private_domains | length > 0

- name: Check Tailscale gave one IPv4 address
  ansible.builtin.assert:
    that: caddy_tailscale_ip.stdout | trim is match('^[0-9]+([.][0-9]+){3}$')
    fail_msg: "`tailscale ip -4` did not print one address. Join the host to your tailnet first (`sudo tailscale up`)."
    quiet: true
  when: caddy_private_domains | length > 0

- name: Make the DNS records match
  delegate_to: localhost
  become: false
  module_defaults:
    ansible.builtin.uri:
      headers:
        Authorization: "Bearer {{ cloudflare_api_token }}"
  block:
    - name: Read every DNS record of the zones
      ansible.builtin.import_role:
        name: cloudflare_zone_records

    - name: Work out what to change
      vars:
        records: "{{ cloudflare_zone_lists.results | map(attribute='json.result') | flatten }}"
        ip: "{{ caddy_tailscale_ip.stdout | default('') | trim }}"
      block:
        - name: Pair each name with its record
          ansible.builtin.set_fact:
            caddy_wanted: "{{ caddy_wanted | default([]) + [wanted] }}"
          vars:
            record: "{{ records | selectattr('name', 'equalto', item.name) | first | default({}) }}"
            change: >-
              {{ 'create' if record | length == 0
                 else 'keep' if record.content == ip and not record.proxied
                 else 'update' }}
            wanted: {name: "{{ item.name }}", zone_id: "{{ item.zone_ids | first }}", change: "{{ change }}", record_id: "{{ record.id | default('') }}",
                     comment: "{{ record.comment | default('', true) }}", type: "{{ record.type | default('') }}",
                     count: "{{ records | selectattr('name', 'equalto', item.name) | list | length }}"}
          loop: "{{ caddy_names }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Stop if a name has a record this role did not create
          ansible.builtin.assert:
            that: item.count | int <= 1 and (item.change == 'create' or (item.type == 'A' and item.comment == caddy_dns_comment))
            fail_msg: >-
              {{ item.name }} has a record that this role did not create, or more than one record. If they are unused,
              delete them in the Cloudflare dashboard (DNS) and deploy again.
            quiet: true
          loop: "{{ caddy_wanted | default([]) }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Find this host's records for domains not in the list
          ansible.builtin.set_fact:
            caddy_unwanted: >-
              {{ records | selectattr('comment', 'defined') | selectattr('comment', 'equalto', caddy_dns_comment)
                 | rejectattr('name', 'in', caddy_wanted | default([]) | map(attribute='name') | list) | list }}

    - name: Show the DNS plan
      ansible.builtin.debug:
        msg:
          - "create: {{ caddy_wanted | default([]) | selectattr('change', 'equalto', 'create') | map(attribute='name') | list }}"
          - "update: {{ caddy_wanted | default([]) | selectattr('change', 'equalto', 'update') | map(attribute='name') | list }}"
          - "delete: {{ caddy_unwanted | map(attribute='name') | list }}"

    # DNS only (proxied: false): Cloudflare cannot proxy traffic to a Tailscale address, and the name must not
    # work for anyone outside the tailnet. PATCH changes only the fields sent.
    - name: Create the records
      ansible.builtin.uri:
        url: "{{ cloudflare_api_url }}/zones/{{ item.zone_id }}/dns_records"
        method: POST
        body_format: json
        body:
          type: A
          name: "{{ item.name }}"
          content: "{{ caddy_tailscale_ip.stdout | trim }}"
          ttl: 1   # 1 means automatic
          proxied: false
          comment: "{{ caddy_dns_comment }}"
      loop: "{{ caddy_wanted | default([]) | selectattr('change', 'equalto', 'create') | list }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Update the records
      ansible.builtin.uri:
        url: "{{ cloudflare_api_url }}/zones/{{ item.zone_id }}/dns_records/{{ item.record_id }}"
        method: PATCH
        body_format: json
        body:
          content: "{{ caddy_tailscale_ip.stdout | trim }}"
          proxied: false
      loop: "{{ caddy_wanted | default([]) | selectattr('change', 'equalto', 'update') | list }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Delete the records of domains not in the list
      ansible.builtin.uri:
        url: "{{ cloudflare_api_url }}/zones/{{ item.zone_id }}/dns_records/{{ item.id }}"
        method: DELETE
      loop: "{{ caddy_unwanted }}"
      loop_control:
        label: "{{ item.name }}"
