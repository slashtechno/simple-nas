---
# The services this repo runs on the host that get an https name (web_services, group_vars/all/services.yml):
# one entry each, with the names it is served under, one per caddy_private_domains entry (only the first for a service
# behind Tinyauth). The compose template loops over this list.
- name: Start the list of services with a name (it stays empty when none has one)
  ansible.builtin.set_fact:
    caddy_web_sites: []

- name: Add each service that is switched on and has a subdomain
  ansible.builtin.set_fact:
    caddy_web_sites: "{{ caddy_web_sites + [site] }}"
  vars:
    subdomain: "{{ lookup('vars', item.key ~ '_subdomain') }}"
    # The names come from caddy_private_domains, prefixed with the service's subdomain.
    site_hosts: >-
      {{ (caddy_private_domains[:1] if item.key in protected_service_keys else caddy_private_domains)
         | map('regex_replace', '^', subdomain ~ '.') | join(' ') }}
    site:
      hosts: "{{ site_hosts }}"
      protected: "{{ item.key in protected_service_keys }}"
      # The header that proves to Copyparty that the user Tinyauth named came from Caddy (its idp-h-key setting). Only
      # the site every request reaches through the login gets it, so the published port and the tunnel cannot claim one.
      idp_key: "{{ item.key == 'copyparty' and (item.key in protected_service_keys) }}"
      container: "{{ item.container }}"
      container_port: "{{ item.container_port }}"
      scheme: "{{ item.scheme | default('http') }}"
  loop: "{{ web_services }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - item.port is not defined   # a service with a fixed host port has no name (Homebridge)
    - lookup('vars', item.key ~ '_enabled') | bool
    - lookup('vars', item.key ~ '_subdomain') != ''
