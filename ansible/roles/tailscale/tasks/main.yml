---
# Tailscale's install script adds its own apt source and keyring. The role writes a source for the same
# repository, and apt refuses two sources with different keys.
- name: Remove the install script's Tailscale apt source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/tailscale.list
    state: absent

- name: Remove the install script's Tailscale apt keyring
  ansible.builtin.file:
    path: /usr/share/keyrings/tailscale-archive-keyring.gpg
    state: absent

# artis3n.tailscale.machine installs the package and starts the service. It does not log in:
# join a new host once by hand with `sudo tailscale up` (add flags such as --advertise-exit-node
# there; Tailscale remembers them). No auth key is stored anywhere in this repo.
# state: present installs Tailscale if missing but never upgrades it during a deploy; the role's
# default, latest, would. Upgrade by hand with `sudo apt upgrade tailscale`.
# include_role, not import_role (AGENTS.md exception): import_role would tag every inner task of the collection role.
# Skipped under --check: the collection reads `tailscale status --json` with a plain command task, which
# --check skips, so its next task then fails parsing the empty output. A preview therefore does not show
# Tailscale's install.
- name: Install Tailscale
  ansible.builtin.include_role:
    name: artis3n.tailscale.machine
  vars:
    state: present
    tailscale_up_skip: true
  when: not ansible_check_mode

# Both want port 443 on the tailnet address. With Caddy publishing 443 the HTTPS connection to the host fails.
- name: Check Caddy leaves port 443 free for the front door
  ansible.builtin.assert:
    that: not (caddy_enabled | bool and caddy_https_port | default(443) | int == 443)
    fail_msg: >-
      tailscale_serve_port needs port 443 and Caddy is publishing it. Set caddy_https_port to another port
      (8443) in this host's vars.yml, then deploy caddy and tailscale.
    quiet: true
  when: tailscale_serve_port | string | length > 0

- name: Read what Tailscale already serves
  ansible.builtin.command: tailscale serve status
  register: tailscale_serve_status
  changed_when: false
  check_mode: false
  when: tailscale_serve_port | string | length > 0

# Running the same command again is harmless, but it would report a change on every deploy.
- name: Serve the front door at https://<host>
  ansible.builtin.command: tailscale serve --bg --https=443 http://127.0.0.1:{{ tailscale_serve_port }}
  changed_when: true
  when:
    - tailscale_serve_port | string | length > 0
    - ('127.0.0.1:' ~ tailscale_serve_port) not in tailscale_serve_status.stdout
