---
- name: Create Gitea data directory
  ansible.builtin.file:
    path: "{{ gitea_data_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Deploy gitea
  ansible.builtin.import_role:
    name: compose_service
  vars:
    compose_service_name: gitea
