---
- name: Create Gitea data directory
  ansible.builtin.file:
    path: "{{ gitea_data_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Deploy gitea
  ansible.builtin.import_role:
    name: compose_service
  vars:
    compose_service_name: gitea

- name: Create the dump script directory
  ansible.builtin.file:
    path: "{{ service_dump_scripts_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

# Gitea has a live database, so the backup runs this dump script first
# (see backup-services.sh). teardown_service.yml removes it again.
- name: Install the Gitea dump script
  ansible.builtin.copy:
    src: dump.sh
    dest: "{{ service_dump_scripts_dir }}/gitea.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
