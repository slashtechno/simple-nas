---
# The compose file runs Gitea as uid and gid 1000 (docker-compose.yml.j2); the data directories belong to ansible_user.
# The facts are gathered as root (become), so the user's ids come from the passwd database.
- name: Look up the Ansible user
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_user }}"

- name: Check the Ansible user is uid and gid 1000
  ansible.builtin.assert:
    that: getent_passwd[ansible_user][1:3] == ['1000', '1000']
    fail_msg: >-
      Gitea runs as uid and gid 1000 but {{ ansible_user }} is uid {{ getent_passwd[ansible_user][1] }}, gid
      {{ getent_passwd[ansible_user][2] }}, so Gitea could not write its data directories. Run Gitea as the Ansible user
      (the compose file sets USER_UID and USER_GID to 1000 together with this check).
    quiet: true

- name: Create Gitea data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - "{{ gitea_data_dir }}"
    - "{{ gitea_runner_data_dir }}"

- name: Deploy gitea
  ansible.builtin.import_role:
    name: compose_service
  vars:
    compose_service_name: gitea
    compose_service_has_secrets: true

- name: Add Gitea's Tinyauth login source
  ansible.builtin.import_tasks: sso.yml
  when: gitea_sso_enabled | bool

# Gitea has a live database, so the backup runs this dump script first
# (see backup-services.sh). teardown_service.yml removes it again.
- name: Install the Gitea dump script
  ansible.builtin.copy:
    src: dump.sh
    dest: "{{ service_dump_scripts_dir }}/gitea.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
