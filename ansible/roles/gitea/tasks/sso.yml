---
# Gitea keeps its authentication sources in its database, so the Tinyauth login source cannot come from app.ini: the
# admin CLI in the running container adds it (docs/auth-reference.md#sign-in-with-tinyauth-oidc). Call this after the
# container is up.

- name: Wait for Gitea's admin CLI to answer
  ansible.builtin.command:
    cmd: docker exec -u git gitea gitea admin auth list
  register: gitea_auth_list
  until: gitea_auth_list.rc == 0
  retries: 30
  delay: 5
  changed_when: false
  check_mode: false

# auth list prints a table of ID, name, type and enabled; the name is the only stable handle on a source, because the
# ID is a database sequence. An empty result means the source does not exist yet.
- name: Find the login source named tinyauth
  ansible.builtin.set_fact:
    gitea_sso_source_id: >-
      {%- set ids = [] -%}
      {%- for line in gitea_auth_list.stdout_lines -%}
      {%- set fields = line.split() -%}
      {%- if fields | length > 1 and fields[1] == 'tinyauth' -%}
      {%- set _ = ids.append(fields[0]) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ids[0] if ids else '' }}

# Gitea fetches Tinyauth's discovery document as it registers the source, so Tinyauth has to be running and reachable
# from this container by then. site.yml deploys it before Gitea, so the retries only cover the seconds its container
# needs to start. Only a new source counts as a change: update-oauth writes the same settings again on every deploy.
# The client secret is an argument of docker exec, so on every deploy it is visible in the host's process list for the seconds
# the command runs; no_log only hides it from Ansible's output.
- name: Add or update the Tinyauth login source
  ansible.builtin.command:
    cmd: >-
      docker exec -u git gitea gitea admin auth
      {{ 'update-oauth --id ' ~ gitea_sso_source_id if gitea_sso_source_id else 'add-oauth' }}
      --name tinyauth
      --provider openidConnect
      --key gitea
      --secret {{ vault_gitea_oidc_secret }}
      --auto-discover-url {{ tinyauth_url }}/.well-known/openid-configuration
      --scopes openid --scopes email --scopes profile
  register: gitea_sso_source
  until: gitea_sso_source.rc == 0
  retries: 5
  delay: 5
  changed_when: gitea_sso_source_id == ''
  no_log: true
