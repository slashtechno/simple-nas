---
# Host name Gitea serves its web pages for. Default: the host name in gitea_root_url.
gitea_domain: "{{ gitea_root_url | urlsplit('hostname') }}"
# Host name shown in SSH clone URLs. Set it when SSH clones use a different name than the web page
# (a Cloudflare tunnel carries only HTTP, so SSH needs a name that points at the host itself).
gitea_ssh_domain: "{{ gitea_domain }}"
# SSH port for git clones, published on the host.
gitea_ssh_port: "2222"
