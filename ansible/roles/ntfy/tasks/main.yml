---
- name: Check the ntfy secrets are in the vault
  ansible.builtin.assert:
    that:
      - vault_ntfy_password is defined
      - vault_ntfy_token is defined
      - vault_ntfy_token is match('^tk_[A-Za-z0-9]{29}$')
    fail_msg: >-
      vault_ntfy_password and vault_ntfy_token ("tk_" plus 29 letters or digits) must be in the vault.
      A placeholder token makes ntfy refuse to start, and alerts then fail silently. vault.yml.example says how to make them.
    quiet: true

- name: Create the ntfy data directory
  ansible.builtin.file:
    path: "{{ ntfy_data_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Deploy ntfy
  ansible.builtin.import_role:
    name: compose_service
  vars:
    compose_service_name: ntfy
    compose_service_has_secrets: true
