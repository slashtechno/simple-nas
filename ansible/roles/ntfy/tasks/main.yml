---
- name: Check the ntfy secrets are in the vault
  ansible.builtin.assert:
    that:
      - vault_ntfy_password_hash is defined
      - vault_ntfy_password_hash is match('^\\$2[aby]\\$[0-9]{2}\\$.{53}$')
      - vault_ntfy_token is defined
      - vault_ntfy_token is match('^tk_[A-Za-z0-9]{29}$')
    fail_msg: >-
      vault_ntfy_password_hash must be a bcrypt hash and vault_ntfy_token "tk_" plus 29 letters or digits,
      both in the vault. A placeholder makes ntfy refuse to start, and alerts then fail silently.
      vault.yml.example says how to make them.
    quiet: true

- name: Create the ntfy data directory
  ansible.builtin.file:
    path: "{{ ntfy_data_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Deploy ntfy
  ansible.builtin.import_role:
    name: compose_service
  vars:
    compose_service_name: ntfy
