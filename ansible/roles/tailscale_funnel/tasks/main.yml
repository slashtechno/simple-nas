---
# Tailscale Funnel for Copyparty: this role runs on a host with copyparty_enabled.

# Funnel has no Ansible module, so read current state and only act on a difference.
# A host that has not joined Tailscale yet (docs/networking.md) serves no Funnel, so there is nothing to compare.
# A failure of `tailscale funnel status` on a joined host stops the play, so an unreadable state is never taken as "off".
- name: Read whether Tailscale is joined
  ansible.builtin.command:
    cmd: tailscale status --json
  register: tailscale_status
  failed_when: false
  changed_when: false
  check_mode: false

- name: Work out whether Tailscale is joined
  ansible.builtin.set_fact:
    tailscale_funnel_joined: "{{ (tailscale_status.stdout | from_json).BackendState | default('') == 'Running' if tailscale_status.stdout | trim else false }}"

- name: Tell the owner Tailscale is not joined
  ansible.builtin.debug:
    msg: "Tailscale is not joined on {{ inventory_hostname }}, so the Funnel was not touched. Run `sudo tailscale up` on the host, then deploy again."
  when: not tailscale_funnel_joined

- name: Set the Funnel to match tailscale_funnel_enabled
  when: tailscale_funnel_joined
  block:
    # `tailscale funnel status --json` prints the serve config: AllowFunnel maps "host:port" -> bool,
    # and Web.<host:port>.Handlers.<path>.Proxy holds the backend URL.
    - name: Read current Tailscale Funnel config
      ansible.builtin.command:
        cmd: tailscale funnel status --json
      register: tailscale_funnel_status
      changed_when: false
      check_mode: false

    - name: Work out current Funnel state on :443
      ansible.builtin.set_fact:
        tailscale_funnel_cfg: "{{ tailscale_funnel_status.stdout | from_json if tailscale_funnel_status.stdout | trim else {} }}"

    - name: Compare Funnel state to desired
      ansible.builtin.set_fact:
        tailscale_funnel_is_on: >-
          {{ (tailscale_funnel_cfg.AllowFunnel | default({}) | dict2items
              | selectattr('key', 'match', '.*:443$') | selectattr('value') | list | length) > 0 }}
        tailscale_funnel_points_here: "{{ ('127.0.0.1:' ~ copyparty_port) in (tailscale_funnel_cfg.Web | default({}) | to_json) }}"

    # Funnel lets anyone on the internet reach Copyparty at your ts.net hostname.
    # Disabled by default; set tailscale_funnel_enabled: true in vars.yml to turn it on.
    - name: Enable Tailscale Funnel for Copyparty
      ansible.builtin.command:
        cmd: tailscale funnel --bg --https=443 http://127.0.0.1:{{ copyparty_port }}
      when:
        - tailscale_funnel_enabled | bool
        - not (tailscale_funnel_is_on and tailscale_funnel_points_here)
      changed_when: true

    - name: Disable Tailscale Funnel
      ansible.builtin.command:
        cmd: tailscale funnel --https=443 off
      when:
        - not (tailscale_funnel_enabled | bool)
        - tailscale_funnel_is_on
      changed_when: true

# Helper for toggling the Copyparty funnel by hand: copyparty-funnel.sh enable|disable|status
- name: Create scripts directory
  ansible.builtin.file:
    path: "{{ scripts_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Install copyparty-funnel.sh
  ansible.builtin.template:
    src: copyparty-funnel.sh.j2
    dest: "{{ scripts_dir }}/copyparty-funnel.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
