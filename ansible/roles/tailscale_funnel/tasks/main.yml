---
# Tailscale Funnel for Copyparty: only the NAS runs Copyparty, so this role is in the NAS play.

# Funnel has no Ansible module, so read current state and only act on a difference.
# `tailscale funnel status --json` prints the serve config: AllowFunnel maps "host:port" -> bool,
# and Web.<host:port>.Handlers.<path>.Proxy holds the backend URL.
- name: Read current Tailscale Funnel config
  ansible.builtin.command:
    cmd: tailscale funnel status --json
  register: tailscale_funnel_status
  changed_when: false
  check_mode: false

- name: Work out current Funnel state on :443
  ansible.builtin.set_fact:
    tailscale_funnel_cfg: "{{ tailscale_funnel_status.stdout | from_json if tailscale_funnel_status.stdout | trim else {} }}"

- name: Compare Funnel state to desired
  ansible.builtin.set_fact:
    tailscale_funnel_is_on: >-
      {{ (tailscale_funnel_cfg.AllowFunnel | default({}) | dict2items
          | selectattr('key', 'match', '.*:443$') | selectattr('value') | list | length) > 0 }}
    tailscale_funnel_points_here: "{{ ('127.0.0.1:' ~ tailscale_funnel_port) in (tailscale_funnel_cfg.Web | default({}) | to_json) }}"

# Funnel lets anyone on the internet reach Copyparty at your ts.net hostname.
# Disabled by default; set tailscale_funnel_enabled: true in vars.yml to turn it on.
- name: Enable Tailscale Funnel for Copyparty
  ansible.builtin.command:
    cmd: tailscale funnel --bg --https=443 http://127.0.0.1:{{ tailscale_funnel_port }}
  when:
    - tailscale_funnel_enabled | bool
    - not (tailscale_funnel_is_on and tailscale_funnel_points_here)
  changed_when: true

- name: Disable Tailscale Funnel
  ansible.builtin.command:
    cmd: tailscale funnel --https=443 off
  when:
    - not (tailscale_funnel_enabled | bool)
    - tailscale_funnel_is_on
  changed_when: true

# Helper for toggling the Copyparty funnel by hand: copyparty-funnel.sh enable|disable|status
- name: Create scripts directory
  ansible.builtin.file:
    path: "{{ nas_scripts_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Install copyparty-funnel.sh
  ansible.builtin.template:
    src: copyparty-funnel.sh.j2
    dest: "{{ nas_scripts_dir }}/copyparty-funnel.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
