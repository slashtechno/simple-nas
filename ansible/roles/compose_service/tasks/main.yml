---
# Deploys roles/<compose_service_name>/templates/docker-compose.yml.j2 to {{ services_dir }}/<compose_service_name>.
# `state: present` recreates containers whose definition changed, so these services need no restart handler.
# Roles with other config files, builds or start modes (garage, copyparty, pics, ...) do this inline.
# A service whose compose file holds a secret sets `compose_service_has_secrets: true`, which keeps the file out of --diff.
# Use import_role, not include_role: only imported tasks pick up --tags.
#   - ansible.builtin.import_role: {name: compose_service}
#     vars: {compose_service_name: <role>}
- name: Create {{ compose_service_name }} compose directory
  ansible.builtin.file:
    path: "{{ services_dir }}/{{ compose_service_name }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Render {{ compose_service_name }} docker-compose.yml
  ansible.builtin.template:
    src: "{{ playbook_dir }}/roles/{{ compose_service_name }}/templates/docker-compose.yml.j2"
    dest: "{{ services_dir }}/{{ compose_service_name }}/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0640"
  diff: "{{ not (compose_service_has_secrets | default(false)) }}"

- name: Start {{ compose_service_name }}
  community.docker.docker_compose_v2:
    project_src: "{{ services_dir }}/{{ compose_service_name }}"
    state: present
    pull: "{{ docker_pull_policy }}"
