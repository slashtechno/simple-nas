---
- name: Create Homebridge config directory
  ansible.builtin.file:
    path: "{{ homebridge_config_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Deploy homebridge
  ansible.builtin.import_role:
    name: compose_service
  vars:
    compose_service_name: homebridge
