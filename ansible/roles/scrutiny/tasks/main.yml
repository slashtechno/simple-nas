---
# Scrutiny has no login of its own, so it needs Tinyauth to protect it and Caddy to route to it.
- name: Require Tinyauth and Caddy
  ansible.builtin.import_role:
    name: compose_service
    tasks_from: require_tinyauth
  vars:
    compose_service_name: scrutiny
    compose_service_has_secrets: true

- name: Read the drives from the host unless they are set
  ansible.builtin.import_tasks: devices.yml
  when: scrutiny_devices | length == 0

- name: Create the Scrutiny data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - "{{ scrutiny_config_dir }}"
    - "{{ scrutiny_influx_dir }}"

- name: Deploy Scrutiny
  ansible.builtin.import_role:
    name: compose_service
  vars:
    compose_service_name: scrutiny
