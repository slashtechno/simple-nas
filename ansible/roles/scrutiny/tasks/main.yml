---
# Scrutiny has no login of its own, so it needs Tinyauth to protect it and Caddy to route to it.
- name: Check Scrutiny is behind Tinyauth and Caddy
  ansible.builtin.assert:
    that:
      - tinyauth_enabled | bool
      - caddy_enabled | bool
    fail_msg: >-
      Scrutiny has no login of its own: switch on tinyauth_enabled (docs/services.md#tinyauth-login) and
      caddy_enabled with a caddy_private_domains entry.
    quiet: true

- name: Read the drives from the host unless they are set
  ansible.builtin.import_tasks: devices.yml
  when: scrutiny_devices | length == 0

- name: Create the Scrutiny data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - "{{ scrutiny_config_dir }}"
    - "{{ scrutiny_influx_dir }}"

- name: Deploy Scrutiny
  ansible.builtin.import_role:
    name: compose_service
  vars:
    compose_service_name: scrutiny
