---
# Job concurrency to set in Immich on every deploy: queue name (as in Immich's settings: thumbnailGeneration, metadataExtraction,
# smartSearch, faceDetection, videoConversion, ...) to the number of jobs that run at once. Only the queues named here are
# set; every other queue stays as saved in Immich. Empty leaves job settings alone. Needs vault_immich_api_key
# (docs/memory.md#immich). Example: {thumbnailGeneration: 1, smartSearch: 1}
immich_job_concurrency: {}
# Immich's transcode policy, set on every deploy (Immich's own default is required). Empty leaves it as saved.
#   disabled  no second copy of any video; HDR phone video plays as it is (washed out outside Safari)
#   required  a copy only for videos that will not play as they are: an unaccepted video or audio codec, or HDR
#   optimal   required, plus a copy of anything above the target resolution
#   bitrate   required, plus a copy of anything above the max bitrate
#   all       a copy of every video
# The next Transcode Videos job (Administration → Jobs) deletes the copies the new policy no longer needs.
# Needs vault_immich_api_key (docs/memory.md#immich).
immich_transcode_policy: ""
# Video codecs Immich plays as they are, without making a transcoded copy (the "required" policy transcodes the rest;
# "disabled" ignores this list).
# Any codec the browsers and phones you use can play: h264 plays everywhere; hevc (iPhone and many Android videos) and av1
# are smaller but need a recent browser or phone; vp9 plays in every current browser. Allowed: h264, hevc, vp9, av1.
# Empty leaves the list as saved in Immich. Needs vault_immich_api_key (docs/memory.md#immich).
immich_accepted_video_codecs: []
# Memory limit for Immich's machine-learning container (smart search, face detection), such as 1g. Empty sets no limit.
# On a Raspberry Pi it is enforced once the memory cgroup is on (docs/memory.md#memory-limits). Too low a limit kills the
# container during a job, which Docker then restarts.
immich_machine_learning_memory_limit: ""
# True when this deploy sets something through Immich's API, which needs vault_immich_api_key and a port. Derived: not a setting.
immich_api_settings_set: >-
  {{ immich_sso_enabled | bool or immich_job_concurrency | length > 0 or immich_transcode_policy != ""
  or immich_accepted_video_codecs | length > 0 }}
