---
# Catches a missing or incomplete vault. (An encrypted vault with no password given fails earlier, when
# Ansible loads the variables: use --vault-password-file .vault-pass or `just deploy`.)
- name: Check what the Immich API settings need
  ansible.builtin.assert:
    that:
      - vault_immich_api_key is defined
      - immich_port != ''
    fail_msg: >-
      immich_sso_enabled and immich_job_concurrency need vault_immich_api_key (an admin's API key with the permissions
      systemConfig.read and systemConfig.update) and a non-empty immich_port, because the deploy sets them through Immich's
      API on that port (docs/auth-reference.md#sign-in-with-tinyauth-oidc, docs/memory.md#immich).
    quiet: true
  when: immich_sso_enabled | bool or immich_job_concurrency | length > 0 or immich_transcode_required_only | bool

- name: Check the Immich database password is in the vault
  ansible.builtin.assert:
    that: vault_immich_db_password is defined
    fail_msg: >-
      vault_immich_db_password is not defined. Add it to the vault that applies to {{ inventory_hostname }}
      (host_vars/{{ inventory_hostname }}/vault.yml or group_vars/all/vault.yml; see vault.yml.example).
    quiet: true

- name: Create Immich upload directory
  ansible.builtin.file:
    path: "{{ immich_upload_location }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Create Postgres data directory (container runs as UID 999)
  ansible.builtin.file:
    path: "{{ immich_db_data_location }}"
    state: directory
    owner: "999"
    group: "999"
    mode: "0700"

- name: Deploy immich
  ansible.builtin.import_role:
    name: compose_service
  vars:
    compose_service_name: immich
    compose_service_has_secrets: true

# Immich has a live database, so the backup runs this dump script first
# (see backup-services.sh). teardown_service.yml removes it again.
- name: Install the Immich dump script
  ansible.builtin.copy:
    src: dump.sh
    dest: "{{ service_dump_scripts_dir }}/immich.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

# The API takes the whole settings object on every write, so read it, change only what this deploy owns and write it back:
# the sign-in block (immich_sso_enabled), the concurrency of the queues named in immich_job_concurrency and the transcode
# policy (immich_transcode_required_only). That leaves every other setting, and the fields of these blocks not named here,
# as saved in Immich's settings page.
# Immich stores the settings in its database, so the write happens only when they differ.
- name: Set Immich's settings through its API
  when: immich_sso_enabled | bool or immich_job_concurrency | length > 0 or immich_transcode_required_only | bool
  vars:
    immich_api: "http://127.0.0.1:{{ immich_port }}/api"
    immich_oauth: >-
      {{ immich_settings.json.oauth | combine({
        'enabled': true,
        'issuerUrl': 'https://' ~ tinyauth_subdomain ~ '.' ~ caddy_private_domains[0],
        'clientId': 'immich',
        'clientSecret': vault_immich_oidc_secret,
        'scope': 'openid email profile',
        'signingAlgorithm': 'RS256',
        'profileSigningAlgorithm': 'none',
        'tokenEndpointAuthMethod': 'client_secret_post',
        'storageLabelClaim': 'preferred_username',
        'buttonText': 'Sign in with Tinyauth',
        'autoRegister': false
      }) }}
    immich_job: >-
      {%- set merged = {} -%}
      {%- for queue, value in immich_settings.json.job.items() -%}
      {%- set _ = merged.update({queue: value | combine({'concurrency': immich_job_concurrency[queue]}) if queue in immich_job_concurrency else value}) -%}
      {%- endfor -%}
      {{ merged }}
    immich_ffmpeg: "{{ immich_settings.json.ffmpeg | combine({'transcode': 'required'}) }}"
    immich_wanted: >-
      {{ immich_settings.json
         | combine({'oauth': immich_oauth} if immich_sso_enabled | bool else {})
         | combine({'job': immich_job} if immich_job_concurrency | length > 0 else {})
         | combine({'ffmpeg': immich_ffmpeg} if immich_transcode_required_only | bool else {}) }}
  block:
    - name: Wait for the Immich API
      ansible.builtin.uri:
        url: "{{ immich_api }}/server/ping"
      register: immich_ping
      until: immich_ping.status == 200
      retries: 30
      delay: 5
      check_mode: false

    - name: Read Immich's settings
      ansible.builtin.uri:
        url: "{{ immich_api }}/system-config"
        headers:
          x-api-key: "{{ vault_immich_api_key }}"
      register: immich_settings
      check_mode: false
      failed_when: false   # the check below names the cause; no_log would hide it
      no_log: true   # the answer holds the client secret

    - name: Check Immich answered with its settings
      ansible.builtin.assert:
        that: immich_settings.status | default(0) == 200
        fail_msg: >-
          GET {{ immich_api }}/system-config answered {{ immich_settings.status | default('nothing') }}, not 200. Check that vault_immich_api_key
          is a valid key of an Immich admin with the permissions systemConfig.read and systemConfig.update
          (docs/auth-reference.md#sign-in-with-tinyauth-oidc) and that immich_port is Immich's.
        quiet: true

    - name: Check every queue in immich_job_concurrency is one Immich has
      ansible.builtin.assert:
        that: immich_job_concurrency.keys() | difference(immich_settings.json.job.keys()) | length == 0
        fail_msg: >-
          immich_job_concurrency names {{ immich_job_concurrency.keys() | difference(immich_settings.json.job.keys()) }}, which
          Immich has no job queue for. Its queues are: {{ immich_settings.json.job.keys() | join(', ') }}
        quiet: true
      when: immich_job_concurrency | length > 0

    - name: Write Immich's settings
      ansible.builtin.uri:
        url: "{{ immich_api }}/system-config"
        method: PUT
        headers:
          x-api-key: "{{ vault_immich_api_key }}"
        body_format: json
        body: "{{ immich_wanted }}"
      register: immich_write
      when: immich_settings.json != immich_wanted
      changed_when: true   # uri reports a PUT as unchanged
      failed_when: false   # the check below names the cause; no_log would hide it
      no_log: true

    - name: Check Immich accepted the settings
      ansible.builtin.assert:
        that: immich_write.status | default(0) == 200
        fail_msg: >-
          PUT {{ immich_api }}/system-config answered {{ immich_write.status | default('nothing') }}, not 200. Check the key has the permission
          systemConfig.update (docs/auth-reference.md#sign-in-with-tinyauth-oidc) and that the values in immich_job_concurrency are whole numbers.
        quiet: true
      when: immich_write is not skipped
