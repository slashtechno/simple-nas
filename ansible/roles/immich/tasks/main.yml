---
# Catches a missing or incomplete vault. (An encrypted vault with no password given fails earlier, when
# Ansible loads the variables: use --vault-password-file .vault-pass or `just deploy`.)
- name: Check what the Immich sign-in settings need
  ansible.builtin.assert:
    that:
      - vault_immich_api_key is defined
      - immich_port != ''
    fail_msg: >-
      immich_sso_enabled needs vault_immich_api_key (an admin's API key with the permissions systemConfig.read and
      systemConfig.update) and a non-empty immich_port, because the deploy sets the sign-in through Immich's API on that port
      (docs/auth-reference.md#sign-in-with-tinyauth-oidc).
    quiet: true
  when: immich_sso_enabled | bool

- name: Check the Immich database password is in the vault
  ansible.builtin.assert:
    that: vault_immich_db_password is defined
    fail_msg: >-
      vault_immich_db_password is not defined. Add it to the vault that applies to {{ inventory_hostname }}
      (host_vars/{{ inventory_hostname }}/vault.yml or group_vars/all/vault.yml; see vault.yml.example).
    quiet: true

- name: Create Immich upload directory
  ansible.builtin.file:
    path: "{{ immich_upload_location }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Create Postgres data directory (container runs as UID 999)
  ansible.builtin.file:
    path: "{{ immich_db_data_location }}"
    state: directory
    owner: "999"
    group: "999"
    mode: "0700"

- name: Deploy immich
  ansible.builtin.import_role:
    name: compose_service
  vars:
    compose_service_name: immich
    compose_service_has_secrets: true

# Immich has a live database, so the backup runs this dump script first
# (see backup-services.sh). teardown_service.yml removes it again.
- name: Install the Immich dump script
  ansible.builtin.copy:
    src: dump.sh
    dest: "{{ service_dump_scripts_dir }}/immich.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

# The API takes the whole settings object on every write, so read it, change only the sign-in block and write it back.
# That leaves every other setting, and the fields of this block not named here, as saved in Immich's settings page.
# Immich stores the settings in its database, so the write happens only when the block differs.
- name: Set Immich's Tinyauth sign-in
  when: immich_sso_enabled | bool
  vars:
    immich_api: "http://127.0.0.1:{{ immich_port }}/api"
    immich_oauth: >-
      {{ immich_settings.json.oauth | combine({
        'enabled': true,
        'issuerUrl': 'https://' ~ tinyauth_subdomain ~ '.' ~ caddy_private_domains[0],
        'clientId': 'immich',
        'clientSecret': vault_immich_oidc_secret,
        'scope': 'openid email profile',
        'signingAlgorithm': 'RS256',
        'profileSigningAlgorithm': 'none',
        'tokenEndpointAuthMethod': 'client_secret_post',
        'storageLabelClaim': 'preferred_username',
        'buttonText': 'Sign in with Tinyauth',
        'autoRegister': false
      }) }}
  block:
    - name: Wait for the Immich API
      ansible.builtin.uri:
        url: "{{ immich_api }}/server/ping"
      register: immich_ping
      until: immich_ping.status == 200
      retries: 30
      delay: 5
      check_mode: false

    - name: Read Immich's settings
      ansible.builtin.uri:
        url: "{{ immich_api }}/system-config"
        headers:
          x-api-key: "{{ vault_immich_api_key }}"
      register: immich_settings
      check_mode: false
      failed_when: false   # the check below names the cause; no_log would hide it
      no_log: true   # the answer holds the client secret

    - name: Check Immich answered with its settings
      ansible.builtin.assert:
        that: immich_settings.status == 200
        fail_msg: >-
          GET {{ immich_api }}/system-config answered {{ immich_settings.status }}, not 200. Check that vault_immich_api_key
          is a valid key of an Immich admin with the permissions systemConfig.read and systemConfig.update
          (docs/auth-reference.md#sign-in-with-tinyauth-oidc) and that immich_port is Immich's.
        quiet: true

    - name: Write Immich's settings with the sign-in block changed
      ansible.builtin.uri:
        url: "{{ immich_api }}/system-config"
        method: PUT
        headers:
          x-api-key: "{{ vault_immich_api_key }}"
        body_format: json
        body: "{{ immich_settings.json | combine({'oauth': immich_oauth}) }}"
      register: immich_write
      when: immich_settings.json.oauth != immich_oauth
      changed_when: true   # uri reports a PUT as unchanged
      failed_when: false   # the check below names the cause; no_log would hide it
      no_log: true

    - name: Check Immich accepted the settings
      ansible.builtin.assert:
        that: immich_write.status == 200
        fail_msg: >-
          PUT {{ immich_api }}/system-config answered {{ immich_write.status }}, not 200. The key needs the permission
          systemConfig.update (docs/auth-reference.md#sign-in-with-tinyauth-oidc).
        quiet: true
      when: immich_write is not skipped
