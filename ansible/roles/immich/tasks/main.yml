---
# Catches a missing or incomplete vault. (An encrypted vault with no password given fails earlier, when
# Ansible loads the variables: use --vault-password-file .vault-pass or `just deploy`.)
- name: Check the Immich database password is in the vault
  ansible.builtin.assert:
    that: vault_immich_db_password is defined
    fail_msg: >-
      vault_immich_db_password is not defined. Add it to the vault that applies to {{ inventory_hostname }}
      (host_vars/{{ inventory_hostname }}/vault.yml or group_vars/all/vault.yml; see vault.yml.example).
    quiet: true

- name: Check Immich's sign-in through Tinyauth is set up
  ansible.builtin.assert:
    that:
      - tinyauth_enabled | bool
      - caddy_enabled | bool
      - caddy_private_domains | length > 0
      - vault_immich_oidc_secret is defined
    fail_msg: >-
      immich_sso_enabled needs tinyauth_enabled and caddy_enabled with a caddy_private_domains entry, and
      vault_immich_oidc_secret in the vault that applies to {{ inventory_hostname }} (vault.yml.example says how to
      make it).
    quiet: true
  when: immich_sso_enabled | bool

- name: Create Immich upload directory
  ansible.builtin.file:
    path: "{{ immich_upload_location }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Create Postgres data directory (container runs as UID 999)
  ansible.builtin.file:
    path: "{{ immich_db_data_location }}"
    state: directory
    owner: "999"
    group: "999"
    mode: "0700"

- name: Create Immich's compose directory for its config file
  ansible.builtin.file:
    path: "{{ services_dir }}/immich"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  when: immich_sso_enabled | bool

# Immich reads its whole configuration from this file when it is set, and refuses to save settings from its web UI while
# it is set: a setting the template leaves out gets Immich's default, not the value the settings page saved.
- name: Render Immich's config file
  ansible.builtin.template:
    src: immich-config.json.j2
    dest: "{{ services_dir }}/immich/immich-config.json"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0640"
  diff: false   # the client secret would show in --diff
  notify: Restart Immich
  when: immich_sso_enabled | bool

- name: Deploy immich
  ansible.builtin.import_role:
    name: compose_service
  vars:
    compose_service_name: immich
    compose_service_has_secrets: true

# Immich has a live database, so the backup runs this dump script first
# (see backup-services.sh). teardown_service.yml removes it again.
- name: Install the Immich dump script
  ansible.builtin.copy:
    src: dump.sh
    dest: "{{ service_dump_scripts_dir }}/immich.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
