---
# Everything here only reads or asserts, so a wrong setting stops the deploy before anything is changed.
- name: Check the backup role can run on this host
  ansible.builtin.assert:
    that:
      - backup_local_enabled | bool or backup_cloud_enabled | bool
      - vault_restic_password is defined
    fail_msg: >-
      The backup role is on for {{ inventory_hostname }} but neither backup_local_enabled nor
      backup_cloud_enabled is true, or vault_restic_password is missing from group_vars/all/vault.yml.
    quiet: true

- name: Check the local backup has a drive
  ansible.builtin.assert:
    that: "'backup' in drive_mounts"
    fail_msg: >-
      backup_local_enabled is true but {{ inventory_hostname }} has no drive with the `backup` role.
      Claim one in `drives` (host_vars/{{ inventory_hostname }}/vars.yml) or set backup_local_enabled: false.
    quiet: true
  when: backup_local_enabled | bool

- name: Check the offsite backup has a repository
  ansible.builtin.assert:
    that: restic_cloud_repository | length > 0
    fail_msg: >-
      backup_cloud_enabled is true but restic_cloud_repository is empty. Set it in
      host_vars/{{ inventory_hostname }}/vars.yml, e.g. "rclone:gdrive:/{{ inventory_hostname }}-backups".
    quiet: true
  when: backup_cloud_enabled | bool

- name: Check an rclone repository uses the gdrive remote
  ansible.builtin.assert:
    that: not restic_cloud_repository.startswith('rclone:') or restic_cloud_repository.startswith('rclone:gdrive:')
    fail_msg: >-
      restic_cloud_repository uses an rclone remote other than gdrive. The rendered rclone.conf defines only
      [gdrive], so the offsite backup would fail. Use "rclone:gdrive:/path".
    quiet: true
  when: backup_cloud_enabled | bool

- name: Check every backup rule is a path or starts with "- "
  vars:
    bad_rules: "{{ (restic_local_rules + restic_cloud_rules) | reject('match', '^(- .+|/.+)$') | list }}"
  ansible.builtin.assert:
    that: bad_rules | length == 0
    fail_msg: >-
      Every line of restic_local_rules and restic_cloud_rules is an absolute path, "- pattern" or
      "- !pattern" (a dash and a space). Offending lines: {{ bad_rules }}
    quiet: true

- name: Check the local backup covers every enabled service's data
  ansible.builtin.import_tasks: check_coverage.yml
  when: backup_local_enabled | bool

# Read-only, so it also runs under --check. Without this the directories below would be created on the root drive.
# The trailing /. opens the path, which mounts the drive (automount); `mountpoint -q` on the bare path also succeeds
# on the automount placeholder of a missing drive.
- name: Look up whether the backup drive is mounted
  ansible.builtin.command: mountpoint -q {{ (backup_drive ~ '/.') | quote }}
  register: backup_drive_mountpoint
  changed_when: false
  failed_when: false
  check_mode: false
  when: backup_local_enabled | bool

- name: Check the backup drive is mounted
  ansible.builtin.assert:
    that: backup_drive_mountpoint.rc == 0
    fail_msg: >-
      {{ backup_drive }} is not mounted. Plug the backup drive in and deploy again. Only a `drives` entry with a
      `uuid` is mounted by the storage role (docs/storage.md), so give the backup drive one.
    quiet: true
  when: backup_local_enabled | bool

- name: Check the ntfy token is in the vault
  ansible.builtin.assert:
    that: vault_ntfy_token is defined
    fail_msg: "ntfy_alert_url is set but vault_ntfy_token is not in group_vars/all/vault.yml (see vault.yml.example)."
    quiet: true
  when: ntfy_alert_url | length > 0

# The backup leaves out Immich's and Garage's live database directories (restic-excludes-services.txt.j2); the
# dump their roles install is the only copy. Without the dump script the backup would run without errors and
# hold no database. The roles run before this one in site.yml.
- name: Look for the dump scripts of the services whose live database is left out
  vars:
    services_with_dump:
      - {name: immich, enabled: "{{ immich_enabled }}"}
      - {name: garage, enabled: "{{ garage_enabled }}"}
  ansible.builtin.stat:
    path: "{{ service_dump_scripts_dir }}/{{ item }}.sh"
  register: backup_dump_scripts
  loop: "{{ services_with_dump | selectattr('enabled') | map(attribute='name') | list }}"
  when: not ansible_check_mode

- name: Check those dump scripts are installed
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: >-
      {{ item.item }} is enabled but {{ service_dump_scripts_dir }}/{{ item.item }}.sh is not installed, so the
      backup would hold no {{ item.item }} database. Deploy {{ item.item }} first: just deploy {{ item.item }}.
    quiet: true
  loop: "{{ backup_dump_scripts.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: not ansible_check_mode
