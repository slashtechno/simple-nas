---
# The daily local backup and the weekly integrity check: scripts, exclude list and cron jobs.
- name: Set up the local backup
  when: backup_local_enabled | bool
  block:
    - name: Render the local backup and check scripts
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "{{ scripts_dir }}/{{ item }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"
      loop:
        - backup-restic-local.sh
        - restic-check.sh

    - name: Render the local backup exclude list
      ansible.builtin.template:
        src: restic-excludes-local.txt.j2
        dest: "{{ scripts_dir }}/restic-excludes-local.txt"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"

    - name: Schedule daily local backup (2 AM)
      ansible.builtin.cron:
        name: backup-local
        user: "{{ ansible_user }}"
        minute: "0"
        hour: "2"
        job: >-
          /bin/bash {{ (scripts_dir ~ '/backup-restic-local.sh') | quote }}
          >> {{ (backup_logs_dir ~ '/backup-cron.log') | quote }} 2>&1 ||
          /bin/bash {{ (scripts_dir ~ '/alert.sh') | quote }}
          "backup-restic-local failed (see backup-cron.log; is {{ backup_drive }} mounted and not full, and is every encrypted folder unlocked?)"

    - name: Schedule weekly restic integrity check (Saturday 5 AM, away from the daily backup)
      ansible.builtin.cron:
        name: restic-check
        user: "{{ ansible_user }}"
        minute: "0"
        hour: "5"
        weekday: "6"
        job: >-
          /bin/bash {{ (scripts_dir ~ '/restic-check.sh') | quote }}
          >> {{ (backup_logs_dir ~ '/backup-cron.log') | quote }} 2>&1 ||
          /bin/bash {{ (scripts_dir ~ '/alert.sh') | quote }}
          "restic-check failed (see backup-cron.log; is {{ backup_drive }} mounted?)"

    # Before the cloud setup, so a cloud failure (an expired Drive token) cannot stop the local repository being created.
    - name: Initialize local restic repository (idempotent)
      ansible.builtin.command:
        cmd: restic init
      environment:
        RESTIC_PASSWORD_FILE: "{{ restic_password_file }}"
        RESTIC_REPOSITORY: "{{ restic_repo_path }}"
      register: restic_init
      changed_when: "'created restic repository' in restic_init.stdout"
      failed_when:
        - restic_init.rc != 0
        - "'already exists' not in restic_init.stderr"
      become: true
      become_user: "{{ ansible_user }}"

- name: Remove the local backup jobs and scripts when the local backup is off
  when: not backup_local_enabled | bool
  block:
    - name: Remove the local backup cron jobs
      ansible.builtin.cron:
        name: "{{ item }}"
        user: "{{ ansible_user }}"
        state: absent
      loop:
        - backup-local
        - restic-check

    - name: Remove the local backup scripts and exclude list
      ansible.builtin.file:
        path: "{{ scripts_dir }}/{{ item }}"
        state: absent
      loop:
        - backup-restic-local.sh
        - restic-check.sh
        - restic-excludes-local.txt
