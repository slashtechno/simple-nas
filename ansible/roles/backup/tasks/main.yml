---
- name: Create scripts directory
  ansible.builtin.file:
    path: "{{ nas_scripts_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Render backup scripts that reference deployment-specific paths
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ nas_scripts_dir }}/{{ item }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - backup-restic-local.sh
    - backup-restic-cloud.sh
    - backup-services.sh
    - restic-check.sh

- name: Deploy backup scripts with no deployment-specific paths
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ nas_scripts_dir }}/{{ item }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - restore-services.sh

- name: Render backup path and exclude lists
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ nas_scripts_dir }}/{{ item }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  loop:
    - backup-paths.txt
    - restic-excludes-local.txt
    - restic-excludes-cloud.txt

- name: Write restic password file
  ansible.builtin.copy:
    content: "{{ vault_restic_password }}"
    dest: "{{ restic_password_file }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Initialize local restic repository (idempotent)
  ansible.builtin.command:
    cmd: restic init
  environment:
    RESTIC_PASSWORD_FILE: "{{ restic_password_file }}"
    RESTIC_REPOSITORY: "{{ restic_repo_path }}"
  register: restic_init
  changed_when: "'created restic repository' in restic_init.stdout"
  failed_when:
    - restic_init.rc != 0
    - "'already exists' not in restic_init.stderr"
  become: true
  become_user: "{{ ansible_user }}"

# Google Drive is reached through rclone, whose remote needs an OAuth token. It comes from the vault
# (vault_rclone_gdrive_token, made with `rclone authorize` on a computer with a browser). The file is
# written only when it does not exist: rclone writes refreshed tokens back into it, so overwriting
# it on every deploy would replace a fresh token with the stale one from the vault.
- name: Create the rclone config directory
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.config/rclone"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"
  when: vault_rclone_gdrive_token | default('') | length > 0

- name: Write the rclone Google Drive remote (only if there is no rclone.conf yet)
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: "/home/{{ ansible_user }}/.config/rclone/rclone.conf"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
    force: false
  when: vault_rclone_gdrive_token | default('') | length > 0

# A repository that is configured but cannot be initialised (no rclone remote, wrong credentials,
# unreachable server) fails the deploy, so a backup that would never run is noticed now.
- name: Initialize cloud restic repository (idempotent)
  ansible.builtin.command:
    cmd: >-
      restic -o "rclone.args={{ restic_cloud_rclone_args }}" init
  environment:
    RESTIC_PASSWORD_FILE: "{{ restic_password_file }}"
    RESTIC_REPOSITORY: "{{ restic_cloud_repository }}"
  register: restic_cloud_init
  changed_when: "'created restic repository' in restic_cloud_init.stdout"
  failed_when:
    - restic_cloud_init.rc != 0
    - "'already exists' not in restic_cloud_init.stderr"
  become: true
  become_user: "{{ ansible_user }}"

- name: Schedule daily local backup (2 AM)
  ansible.builtin.cron:
    name: nas-backup-local
    user: "{{ ansible_user }}"
    minute: "0"
    hour: "2"
    job: >-
      /bin/bash {{ nas_scripts_dir }}/backup-restic-local.sh
      >> {{ backup_logs_dir }}/backup-cron.log 2>&1 ||
      logger -t nas-backup "backup-restic-local failed or {{ backup_drive }} not mounted"

- name: Schedule weekly cloud backup (Sunday 4 AM)
  ansible.builtin.cron:
    name: nas-backup-cloud
    user: "{{ ansible_user }}"
    minute: "0"
    hour: "4"
    weekday: "0"
    job: >-
      /bin/bash {{ nas_scripts_dir }}/backup-restic-cloud.sh
      >> {{ backup_logs_dir }}/backup-cron.log 2>&1 ||
      logger -t nas-backup "backup-restic-cloud failed or {{ backup_drive }} not mounted"

- name: Schedule weekly restic integrity check (Wednesday 3 AM)
  ansible.builtin.cron:
    name: nas-restic-check
    user: "{{ ansible_user }}"
    minute: "0"
    hour: "3"
    weekday: "3"
    job: >-
      /bin/bash {{ nas_scripts_dir }}/restic-check.sh
      >> {{ backup_logs_dir }}/backup-cron.log 2>&1 ||
      logger -t nas-backup "restic-check failed or {{ backup_drive }} not mounted"
