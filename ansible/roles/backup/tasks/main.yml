---
- name: Check the backup settings and drive
  ansible.builtin.import_tasks: checks.yml

- name: Install restic, and rclone for an rclone repository
  ansible.builtin.apt:
    name: "{{ ['restic'] + (['rclone'] if backup_cloud_enabled | bool and restic_cloud_repository.startswith('rclone:') else []) }}"
    state: present
    update_cache: true

# With a local backup the work dir is the backup drive's mount root, so it is not listed: this task would change its mode.
- name: Create the backup directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "{{ '0700' if item == service_dumps_dir else '0755' }}"   # the dumps hold databases and keys: only the backup user reads them
  loop: >-
    {{ ([] if backup_local_enabled | bool else [backup_work_dir])
       + [restic_cache_dir, backup_logs_dir, service_dumps_dir]
       + ([restic_repo_path] if backup_local_enabled | bool else []) }}

- name: Render backup scripts that reference deployment-specific paths
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ scripts_dir }}/{{ item }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - backup-services.sh

- name: Deploy backup scripts with no deployment-specific paths
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ scripts_dir }}/{{ item }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - restore-services.sh

- name: Write restic password file
  ansible.builtin.copy:
    content: "{{ vault_restic_password }}"
    dest: "{{ restic_password_file }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  no_log: true   # the password would show in --diff

- name: Set up or remove the local backup
  ansible.builtin.import_tasks: local.yml

- name: Set up or remove the offsite backup
  ansible.builtin.import_tasks: cloud.yml
