---
# A failed backup job always goes to the system log (`journalctl -t backup`). To also send it to your phone, set
# this to the inventory name of the host that runs ntfy (it needs ntfy_enabled: true). Any host can name it,
# itself or another one, because a homelab needs one ntfy server. "" sends nothing. The login token is
# vault_ntfy_token. A host that is down or unreachable cannot alert. The URL is http:// to the host's
# ansible_host, so the token is encrypted only when that address is on the tailnet (Tailscale encrypts it); for
# a host reached over a plain LAN, set ntfy_alert_url to an https:// Caddy name instead.
ntfy_server: ""
# The topic URL alerts are posted to. The default is built from ntfy_server. Set it yourself only for a server this
# repo does not run, such as "https://ntfy.sh/<your-topic>".
ntfy_alert_url: >-
  {{ '' if ntfy_server == ''
     else 'http://' ~ ('localhost' if ntfy_server == inventory_hostname else hostvars[ntfy_server].ansible_host | default(ntfy_server))
          ~ ':' ~ hostvars[ntfy_server].ntfy_port ~ '/alerts' }}
# What the local (daily) backup copies and skips, one rule per line: "/path" backs a path up, "- pattern" leaves
# something out, "- !pattern" puts it back. The service dumps dir is always added and caches and live database
# directories are always skipped (roles/backup/templates/restic-excludes-*.txt.j2).
# Default: the primary and fast drives; a host with neither role backs up the user's home. The backup runs as
# the ansible user, so files only root can read are skipped and the run then fails so the alert fires.
# Adding or removing a "/path" line starts a new snapshot group: docs/backups.md#choosing-what-is-backed-up
# To add to the default instead of replacing it, set restic_local_extra_rules.
restic_local_rules: >-
  {{ ([drive_mounts.primary | default(''), drive_mounts.fast | default('')] | select | unique | list
      or ['/home/' ~ ansible_user])
     + restic_local_extra_rules }}
# Rules added after the default local rules. Same line format; most hosts only need this.
restic_local_extra_rules: []
# The same rules for the weekly offsite backup. Each path is its own snapshot group, and a "- " line applies to
# every path. Default: this host's base directory (compose files, credentials) and Copyparty's config. Add more
# paths to upload more, e.g. a drive's data on a host with no local backup; Immich's photos are not included
# (they are large): add "{{ immich_upload_location }}" to restic_cloud_extra_rules.
restic_cloud_rules: >-
  {{ ([copyparty_config_dir] if copyparty_enabled | bool else [])
     + [services_dir] + restic_cloud_extra_rules }}
# Rules added after the default cloud rules. Same line format.
restic_cloud_extra_rules: []
# Every restic call in the backup scripts is wrapped in `timeout` with this value, so a stalled
# rclone or network pipe cannot hold the repo lock indefinitely.
restic_command_timeout: "2h"
# restic's index and snapshot cache. On the fast drive it keeps cache reads off the backup drive and
# off Google Drive; it only helps once the fast and backup roles are different drives. Not backed up.
# A host without a fast drive keeps it in the user's ~/.cache.
restic_cache_dir: "{{ drive_mounts.fast ~ '/restic-cache' if 'fast' in drive_mounts else '/home/' ~ ansible_user ~ '/.cache/restic' }}"
# Where the dump.d scripts write database dumps before each backup; the local backup includes this directory.
service_dumps_dir: "{{ backup_work_dir }}/service-dumps"
# Where rclone keeps its remote's login. The cloud backup creates it and the backup lists never copy it.
rclone_config_dir: "/home/{{ ansible_user }}/.config/rclone"
# Where each service keeps data that the backup must cover: one line per service, with the directories to check
# (roles/backup/tasks/check_coverage.yml, and the offsite notice in cloud.yml). Immich's raw database directory and
# Copyparty's hist directory are not listed: restic-excludes-services.txt.j2 leaves them out on purpose.
# Folders in encrypted_folders are listed too, because they can be anywhere.
backup_service_data:
  - {enabled: "{{ immich_enabled }}", dirs: ["{{ immich_upload_location }}"]}
  - {enabled: "{{ copyparty_enabled }}", dirs: ["{{ copyparty_files_dir }}", "{{ copyparty_config_dir }}"]}
  - {enabled: "{{ copyparty_enabled and copyparty_collab_enabled }}", dirs: ["{{ copyparty_collab_dir }}"]}
  - {enabled: "{{ copyparty_enabled and copyparty_fast_enabled }}", dirs: ["{{ copyparty_fast_dir }}"]}
  - {enabled: "{{ gitea_enabled }}", dirs: ["{{ gitea_data_dir }}", "{{ gitea_runner_data_dir }}"]}
  - {enabled: "{{ pics_enabled }}", dirs: ["{{ pics_data_dir }}"]}
  - {enabled: "{{ homebridge_enabled }}", dirs: ["{{ homebridge_config_dir }}"]}
  - {enabled: "{{ garage_enabled }}", dirs: ["{{ garage_data_dir }}"]}
  - {enabled: "{{ crafty_enabled }}", dirs: ["{{ crafty_data_dir }}"]}
  - {enabled: "{{ ntfy_enabled }}", dirs: ["{{ ntfy_data_dir }}"]}
  - {enabled: "{{ dockge_enabled }}", dirs: ["{{ dockge_stacks_dir }}", "{{ dockge_data_dir }}"]}
  - {enabled: "{{ caddy_enabled }}", dirs: ["{{ caddy_data_dir }}"]}
  - {enabled: "{{ encrypted_folders | length > 0 }}", dirs: "{{ encrypted_pairs | map(attribute='mount') | list }}"}
