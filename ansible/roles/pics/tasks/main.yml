---
# pics reaches Copyparty by container name on the Docker network, as the "photos" service account.
- name: Check Copyparty runs on this host with a photos account
  ansible.builtin.assert:
    that:
      - copyparty_enabled | bool
      - "'photos' in (copyparty_service_accounts | default([]) | map(attribute='user'))"
    fail_msg: >-
      pics stores photos in Copyparty. On {{ inventory_hostname }} set copyparty_enabled: true and add a
      copyparty_service_accounts entry with user: photos (see group_vars/all/vars.yml.example).
    quiet: true

- name: Create pics directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(ansible_user) }}"
    group: "{{ item.owner | default(ansible_user) }}"
    mode: "0755"
  loop:
    - path: "{{ nas_base_dir }}/pics"
    # The container runs as uid 10001 and must own its data folder
    - { path: "{{ pics_data_dir }}", owner: "10001" }

# include_role, not import_role (AGENTS.md exception): import_role would tag every inner task of github_clone.
- name: Fetch the pics source
  ansible.builtin.include_role:
    name: github_clone
  vars:
    repo: "{{ pics_repo }}"
    dest: "{{ nas_base_dir }}/pics/src"
    version: "{{ pics_version }}"

- name: Render pics.env
  ansible.builtin.template:
    src: pics.env.j2
    dest: "{{ nas_base_dir }}/pics/pics.env"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  diff: false   # holds the passwords and secret key
  notify: Restart pics

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ nas_base_dir }}/pics/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0640"
  notify: Restart pics

# Building takes several minutes on a Pi: rebuild only when the source moved or the image is missing.
- name: Build and start pics
  community.docker.docker_compose_v2:
    project_src: "{{ nas_base_dir }}/pics"
    state: present
    build: "{{ 'always' if private_repo_clone.before != private_repo_clone.after else 'policy' }}"
