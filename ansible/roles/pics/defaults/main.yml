---
# pics builds from a private repo with vault_github_read_token. It reaches Copyparty as the "photos" account
# (copyparty_service_accounts). The container publishes <pics_port> on the host, so the whole app (owner pages
# included) is on your LAN and tailnet. Only guest pages go public, through the
# cloudflared_ingress entry, which points at pics_public_port. The owner pages' host port is pics_port, in
# group_vars/all/defaults.yml.

# GitHub repository (owner/name) that pics builds from.
pics_repo: "{{ undef(hint='Set pics_repo (owner/name of the private GitHub repo pics builds from) in group_vars/all/vars.yml') }}"
# Public URL of pics' guest pages: the Cloudflare hostname that points at pics_public_port.
pics_public_url: "{{ undef(hint='Set pics_public_url (e.g. https://photos.example.com) in group_vars/all/vars.yml') }}"
# Container-internal port of the guest pages (never published): the tunnel points here. Only pics_port is
# published on the host (LAN and tailnet). Container ports cannot collide with other services' ports.
pics_public_port: 8001
# With pics_sso_enabled: the one Tinyauth user name or email address that may open pics' owner pages. Tinyauth cannot
# limit a client to some of its users, so without this check every user in vault_tinyauth_users would get in.
pics_oidc_owner: "{{ undef(hint='Set pics_oidc_owner (the Tinyauth user name or email address that may open pics) in the host vars.yml') }}"
# Written into the EXIF of public downloads.
pics_artist: ""
# For example "example.com"; watermarked and linked from the home page.
pics_website: ""
# For example "@you"; watermarked and linked from the home page.
pics_instagram: ""
