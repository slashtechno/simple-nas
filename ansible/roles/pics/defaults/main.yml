---
# pics builds from a private repo with vault_github_read_token. It reaches Copyparty as the "pics" account
# (the copyparty field of pics in group_vars/all/services.yml), whose volumes are /apps/pics/photos and
# /apps/pics/trash. The container publishes <pics_port> on the host, so the whole app (owner pages included) is
# on your LAN and tailnet. Only guest pages go public, through the cloudflared_ingress entry, which points at
# pics_public_port. pics_port is in group_vars/all/defaults-ports-and-names.yml, pics_public_port in defaults-data-dirs.yml.

# GitHub repository (owner/name) that pics builds from.
pics_repo: "{{ undef(hint='Set pics_repo (owner/name of the private GitHub repo pics builds from) in group_vars/all/vars.yml') }}"
# Public URL of pics' guest pages: the Cloudflare hostname that points at pics_public_port.
pics_public_url: "{{ undef(hint='Set pics_public_url (e.g. https://photos.example.com) in group_vars/all/vars.yml') }}"
# Written into the EXIF of public downloads.
pics_artist: ""
# For example "example.com"; watermarked and linked from the home page.
pics_website: ""
# For example "@you"; watermarked and linked from the home page.
pics_instagram: ""
