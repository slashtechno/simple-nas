---
- name: Check the host has a local backup to show
  ansible.builtin.assert:
    that: backup_local_enabled | bool
    fail_msg: >-
      backup_status_enabled needs backup_local_enabled: true on {{ inventory_hostname }}
      (and a drive in `drives` with the `backup` role). The dashboard reads the local repository.
    quiet: true

# Without the file Docker creates the path as a directory, and the next backup deploy fails writing the password there.
- name: Check the restic password file exists (deploy the backup role first)
  ansible.builtin.stat:
    path: "{{ restic_password_file }}"
  register: backup_status_password_file

- name: Stop if there is no restic password file
  ansible.builtin.assert:
    that: backup_status_password_file.stat.isreg | default(false)
    fail_msg: "{{ restic_password_file }} is missing: deploy the backup role to this host before backup_status."
    quiet: true

- name: Check the dashboard has a login in front of it or a port set on purpose
  ansible.builtin.assert:
    that: (tinyauth_enabled | bool) or backup_status_port != ''
    fail_msg: >-
      The backup dashboard has no login of its own. Switch on tinyauth_enabled (docs/services.md#tinyauth-login) to
      serve it behind the login, or set backup_status_port in host_vars/{{ inventory_hostname }}/vars.yml to publish it
      open on the network.
    quiet: true

- name: Create backup-status compose directory
  ansible.builtin.file:
    path: "{{ services_dir }}/backup-status"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Deploy backup-status app files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ services_dir }}/backup-status/{{ item }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  loop:
    - app.py
    - index.html
    - pico.min.css
    - Dockerfile

- name: Render backup-status docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ services_dir }}/backup-status/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0640"

# build: always rebuilds the image from the copied files and compose recreates the container when the image or
# the compose file changed, so no separate restart is needed.
- name: Build and start backup-status
  community.docker.docker_compose_v2:
    project_src: "{{ services_dir }}/backup-status"
    state: present
    build: always
