---


- name: Create Crafty data directories
  ansible.builtin.file:
    path: "{{ crafty_data_dir }}/{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop: [servers, backups, logs, config, import]

- name: Deploy crafty
  ansible.builtin.import_role:
    name: compose_service
  vars:
    compose_service_name: crafty
