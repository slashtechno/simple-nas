---
- name: Create Dockge directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - "{{ dockge_stacks_dir }}"
    - "{{ dockge_data_dir }}"

- name: Deploy dockge
  ansible.builtin.import_role:
    name: compose_service
  vars:
    compose_service_name: dockge
