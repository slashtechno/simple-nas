---
# Every host: a role is claimed at most once and only known roles are used.
- name: Validate the drive roles
  vars:
    claimed_roles: "{{ drives | map(attribute='roles', default=[]) | flatten }}"
  ansible.builtin.assert:
    that:
      - claimed_roles | length == claimed_roles | unique | length
      - claimed_roles | difference(['fast', 'primary', 'backup']) | length == 0
    fail_msg: >-
      Invalid drive roles in `drives`: a role (fast, primary, backup) can be claimed by only one drive,
      and no other role names exist. Any one drive may hold several roles.
      Current `drives`: {{ drives }}
    quiet: true

# A `drives` entry without `uuid` is a folder on the root drive: created, never put in fstab.
# A backup there would die with the root drive, so the backup role needs an entry with a `uuid`.
- name: Validate that the backup role is on a mounted drive
  ansible.builtin.assert:
    that: mounted_drives | selectattr('mount', 'equalto', drive_mounts.backup) | list | length == 1
    fail_msg: >-
      The `backup` role is on {{ drive_mounts.backup }}, which has no `uuid`, so it is a folder on the root
      drive. A backup on the same drive as the system is not a backup. Give the backup role to an entry that has a `uuid`.
    quiet: true
  when: "'backup' in drive_mounts"

# Each drive is mounted lazily by systemd (x-systemd.automount): a tripwire filesystem sits on the mount point
# from boot and mounts the drive on first access. With the drive missing, an access fails with "No such device"
# after 30 seconds instead of writing to a plain folder on the root drive, and the next access after the drive
# returns mounts it again. See docs/storage.md.
# `nofail` makes the drive's mount wanted, not required, by local-fs.target, so a drive that fails to mount cannot
# drop a headless host into emergency mode, unreachable over SSH. It is added unless the drive's options have it.
# systemd reads fstab at boot and on daemon-reload; the tripwire is armed at the next boot.
- name: Add drives to fstab
  vars:
    drive_options: "{{ item.options | default('defaults') }}"
  ansible.posix.mount:
    path: "{{ item.mount }}"
    src: "UUID={{ item.uuid }}"
    fstype: "{{ item.fstype | default('ext4') }}"
    opts: "{{ drive_options ~ ('' if 'nofail' in drive_options else ',nofail') }},x-systemd.automount,x-systemd.device-timeout=30s"
    state: mounted
  loop: "{{ mounted_drives }}"
  notify: Reload systemd daemon

# Once the automount is armed, `state: mounted` sees the placeholder and mounts nothing, and a plain stat of the
# path does not trigger the mount. Opening it with /. does, and fails after the timeout if the drive is missing.
- name: Check every drive is mounted
  ansible.builtin.command: mountpoint -q {{ (item.mount ~ '/.') | quote }}
  loop: "{{ mounted_drives }}"
  changed_when: false

- name: Set ownership of mounted drives to ansible user  # noqa: risky-file-permissions (mode is left as the filesystem's)
  ansible.builtin.file:
    path: "{{ item.mount }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    state: directory
  loop: "{{ drives }}"

# USB drives plugged in are mounted at /run/media/system/<label>. The rule calls systemd-mount, not mount,
# because udev runs in its own mount namespace. systemd-mount creates the mount point.
- name: Install the USB automount udev rule
  ansible.builtin.template:
    src: 98-usb-automount.rules.j2
    dest: /etc/udev/rules.d/98-usb-automount.rules
    owner: root
    group: root
    mode: "0644"
  notify: Reload udev rules
  when: usb_automount_enabled | bool

# Switched off: remove what the task above installs. Drives already mounted stay mounted until unplugged or reboot.
- name: Remove the USB automount rule when it is switched off
  ansible.builtin.file:
    path: /etc/udev/rules.d/98-usb-automount.rules
    state: absent
  notify: Reload udev rules
  when: not usb_automount_enabled | bool

# The Docker directory on the fast drive. Each service role creates its own data directories below it; the backup role creates its own.
- name: Create the Docker directory on the fast drive
  ansible.builtin.file:
    path: "{{ fast_drive }}/docker"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  when: "'fast' in drive_mounts"
