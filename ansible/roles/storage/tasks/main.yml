---
- name: Validate drive role map
  ansible.builtin.assert:
    that:
      - nas_drive_mounts.fast is match('^/')
      - nas_drive_mounts.primary is match('^/')
      - nas_drive_mounts.backup is match('^/')
      - (nas_drives | map(attribute='roles', default=[]) | flatten | length)
        == (nas_drives | map(attribute='roles', default=[]) | flatten | unique | length)
      - (nas_drives | map(attribute='roles', default=[]) | flatten)
        | difference(['fast', 'primary', 'backup']) | length == 0
      - ['fast', 'primary', 'backup'] | difference(nas_drives | map(attribute='roles', default=[]) | flatten) | length == 0
    fail_msg: >-
      Invalid nas_drives role map: each role (fast/primary/backup) must be
      claimed by exactly one drive (an unclaimed role would silently use a folder on the microSD),
      unknown role names are not allowed
      (allowed: fast, primary, backup, any drive may hold several).
      Current map: {{ nas_drive_mounts }}

- name: Create mount points
  ansible.builtin.file:
    path: "{{ item.mount }}"
    state: directory
    mode: "0755"
  loop: "{{ nas_drives }}"

- name: Add drives to fstab
  ansible.posix.mount:
    path: "{{ item.mount }}"
    src: "UUID={{ item.uuid }}"
    fstype: "{{ item.fstype }}"
    opts: "{{ item.options }}"
    state: mounted
  loop: "{{ nas_drives }}"

- name: Set ownership of mounted drives to ansible user  # noqa: risky-file-permissions (mode is left as the filesystem's)
  ansible.builtin.file:
    path: "{{ item.mount }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    state: directory
  loop: "{{ nas_drives }}"

- name: Install udev rule to trigger a remount when a drive reappears
  ansible.builtin.copy:
    src: 99-nas-drive-remount.rules
    dest: /etc/udev/rules.d/99-nas-drive-remount.rules
    owner: root
    group: root
    mode: "0644"
  notify: Reload udev rules

- name: Install remount systemd service (self-heals a drive that drops offline and reconnects)
  ansible.builtin.copy:
    src: nas-drive-remount.service
    dest: /etc/systemd/system/nas-drive-remount.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd daemon

# Drive-level layout only. Each service role creates its own data directories.
- name: Create NAS directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - "{{ fast_drive }}/docker"
    - "{{ restic_cache_dir }}"
    - "{{ restic_repo_path }}"
    - "{{ backup_logs_dir }}"
    - "{{ service_dumps_dir }}"

- name: Create /opt/nas base directory
  ansible.builtin.file:
    path: "{{ nas_base_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
