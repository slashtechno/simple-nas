---
- name: Check Tinyauth has a login name and users
  ansible.builtin.assert:
    that:
      - caddy_enabled | bool
      - caddy_private_domains | length > 0
      - tinyauth_subdomain | length > 0
      - vault_tinyauth_users is defined
      - vault_tinyauth_users | length > 0
    fail_msg: >-
      Tinyauth needs an https name: set caddy_enabled, a caddy_private_domains entry and a tinyauth_subdomain on this
      host, and vault_tinyauth_users in group_vars/all/vault.yml (or this host's vault.yml, for users of its own;
      group_vars/all/vault.yml.example says how to make it).
    quiet: true

# Tinyauth reads the setting name in lower case, so a user name with a capital or an underscore would get no email.
- name: Check the Tinyauth users with an email have a plain name
  ansible.builtin.assert:
    that: item.name is match('^[a-z0-9-]+$')
    fail_msg: "The Tinyauth user {{ item.name }} has an email, so its name may use only lower-case letters, digits and -."
    quiet: true
  loop: "{{ vault_tinyauth_users | selectattr('email', 'defined') | list }}"
  loop_control: {label: "{{ item.name }}"}

# service_users is shared by every host, so only the services this host runs are held to what Tinyauth can limit.
- name: Check service_users names real users and services
  ansible.builtin.assert:
    that:
      - unknown_users | length == 0
      - unknown_services | length == 0
      - not_limited | length == 0
      - not_lists | length == 0
    fail_msg: >-
      service_users must name Tinyauth users from vault_tinyauth_users and services from services.yml, and only
      services Tinyauth can limit ({{ (protected_service_keys + ['pics']) | join(', ') }}); a service with accounts of
      its own is decided by them. Unknown users: {{ unknown_users }}. Unknown services: {{ unknown_services }}.
      Not limited by Tinyauth on this host: {{ not_limited }}. Each value must be a non-empty list (an empty one would
      leave the service open): {{ not_lists }}.
    quiet: true
  vars:
    unknown_users: "{{ service_users.values() | flatten | unique | difference(vault_tinyauth_users | map(attribute='name') | list) }}"
    unknown_services: "{{ service_users.keys() | list | difference(services | map(attribute='key') | list) }}"
    not_lists: >-
      {%- set bad = [] -%}
      {%- for name, users in service_users.items() if users is string or users is not sequence or users | length == 0 -%}
      {%- set _ = bad.append(name) -%}
      {%- endfor -%}
      {{ bad }}
    not_limited: >-
      {{ service_users.keys() | list | select('in', enabled_service_keys)
         | difference(protected_service_keys + ['pics']) | list }}

# An OAuth login accepts every account at the provider unless a whitelist names the allowed emails (an empty one allows
# all), and Tinyauth then lets it into every name behind the login. The whitelists are made from the users' emails.
- name: Check an OAuth login can only be used by the people with an email
  ansible.builtin.assert:
    that:
      - vault_tinyauth_users | selectattr('email', 'defined') | list | length > 0
      - tinyauth_environment.keys() | select('match', '^TINYAUTH_OAUTH_(WHITELIST|PROVIDERS_.*_WHITELIST)$') | list | length == 0
      - without_email | length == 0
    fail_msg: >-
      tinyauth_environment sets an OAuth login, so give each person who may use it an email in vault_tinyauth_users
      (at least one), and do not set TINYAUTH_OAUTH_WHITELIST or a provider
      whitelist yourself (docs/auth-reference.md). Users in service_users without an email: {{ without_email }}.
    quiet: true
  vars:
    without_email: >-
      {{ vault_tinyauth_users | rejectattr('email', 'defined') | map(attribute='name')
         | intersect(service_users.items() | selectattr('0', 'in', protected_service_keys) | map(attribute='1') | flatten | list) | list }}
  when: tinyauth_oauth_enabled | bool

- name: Create the Tinyauth data directory
  ansible.builtin.file:
    path: "{{ tinyauth_data_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Deploy Tinyauth
  ansible.builtin.import_role:
    name: compose_service
  vars:
    compose_service_name: tinyauth
    compose_service_has_secrets: true
