---
# One tile per service that publishes a web UI on a host port. The page lists every host in the inventory
# (group `servers`) and shows a host's tile when that host has the service's flag on. To add a tile, add a line.
#   flag          the service's <name>_enabled setting
#   port_setting  the setting that holds its host port (group_vars/all/defaults.yml)
#   port          a fixed port, for a service whose port is not ours to set (Homebridge runs on the host network)
#   scheme        http unless set
#   monitor       false for a page the up/down dot cannot check (Crafty's certificate is self-signed)
#   icon          a name from https://github.com/homarr-labs/dashboard-icons, or mdi-<name> from https://pictogrammers.com/library/mdi/
# Garage, Caddy and Cloudflare Tunnel have no web UI to link to.
homepage_tiles:
  - {name: Immich, flag: immich_enabled, port_setting: immich_port, icon: immich, description: Photos}
  - {name: Copyparty, flag: copyparty_enabled, port_setting: copyparty_port, icon: copyparty, description: Files}
  - {name: Gitea, flag: gitea_enabled, port_setting: gitea_port, icon: gitea, description: Git}
  - {name: pics, flag: pics_enabled, port_setting: pics_port, icon: mdi-image-multiple, description: Photo culling and sharing}
  - {name: Homebridge, flag: homebridge_enabled, port: 8581, icon: homebridge, description: HomeKit}
  - {name: Crafty, flag: crafty_enabled, port_setting: crafty_panel_port, scheme: https, monitor: false, icon: crafty-controller,
     description: Minecraft servers}
  - {name: Dockge, flag: dockge_enabled, port_setting: dockge_port, icon: dockge, description: Compose stacks}
  - {name: ntfy, flag: ntfy_enabled, port_setting: ntfy_port, icon: ntfy, description: Alerts}
  - {name: Backups, flag: backup_status_enabled, port_setting: backup_status_port, icon: restic, description: Backup status}
