---
- name: Create the Homepage config directory
  ansible.builtin.file:
    path: "{{ services_dir }}/homepage/config"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

# Homepage copies a default for any config file that is missing (example bookmarks, a search widget), so every
# file it would copy is written here.
- name: Render the Homepage tiles
  ansible.builtin.template:
    src: services.yaml.j2
    dest: "{{ services_dir }}/homepage/config/services.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: Render the Homepage settings
  ansible.builtin.template:
    src: settings.yaml.j2
    dest: "{{ services_dir }}/homepage/config/settings.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Restart Homepage

- name: Copy the fixed Homepage config files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ services_dir }}/homepage/config/{{ item }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  loop: [bookmarks.yaml, widgets.yaml, custom.css]

- name: Deploy homepage
  ansible.builtin.import_role:
    name: compose_service
  vars:
    compose_service_name: homepage
