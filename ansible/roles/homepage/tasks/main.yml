---
- name: Check the Homepage login secrets are in the vault
  ansible.builtin.assert:
    that:
      - vault_homepage_password is defined
      - vault_homepage_auth_secret is defined
      - vault_homepage_auth_secret | length >= 32
    fail_msg: >-
      homepage_auth_enabled needs vault_homepage_password and vault_homepage_auth_secret (at least 32 characters)
      in the vault that applies to {{ inventory_hostname }} (see vault.yml.example).
    quiet: true
  when: homepage_auth_enabled | bool

- name: Create the Homepage config directory
  ansible.builtin.file:
    path: "{{ services_dir }}/homepage/config"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

# Homepage reloads this file when it changes, so there is no restart handler.
- name: Render the Homepage tiles
  ansible.builtin.template:
    src: services.yaml.j2
    dest: "{{ services_dir }}/homepage/config/services.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: Deploy homepage
  ansible.builtin.import_role:
    name: compose_service
  vars:
    compose_service_name: homepage
    compose_service_has_secrets: true
