---
# Host port of the start page.
homepage_port: 3001
# The address the tile links use, and the address you open the page at. The default is the address Ansible
# reaches the host at (the full tailnet name in the inventory). The page also answers on the inventory name
# with homepage_port; any other address (a LAN IP, a Caddy name) gets a host validation error, so set this
# to the one you use.
homepage_host: "{{ ansible_host | default(inventory_hostname) }}"
# Extra tiles, shown in a "Links" group after the service tiles: a public hostname, a service on another host,
# any web page. Each is {name, href}, with an optional description. For example, a service on a second host:
#   - {name: "Dockge on pi4", href: "http://{{ hostvars['pi4'].ansible_host }}:{{ hostvars['pi4'].dockge_port }}"}
homepage_links: []
