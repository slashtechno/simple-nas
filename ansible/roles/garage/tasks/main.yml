---
- name: Check the garage secrets are in the vault
  ansible.builtin.assert:
    that:
      - vault_garage_rpc_secret is defined
      - vault_garage_admin_token is defined
    fail_msg: >-
      garage needs vault_garage_rpc_secret and vault_garage_admin_token in the vault that applies to {{ inventory_hostname }}
      (host_vars/{{ inventory_hostname }}/vault.yml or group_vars/all/vault.yml; see vault.yml.example).
    quiet: true

# The web UI holds the admin token and has no login of its own, so it is served only behind Tinyauth, never on a
# host port or a tunnel name.
- name: Require Tinyauth and Caddy
  ansible.builtin.import_role:
    name: compose_service
    tasks_from: require_tinyauth
  vars:
    compose_service_name: garage

- name: Create Garage compose directory
  ansible.builtin.file:
    path: "{{ services_dir }}/garage"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

# --single-node auto-configures the cluster layout on first start, but Garage refuses it
# when an existing layout has version > 1 (v2.4.1: "Refusing to run in single-node mode").
# So the flag goes in only when the meta directory is still empty, i.e. a first deploy.
- name: Check if the Garage meta directory has data (the cluster is already bootstrapped)
  ansible.builtin.find:
    path: "{{ garage_meta_dir }}"
    file_type: any
  register: garage_meta_contents

- name: Set the first-deploy flag
  ansible.builtin.set_fact:
    garage_is_first_deploy: "{{ garage_meta_contents.matched == 0 }}"

# An empty meta directory next to existing data blocks means the metadata was not copied along (a moved
# garage_meta_dir). A first deploy would then start Garage with a new, empty cluster and orphan the blocks.
- name: Check for data blocks
  ansible.builtin.find:
    path: "{{ garage_blocks_dir }}"
    file_type: any
  register: garage_data_contents

- name: Stop if the data blocks are here but the metadata is not
  ansible.builtin.assert:
    that: not (garage_is_first_deploy and garage_data_contents.matched > 0)
    fail_msg: >-
      {{ garage_blocks_dir }} has files but {{ garage_meta_dir }} is empty. Copy the old meta directory
      over (or restore the metadata dump, docs/backups.md#restore-garage), then deploy again.
    quiet: true

- name: Create Garage data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - "{{ garage_meta_dir }}"
    - "{{ garage_blocks_dir }}"

# Garage's metadata is root-owned, so the backup copies it through this script, not as plain files
# (see backup-services.sh). teardown_service.yml removes it again.
- name: Install the Garage dump script
  ansible.builtin.copy:
    src: dump.sh
    dest: "{{ service_dump_scripts_dir }}/garage.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Render garage.toml
  ansible.builtin.template:
    src: garage.toml.j2
    dest: "{{ services_dir }}/garage/garage.toml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0640"
  diff: false   # holds the RPC secret and admin token
  notify: Restart Garage

- name: Render Garage docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ services_dir }}/garage/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0640"
  diff: false   # holds the admin token and the web UI password
  notify: Restart Garage

- name: Render Caddyfile for CORS proxy
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ services_dir }}/garage/Caddyfile"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Restart the Garage CORS proxy

- name: Start Garage
  community.docker.docker_compose_v2:
    project_src: "{{ services_dir }}/garage"
    state: present
    pull: "{{ docker_pull_policy }}"
