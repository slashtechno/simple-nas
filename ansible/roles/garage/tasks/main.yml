---
- name: Check the garage secrets are in the vault
  ansible.builtin.assert:
    that:
      - vault_garage_rpc_secret is defined
      - vault_garage_admin_token is defined
      - vault_garage_webui_user is defined
      - vault_garage_webui_pass is defined
    fail_msg: >-
      garage needs vault_garage_rpc_secret, vault_garage_admin_token, vault_garage_webui_user and
      vault_garage_webui_pass in the vault that applies to {{ inventory_hostname }}
      (host_vars/{{ inventory_hostname }}/vault.yml or group_vars/all/vault.yml; see vault.yml.example).
    quiet: true

- name: Create Garage compose directory
  ansible.builtin.file:
    path: "{{ services_dir }}/garage"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Create Garage data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - "{{ garage_data_dir }}/meta"
    - "{{ garage_data_dir }}/data"

# Garage's metadata is root-owned, so the backup copies it through this script, not as plain files
# (see backup-services.sh). teardown_service.yml removes it again.
- name: Install the Garage dump script
  ansible.builtin.copy:
    src: dump.sh
    dest: "{{ service_dump_scripts_dir }}/garage.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Check if Garage meta directory already has data (i.e., cluster was already bootstrapped)
  ansible.builtin.find:
    path: "{{ garage_data_dir }}/meta"
    file_type: any
  register: garage_meta_contents

- name: Set fact for first deploy detection
  ansible.builtin.set_fact:
    garage_is_first_deploy: "{{ garage_meta_contents.matched == 0 }}"

- name: Render garage.toml
  ansible.builtin.template:
    src: garage.toml.j2
    dest: "{{ services_dir }}/garage/garage.toml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0640"
  diff: false   # holds the RPC secret and admin token
  notify: Restart Garage

- name: Render Garage docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ services_dir }}/garage/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0640"
  diff: false   # holds the admin token and the web UI password hash
  notify: Restart Garage

- name: Render Caddyfile for CORS proxy
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ services_dir }}/garage/Caddyfile"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Restart the Garage CORS proxy

- name: Start Garage
  community.docker.docker_compose_v2:
    project_src: "{{ services_dir }}/garage"
    state: present
    pull: "{{ docker_pull_policy }}"
