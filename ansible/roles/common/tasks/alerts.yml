---
# alert.sh is run by the backup cron jobs, the connectivity watchdog and unlock.sh (which runs as root), so it lives here: they work with
# the other parts off. It is root's file because root runs it, though scripts_dir belongs to the Ansible user (docs/encryption.md#what-it-protects).
- name: Render the alert script
  ansible.builtin.template:
    src: alert.sh.j2
    dest: "{{ scripts_dir }}/alert.sh"
    owner: root
    group: root
    mode: "0755"
  diff: false

- name: Create the alert token directory
  ansible.builtin.file:
    path: "{{ alert_token_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

# alert.sh reads a sender's token from its file; a sender with no destination or no token has no file.
- name: Write the alert token files
  ansible.builtin.copy:
    content: "{{ alert_targets[item].token }}"
    dest: "{{ alert_token_dir }}/{{ item }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  no_log: true
  loop: "{{ script_alert_senders }}"
  when: alert_targets[item].url | length > 0 and alert_targets[item].token | length > 0

- name: Remove the token file of a sender with no destination or no token
  ansible.builtin.file:
    path: "{{ alert_token_dir }}/{{ item }}"
    state: absent
  loop: "{{ script_alert_senders }}"
  when: alert_targets[item].url | length == 0 or alert_targets[item].token | length == 0
