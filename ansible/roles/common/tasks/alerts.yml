---
# alert.sh is run by the backup cron jobs and the connectivity watchdog, so it lives here: both work with the other off.
- name: Render the alert script
  ansible.builtin.template:
    src: alert.sh.j2
    dest: "{{ scripts_dir }}/alert.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

# alert.sh reads the token from this file; with no system alert destination or no token the file is removed.
- name: Write the ntfy token file
  ansible.builtin.copy:
    content: "{{ alert_targets.system.token }}"
    dest: "{{ ntfy_token_file }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  no_log: true
  when: alert_targets.system.url | length > 0 and alert_targets.system.token | length > 0

- name: Remove the ntfy token file when alerts are off
  ansible.builtin.file:
    path: "{{ ntfy_token_file }}"
    state: absent
  when: alert_targets.system.url | length == 0 or alert_targets.system.token | length == 0
