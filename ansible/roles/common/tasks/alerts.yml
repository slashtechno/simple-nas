---
# alert.sh is run by the backup cron jobs and the connectivity watchdog, so it lives here: both work with the other off.
- name: Render the alert script
  ansible.builtin.template:
    src: alert.sh.j2
    dest: "{{ scripts_dir }}/alert.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

# alert.sh reads the token from this file; with no host_alert_url or no token the file is removed.
- name: Write the ntfy token file
  ansible.builtin.copy:
    content: "{{ host_alert_token }}"
    dest: "{{ ntfy_token_file }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  no_log: true
  when: host_alert_url | length > 0 and host_alert_token | length > 0

- name: Remove the ntfy token file when alerts are off
  ansible.builtin.file:
    path: "{{ ntfy_token_file }}"
    state: absent
  when: host_alert_url | length == 0 or host_alert_token | length == 0
