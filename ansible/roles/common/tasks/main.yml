---
# Docker is handled via the geerlingguy.docker role dependency in meta/main.yml.

# Passwordless sudo for the Ansible user, so deploys need no password. On a new host the first run
# uses -K (--ask-become-pass) to type the sudo password once; this file makes later runs need none.
# The drop-in is checked with visudo before it is installed, so a typo cannot lock sudo out.
- name: Allow the Ansible user passwordless sudo
  ansible.builtin.copy:
    content: "{{ ansible_user }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: /etc/sudoers.d/90-ansible
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

# The parent of every compose project, then the scripts directory and the dump script directory inside it.
# Several roles install into the last two, so they are created here once.
- name: Create the base directory for compose projects, scripts and dump scripts
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - "{{ services_dir }}"
    - "{{ scripts_dir }}"
    - "{{ service_dump_scripts_dir }}"

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - git
      - vim
      - jq
      - python3
      - python3-docker   # Docker SDK — required by community.docker Ansible modules
    state: present
    update_cache: true

# A NAS must not sleep. Ubuntu Desktop suspends after idle time by default (GNOME's
# sleep-inactive-ac-type is 'suspend'), which would take every service offline. Masking the targets stops
# any suspend or hibernate, from the desktop or from a command; servers never use them.
- name: Never suspend or hibernate
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: true
  loop: [sleep.target, suspend.target, hibernate.target, hybrid-sleep.target]

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Add the owner's SSH public keys
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    key: "{{ item }}"
  loop: "{{ ssh_authorized_keys }}"

# Set where the system log is kept (journal_storage). Raspberry Pi OS ships 40-rpi-volatile-storage.conf
# (Storage=volatile); this file sorts after it and wins. journald caps its own disk use. The restart handler applies
# it now: without it the setting waits for the next reboot, which is often the one worth logging.
- name: Create the journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Set where the system log is kept
  ansible.builtin.copy:
    content: "[Journal]\nStorage={{ journal_storage }}\n"
    dest: "{{ journald_dropin }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald

- name: Set up failure alerts
  ansible.builtin.import_tasks: alerts.yml

- name: Install the terminal tools
  ansible.builtin.import_tasks: terminal.yml
  when: terminal_tools_enabled | bool

- name: Set where Docker keeps its data
  ansible.builtin.import_tasks: docker_data_root.yml
