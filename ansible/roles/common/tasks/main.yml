---
# Docker is handled via the geerlingguy.docker role dependency in meta/main.yml.

# Passwordless sudo for the Ansible user, so deploys need no password. On a new host the first run
# uses -K (--ask-become-pass) to type the sudo password once; this file makes later runs need none.
# The drop-in is checked with visudo before it is installed, so a typo cannot lock sudo out.
- name: Allow the Ansible user passwordless sudo
  ansible.builtin.copy:
    content: "{{ ansible_user }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: /etc/sudoers.d/90-ansible
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - git
      - vim
      - jq
      - python3
      - python3-docker   # Docker SDK — required by community.docker Ansible modules
    state: present
    update_cache: true

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Add the owner's SSH public keys
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    key: "{{ item }}"
  loop: "{{ ssh_authorized_keys }}"

# Docker data root (docker_data_root in vars.yml). daemon.json gets data-root from derived.yml.
# Docker 29's containerd image store keeps layers under containerd's own root, which data-root does
# not move, so containerd's config.toml is set too. Both services also wait for the drive to be
# mounted: without that, either could start first and create its directory on the microSD under the
# empty mount point. With docker_data_root empty these tasks remove what they added.
- name: Set containerd's storage location
  ansible.builtin.lineinfile:
    path: /etc/containerd/config.toml
    regexp: '^root\s*='
    line: 'root = "{{ docker_data_root }}/containerd"'
    create: true        # a fresh install may have no config.toml yet
    mode: "0644"
    insertbefore: BOF   # a top-level key must precede any [table] in TOML
    state: "{{ 'present' if docker_data_root | length > 0 else 'absent' }}"
  notify: Restart containerd

- name: Create the systemd drop-in directories
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: [docker, containerd]
  when: docker_data_root | length > 0

- name: Hold Docker and containerd until the data-root drive is mounted
  ansible.builtin.copy:
    content: |
      [Unit]
      RequiresMountsFor={{ docker_data_root }}
    dest: "/etc/systemd/system/{{ item }}.service.d/10-data-root-mount.conf"
    owner: root
    group: root
    mode: "0644"
  loop: [docker, containerd]
  when: docker_data_root | length > 0
  notify: Reload systemd

- name: Remove the data-root mount guard
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.service.d/10-data-root-mount.conf"
    state: absent
  loop: [docker, containerd]
  when: docker_data_root | length == 0
  notify: Reload systemd
