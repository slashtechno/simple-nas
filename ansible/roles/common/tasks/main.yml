---
# Docker is handled via the geerlingguy.docker role dependency in meta/main.yml.

# Passwordless sudo for the Ansible user, so deploys need no password. On a new host the first run
# uses -K (--ask-become-pass) to type the sudo password once; this file makes later runs need none.
# The drop-in is checked with visudo before it is installed, so a typo cannot lock sudo out.
- name: Allow the Ansible user passwordless sudo
  ansible.builtin.copy:
    content: "{{ ansible_user }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: /etc/sudoers.d/90-ansible
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

# The parent of every compose project and of the scripts directory.
- name: Create the base directory for compose projects
  ansible.builtin.file:
    path: "{{ services_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - git
      - vim
      - jq
      - python3
      - python3-docker   # Docker SDK — required by community.docker Ansible modules
    state: present
    update_cache: true

# A NAS must not sleep. Ubuntu Desktop suspends after idle time by default (GNOME's
# sleep-inactive-ac-type is 'suspend'), which would take every service offline. Masking the targets stops
# any suspend or hibernate, from the desktop or from a command; servers never use them.
- name: Never suspend or hibernate
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: true
    daemon_reload: true
  loop: [sleep.target, suspend.target, hibernate.target, hybrid-sleep.target]

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Add the owner's SSH public keys
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    key: "{{ item }}"
  loop: "{{ ssh_authorized_keys }}"

# Terminals send TERM=xterm-ghostty, which a fresh Debian does not know: without it, full-screen
# programs (zellij, vim) misbehave over SSH. Compiled from the Mac's own entry (infocmp -x xterm-ghostty).
- name: Install the Ghostty terminfo entry
  ansible.builtin.copy:
    src: xterm-ghostty.terminfo
    dest: /usr/local/share/xterm-ghostty.terminfo
    owner: root
    group: root
    mode: "0644"

- name: Compile the Ghostty terminfo entry
  ansible.builtin.command:
    cmd: tic -x -o /etc/terminfo /usr/local/share/xterm-ghostty.terminfo
    creates: /etc/terminfo/x/xterm-ghostty

# Zellij is not in Debian's apt. Each version gets its own directory and /usr/local/bin/zellij
# points at the current one, so a new zellij_version installs next to the old one.
# Old versions are left behind; delete /opt/zellij/<version> when you like.
# zellij_sha256 lists the CPUs with a download; any other CPU gets no zellij and the deploy carries on.
- name: Install zellij
  when: ansible_facts['architecture'] in zellij_sha256
  block:
    - name: Create the zellij directory for this version
      ansible.builtin.file:
        path: "/opt/zellij/{{ zellij_version }}"
        state: directory
        mode: "0755"

    - name: Download zellij
      ansible.builtin.get_url:
        url: "https://github.com/zellij-org/zellij/releases/download/{{ zellij_version }}/zellij-{{ ansible_facts['architecture'] }}-unknown-linux-musl.tar.gz"
        dest: "/opt/zellij/{{ zellij_version }}/zellij.tar.gz"
        checksum: "sha256:{{ zellij_sha256[ansible_facts['architecture']] }}"
        mode: "0644"

    - name: Unpack zellij
      ansible.builtin.unarchive:
        src: "/opt/zellij/{{ zellij_version }}/zellij.tar.gz"
        dest: "/opt/zellij/{{ zellij_version }}"
        remote_src: true
        creates: "/opt/zellij/{{ zellij_version }}/zellij"

    - name: Put zellij on the PATH
      ansible.builtin.file:
        src: "/opt/zellij/{{ zellij_version }}/zellij"
        dest: /usr/local/bin/zellij
        state: link
        force: true   # replaces a copy installed by hand

# Docker data root (docker_data_root in vars.yml). daemon.json gets data-root from defaults.yml.
# Docker 29's containerd image store keeps layers under containerd's own root, which data-root does
# not move, so containerd's config.toml is set too. With docker_data_root empty this task removes what it added.
- name: Set containerd's storage location
  ansible.builtin.lineinfile:
    path: /etc/containerd/config.toml
    regexp: '^root\s*='
    line: 'root = "{{ docker_data_root }}/containerd"'
    create: true        # a fresh install may have no config.toml yet
    mode: "0644"
    insertbefore: BOF   # a top-level key must precede any [table] in TOML
    state: "{{ 'present' if docker_data_root | length > 0 else 'absent' }}"
  notify: Restart containerd
