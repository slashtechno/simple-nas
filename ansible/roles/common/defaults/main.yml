---
# SSH public keys allowed to log in as the Ansible user, one per device (a list of lines like `ssh-ed25519 AAAA... you@laptop`). Added, never removed:
# a key you delete here stays on the hosts until removed from ~/.ssh/authorized_keys by hand.
ssh_authorized_keys: []
# Install the Ghostty terminfo entry and zellij on the host (a terminal multiplexer). Set false to leave both out.
terminal_tools_enabled: true
# Where a failed backup job and a recovered connection are sent, besides the system log (`journalctl -t backup`): the
# URL of an ntfy topic, for example "http://pinas:8090/alerts" (the ntfy this repo runs, over the tailnet),
# "https://ntfy.pinas.example.com/alerts" (its Caddy name) or "https://ntfy.sh/<your-topic>". "" sends nothing.
# The login token is vault_ntfy_token. A host that is down or unreachable cannot alert. Use https:// or a tailnet
# address: the token travels in the request. For the ntfy this repo runs, the path must be ntfy_topic.
ntfy_alert_url: ""
