---
# gocryptfs encrypts the folders in `encrypted_folders`. Creating a folder (`gocryptfs -init`) and unlocking
# after every boot are done by hand; docs/encryption.md has the steps. This role installs the tools and
# stops Docker starting at boot, so no container can write into a folder before it is unlocked.
- name: Install gocryptfs and FUSE
  ansible.builtin.apt:
    name:
      - gocryptfs
      - fuse3
    state: present
    update_cache: true
    cache_valid_time: 3600

# docker.service is kept off boot by docker_service_enabled in roles/common/meta/main.yml. Without this,
# a connection to the Docker socket would start Docker anyway.
- name: Stop the Docker socket starting Docker at boot
  ansible.builtin.systemd:
    name: docker.socket
    enabled: false

- name: Install the unlock script
  ansible.builtin.template:
    src: unlock.sh.j2
    dest: "{{ scripts_dir }}/unlock.sh"
    owner: root
    group: root
    mode: "0750"
