---
# Folders in `encrypted_folders` are stored encrypted with gocryptfs (docs/encryption.md). Creating one
# (setup-encrypted-folder.sh) and unlocking after each boot (unlock.sh) are done by hand; this role installs the
# tools and the scripts. With no encrypted folder it removes the scripts again (remove.yml).
- name: Check the encrypted folders
  ansible.builtin.import_tasks: check.yml

- name: Install what unlocking needs
  when: encrypted_folders | length > 0
  block:
    - name: Install gocryptfs and FUSE
      ansible.builtin.apt:
        name:
          - gocryptfs
          - fuse3
          - rsync
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Install the encryption scripts
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "{{ scripts_dir }}/{{ item }}"
        owner: root
        group: root
        mode: "0750"
      loop: [unlock.sh, setup-encrypted-folder.sh, remove-encrypted-folder.sh]

    - name: Create the after-unlock scripts directory
      ansible.builtin.file:
        path: "{{ encryption_hooks_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Install the container restart script
      ansible.builtin.template:
        src: 00-containers.sh.j2
        dest: "{{ encryption_hooks_dir }}/00-containers.sh"
        owner: root
        group: root
        mode: "0755"

# A locked host runs nothing that uses those folders until someone types the passphrase, so one alert after each boot tells you it
# is waiting (Tailscale and the network are up two minutes after boot). It is sent to unlock_alert_url; with "" the job is removed.
- name: Write the ntfy token file for the locked-folder alert
  ansible.builtin.copy:
    content: "{{ unlock_alert_token }}"
    dest: "{{ unlock_token_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: encrypted_folders | length > 0 and unlock_alert_url | length > 0 and unlock_alert_token | length > 0

- name: Remove the ntfy token file when the alert has no token
  ansible.builtin.file:
    path: "{{ unlock_token_file }}"
    state: absent
  when: encrypted_folders | length > 0 and (unlock_alert_url | length == 0 or unlock_alert_token | length == 0)

- name: Alert two minutes after boot if a folder is locked
  when: encrypted_folders | length > 0
  ansible.builtin.cron:
    name: "{{ encryption_alert_cron_job }}"
    user: root
    special_time: reboot
    job: sleep 120 && {{ (scripts_dir ~ '/unlock.sh') | quote }} --alert
    state: "{{ 'present' if unlock_alert_url | length > 0 else 'absent' }}"

- name: Remove the encryption scripts when no folder is listed
  ansible.builtin.import_tasks: remove.yml
  when: encrypted_folders | length == 0
