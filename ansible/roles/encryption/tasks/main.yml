---
# Folders in `encrypted_folders` are stored encrypted with gocryptfs (docs/encryption.md). Creating one
# (`gocryptfs -init`) and unlocking after each boot are done by hand; this role installs the tools and unlock.sh.
# With no encrypted folder it removes unlock.sh again.
- name: Install gocryptfs and FUSE
  ansible.builtin.apt:
    name:
      - gocryptfs
      - fuse3
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: encrypted_folders | length > 0

- name: Install the unlock script
  ansible.builtin.template:
    src: unlock.sh.j2
    dest: "{{ scripts_dir }}/unlock.sh"
    owner: root
    group: root
    mode: "0750"
  when: encrypted_folders | length > 0

- name: Remove the unlock script
  ansible.builtin.file:
    path: "{{ scripts_dir }}/unlock.sh"
    state: absent
  when: encrypted_folders | length == 0
