---
# Removes what the encryption role installs. Used by the role (no encrypted folders) and by teardown.yml.
# The hooks directory and the scripts you added to it are never touched.
# Data in encrypted folders is not touched either.
- name: Remove the encryption scripts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ scripts_dir }}/unlock.sh"
    - "{{ scripts_dir }}/setup-encrypted-folder.sh"
    - "{{ scripts_dir }}/remove-encrypted-folder.sh"
    - "{{ encryption_hooks_dir }}/00-containers.sh"

- name: Remove the unlock page's SSH key
  ansible.builtin.lineinfile:
    path: "/home/{{ ansible_user }}/.ssh/authorized_keys"
    regexp: "^{{ (unlock_page_key_command ~ ' ') | regex_escape }}"
    state: absent
