---
# Copyparty's SFTP listener, for a sync client (rclone, a phone app) that logs in with its own account: read, write,
# move and delete on /files. WebDAV lacks the modtimes rclone needs; SFTP has them.
copyparty_sftp_enabled: false
# The SFTP account's name. Its password is vault_copyparty_sftp_pass.
copyparty_sftp_user: sftp
# Host port of the SFTP listener.
copyparty_sftp_port: 3922
# The Copyparty admin login, from the vault.
copyparty_user: "{{ vault_copyparty_user }}"
# The Copyparty admin password, from the vault.
copyparty_pass: "{{ vault_copyparty_pass }}"
