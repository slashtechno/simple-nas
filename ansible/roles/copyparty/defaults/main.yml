---
# Cap in GiB on the thumbnailer's RAM. The upstream default is 60% of system RAM.
copyparty_th_ram_max: "1"
copyparty_version_checker_enabled: true   # vc-url points at the upstream advisory feed (disabled upstream by default)

# Copyparty's SFTP listener, used by the pocketpi project's sync through a scoped
# account in copyparty_service_accounts. WebDAV lacks the modtimes rclone needs; SFTP has them.
copyparty_sftp_enabled: false
# Host port of the SFTP listener.
copyparty_sftp_port: 3922


# The Copyparty admin login, from the vault.
copyparty_user: "{{ vault_copyparty_user }}"
# The Copyparty admin password, from the vault.
copyparty_pass: "{{ vault_copyparty_pass }}"
