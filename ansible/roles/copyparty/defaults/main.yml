---
# Extra Copyparty config, written to its own file next to the generated one; Copyparty merges the [global], [accounts] and
# volume sections of both. For anything the settings here do not cover, e.g. an SFTP or FTP listener
# (docs/services.md#copyparty-folders-and-logins). Keep passwords in the vault: the file is mode 0600 and --diff does not show it.
copyparty_extra_conf: ""
# Host folders to mount into the container, as "host:container" or "host:container:ro" strings, e.g. ["/mnt/fast/shared:/fast"].
# A mounted folder is visible only after a volume for it is in copyparty_extra_conf (docs/services.md#show-a-read-only-host-folder).
copyparty_extra_volumes: []
# Ports to publish for what copyparty_extra_conf opens, as "host:container" strings, e.g. ["3922:3922"].
copyparty_extra_ports: []
# Everyone who signs in to Copyparty, from the vault: a list of {user, pass, admin}. admin: true gives full access to every folder and to
# /drives; no pass means a login through Tinyauth only (copyparty_sso_enabled), with the Tinyauth user name as user. Which folders
# a login can open is in copyparty_folders.
copyparty_accounts: "{{ vault_copyparty_accounts }}"
