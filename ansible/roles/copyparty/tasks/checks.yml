---
# Run by main.yml, and by tests/copyparty_refuse.yml with bad input.
- name: Check the Copyparty logins have an admin
  ansible.builtin.assert:
    that:
      - vault_copyparty_accounts is defined
      - copyparty_accounts | selectattr('admin', 'defined') | selectattr('admin') | list | length > 0
    fail_msg: >-
      copyparty needs vault_copyparty_accounts in the vault that applies to {{ inventory_hostname }}
      (host_vars/{{ inventory_hostname }}/vault.yml or group_vars/all/vault.yml), with at least one login that has admin: true
      (vault.yml.example).
    quiet: true

- name: Check Copyparty's single sign-on is set up
  ansible.builtin.assert:
    that:
      - tinyauth_enabled | bool
      - caddy_enabled | bool
      - vault_copyparty_idp_key is defined
    fail_msg: >-
      copyparty_sso_enabled needs tinyauth_enabled, caddy_enabled and vault_copyparty_idp_key in the vault that applies to
      {{ inventory_hostname }} (vault.yml.example says how to make it).
    quiet: true
  when: copyparty_sso_enabled | bool

- name: Check the folder names and permissions
  ansible.builtin.assert:
    that:
      - item.value is mapping
      - item.key is match('^[A-Za-z0-9_-]+$') and item.key not in ['drives', 'shares']
      - item.value.access | default({}) is mapping
      - item.value.access | default({}) | dict2items | rejectattr('value', 'match', '^[rwmdgGha]+$') | list | length == 0
      - item.value.dir is not defined or (item.value.dir is string and item.value.dir is match('^/'))
    fail_msg: >-
      copyparty_folders entry '{{ item.key }}' must be {dir: /absolute/path, access: {login: letters}}. The name is letters, digits, - and _,
      and not drives or shares (Copyparty's own addresses). The letters are from rwmdgGha, such as {friend1: rwmd}.
    quiet: true
  loop: "{{ copyparty_folders | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Check every login is complete
  ansible.builtin.assert:
    that:
      - item.user is defined and item.user | string | length > 0
      - copyparty_accounts | map(attribute='user') | list | length == copyparty_accounts | map(attribute='user') | unique | list | length
      - item.pass is not defined or (item.pass is not none and item.pass | string | length > 0)
      - item.admin | default(false) is boolean
      - item.pass is defined or (copyparty_sso_enabled | bool and item.user in vault_tinyauth_users | map(attribute='name') | list)
    fail_msg: >-
      Each user in vault_copyparty_accounts appears once. Each entry needs user, and pass (not empty) or no pass at all. A login with no pass signs in
      through Tinyauth: it needs copyparty_sso_enabled and a user that is a Tinyauth user name. admin is true or false (vault.yml.example).
    quiet: true
  loop: "{{ copyparty_accounts }}"
  loop_control:
    label: "{{ item.user | default('?') }}"

- name: Check every login a folder names exists
  ansible.builtin.assert:
    that: used | difference(copyparty_accounts | map(attribute='user') | list) | length == 0
    fail_msg: >-
      copyparty_folders names logins that vault_copyparty_accounts does not have:
      {{ used | difference(copyparty_accounts | map(attribute='user') | list) }}.
    quiet: true
  vars:
    used: "{{ copyparty_volumes.values() | map(attribute='access') | map('list') | flatten | unique | list }}"
