---
- name: Check the Copyparty logins have an admin
  ansible.builtin.assert:
    that:
      - vault_copyparty_accounts is defined
      - copyparty_accounts | selectattr('admin', 'defined') | selectattr('admin') | list | length > 0
    fail_msg: >-
      copyparty needs vault_copyparty_accounts in the vault that applies to {{ inventory_hostname }}
      (host_vars/{{ inventory_hostname }}/vault.yml or group_vars/all/vault.yml), with at least one login that has admin: true
      (vault.yml.example).
    quiet: true

- name: Check Copyparty's single sign-on is set up
  ansible.builtin.assert:
    that:
      - tinyauth_enabled | bool
      - caddy_enabled | bool
      - vault_copyparty_idp_key is defined
    fail_msg: >-
      copyparty_sso_enabled needs tinyauth_enabled, caddy_enabled and vault_copyparty_idp_key in the vault that applies to
      {{ inventory_hostname }} (vault.yml.example says how to make it).
    quiet: true
  when: copyparty_sso_enabled | bool

- name: Check the folder names and permissions
  ansible.builtin.assert:
    that:
      - item.key is match('^[A-Za-z0-9_-]+$') and item.key not in ['drives', 'shares']
      - item.value.access | default({}) is mapping
      - item.value.access | default({}) | dict2items | rejectattr('value', 'match', '^[rwmdgGha]+$') | list | length == 0
    fail_msg: >-
      copyparty_folders entry '{{ item.key }}': the name must be letters, digits, - and _, and not drives or shares (Copyparty's own
      addresses), and access must be {login: letters from rwmdgGha}, such as {friend1: rwmd}.
    quiet: true
  loop: "{{ copyparty_folders | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Check every login is complete
  ansible.builtin.assert:
    that:
      - item.user is defined and item.user | string | length > 0
      - item.pass | default('x') | string | length > 0
      - item.admin | default(false) is boolean
      - item.pass is defined or (copyparty_sso_enabled | bool and item.user in vault_tinyauth_users | map(attribute='name') | list)
    fail_msg: >-
      Each entry of vault_copyparty_accounts needs user, and pass (not empty) or no pass at all. A login with no pass signs in
      through Tinyauth: it needs copyparty_sso_enabled and a user that is a Tinyauth user name. admin is true or false (vault.yml.example).
    quiet: true
  loop: "{{ copyparty_accounts }}"
  loop_control:
    label: "{{ item.user | default('?') }}"

- name: Check every login a folder names exists
  ansible.builtin.assert:
    that: used | difference(copyparty_accounts | map(attribute='user') | list) | length == 0
    fail_msg: >-
      copyparty_folders names logins that vault_copyparty_accounts does not have:
      {{ used | difference(copyparty_accounts | map(attribute='user') | list) }}.
    quiet: true
  vars:
    used: "{{ copyparty_volumes.values() | map(attribute='access') | map('list') | flatten | unique | list }}"

- name: Create Copyparty compose directory
  ansible.builtin.file:
    path: "{{ services_dir }}/copyparty"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Create Copyparty data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - "{{ copyparty_files_dir }}"
    - "{{ copyparty_config_dir }}"
    - "{{ copyparty_hist_dir }}"

- name: Create the folder behind each Copyparty folder
  ansible.builtin.file:
    path: "{{ item.value.dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop: "{{ copyparty_volumes | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Copy Docker build files
  ansible.builtin.copy:
    src: Dockerfile
    dest: "{{ services_dir }}/copyparty/Dockerfile"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

# Holds the account passwords. The container runs as root, so the owner-only mode is enough.
- name: Render the Copyparty config
  ansible.builtin.template:
    src: copyparty.conf.j2
    dest: "{{ copyparty_config_dir }}/copyparty.conf"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  diff: false   # the passwords would show in --diff
  notify: Restart Copyparty

- name: Render the extra Copyparty config
  ansible.builtin.copy:
    content: "{{ copyparty_extra_conf }}\n"
    dest: "{{ copyparty_config_dir }}/extra.conf"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  diff: false
  notify: Restart Copyparty

- name: Render Copyparty docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ services_dir }}/copyparty/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0640"
  notify: Restart Copyparty

- name: Build and start Copyparty
  community.docker.docker_compose_v2:
    project_src: "{{ services_dir }}/copyparty"
    state: present
    build: always
