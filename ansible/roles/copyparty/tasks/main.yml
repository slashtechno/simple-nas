---
- name: Check the copyparty secrets are in the vault
  ansible.builtin.assert:
    that:
      - vault_copyparty_user is defined
      - vault_copyparty_pass is defined
    fail_msg: >-
      copyparty needs vault_copyparty_user, vault_copyparty_pass in the vault that applies to {{ inventory_hostname }}
      (host_vars/{{ inventory_hostname }}/vault.yml or group_vars/all/vault.yml; see vault.yml.example).
    quiet: true

- name: Check Copyparty's single sign-on is set up
  ansible.builtin.assert:
    that:
      - copyparty_sso_admins | length > 0
      - tinyauth_enabled | bool
      - caddy_enabled | bool
      - vault_copyparty_idp_key is defined
    fail_msg: >-
      copyparty_sso_enabled needs copyparty_sso_admins, a list of Tinyauth user names (roles/copyparty/defaults/main.yml),
      tinyauth_enabled and caddy_enabled, and vault_copyparty_idp_key in the vault that applies to
      {{ inventory_hostname }} (vault.yml.example says how to make it).
    quiet: true
  when: copyparty_sso_enabled | bool

- name: Check the collab accounts are in the vault
  ansible.builtin.assert:
    that: vault_copyparty_collab_users | default([]) | length > 0
    fail_msg: >-
      copyparty_collab_enabled needs vault_copyparty_collab_users, a list of user and pass entries
      (see vault.yml.example).
    quiet: true
  when: copyparty_collab_enabled | bool

- name: Create Copyparty compose directory
  ansible.builtin.file:
    path: "{{ services_dir }}/copyparty"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Create Copyparty data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - "{{ copyparty_files_dir }}"
    - "{{ copyparty_config_dir }}"
    - "{{ copyparty_hist_dir }}"

- name: Create the /collab volume directory
  ansible.builtin.file:
    path: "{{ copyparty_collab_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  when: copyparty_collab_enabled | bool

- name: Create the /fast volume directory
  ansible.builtin.file:
    path: "{{ copyparty_fast_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  when: copyparty_fast_enabled | bool

- name: Copy Docker build files
  ansible.builtin.copy:
    src: Dockerfile
    dest: "{{ services_dir }}/copyparty/Dockerfile"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: Create the directory behind each app volume
  ansible.builtin.file:
    path: "{{ lookup('ansible.builtin.vars', item.1.dir) }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  # item.0 is the app, item.1 one of its volumes
  loop: "{{ copyparty_clients | subelements('copyparty.volumes') }}"
  loop_control:
    label: "{{ item.0.key }}/{{ item.1.folder }}"

# Holds the account passwords. The container runs as root, so the owner-only mode is enough.
- name: Render the Copyparty config
  ansible.builtin.template:
    src: copyparty.conf.j2
    dest: "{{ copyparty_config_dir }}/copyparty.conf"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  diff: false   # the passwords would show in --diff
  notify: Restart Copyparty

- name: Render Copyparty docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ services_dir }}/copyparty/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0640"
  notify: Restart Copyparty

- name: Build and start Copyparty
  community.docker.docker_compose_v2:
    project_src: "{{ services_dir }}/copyparty"
    state: present
    build: always
