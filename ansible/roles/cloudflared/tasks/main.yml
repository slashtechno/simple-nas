---
# The tunnel is remotely managed: its ingress rules live at Cloudflare and the container only needs
# a token. A deploy makes Cloudflare match cloudflared_ingress: it creates the tunnel if it does not
# exist, sets the rules, and creates, corrects and deletes DNS records so they match (plan shown first).
# Cloudflare's API: https://developers.cloudflare.com/api/
#   check.yml   the settings, and each hostname's zone
#   tunnel.yml  find or create the tunnel
#   rules.yml   the tunnel's hostname rules
#   dns.yml     the DNS records
#
# API calls run on your computer so the broad token (cloudflare_api_token) stays off the server; only
# the tunnel token reaches it. Tasks with `check_mode: false` only read, so --check can show the plan.
- name: Check the settings
  ansible.builtin.import_tasks: check.yml

- name: Make Cloudflare match cloudflared_ingress
  delegate_to: localhost
  become: false
  module_defaults:
    ansible.builtin.uri:
      headers:
        Authorization: "Bearer {{ cloudflare_api_token }}"
  block:
    - name: Find or create the tunnel
      ansible.builtin.import_tasks: tunnel.yml

    # Everything below needs the tunnel, which does not exist yet in a --check on a new setup.
    - name: Make the tunnel's rules and DNS match
      when: cloudflared_tunnel_id | length > 0
      block:
        - name: Set the rules
          ansible.builtin.import_tasks: rules.yml

        - name: Set the DNS records
          ansible.builtin.import_tasks: dns.yml

# --- On the server ---
- name: Create the cloudflared directory
  ansible.builtin.file:
    path: "{{ services_dir }}/cloudflared"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

# The token is how the container proves it is this tunnel. It is fetched on every deploy, so it
# can always be rewritten, and it can be revoked in Cloudflare without touching the API token.
- name: Fetch the tunnel token
  ansible.builtin.uri:
    url: "{{ cloudflare_api_url }}/accounts/{{ cloudflare_account_id }}/cfd_tunnel/{{ cloudflared_tunnel_id }}/token"
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  no_log: true
  register: cloudflared_token
  when: cloudflared_tunnel_id | length > 0

# The image runs as user 65532, so only that user can read the file (mode 0400).
- name: Write the tunnel token
  ansible.builtin.copy:
    content: "{{ cloudflared_token.json.result }}"
    dest: "{{ cloudflared_token_file }}"
    owner: "65532"
    group: "65532"
    mode: "0400"
  no_log: true
  when: cloudflared_tunnel_id | length > 0
  notify: Restart cloudflared

- name: Deploy cloudflared
  ansible.builtin.import_role:
    name: compose_service
  vars:
    compose_service_name: cloudflared
  when: cloudflared_tunnel_id | length > 0   # empty only in --check, before the tunnel exists
