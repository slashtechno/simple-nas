---
# The tunnel is remotely managed: its ingress rules live at Cloudflare and the container only needs
# a token. A deploy makes Cloudflare match cloudflared_ingress: it creates the tunnel if it does not
# exist, sets the rules, and creates, corrects and deletes DNS records so they match (plan shown first).
# Cloudflare's API: https://developers.cloudflare.com/api/
#
# Every API call runs on the machine running Ansible (delegate_to: localhost), so the broad API token
# (cloudflare_api_token) never reaches a server. The server gets only the tunnel token.
#
# The API calls sit in one block so the settings shared by all of them are written once:
#   - delegate_to / become: run on your computer, without sudo.
#   - module_defaults: every ansible.builtin.uri call below sends the token in this header.
# Tasks marked `check_mode: false` only read, so they run even with --check; that is what lets
# --check --diff show what would change.
- name: Check cloudflared_ingress before calling Cloudflare
  ansible.builtin.assert:
    that:
      - item.keys() | sort | list == ['hostname', 'service']
      # `in` here means the zone's domain appears in the hostname, e.g. angad.me in pics.angad.me.
      - cloudflare_zones | dict2items | selectattr('key', 'in', item.hostname) | list | length == 1
    fail_msg: >-
      {{ item }} must have only hostname and service (no path), and its hostname must match exactly
      one domain in cloudflare_zones. See the comments in group_vars/all/vars.yml.
    quiet: true
  loop: "{{ cloudflared_ingress }}"
  loop_control:
    label: "{{ item.hostname | default(item) }}"

# Two hosts serving one hostname would fight over its DNS record, so each hostname belongs to one host.
# Only hosts with cloudflared_enabled count: a host that does not run a tunnel does not touch DNS.
- name: Check that no other host serves the same hostname
  vars:
    other_tunnel_hosts: "{{ groups['servers'] | difference([inventory_hostname]) | map('extract', hostvars) | selectattr('cloudflared_enabled') | list }}"
    their_hostnames: "{{ other_tunnel_hosts | map(attribute='cloudflared_ingress') | flatten | map(attribute='hostname') | list }}"
    my_hostnames: "{{ cloudflared_ingress | map(attribute='hostname') | list }}"
  ansible.builtin.assert:
    that: my_hostnames | intersect(their_hostnames) | length == 0
    fail_msg: A hostname in cloudflared_ingress is also in another host's cloudflared_ingress. Each hostname belongs to one host.
    quiet: true

- name: Make Cloudflare match cloudflared_ingress
  delegate_to: localhost
  become: false
  module_defaults:
    ansible.builtin.uri:
      headers:
        Authorization: "Bearer {{ cloudflare_api_token }}"
  block:
    # --- The tunnel ---
    - name: Look up the tunnel by name
      ansible.builtin.uri:
        url: "{{ cloudflare_api_url }}/accounts/{{ cloudflare_account_id }}/cfd_tunnel?name={{ cloudflared_tunnel_name }}&is_deleted=false"
      check_mode: false
      changed_when: false
      register: cloudflared_lookup

    # An empty result means there is no tunnel with that name yet.
    - name: Remember the tunnel Cloudflare returned (empty if none)
      ansible.builtin.set_fact:
        cloudflared_existing: "{{ cloudflared_lookup.json.result | first | default({}) }}"

    # A locally managed tunnel keeps its rules in a file on the host, which this role does not write.
    # Cloudflare can convert it (Zero Trust, Networks, Tunnels, the tunnel's migrate option).
    # Deleting it instead takes the public hostnames offline until the next deploy creates a new one.
    - name: Stop if the existing tunnel is locally managed
      ansible.builtin.assert:
        that: cloudflared_existing.config_src | default('cloudflare') == 'cloudflare'
        fail_msg: >-
          The tunnel "{{ cloudflared_tunnel_name }}" is locally managed, so its rules cannot be set from here.
          In the Cloudflare dashboard (Zero Trust, Networks, Tunnels) use the tunnel's migrate option
          and deploy again. Or delete the tunnel there and deploy: that creates a new one, but every
          public hostname is offline until the deploy finishes.
        quiet: true

    - name: Say that the tunnel will be created
      ansible.builtin.debug:
        msg: "There is no tunnel called {{ cloudflared_tunnel_name }}. A real deploy creates it; --check cannot show the steps that depend on it."
      when: cloudflared_existing | length == 0

    - name: Create the tunnel
      ansible.builtin.uri:
        url: "{{ cloudflare_api_url }}/accounts/{{ cloudflare_account_id }}/cfd_tunnel"
        method: POST
        body_format: json
        body:
          name: "{{ cloudflared_tunnel_name }}"
          config_src: cloudflare
      register: cloudflared_created
      when: cloudflared_existing | length == 0

    # cloudflared_tunnel_id is empty only in --check, when the tunnel does not exist yet. The tasks
    # below that need the ID are skipped in that case.
    - name: Take the ID from the existing tunnel
      ansible.builtin.set_fact:
        cloudflared_tunnel_id: "{{ cloudflared_existing.id }}"
      when: cloudflared_existing | length > 0

    - name: Take the ID from the tunnel just created
      ansible.builtin.set_fact:
        cloudflared_tunnel_id: "{{ cloudflared_created.json.result.id }}"
      when:
        - cloudflared_existing | length == 0
        - not ansible_check_mode

    - name: Use an empty ID if the tunnel does not exist yet (--check only)
      ansible.builtin.set_fact:
        cloudflared_tunnel_id: ""
      when: cloudflared_tunnel_id is not defined

    # Each hostname with its zone: the cloudflare_zones entry whose domain appears in the hostname (checked above).
    - name: Pair each hostname with its zone
      ansible.builtin.set_fact:
        cloudflared_hostnames: "{{ cloudflared_hostnames | default([]) + [{'hostname': item.hostname, 'zone_id': zone_id}] }}"
      vars:
        zone_id: "{{ (cloudflare_zones | dict2items | selectattr('key', 'in', item.hostname) | first).value }}"
      loop: "{{ cloudflared_ingress }}"
      loop_control:
        label: "{{ item.hostname }}"

    # Everything below needs the tunnel, which does not exist yet in a --check on a new setup.
    - name: Make the tunnel's rules and DNS match
      when: cloudflared_tunnel_id | length > 0
      block:
        # --- The rules ---
        - name: Read the rules the tunnel has now
          ansible.builtin.uri:
            url: "{{ cloudflare_api_url }}/accounts/{{ cloudflare_account_id }}/cfd_tunnel/{{ cloudflared_tunnel_id }}/configurations"
          check_mode: false
          changed_when: false
          register: cloudflared_rules_now

        # Only the hostnames and services are compared; Cloudflare adds fields of its own to each rule.
        # The last rule (no hostname) is the catch-all, which this role always sets.
        - name: Work out whether the rules differ
          vars:
            rules_now: >-
              {{ cloudflared_rules_now.json.result.config.ingress | default([], true)
                 | selectattr('hostname', 'defined') | list }}
          ansible.builtin.set_fact:
            cloudflared_rules_differ: >-
              {{ rules_now | map(attribute='hostname') | list != cloudflared_ingress | map(attribute='hostname') | list
                 or rules_now | map(attribute='service') | list != cloudflared_ingress | map(attribute='service') | list }}

        # The PUT replaces the whole list. The final rule answers 404 for any hostname not listed.
        - name: Set the tunnel's rules
          ansible.builtin.uri:
            url: "{{ cloudflare_api_url }}/accounts/{{ cloudflare_account_id }}/cfd_tunnel/{{ cloudflared_tunnel_id }}/configurations"
            method: PUT
            body_format: json
            body:
              config:
                ingress: "{{ cloudflared_ingress + [{'service': 'http_status:404'}] }}"
          when: cloudflared_rules_differ | bool

        # --- DNS: one proxied CNAME per hostname, pointing at <tunnel id>.cfargotunnel.com ---
        # The zone is the cloudflare_zones entry whose domain appears in the hostname (checked above).
        # Every record this role writes carries a comment (cloudflared_dns_comment) that says it is
        # managed here. The plan below is worked out from read-only calls, so --check shows it in full.
        #
        # A hostname's existing record:
        #   none                                          create
        #   CNAME to this tunnel                          keep (add the comment if it is missing)
        #   has the comment, or points at a deleted tunnel  point it at this tunnel
        #   points at another tunnel that exists          stop: that tunnel is serving it
        #   anything else (A, MX, TXT, ...)               stop
        # A record not in cloudflared_ingress is deleted if it has the comment or points at this tunnel
        # (a hostname added in the Zero Trust dashboard, or removed from the list). Records that point
        # at a deleted tunnel and are not ours are only reported.
        - name: Read every DNS record of the zones
          ansible.builtin.uri:
            url: "{{ cloudflare_api_url }}/zones/{{ item }}/dns_records?per_page=5000"
          check_mode: false
          changed_when: false
          loop: "{{ cloudflare_zones.values() | unique | list }}"
          register: cloudflared_zone_lists

        - name: Read the tunnels that exist in the account
          ansible.builtin.uri:
            url: "{{ cloudflare_api_url }}/accounts/{{ cloudflare_account_id }}/cfd_tunnel?is_deleted=false&per_page=1000"
          check_mode: false
          changed_when: false
          register: cloudflared_live_tunnels

        # The plan trusts these lists to be complete, so a second page stops the deploy.
        - name: Stop if a listing has more than one page
          ansible.builtin.assert:
            that:
              - cloudflared_zone_lists.results | map(attribute='json.result_info.total_pages') | select('gt', 1) | list | length == 0
              - cloudflared_live_tunnels.json.result_info.total_pages | default(1) <= 1
            fail_msg: A zone or the tunnel list has more than 5000 or 1000 entries. This role reads one page only.
            quiet: true

        - name: Collect what the plan needs
          ansible.builtin.set_fact:
            cloudflared_our_target: "{{ cloudflared_tunnel_id }}.cfargotunnel.com"
            cloudflared_live_targets: "{{ cloudflared_live_tunnels.json.result | map(attribute='id') | map('regex_replace', '$', '.cfargotunnel.com') | list }}"
            cloudflared_dns_records: "{{ cloudflared_zone_lists.results | map(attribute='json.result') | flatten }}"

        - name: Stop if a hostname has a record that belongs to something else
          vars:
            record: "{{ cloudflared_dns_records | selectattr('name', 'equalto', item.hostname) | first | default({}) }}"
          ansible.builtin.assert:
            that: >-
              record | length == 0
              or (record.type == 'CNAME'
                  and (record.content == cloudflared_our_target
                       or record.comment | default('', true) == cloudflared_dns_comment
                       or (record.content.endswith('.cfargotunnel.com') and record.content not in cloudflared_live_targets)))
            fail_msg: >-
              {{ item.hostname }} already has a {{ record.type | default('') }} record ({{ record.content | default('') }})
              that this role did not create and that another tunnel or service uses. If it is unused, delete it in
              the Cloudflare dashboard (DNS) and deploy again.
            quiet: true
          loop: "{{ cloudflared_hostnames }}"
          loop_control:
            label: "{{ item.hostname }}"

        - name: Work out what each hostname needs
          vars:
            record: "{{ cloudflared_dns_records | selectattr('name', 'equalto', item.hostname) | first | default({}) }}"
            change: >-
              {{ 'create' if record | length == 0
                 else 'keep' if record.content == cloudflared_our_target and record.comment | default('', true) == cloudflared_dns_comment
                 else 'adopt' if record.content == cloudflared_our_target
                 else 'repoint' }}
          ansible.builtin.set_fact:
            cloudflared_dns_actions: >-
              {{ cloudflared_dns_actions | default([])
                 + [{'hostname': item.hostname, 'zone_id': item.zone_id, 'action': change, 'record_id': record.id | default('')}] }}
          loop: "{{ cloudflared_hostnames }}"
          loop_control:
            label: "{{ item.hostname }}"

        - name: Work out which records to delete and which to report
          vars:
            declared: "{{ cloudflared_hostnames | map(attribute='hostname') | list }}"
            ours: >-
              {{ cloudflared_dns_records | selectattr('comment', 'defined') | selectattr('comment', 'equalto', cloudflared_dns_comment) | list
                 + cloudflared_dns_records | selectattr('type', 'equalto', 'CNAME') | selectattr('content', 'equalto', cloudflared_our_target) | list }}
            to_delete: "{{ ours | unique(attribute='id') | rejectattr('name', 'in', declared) | list }}"
          ansible.builtin.set_fact:
            cloudflared_dns_deletes: "{{ to_delete }}"
            cloudflared_dns_dangling: >-
              {{ cloudflared_dns_records | selectattr('type', 'equalto', 'CNAME') | selectattr('content', 'search', '[.]cfargotunnel[.]com$')
                 | rejectattr('content', 'in', cloudflared_live_targets) | rejectattr('name', 'in', declared)
                 | rejectattr('id', 'in', to_delete | map(attribute='id') | list) | list }}

        - name: Show the DNS plan
          ansible.builtin.debug:
            msg:
              - "create:   {{ cloudflared_dns_actions | selectattr('action', 'equalto', 'create') | map(attribute='hostname') | list }}"
              - "comment:  {{ cloudflared_dns_actions | selectattr('action', 'equalto', 'adopt') | map(attribute='hostname') | list }}"
              - "repoint:  {{ cloudflared_dns_actions | selectattr('action', 'equalto', 'repoint') | map(attribute='hostname') | list }}"
              - "delete:   {{ cloudflared_dns_deletes | map(attribute='name') | list }}"
              - "not ours, point at a deleted tunnel (left alone): {{ cloudflared_dns_dangling | map(attribute='name') | list }}"

        # PATCH changes only the fields sent. A PUT would reset the ones left out, such as proxied.
        - name: Create the missing records
          ansible.builtin.uri:
            url: "{{ cloudflare_api_url }}/zones/{{ item.zone_id }}/dns_records"
            method: POST
            body_format: json
            body:
              type: CNAME
              name: "{{ item.hostname }}"
              content: "{{ cloudflared_our_target }}"
              ttl: 1   # 1 means automatic
              proxied: true
              comment: "{{ cloudflared_dns_comment }}"
          loop: "{{ cloudflared_dns_actions | selectattr('action', 'equalto', 'create') | list }}"
          loop_control:
            label: "{{ item.hostname }}"

        - name: Add the comment to records already pointing at this tunnel
          ansible.builtin.uri:
            url: "{{ cloudflare_api_url }}/zones/{{ item.zone_id }}/dns_records/{{ item.record_id }}"
            method: PATCH
            body_format: json
            body:
              comment: "{{ cloudflared_dns_comment }}"
          loop: "{{ cloudflared_dns_actions | selectattr('action', 'equalto', 'adopt') | list }}"
          loop_control:
            label: "{{ item.hostname }}"

        - name: Point records at this tunnel
          ansible.builtin.uri:
            url: "{{ cloudflare_api_url }}/zones/{{ item.zone_id }}/dns_records/{{ item.record_id }}"
            method: PATCH
            body_format: json
            body:
              content: "{{ cloudflared_our_target }}"
              proxied: true
              comment: "{{ cloudflared_dns_comment }}"
          loop: "{{ cloudflared_dns_actions | selectattr('action', 'equalto', 'repoint') | list }}"
          loop_control:
            label: "{{ item.hostname }}"

        - name: Delete records that are not in cloudflared_ingress
          ansible.builtin.uri:
            url: "{{ cloudflare_api_url }}/zones/{{ item.zone_id }}/dns_records/{{ item.id }}"
            method: DELETE
          loop: "{{ cloudflared_dns_deletes }}"
          loop_control:
            label: "{{ item.name }}"

# --- On the server ---
- name: Create the cloudflared directory
  ansible.builtin.file:
    path: "{{ services_dir }}/cloudflared"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

# The token is how the container proves it is this tunnel. It is fetched on every deploy, so it
# can always be rewritten, and it can be revoked in Cloudflare without touching the API token.
- name: Fetch the tunnel token
  ansible.builtin.uri:
    url: "{{ cloudflare_api_url }}/accounts/{{ cloudflare_account_id }}/cfd_tunnel/{{ cloudflared_tunnel_id }}/token"
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  no_log: true
  register: cloudflared_token
  when: cloudflared_tunnel_id | length > 0

# The image runs as user 65532, so only that user can read the file (mode 0400).
- name: Write the tunnel token
  ansible.builtin.copy:
    content: "{{ cloudflared_token.json.result }}"
    dest: "{{ services_dir }}/cloudflared/token"
    owner: "65532"
    group: "65532"
    mode: "0400"
  no_log: true
  when: cloudflared_tunnel_id | length > 0
  notify: Restart cloudflared

- name: Deploy cloudflared
  ansible.builtin.import_role:
    name: compose_service
  vars:
    compose_service_name: cloudflared
  when: cloudflared_tunnel_id | length > 0   # empty only in --check, before the tunnel exists
