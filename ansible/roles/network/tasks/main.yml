---
- name: Create shared Docker network
  community.docker.docker_network:
    name: "{{ docker_network }}"
    state: present

# cloud-init (Raspberry Pi Imager, Ubuntu) sets up networking at first boot. From then on Ansible and
# NetworkManager own it, so cloud-init is told to leave the network config alone. This is cloud-init's
# documented switch; it changes nothing at the time, it only stops a later cloud-init run from rewriting it.
- name: Check for cloud-init
  ansible.builtin.stat:
    path: /etc/cloud/cloud.cfg.d
  register: network_cloud_init_dir

- name: Stop cloud-init managing the network
  ansible.builtin.copy:
    content: |
      # Ansible-managed (roles/network). Networking is configured by Ansible, not cloud-init.
      network: {config: disabled}
    dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
    owner: root
    group: root
    mode: "0644"
  when: network_cloud_init_dir.stat.exists

# Direct Ethernet link to a laptop (see docs/networking.md#direct-ethernet-link).
# The port must be idle (Pi runs on wifi): setting it up on the connection Ansible uses would drop it.
- name: Set up direct Ethernet link
  when: direct_link_enabled | bool
  block:
    # Raspberry Pi OS and Ubuntu Desktop run NetworkManager (the link is an nmcli profile). Ubuntu Server runs
    # systemd-networkd, configured through netplan (the link is a netplan file). dnsmasq is the same for both.
    - name: Check which network manager is running
      ansible.builtin.service_facts:

    - name: Note whether NetworkManager is the one running
      ansible.builtin.set_fact:
        network_uses_nm: "{{ ansible_facts['services']['NetworkManager.service']['state'] | default('') == 'running' }}"

    - name: Check for netplan
      ansible.builtin.stat:
        path: /usr/sbin/netplan
      register: network_netplan

    - name: Refuse the direct link where there is neither NetworkManager nor netplan
      ansible.builtin.assert:
        that: network_uses_nm or network_netplan.stat.exists
        fail_msg: >-
          {{ inventory_hostname }} runs neither NetworkManager nor netplan, so the direct link cannot be set up
          here. Set direct_link_enabled to false for this host (docs/networking.md#direct-ethernet-link).

    - name: Refuse to touch the interface this host is managed over
      ansible.builtin.assert:
        that: ansible_facts['default_ipv4']['interface'] | default('') != direct_link_iface
        fail_msg: >-
          {{ direct_link_iface }} carries this host's default route, which is probably the connection
          Ansible uses. Setting up the direct link on it would cut that connection.
          Manage the host over another interface (wifi), or use another port for the link.

    - name: Configure static direct-link IP with NetworkManager (no gateway, so it cannot route internet traffic)
      when: network_uses_nm
      block:
        - name: Add the direct-link profile
          community.general.nmcli:
            type: ethernet
            conn_name: direct-link
            ifname: "{{ direct_link_iface }}"
            ip4: "{{ direct_link_ip }}/{{ direct_link_prefix }}"
            method4: manual
            autoconnect: true
            state: present

        # The Pi ships with a default DHCP profile on eth0 ("Wired connection 1");
        # it's turned off so it can never race our static one for the port.
        - name: Disable auto-connect on the default eth0 DHCP profile
          community.general.nmcli:
            type: ethernet
            conn_name: "Wired connection 1"
            ifname: "{{ direct_link_iface }}"
            autoconnect: false
            state: present

    # netplan merges files in name order and a later file overrides the same keys, so this file turns off the
    # port's DHCP from the installer's or cloud-init's file without editing it. "optional" keeps boot from
    # waiting for a cable.
    - name: Configure static direct-link IP with netplan (no gateway, so it cannot route internet traffic)
      when: not network_uses_nm
      ansible.builtin.template:
        src: direct-link-netplan.yaml.j2
        dest: /etc/netplan/60-direct-link.yaml
        owner: root
        group: root
        mode: "0600"
      notify: Apply netplan

    # Auto-assigns the laptop's IP so it doesn't need manual TCP/IP config.
    # DHCP only (port=0 disables dnsmasq's DNS proxy) and scoped to the link port only
    # (bind-dynamic + interface={{ direct_link_iface }}), so it can't affect wifi or hand out a gateway/DNS —
    # NetworkManager's built-in "shared" mode is not used: it also enables
    # NAT/forwarding, which would open exactly the internet path this link is
    # designed not to have.
    - name: Install dnsmasq
      ansible.builtin.apt:
        name: dnsmasq
        state: present

    - name: Configure dnsmasq to auto-assign the laptop's IP
      ansible.builtin.template:
        src: direct-link-dnsmasq.conf.j2
        dest: /etc/dnsmasq.d/direct-link.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart direct-link dnsmasq

# Symmetric revert: flipping direct_link_enabled back to false and redeploying
# undoes the block above, without needing the full destructive teardown.yml.
# Runs only where the link was set up before (its dnsmasq file exists). A host that never had the
# link, including one that copied the example's "false", keeps its own port profile untouched.
- name: Check whether the direct link is set up
  ansible.builtin.stat:
    path: /etc/dnsmasq.d/direct-link.conf
  register: network_direct_link_conf

- name: Tear down direct Ethernet link
  ansible.builtin.import_tasks: remove_direct_link.yml
  when: not (direct_link_enabled | bool) and network_direct_link_conf.stat.exists
