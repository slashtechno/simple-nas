---
- name: Create shared Docker network
  community.docker.docker_network:
    name: "{{ nas_network }}"
    state: present

# Direct Ethernet link to a laptop (see README.md#direct-ethernet-link).
# Assumes eth0 is idle (Pi runs on wifi) — if eth0 is ever your Ansible
# management connection instead, enabling this will drop that connection.
- name: Set up direct Ethernet link on eth0
  when: direct_link_enabled | default(false)
  block:
    - name: Configure static direct-link IP on eth0 (no gateway — can't route internet traffic)
      community.general.nmcli:
        type: ethernet
        conn_name: direct-link
        ifname: eth0
        ip4: "{{ direct_link_ip }}/{{ direct_link_prefix }}"
        method4: manual
        autoconnect: true
        state: present

    # The Pi ships with a default DHCP profile on eth0 ("Wired connection 1");
    # it's turned off so it can never race our static one for the port.
    - name: Disable auto-connect on the default eth0 DHCP profile
      community.general.nmcli:
        type: ethernet
        conn_name: "Wired connection 1"
        ifname: eth0
        autoconnect: false
        state: present

    # Auto-assigns the laptop's IP so it doesn't need manual TCP/IP config.
    # DHCP only (port=0 disables dnsmasq's DNS proxy) and scoped to eth0 only
    # (bind-interfaces), so it can't affect wifi or hand out a gateway/DNS —
    # NetworkManager's built-in "shared" mode was considered instead, but it
    # also enables NAT/forwarding, which would open exactly the internet path
    # this link is designed not to have.
    - name: Install dnsmasq
      ansible.builtin.apt:
        name: dnsmasq
        state: present

    - name: Configure dnsmasq to auto-assign the laptop's IP on eth0
      ansible.builtin.template:
        src: direct-link-dnsmasq.conf.j2
        dest: /etc/dnsmasq.d/direct-link.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart direct-link dnsmasq

# Symmetric revert: flipping direct_link_enabled back to false and redeploying
# undoes the block above, without needing the full destructive teardown.yml.
- name: Tear down direct Ethernet link on eth0
  when: not (direct_link_enabled | default(false))
  block:
    - name: Remove static direct-link profile
      community.general.nmcli:
        conn_name: direct-link
        state: absent
      ignore_errors: true

    - name: Re-enable auto-connect on the default eth0 DHCP profile
      community.general.nmcli:
        type: ethernet
        conn_name: "Wired connection 1"
        ifname: eth0
        autoconnect: true
        state: present
      ignore_errors: true

    - name: Remove direct-link dnsmasq config
      ansible.builtin.file:
        path: /etc/dnsmasq.d/direct-link.conf
        state: absent

    # dnsmasq package is left installed (matches how other roles handle
    # packages) but stopped, so it's not idling with no config to serve.
    - name: Stop and disable dnsmasq
      ansible.builtin.systemd:
        name: dnsmasq
        state: stopped
        enabled: false
      ignore_errors: true
