---
name: pics
key: pics
compose: pics
data: [pics_data_dir, pics_photos_dir, pics_trash_dir]
container: pics
container_port: 8000
login: tinyauth_users
alert_to: true
icon: mdi-image-multiple
description: Photo culling and sharing
oidc_secret: vault_pics_oidc_secret
oidc: "{{ (caddy_private_domains | map('regex_replace', '^', 'https://' ~ pics_subdomain ~ '.') | list + pics_extra_origins)
          | map('regex_replace', '$', '/api/auth/oidc/callback') | list }}"
