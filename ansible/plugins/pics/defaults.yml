---
# pics, the photo culling and sharing app. The settings the rest of the repo reads; the role's own are in defaults/main.yml.

pics_enabled: false
# pics' owner login also accepts a Tinyauth login (docs/auth-reference.md#sign-in-with-tinyauth-oidc). Needs service_users.pics.
pics_sso_enabled: false
# pics' owner pages (the guest pages never use a host port).
pics_port: 8100
# Container-internal port of pics' guest pages (never published): the tunnel points here, in cloudflared_ingress. Only pics_port is
# published on the host (LAN and tailnet). Container ports cannot collide with other services' ports.
pics_public_port: 8001
# pics' owner pages.
pics_subdomain: pics
# Addresses besides the Caddy names that pics' owner app is opened at, scheme included, e.g. ["http://pinas:8100"]
# (pics_port), without a trailing slash. pics sends the address it was opened on to Tinyauth, which must trust it.
pics_extra_origins: []
# pics' data directory.
pics_data_dir: "{{ fast_appdata_dir }}/pics/data"
# Where pics keeps its photos. Copyparty serves them as the folder services/pics/photos (copyparty_folders).
pics_photos_dir: "{{ primary_appdata_dir }}/pics/photos"
# Where pics moves deleted photos; the only pics folder where files can be deleted (served as services/pics/trash).
pics_trash_dir: "{{ primary_appdata_dir }}/pics/trash"
# pics' own alerts (docs/services.md#ntfy-failure-alerts).
pics_alert_to: ""
