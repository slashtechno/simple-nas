---
- name: Check the pics secrets are in the vault
  ansible.builtin.assert:
    that:
      - vault_pics_password is defined
      - vault_pics_secret_key is defined
      - vault_pics_repo_token is defined
      - vault_pics_copyparty_password is defined
    fail_msg: >-
      pics needs vault_pics_password, vault_pics_secret_key, vault_pics_repo_token and vault_pics_copyparty_password
      in the vault that applies to {{ inventory_hostname }}
      (host_vars/{{ inventory_hostname }}/vault.yml or group_vars/all/vault.yml; see vault.yml.example).
    quiet: true

# pics reaches Copyparty by container name on the Docker network, with the login named pics.
- name: Check Copyparty runs on this host and serves the two pics folders
  ansible.builtin.assert:
    that:
      - copyparty_enabled | bool
      - "['services/pics/photos', 'services/pics/trash'] | difference(copyparty_folders.keys() | list) | length == 0"
      - "copyparty_volumes['services/pics/photos'].dir == pics_photos_dir and copyparty_volumes['services/pics/trash'].dir == pics_trash_dir"
      - "not copyparty_volumes['services/pics/photos'].root and not copyparty_volumes['services/pics/trash'].root"
    fail_msg: >-
      pics stores photos in Copyparty. On {{ inventory_hostname }} set copyparty_enabled: true and add the folders services/pics/photos and
      services/pics/trash to copyparty_folders, with dir pics_photos_dir and pics_trash_dir, which the backup covers.
      Neither may have root: true: pics reaches them at /services/pics/photos and /services/pics/trash (plugins/pics/README.md).
    quiet: true

- name: Create pics directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(ansible_user) }}"
    group: "{{ item.owner | default(ansible_user) }}"
    mode: "0755"
  loop:
    - path: "{{ services_dir }}/pics"
    # The container runs as uid 10001 and must own its data folder
    - { path: "{{ pics_data_dir }}", owner: "10001" }

# include_role, not import_role (AGENTS.md exception): import_role would tag every inner task of git_clone.
- name: Fetch the pics source
  ansible.builtin.include_role:
    name: git_clone
  vars:
    git_clone_url: "https://github.com/{{ pics_repo }}.git"
    git_clone_dest: "{{ services_dir }}/pics/src"
    git_clone_version: "{{ pics_version }}"
    git_clone_token: "{{ vault_pics_repo_token }}"

- name: Render pics.env
  ansible.builtin.template:
    src: pics.env.j2
    dest: "{{ services_dir }}/pics/pics.env"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  diff: false   # holds the passwords and secret key
  notify: Restart pics

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ services_dir }}/pics/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0640"
  notify: Restart pics

# Building takes several minutes on a Pi: rebuild only when the source moved or the image is missing.
- name: Build and start pics
  community.docker.docker_compose_v2:
    project_src: "{{ services_dir }}/pics"
    state: present
    build: "{{ 'always' if git_clone_result.before != git_clone_result.after else 'policy' }}"
