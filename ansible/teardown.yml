---
# Removes deployed services from a host.
#
# By default this ONLY stops containers and removes deployed files.
# It does NOT touch your data (photos, files, databases).
#
# Also intentionally left alone, always:
#   - Physical drive mounts/fstab entries (storage role) — never unmounted.
#   - The restic encryption password (~/.restic-password) — deleting it would
#     make the existing backup repo permanently unreadable.
#   - Tailscale login — this playbook doesn't touch tailnet membership.
#
# Every host runs every block, whatever it has enabled, so --limit is required: one command must
# never reach all of them. Removing a service that was never deployed does nothing.
#
# Usage:
#
#   # Remove everything from one host
#   ansible-playbook teardown.yml --limit pi4 --vault-password-file .vault-pass
#
#   # Remove specific services only (the keys in group_vars/all/services.yml)
#   ansible-playbook teardown.yml --limit pi4 -e only=copyparty,garage --vault-password-file .vault-pass
#
#   # Remove only the backup scripts, the encryption scripts, the connectivity watchdog, the network config, or the USB rule
#   ansible-playbook teardown.yml --limit pi4 --tags backup --vault-password-file .vault-pass
#
#   # Also wipe data directories (DESTRUCTIVE - no recovery without a backup)
#   ansible-playbook teardown.yml --limit pi4 -e remove_data=true -e confirm_remove_data=pi4 --vault-password-file .vault-pass

- name: Tear down services
  hosts: servers
  become: true

  vars:
    remove_data: false   # override with -e remove_data=true to also delete data dirs
    # remove_data=true also needs -e confirm_remove_data=<the host's inventory name>, typed on purpose.
    confirm_remove_data: ""
    # Comma-separated service keys (-e only=copyparty,garage) to remove just those; empty removes everything.
    only: ""
    only_keys: "{{ only.split(',') if only | length > 0 else services | map(attribute='key') | list }}"

  tasks:

    - name: Check that --limit was given
      ansible.builtin.assert:
        that: ansible_limit is defined
        fail_msg: "Pass --limit <host>: without it this would run on every server."
        quiet: true
      tags: [always]

    # Data deletion has no undo, so it takes the host's name as well as the flag, and it stops before deleting anything
    # if a data folder is an encrypted folder or holds one: an unlocked mount would lose its files before the mount
    # point itself failed to go, and a locked one is immutable (docs/encryption.md).
    - name: Check that remove_data was confirmed with the host name
      ansible.builtin.assert:
        that: confirm_remove_data == inventory_hostname
        fail_msg: >-
          remove_data=true deletes the data of {{ only_keys | join(', ') }} on {{ inventory_hostname }} with no undo.
          Add -e confirm_remove_data={{ inventory_hostname }} to go ahead.
        quiet: true
      when: remove_data | bool
      tags: [always]

    - name: Check no data folder to delete is, or holds, an encrypted folder
      vars:
        selected: "{{ services | selectattr('key', 'in', only_keys) | list }}"
        names: "{{ (selected | map(attribute='data', default=[]) | flatten + selected | map(attribute='no_backup', default=[]) | flatten) | select | list }}"
        paths: "{{ query('ansible.builtin.vars', *names) }}"
      ansible.builtin.assert:
        that: not (item[0] == item[1] or item[0].startswith(item[1] ~ '/') or item[1].startswith(item[0] ~ '/'))
        fail_msg: >-
          {{ item[0] }} is, or holds, the encrypted folder {{ item[1] }}. Turn encryption off for it first
          (docs/encryption.md#turning-it-off); nothing was deleted.
        quiet: true
      loop: "{{ paths | product(encrypted_folders) | list if remove_data | bool else [] }}"
      loop_control:
        label: "{{ item[0] }}"
      tags: [always]

    # ── Services ───────────────────────────────────────────────────────────

    # Every entry of `services` (group_vars/all/services.yml) with a compose directory, or only those named in
    # `only`. include_tasks, not import_tasks, because a loop needs it (a kept exception, as in roles/pics and
    # roles/tailscale), so these tasks have no tags: select services with -e only=a,b.
    - name: Check every name in only is a service
      ansible.builtin.assert:
        that: only_keys | difference(services | map(attribute='key')) | length == 0
        fail_msg: >-
          only names {{ only_keys | difference(services | map(attribute='key')) }}, which are not services.
          The services are: {{ services | map(attribute='key') | join(', ') }}
        quiet: true

    - name: Stop and remove the services
      ansible.builtin.include_tasks: teardown_service.yml
      loop: "{{ services | selectattr('compose', 'defined') | selectattr('key', 'in', only_keys) | list }}"
      loop_control:
        label: "{{ item.key }}"
      vars:
        service: "{{ item.compose }}"
        # The names become paths only when remove_data is true: a host without the drives never reads them otherwise.
        data_paths: "{{ query('ansible.builtin.vars', *((item.data | default([]) + item.no_backup | default([])) | select | list)) }}"

    # Everything below runs only when `only` is empty, so that -e only=copyparty removes Copyparty and nothing else.
    - name: Remove the backups, drive rules and network config
      when: only | length == 0
      block:
        - name: Remove the alert script and the ntfy token
          tags: [alerts]
          block:
            - name: Remove alert.sh and the token file
              ansible.builtin.file:
                path: "{{ item }}"
                state: absent
              loop:
                - "{{ scripts_dir }}/alert.sh"
                - "{{ ntfy_token_file }}"

        # What the common and network roles wrote outside our directories. cloud-init gets the network back and journald
        # returns to the OS default; both take effect at the next boot. SSH keys, the sudoers file, packages and the
        # timezone stay: removing them could lock Ansible out or cannot be undone.
        - name: Remove the journald drop-in
          tags: [journal]
          ansible.builtin.file:
            path: "{{ journald_dropin }}"
            state: absent

        - name: Remove the cloud-init network drop-in
          tags: [network]
          ansible.builtin.file:
            path: "{{ cloud_init_network_dropin }}"
            state: absent

        - name: Remove the connectivity watchdog
          tags: [connectivity_watchdog]
          ansible.builtin.import_tasks: roles/connectivity_watchdog/tasks/remove.yml

        # ── Encryption ─────────────────────────────────────────────────────────

        # The scripts only. Encrypted folders, gocryptfs.conf and your own after-unlock scripts stay.
        - name: Remove the encryption scripts
          tags: [encryption]
          ansible.builtin.import_tasks: roles/encryption/tasks/remove.yml

        # ── Backups ────────────────────────────────────────────────────────────

        - name: Remove backup cron jobs and scripts
          tags: [backup]
          block:
            - name: Remove backup cron jobs
              ansible.builtin.cron:
                name: "{{ item }}"
                user: "{{ ansible_user }}"
                state: absent
              loop: "{{ backup_local_cron_jobs + backup_cloud_cron_jobs }}"

            # Removes only the files the backup role installs (the backup_* lists in group_vars/all/derived.yml, which the
            # role installs from too). The dump scripts in dump.d belong to the service roles and go with their services;
            # wiping the whole directory would leave --tags backup redeploys without them,
            # so backups would "succeed" with no database dump.
            - name: Remove backup scripts
              ansible.builtin.file:
                path: "{{ scripts_dir }}/{{ item }}"
                state: absent
              loop: >-
                {{ backup_shared_scripts + backup_local_scripts + backup_local_lists
                   + backup_cloud_scripts + backup_cloud_lists }}

            # rmdir only succeeds when the directory is empty.
            - name: Remove the dump.d and scripts directories (only if empty)
              ansible.builtin.command:
                cmd: rmdir "{{ item }}"
              loop:
                - "{{ service_dump_scripts_dir }}"
                - "{{ scripts_dir }}"
              register: rmdir_scripts
              changed_when: rmdir_scripts.rc == 0
              failed_when: false   # a non-empty or missing directory is fine

        # ── Drives and network ─────────────────────────────────────────────────

        # Only the USB automount rule the storage role installs.
        # Does NOT touch fstab entries, mount points, or drive ownership — those
        # stay untouched so your data drives are never at risk here.
        - name: Remove the USB automount udev rule
          tags: [storage]
          block:
            - name: Remove the udev rule
              ansible.builtin.file:
                path: /etc/udev/rules.d/98-usb-automount.rules
                state: absent

            - name: Reload udev rules
              ansible.builtin.command: udevadm control --reload-rules
              changed_when: true

        - name: Remove direct Ethernet link config
          tags: [network]
          ansible.builtin.import_tasks: roles/network/tasks/remove_direct_link.yml

        # ── Shared infrastructure, last: the scripts directory above must be gone first ──

        - name: Remove shared Docker network
          tags: [network]
          community.docker.docker_network:
            name: "{{ docker_network }}"
            state: absent
            force: true
          ignore_errors: true   # noqa: ignore-errors (best effort: the target may already be gone)

        - name: Remove the base directory (only if empty)
          tags: [always]
          ansible.builtin.command:
            cmd: rmdir "{{ services_dir }}"
          register: rmdir_result
          changed_when: rmdir_result.rc == 0
          failed_when: false   # a non-empty directory is fine: some service remains
