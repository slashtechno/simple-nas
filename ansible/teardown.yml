---
# Removes deployed services from a host.
#
# By default this ONLY stops containers and removes deployed files.
# It does NOT touch your data (photos, files, databases).
#
# Also intentionally left alone, always:
#   - Physical drive mounts/fstab entries (storage role) — never unmounted.
#   - The restic encryption password (~/.restic-password) — deleting it would
#     make the existing backup repo permanently unreadable.
#   - Tailscale login — this playbook doesn't touch tailnet membership.
#
# Every host runs every block, whatever it has enabled, so --limit is required: one command must
# never reach all of them. Removing a service that was never deployed does nothing.
#
# Usage:
#
#   # Remove everything from one host
#   ansible-playbook teardown.yml --limit pi4 --vault-password-file .vault-pass
#
#   # Remove specific services only (the keys in group_vars/all/services.yml)
#   ansible-playbook teardown.yml --limit pi4 -e only=copyparty,garage --vault-password-file .vault-pass
#
#   # Remove only the backup scripts, only the network config, or only the USB rule
#   ansible-playbook teardown.yml --limit pi4 --tags backup --vault-password-file .vault-pass
#
#   # Also wipe data directories (DESTRUCTIVE - no recovery without a backup)
#   ansible-playbook teardown.yml --limit pi4 -e remove_data=true --vault-password-file .vault-pass

- name: Tear down services
  hosts: servers
  become: true

  vars:
    remove_data: false   # override with -e remove_data=true to also delete data dirs
    # Comma-separated service keys (-e only=copyparty,garage) to remove just those; empty removes everything.
    only: ""
    only_keys: "{{ only.split(',') if only | length > 0 else services | map(attribute='key') | list }}"

  tasks:

    - name: Check that --limit was given
      ansible.builtin.assert:
        that: ansible_limit is defined
        fail_msg: "Pass --limit <host>: without it this would run on every server."
        quiet: true
      tags: [always]

    # ── Services ───────────────────────────────────────────────────────────

    # Every entry of `services` (group_vars/all/services.yml) with a compose directory, or only those named in
    # `only`. include_tasks, not import_tasks, because a loop needs it (a kept exception, as in site.yml's pics and
    # tailscale), so these tasks have no tags: select services with -e only=a,b.
    - name: Check every name in only is a service
      ansible.builtin.assert:
        that: only_keys | difference(services | map(attribute='key')) | length == 0
        fail_msg: >-
          only names {{ only_keys | difference(services | map(attribute='key')) }}, which are not services.
          The services are: {{ services | map(attribute='key') | join(', ') }}
        quiet: true

    - name: Stop and remove the services
      ansible.builtin.include_tasks: teardown_service.yml
      loop: "{{ services | selectattr('compose', 'defined') | selectattr('key', 'in', only_keys) | list }}"
      loop_control:
        label: "{{ item.key }}"
      vars:
        service: "{{ item.compose }}"
        # The names become paths only when remove_data is true: a host without the drives never reads them otherwise.
        data_paths: "{{ query('ansible.builtin.vars', *((item.data | default([]) + item.no_backup | default([])) | select | list)) }}"

    # Everything below runs only when `only` is empty, so that -e only=copyparty removes Copyparty and nothing else.
    - name: Remove the backups, drive rules and network config
      when: only | length == 0
      block:
        # ── Backups ────────────────────────────────────────────────────────────

        - name: Remove backup cron jobs and scripts
          tags: [backup]
          block:
            - name: Remove backup cron jobs
              ansible.builtin.cron:
                name: "{{ item }}"
                user: "{{ ansible_user }}"
                state: absent
              loop:
                - backup-local
                - backup-cloud
                - restic-check

            # Removes only the files the backup role installs (the lists in roles/backup/tasks/local.yml and cloud.yml;
            # keep them in step). The dump scripts in dump.d belong to the service roles and go with their services; wiping
            # the whole directory would leave --tags backup redeploys without them,
            # so backups would "succeed" with no database dump.
            - name: Remove backup scripts
              ansible.builtin.file:
                path: "{{ scripts_dir }}/{{ item }}"
                state: absent
              loop:
                - backup-restic-local.sh
                - backup-restic-cloud.sh
                - backup-services.sh
                - restic-check.sh
                - restore-services.sh
                - backup-paths.txt
                - restic-excludes-local.txt
                - restic-excludes-cloud.txt

            # rmdir only succeeds when the directory is empty.
            - name: Remove the dump.d and scripts directories (only if empty)
              ansible.builtin.command:
                cmd: rmdir "{{ item }}"
              loop:
                - "{{ service_dump_scripts_dir }}"
                - "{{ scripts_dir }}"
              register: rmdir_scripts
              changed_when: rmdir_scripts.rc == 0
              failed_when: false   # a non-empty or missing directory is fine

        # ── Drives and network ─────────────────────────────────────────────────

        # Only the USB automount rule the storage role installs.
        # Does NOT touch fstab entries, mount points, or drive ownership — those
        # stay untouched so your data drives are never at risk here.
        - name: Remove the USB automount udev rule
          tags: [storage]
          block:
            - name: Remove the udev rule
              ansible.builtin.file:
                path: /etc/udev/rules.d/98-usb-automount.rules
                state: absent

            - name: Reload udev rules
              ansible.builtin.command: udevadm control --reload-rules
              changed_when: true

        - name: Remove direct Ethernet link config
          tags: [network]
          ansible.builtin.import_tasks: roles/network/tasks/remove_direct_link.yml

        # ── Shared infrastructure, last: the scripts directory above must be gone first ──

        - name: Remove shared Docker network
          tags: [network]
          community.docker.docker_network:
            name: "{{ docker_network }}"
            state: absent
            force: true
          ignore_errors: true   # noqa: ignore-errors (best effort: the target may already be gone)

        - name: Remove the base directory (only if empty)
          tags: [always]
          ansible.builtin.command:
            cmd: rmdir "{{ services_dir }}"
          register: rmdir_result
          changed_when: rmdir_result.rc == 0
          failed_when: false   # a non-empty directory is fine: some service remains
