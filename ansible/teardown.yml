---
# Cleanly removes deployed services from the Pi.
#
# By default this ONLY stops containers and removes deployed files.
# It does NOT touch your data (photos, files, databases).
#
# Also intentionally left alone, always:
#   - Physical drive mounts/fstab entries (storage role) — never unmounted.
#   - The restic encryption password (~/.restic-password) — deleting it would
#     make the existing backup repo permanently unreadable.
#   - Tailscale login/Funnel state — this playbook doesn't touch tailnet
#     membership or Funnel exposure either way.
#
# Usage:
#
#   # Remove everything
#   ansible-playbook teardown.yml --ask-vault-pass
#
#   # Remove specific services only
#   ansible-playbook teardown.yml --tags copyparty,garage --ask-vault-pass
#
#   # Also wipe data directories (DESTRUCTIVE - no recovery without a backup)
#   ansible-playbook teardown.yml -e remove_data=true --ask-vault-pass

- name: Tear down NAS services
  hosts: nas
  become: true

  vars:
    remove_data: false   # override with -e remove_data=true to also delete data dirs

  tasks:

    # ── Per-service teardown ───────────────────────────────────────────────

    - name: Stop and remove Immich
      tags: [immich]
      ansible.builtin.import_tasks: teardown_service.yml
      vars:
        service: immich
        data_paths:
          - "{{ immich_upload_location }}"
          - "{{ immich_db_data_location }}"

    - name: Stop and remove Copyparty
      tags: [copyparty]
      ansible.builtin.import_tasks: teardown_service.yml
      vars:
        service: copyparty
        data_paths:
          - "{{ copyparty_files_dir }}"
          - "{{ copyparty_config_dir }}"

    - name: Stop and remove Gitea
      tags: [gitea]
      ansible.builtin.import_tasks: teardown_service.yml
      vars:
        service: gitea
        data_paths:
          - "{{ gitea_data_dir }}"

    - name: Stop and remove pics
      tags: [pics]
      ansible.builtin.import_tasks: teardown_service.yml
      vars:
        service: pics
        data_paths:
          - "{{ pics_data_dir }}"

    - name: Stop and remove Homebridge
      tags: [homebridge]
      ansible.builtin.import_tasks: teardown_service.yml
      vars:
        service: homebridge
        data_paths:
          - "{{ homebridge_config_dir }}"

    - name: Stop and remove Garage
      tags: [garage]
      ansible.builtin.import_tasks: teardown_service.yml
      vars:
        service: garage
        data_paths:
          - "{{ garage_data_dir }}"

    - name: Stop and remove Crafty
      tags: [crafty]
      ansible.builtin.import_tasks: teardown_service.yml
      vars:
        service: crafty
        data_paths:
          - "{{ crafty_data_dir }}"

    - name: Stop and remove Cloudflared
      tags: [cloudflared]
      block:
        - name: Down Cloudflared compose project
          community.docker.docker_compose_v2:
            project_src: "{{ cloudflared_dir }}"
            state: absent
            remove_volumes: false
          ignore_errors: true   # noqa: ignore-errors (best effort: the target may already be gone)

        - name: Remove Cloudflared compose/config files (credentials kept unless remove_data=true)
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ cloudflared_dir }}/docker-compose.yml"
            - "{{ cloudflared_dir }}/Dockerfile.init"
            - "{{ cloudflared_dir }}/Dockerfile.runtime"
            - "{{ cloudflared_dir }}/create_tunnel.sh"
            - "{{ cloudflared_dir }}/ingress.yml"
            - "{{ cloudflared_dir }}/config.yml"   # regenerated by create_tunnel.sh on next deploy

        # Deleting the tunnel's *.json credentials makes re-deploy create a
        # BRAND NEW tunnel (different ID) instead of reusing this one, orphaning
        # existing DNS records — so they only go with an explicit remove_data=true.
        - name: Wipe Cloudflared tunnel credentials (only when remove_data=true)
          ansible.builtin.shell: rm -f {{ cloudflared_dir }}/*.json
          changed_when: true
          when: remove_data | bool

    - name: Stop and remove backup-status
      tags: [backup-status]
      ansible.builtin.import_tasks: teardown_service.yml
      vars:
        service: backup-status

    - name: Remove backup cron jobs and scripts
      tags: [backup]
      block:
        - name: Remove backup cron jobs
          ansible.builtin.cron:
            name: "{{ item }}"
            state: absent
          loop:
            - nas-backup-local
            - nas-backup-cloud
            - nas-restic-check

        # Removes only the files these roles install. The dump scripts in dump.d
        # belong to the immich and gitea roles and go with their services; wiping
        # the whole directory would leave --tags backup redeploys without them,
        # so backups would "succeed" with no database dump.
        # copyparty-funnel.sh is installed by the tailscale role.
        - name: Remove backup scripts
          ansible.builtin.file:
            path: "{{ nas_scripts_dir }}/{{ item }}"
            state: absent
          loop:
            - backup-restic-local.sh
            - backup-restic-cloud.sh
            - backup-services.sh
            - restic-check.sh
            - restore-services.sh
            - backup-paths.txt
            - copyparty-funnel.sh

        # rmdir only succeeds when the directory is empty, like the nas_base_dir step at the end.
        - name: Remove the dump.d and scripts directories (only if empty)
          ansible.builtin.command:
            cmd: rmdir "{{ item }}"
          loop:
            - "{{ service_dump_scripts_dir }}"
            - "{{ nas_scripts_dir }}"
          register: rmdir_scripts
          changed_when: rmdir_scripts.rc == 0
          failed_when: false   # a non-empty or missing directory is fine

    # Only the drive-remount udev rule/service the storage role installs.
    # Does NOT touch fstab entries, mount points, or drive ownership — those
    # stay untouched so your data drives are never at risk here.
    - name: Remove drive auto-remount udev rule and systemd service
      tags: [storage]
      block:
        - name: Stop and disable remount service
          ansible.builtin.systemd:
            name: nas-drive-remount.service
            state: stopped
            enabled: false
          ignore_errors: true   # noqa: ignore-errors (best effort: the target may already be gone)

        - name: Remove remount systemd unit
          ansible.builtin.file:
            path: /etc/systemd/system/nas-drive-remount.service
            state: absent

        - name: Remove remount udev rule
          ansible.builtin.file:
            path: /etc/udev/rules.d/99-nas-drive-remount.rules
            state: absent

        - name: Reload systemd daemon
          ansible.builtin.systemd:
            daemon_reload: true

        - name: Reload udev rules
          ansible.builtin.command: udevadm control --reload-rules
          changed_when: true

    - name: Remove direct Ethernet link config
      tags: [network]
      block:
        - name: Remove static direct-link profile
          community.general.nmcli:
            conn_name: direct-link
            state: absent
          ignore_errors: true   # noqa: ignore-errors (best effort: the target may already be gone)

        - name: Re-enable auto-connect on the default eth0 DHCP profile
          community.general.nmcli:
            type: ethernet
            conn_name: "Wired connection 1"
            ifname: "{{ direct_link_iface }}"
            autoconnect: true
            state: present
          ignore_errors: true   # noqa: ignore-errors (best effort: the target may already be gone)

        - name: Remove direct-link dnsmasq config
          ansible.builtin.file:
            path: /etc/dnsmasq.d/direct-link.conf
            state: absent
          ignore_errors: true   # noqa: ignore-errors (best effort: the target may already be gone)

        - name: Stop and disable dnsmasq
          ansible.builtin.systemd:
            name: dnsmasq
            state: stopped
            enabled: false
          ignore_errors: true   # noqa: ignore-errors (best effort: the target may already be gone)

    # ── Shared infrastructure (only removed when ALL services are gone) ────

    - name: Remove shared Docker network
      tags: [network]
      community.docker.docker_network:
        name: "{{ nas_network }}"
        state: absent
        force: true
      ignore_errors: true   # noqa: ignore-errors (best effort: the target may already be gone)

    - name: Remove NAS base directory (only if empty)
      tags: [always]
      ansible.builtin.command:
        cmd: rmdir "{{ nas_base_dir }}"
      register: rmdir_result
      changed_when: rmdir_result.rc == 0
      failed_when: false   # non-empty dir is fine — means some services remain
