---
# Cleanly removes deployed services from the Pi.
#
# By default this ONLY stops containers and removes deployed files.
# It does NOT touch your data (photos, files, databases).
#
# Also intentionally left alone, always:
#   - Physical drive mounts/fstab entries (storage role) — never unmounted.
#   - The restic encryption password (~/.restic-password) — deleting it would
#     make the existing backup repo permanently unreadable.
#   - Tailscale login/Funnel state — this playbook doesn't touch tailnet
#     membership or Funnel exposure either way.
#
# Usage:
#
#   # Remove everything
#   ansible-playbook teardown.yml --ask-vault-pass
#
#   # Remove specific services only
#   ansible-playbook teardown.yml --tags copyparty,garage --ask-vault-pass
#
#   # Also wipe data directories (DESTRUCTIVE - no recovery without a backup)
#   ansible-playbook teardown.yml -e remove_data=true --ask-vault-pass

- name: Tear down NAS services
  hosts: nas
  become: true

  vars:
    remove_data: false   # override with -e remove_data=true to also delete data dirs

  tasks:

    # ── Per-service teardown ───────────────────────────────────────────────

    - name: Stop and remove Immich
      tags: [immich]
      block:
        - name: Down Immich compose project
          community.docker.docker_compose_v2:
            project_src: "{{ nas_base_dir }}/immich"
            state: absent
            remove_volumes: false
          ignore_errors: true

        - name: Remove Immich compose directory
          ansible.builtin.file:
            path: "{{ nas_base_dir }}/immich"
            state: absent

        - name: Wipe Immich data (only when remove_data=true)
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ immich_upload_location }}"
            - "{{ immich_db_data_location }}"
          when: remove_data | bool

    - name: Stop and remove Copyparty
      tags: [copyparty]
      block:
        - name: Down Copyparty compose project
          community.docker.docker_compose_v2:
            project_src: "{{ nas_base_dir }}/copyparty"
            state: absent
            remove_volumes: false
          ignore_errors: true

        - name: Remove Copyparty compose directory
          ansible.builtin.file:
            path: "{{ nas_base_dir }}/copyparty"
            state: absent

        - name: Wipe Copyparty data (only when remove_data=true)
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ copyparty_files_dir }}"
            - "{{ copyparty_config_dir }}"
          when: remove_data | bool

    - name: Stop and remove Gitea
      tags: [gitea]
      block:
        - name: Down Gitea compose project
          community.docker.docker_compose_v2:
            project_src: "{{ nas_base_dir }}/gitea"
            state: absent
            remove_volumes: false
          ignore_errors: true

        - name: Remove Gitea compose directory
          ansible.builtin.file:
            path: "{{ nas_base_dir }}/gitea"
            state: absent

        - name: Wipe Gitea data (only when remove_data=true)
          ansible.builtin.file:
            path: "{{ gitea_data_dir }}"
            state: absent
          when: remove_data | bool

    - name: Stop and remove Homebridge
      tags: [homebridge]
      block:
        - name: Down Homebridge compose project
          community.docker.docker_compose_v2:
            project_src: "{{ nas_base_dir }}/homebridge"
            state: absent
            remove_volumes: false
          ignore_errors: true

        - name: Remove Homebridge compose directory
          ansible.builtin.file:
            path: "{{ nas_base_dir }}/homebridge"
            state: absent

        - name: Wipe Homebridge data (only when remove_data=true)
          ansible.builtin.file:
            path: "{{ homebridge_config_dir }}"
            state: absent
          when: remove_data | bool

    - name: Stop and remove Garage
      tags: [garage]
      block:
        - name: Down Garage compose project
          community.docker.docker_compose_v2:
            project_src: "{{ nas_base_dir }}/garage"
            state: absent
            remove_volumes: false
          ignore_errors: true

        - name: Remove Garage compose directory
          ansible.builtin.file:
            path: "{{ nas_base_dir }}/garage"
            state: absent

        - name: Wipe Garage data (only when remove_data=true)
          ansible.builtin.file:
            path: "{{ garage_data_dir }}"
            state: absent
          when: remove_data | bool

    - name: Stop and remove Cloudflared
      tags: [cloudflared]
      block:
        - name: Down Cloudflared compose project
          community.docker.docker_compose_v2:
            project_src: "{{ nas_base_dir }}/cloudflared"
            state: absent
            remove_volumes: false
          ignore_errors: true

        - name: Remove Cloudflared compose/config files (credentials kept unless remove_data=true)
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ nas_base_dir }}/cloudflared/docker-compose.yml"
            - "{{ nas_base_dir }}/cloudflared/Dockerfile.init"
            - "{{ nas_base_dir }}/cloudflared/Dockerfile.runtime"
            - "{{ nas_base_dir }}/cloudflared/create_tunnel.sh"
            - "{{ nas_base_dir }}/cloudflared/ingress.yml"
            - "{{ nas_base_dir }}/cloudflared/config.yml"   # regenerated by create_tunnel.sh on next deploy

        # Deleting the tunnel's *.json credentials makes re-deploy create a
        # BRAND NEW tunnel (different ID) instead of reusing this one, orphaning
        # existing DNS records — so they only go with an explicit remove_data=true.
        - name: Wipe Cloudflared tunnel credentials (only when remove_data=true)
          ansible.builtin.shell: rm -f {{ nas_base_dir }}/cloudflared/*.json
          when: remove_data | bool

    - name: Remove backup cron jobs and scripts
      tags: [backup]
      block:
        - name: Remove backup cron jobs
          ansible.builtin.cron:
            name: "{{ item }}"
            state: absent
          loop:
            - nas-backup-local
            - nas-backup-cloud
            - nas-restic-check

        - name: Remove scripts directory
          ansible.builtin.file:
            path: "{{ nas_base_dir }}/scripts"
            state: absent

    # Only the drive-remount udev rule/service the storage role installs.
    # Does NOT touch fstab entries, mount points, or drive ownership — those
    # stay untouched so your data drives are never at risk here.
    - name: Remove drive auto-remount udev rule and systemd service
      tags: [storage]
      block:
        - name: Stop and disable remount service
          ansible.builtin.systemd:
            name: nas-drive-remount.service
            state: stopped
            enabled: false
          ignore_errors: true

        - name: Remove remount systemd unit
          ansible.builtin.file:
            path: /etc/systemd/system/nas-drive-remount.service
            state: absent

        - name: Remove remount udev rule
          ansible.builtin.file:
            path: /etc/udev/rules.d/99-nas-drive-remount.rules
            state: absent

        - name: Reload systemd daemon
          ansible.builtin.systemd:
            daemon_reload: true

        - name: Reload udev rules
          ansible.builtin.command: udevadm control --reload-rules

    - name: Remove direct Ethernet link config
      tags: [network]
      block:
        - name: Remove static direct-link profile
          community.general.nmcli:
            conn_name: direct-link
            state: absent
          ignore_errors: true

        - name: Re-enable auto-connect on the default eth0 DHCP profile
          community.general.nmcli:
            type: ethernet
            conn_name: "Wired connection 1"
            ifname: eth0
            autoconnect: true
            state: present
          ignore_errors: true

    # ── Shared infrastructure (only removed when ALL services are gone) ────

    - name: Remove shared Docker network
      tags: [network]
      community.docker.docker_network:
        name: "{{ nas_network }}"
        state: absent
        force: true
      ignore_errors: true

    - name: Remove /opt/nas base directory (only if empty)
      tags: [always]
      ansible.builtin.command:
        cmd: rmdir "{{ nas_base_dir }}"
      register: rmdir_result
      changed_when: rmdir_result.rc == 0
      failed_when: false   # non-empty dir is fine — means some services remain
