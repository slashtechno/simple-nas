---
# Removes deployed services from a host.
#
# By default this ONLY stops containers and removes deployed files.
# It does NOT touch your data (photos, files, databases).
#
# Also intentionally left alone, always:
#   - Physical drive mounts/fstab entries (storage role) — never unmounted.
#   - The restic encryption password (~/.restic-password) — deleting it would
#     make the existing backup repo permanently unreadable.
#   - Tailscale login/Funnel state — this playbook doesn't touch tailnet
#     membership or Funnel exposure either way.
#
# Every host runs every block, whatever it has enabled, so --limit is required: one command must
# never reach all of them. Removing a service that was never deployed does nothing.
#
# Usage:
#
#   # Remove everything from one host
#   ansible-playbook teardown.yml --limit pi4 --ask-vault-pass
#
#   # Remove specific services only
#   ansible-playbook teardown.yml --limit pi4 --tags copyparty,garage --ask-vault-pass
#
#   # Also wipe data directories (DESTRUCTIVE - no recovery without a backup)
#   ansible-playbook teardown.yml --limit pi4 -e remove_data=true --ask-vault-pass

- name: Tear down services
  hosts: servers
  become: true

  vars:
    remove_data: false   # override with -e remove_data=true to also delete data dirs

  tasks:

    - name: Check that --limit was given
      ansible.builtin.assert:
        that: ansible_limit is defined
        fail_msg: "Pass --limit <host>: without it this would run on every server."
        quiet: true
      tags: [always]

    # ── Per-service teardown ───────────────────────────────────────────────

    - name: Stop and remove Immich
      tags: [immich]
      ansible.builtin.import_tasks: teardown_service.yml
      vars:
        service: immich
        data_paths:
          - "{{ immich_upload_location }}"
          - "{{ immich_db_data_location }}"

    - name: Stop and remove Copyparty
      tags: [copyparty]
      ansible.builtin.import_tasks: teardown_service.yml
      vars:
        service: copyparty
        data_paths: >-
          {{ [copyparty_files_dir, copyparty_config_dir, copyparty_hist_dir, copyparty_collab_dir]
             + ([copyparty_fast_dir] if copyparty_fast_enabled | bool else []) }}

    - name: Stop and remove Gitea
      tags: [gitea]
      ansible.builtin.import_tasks: teardown_service.yml
      vars:
        service: gitea
        data_paths:
          - "{{ gitea_data_dir }}"
          - "{{ gitea_runner_data_dir }}"

    - name: Stop and remove ntfy
      tags: [ntfy]
      ansible.builtin.import_tasks: teardown_service.yml
      vars:
        service: ntfy
        data_paths:
          - "{{ ntfy_data_dir }}"

    - name: Stop and remove pics
      tags: [pics]
      ansible.builtin.import_tasks: teardown_service.yml
      vars:
        service: pics
        data_paths:
          - "{{ pics_data_dir }}"

    - name: Stop and remove Homebridge
      tags: [homebridge]
      ansible.builtin.import_tasks: teardown_service.yml
      vars:
        service: homebridge
        data_paths:
          - "{{ homebridge_config_dir }}"

    - name: Stop and remove Garage
      tags: [garage]
      ansible.builtin.import_tasks: teardown_service.yml
      vars:
        service: garage
        data_paths:
          - "{{ garage_data_dir }}"

    - name: Stop and remove Crafty
      tags: [crafty]
      ansible.builtin.import_tasks: teardown_service.yml
      vars:
        service: crafty
        data_paths:
          - "{{ crafty_data_dir }}"

    # The stacks you created in Dockge are yours: this removes Dockge's own container, compose file
    # and (with remove_data=true) its database, never dockge_stacks_dir.
    - name: Stop and remove Dockge
      tags: [dockge]
      ansible.builtin.import_tasks: teardown_service.yml
      vars:
        service: dockge
        data_paths:
          - "{{ dockge_data_dir }}"

    - name: Stop and remove Caddy
      tags: [caddy]
      ansible.builtin.import_tasks: teardown_service.yml
      vars:
        service: caddy
        data_paths:
          - "{{ caddy_data_dir }}"

    # The tunnel itself lives at Cloudflare and is found by name on the next deploy.
    - name: Stop and remove Cloudflared
      tags: [cloudflared]
      ansible.builtin.import_tasks: teardown_service.yml
      vars:
        service: cloudflared

    - name: Stop and remove backup-status
      tags: [backup_status]
      ansible.builtin.import_tasks: teardown_service.yml
      vars:
        service: backup-status

    # ── Backups ────────────────────────────────────────────────────────────

    - name: Remove backup cron jobs and scripts
      tags: [backup]
      block:
        - name: Remove backup cron jobs
          ansible.builtin.cron:
            name: "{{ item }}"
            user: "{{ ansible_user }}"
            state: absent
          loop:
            - backup-local
            - backup-cloud
            - restic-check

        # Removes only the files the backup role installs. The dump scripts in dump.d
        # belong to the immich and gitea roles and go with their services; wiping
        # the whole directory would leave --tags backup redeploys without them,
        # so backups would "succeed" with no database dump.
        # copyparty-funnel.sh is installed by the tailscale_funnel role.
        - name: Remove backup scripts
          ansible.builtin.file:
            path: "{{ scripts_dir }}/{{ item }}"
            state: absent
          loop:
            - backup-restic-local.sh
            - backup-restic-cloud.sh
            - backup-services.sh
            - restic-check.sh
            - restore-services.sh
            - backup-paths.txt
            - restic-excludes-local.txt
            - restic-excludes-cloud.txt
            - copyparty-funnel.sh
            - alert.sh

        - name: Remove the ntfy token file
          ansible.builtin.file:
            path: "{{ ntfy_token_file }}"
            state: absent

        # rmdir only succeeds when the directory is empty.
        - name: Remove the dump.d and scripts directories (only if empty)
          ansible.builtin.command:
            cmd: rmdir "{{ item }}"
          loop:
            - "{{ service_dump_scripts_dir }}"
            - "{{ scripts_dir }}"
          register: rmdir_scripts
          changed_when: rmdir_scripts.rc == 0
          failed_when: false   # a non-empty or missing directory is fine

    # ── Drives and network ─────────────────────────────────────────────────

    # Only the udev rules, service and tmpfiles entry the storage role installs (remount and USB automount).
    # Does NOT touch fstab entries, mount points, or drive ownership — those
    # stay untouched so your data drives are never at risk here.
    - name: Remove drive auto-remount udev rule and systemd service
      tags: [storage]
      block:
        - name: Stop and disable remount service
          ansible.builtin.systemd:
            name: drive-remount.service
            state: stopped
            enabled: false
          ignore_errors: true   # noqa: ignore-errors (best effort: the target may already be gone)

        - name: Remove remount systemd unit
          ansible.builtin.file:
            path: /etc/systemd/system/drive-remount.service
            state: absent

        - name: Remove the udev rules and the tmpfiles entry
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/udev/rules.d/99-drive-remount.rules
            - /etc/udev/rules.d/98-usb-automount.rules
            - /etc/tmpfiles.d/usb-automount.conf

        - name: Reload systemd daemon
          ansible.builtin.systemd:
            daemon_reload: true

        - name: Reload udev rules
          ansible.builtin.command: udevadm control --reload-rules
          changed_when: true

    # Same guard as the network role's revert: only where the link was set up (its dnsmasq file exists).
    - name: Check whether the direct link is set up
      tags: [network]
      ansible.builtin.stat:
        path: /etc/dnsmasq.d/direct-link.conf
      register: teardown_direct_link_conf

    - name: Remove direct Ethernet link config
      tags: [network]
      when: teardown_direct_link_conf.stat.exists
      block:
        - name: Remove static direct-link profile
          community.general.nmcli:
            conn_name: direct-link
            state: absent

        - name: Re-enable auto-connect on the default eth0 DHCP profile
          community.general.nmcli:
            type: ethernet
            conn_name: "Wired connection 1"
            ifname: "{{ direct_link_iface }}"
            autoconnect: true
            state: present

        - name: Remove direct-link dnsmasq config
          ansible.builtin.file:
            path: /etc/dnsmasq.d/direct-link.conf
            state: absent

        - name: Stop and disable dnsmasq
          ansible.builtin.systemd:
            name: dnsmasq
            state: stopped
            enabled: false

    # ── Shared infrastructure, last: the scripts directory above must be gone first ──

    - name: Remove shared Docker network
      tags: [network]
      community.docker.docker_network:
        name: "{{ docker_network }}"
        state: absent
        force: true
      ignore_errors: true   # noqa: ignore-errors (best effort: the target may already be gone)

    - name: Remove the base directory (only if empty)
      tags: [always]
      ansible.builtin.command:
        cmd: rmdir "{{ services_dir }}"
      register: rmdir_result
      changed_when: rmdir_result.rc == 0
      failed_when: false   # a non-empty directory is fine: some service remains
