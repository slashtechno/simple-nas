# THESE ARE THE REPO OWNER'S OWN SETTINGS (domains, SSH key, drive UUIDs). If you copied this repo, replace every
# value with yours, starting from vars.yml.example; see "Using this repo for your own hosts" in ansible/README.md.
# What the `nas` group switches on, plus its Cloudflare tunnel. Any host in this group gets these services;
# a host outside it can enable the same ones itself (group_vars/all/vars.yml lists every flag).
# Secrets (passwords, tokens) go in vault.yml, never in this file.

# --- Services ---
immich_enabled: true
copyparty_enabled: true
gitea_enabled: true
homebridge_enabled: true
cloudflared_enabled: true
pics_enabled: true
garage_enabled: true    # needs post-deploy init (see docs/services.md#garage-s3)
crafty_enabled: true   # Minecraft server manager (Crafty Controller); needs RAM headroom, see docs/services.md#crafty-minecraft-servers
backup_enabled: true
backup_cloud_enabled: true   # weekly offsite copy; the repository is below
usb_automount_enabled: true   # plug in a card or drive and it shows up under /drives in Copyparty
backup_status_enabled: true   # read-only web dashboard for backup status/snapshots

# --- Backups ---
# Offsite repository; every host needs its own path (docs/backups.md#offsite-repository-restic_cloud_repository).
restic_cloud_repository: "rclone:gdrive-nas:/pi-nas-backups"

# --- Cloudflare Tunnel ---
# Tunnel name: other hosts default to <hostname>-tunnel (roles/cloudflared/defaults/main.yml).
cf_tunnel_name: pi-nas-tunnel
# cf_api_token, cf_account_id and cf_zones are in group_vars/all/vars.yml: every server that runs a tunnel uses them.

# One entry per public hostname, with exactly two keys: hostname, and service (the internal Docker
# address). No `path:`. The hostname must contain one domain from cf_zones (group_vars/all/vars.yml). Where a service
# has a private surface, it publishes two ports and the tunnel points at the guest one.
cloudflared_ingress:
  # pics' guest surface: share pages and the portfolio, with no owner routes in it. The owner app
  # stays on the Pi's LAN/tailnet port (pics_port); this file never forwards it.
  - hostname: pics.angad.me
    service: "http://pics:{{ pics_public_port }}"
  - hostname: immich.slashtechno.com
    service: "http://immich_server:2283"
  - hostname: git.slashtechno.com
    service: "http://gitea:3000"
  - hostname: copyparty.slashtechno.com
    service: "http://copyparty:3923"
  - hostname: s3.slashtechno.com
    # Caddy CORS proxy sits on 3900; it handles OPTIONS preflights and injects
    # Access-Control-Allow-Origin before forwarding to Garage internally.
    service: "http://garage-cors-proxy:3900"
  - hostname: garage.slashtechno.com
    service: "http://garage-webui:3909"
