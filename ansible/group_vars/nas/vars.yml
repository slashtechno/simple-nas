# Copy to vars.yml and customize. Secrets go in vault.yml (ansible-vault encrypted).

# --- Enable/disable services ---
# Set false to skip a service entirely. It won't be deployed or started.
# To remove a service you previously deployed, run teardown.yml --tags <name> first.
tailscale_enabled: false # tmp since already deployed
immich_enabled: true
copyparty_enabled: true
gitea_enabled: true
homebridge_enabled: true
cloudflared_enabled: true
pics_enabled: true
garage_enabled: true    # off by default — needs post-deploy init (see ansible/README.md)
backup_enabled: true
backup_status_enabled: true   # read-only web dashboard for backup status/snapshots

# --- Tailscale ---
# Every service that publishes a host port is reachable at http://<pi-tailscale-ip>:<port> from any
# device on your tailnet. That needs nothing extra: no `tailscale serve`, no funnel. (The funnel
# below is only for giving one service a public ts.net name, which pics does not use — its public
# pages go through the Cloudflare tunnel with a path allowlist.)
tailscale_args: ""                 # extra flags for `tailscale up`, e.g. "--advertise-exit-node"
tailscale_funnel_enabled: false    # set true to expose Copyparty at your ts.net hostname
tailscale_funnel_port: 3923

# --- General ---
timezone: America/Chicago
nas_base_dir: /opt/nas          # where compose projects are deployed on the Pi
nas_network: nas-services       # shared Docker network name
docker_pull_policy: missing     # "always" to pull newer images on every run

# --- Storage paths on the Pi ---
# Drives are the source of truth; every drive entry below declares which
# roles it fills via `roles:` (a list, so one drive can hold several roles —
# a single-drive NAS is one entry with roles: [fast, primary, backup]).
# Allowed roles, exactly one claim each (validated by the storage role):
#   fast    — SSD; random-IO data (Docker, Immich DB, configs) + caches
#             (restic cache, copyparty hist/thumbnails)
#   primary — bulk data (photos, files)
#   backup  — restic local repo, service dumps, logs
# Right now fast and primary share the T7 — when the 2TB WD + 4TB drives
# arrive, give each their own entry; service paths split automatically.
# Every role has a fallback below, so an unclaimed role never resolves to
# something surprising — but the storage role's assert fails the deploy if
# any role is claimed twice or uses an unknown role name.
nas_role_fallbacks:
  fast: /mnt/t7
  primary: /mnt/main
  backup: /mnt/backup
nas_drive_mounts: >-
  {%- set _m = {} -%}
  {%- for _d in nas_drives if _d.roles is defined -%}
  {%- for _r in _d.roles -%}
  {%- set _ = _m.update({_r: _d.mount}) -%}
  {%- endfor -%}{%- endfor -%}
  {{ nas_role_fallbacks | combine(_m) }}

fast_drive: "{{ nas_drive_mounts.fast }}"
main_drive: "{{ nas_drive_mounts.primary }}"
backup_drive: "{{ nas_drive_mounts.backup }}"

restic_repo_path: "{{ backup_drive }}/restic-repo"
restic_cloud_repository: "rclone:gdrive-nas:/pi-nas-backups"
restic_password_file: "/home/{{ ansible_user }}/.restic-password"
backup_logs_dir: "{{ backup_drive }}/logs"
service_dumps_dir: "{{ backup_drive }}/service-dumps"
# restic's local index/snapshot cache lives on the fast drive — it keeps
# cache reads off the spinning backup drive and off Google Drive round-trips
# (this matters most for the rclone/gdrive repo; see restic's cache docs).
# Same-filesystem caching is near-pointless, so this only pays off once the
# cache drive differs from the repo drive. Excluded from backups below.
restic_cache_dir: "{{ fast_drive }}/restic-cache"
restic_local_retention: "--keep-daily 7 --keep-weekly 4 --keep-monthly 1"
restic_cloud_retention: "--keep-weekly 12 --keep-monthly 6"
# rclone's default Google Drive OAuth client is shared across every rclone
# user, so its request quota gets exhausted fast during a burst of small-file
# uploads (seen in practice: 403 RATE_LIMIT_EXCEEDED on the first cloud
# backup). Throttling here works around it; making your own Google Cloud
# OAuth client (see rclone's docs) is the more permanent fix if this isn't
# enough.
restic_cloud_rclone_args: "serve restic --stdio --tpslimit=10"
# Every restic invocation in the backup scripts is wrapped in `timeout` with
# this value. Without it, a stalled rclone/network pipe can deadlock restic
# indefinitely while holding the repo lock — seen in practice: a cloud backup
# hung for 6 days straight (2m of CPU time burned across the whole span),
# silently blocking every later cloud backup/prune behind its stale lock.
restic_command_timeout: "2h"

# Service data split across drive roles: random-IO data (Docker, DBs,
# configs) on the fast drive; bulk data (photos, files) on the primary.
# Today these resolve to the same physical drive (T7) — no migration needed.
immich_upload_location: "{{ main_drive }}/photos"
immich_db_data_location: "{{ fast_drive }}/docker/immich_postgres"
copyparty_files_dir: "{{ main_drive }}/files"
copyparty_config_dir: "{{ fast_drive }}/docker/copyparty_config"
copyparty_hist_dir: "{{ fast_drive }}/copyparty-hist"   # thumbnails/dbs/transcode cache (see copyparty role)
gitea_data_dir: "{{ fast_drive }}/docker/gitea"
pics_data_dir: "{{ fast_drive }}/docker/pics"
homebridge_config_dir: "{{ fast_drive }}/docker/homebridge"
garage_data_dir: "{{ fast_drive }}/docker/garage"
cloudflared_dir: "{{ nas_base_dir }}/cloudflared"

# fstab entries — idempotent, no-ops if drives already mounted.
# Find UUIDs on the Pi: lsblk -o NAME,SIZE,FSTYPE,UUID,MOUNTPOINTS
nas_drives:
  - uuid: "302ffde9-9f40-45d0-a392-a6bcc655edb7"   # Samsung PSSD T7 → /mnt/t7
    mount: /mnt/t7
    fstype: ext4
    options: defaults,nofail
    roles: [fast, primary]   # SSD does both roles until the 3-drive upgrade
  - uuid: "7fdfb249-0d0e-46c9-af00-813ff465c77d"   # ST3500418AS → /mnt/backup
    mount: /mnt/backup
    fstype: ext4
    options: defaults,nofail
    roles: [backup]

# --- Immich ---
immich_version: release

# --- Copyparty ---
copyparty_user: "{{ vault_copyparty_user }}"
copyparty_pass: "{{ vault_copyparty_pass }}"
copyparty_collab_dir: "{{ main_drive }}/collab"
host_mnt_dir: /mnt
copyparty_port: 3923
# Cap the thumbnailer's RAM claim (default = 60% of system RAM, clamped
# 0.3–6 GiB). On a 4GB Pi that's ~2.4GiB — too greedy when Immich + Postgres
# also live here. 1 GiB is a safe cap on both the Pi 4 and Pi 5.
copyparty_th_ram_max: "1"
copyparty_version_checker_enabled: true   # vc-url points at upstream advisories (default-disabled upstream)

# Accounts for apps that talk to Copyparty. Each gets its own volume at
# /<folder>, stored in copyparty_files_dir/<folder>. No d on photos: without delete, Copyparty also
# refuses overwrites, so pics can't destroy a photo. It may delete only in photos-trash.
copyparty_service_accounts:
  - user: photos
    pass: "{{ vault_copyparty_photos_pass }}"
    volumes:
      - { folder: photos, perms: rwm }
      - { folder: photos-trash, perms: rwmd }

# --- pics ---
# Owner pages: http://<pi>:8100 on the LAN. Only guest pages are public, via the path-limited ingress below.
pics_repo: slashtechno/lab
pics_version: main
pics_port: 8100            # published on the Pi: LAN + tailnet reach the owner app here
pics_public_url: "https://pics.angad.me"
pics_public_port: 8001    # container-internal (never published): the tunnel points here.
                          # Container ports can't collide with other services — each has its own
                          # namespace. Only pics_port (above) is published on the Pi.
pics_artist: ""
pics_website: ""                # e.g. "example.com"; watermarked + linked from the home page
pics_instagram: ""              # e.g. "@you"; watermarked + linked from the home page

# --- Gitea ---
gitea_root_url: "https://git.slashtechno.com/"
gitea_domain: "git.slashtechno.com"
gitea_ssh_domain: "git.slashtechno.com"
gitea_ssh_port: "2222"
gitea_port: 3000
gitea_db_type: sqlite3
gitea_db_path: /data/gitea/gitea.db

# --- Cloudflare Tunnel ---
cf_tunnel_name: pi-nas-tunnel
cf_api_token: "{{ vault_cf_api_token }}"
cf_account_id: "{{ vault_cf_account_id }}"
# Domain -> zone ID, for the DNS record of each cloudflared_ingress hostname (longest matching domain wins).
# Zone IDs aren't secret. The API token needs DNS:Edit on each of these zones.
cf_zones:
  slashtechno.com: 4c2f7e1b060532aac3b3c7e408153222
  angad.me: f0cf329b896c61d1f5bc2a4c53c03647

# Ingress rules for cloudflared (hostname -> internal service URL). Keep these boring: a hostname
# and a service, nothing else. Where a service needs a private surface, it publishes two ports and
# this file points the tunnel at the guest one.
cloudflared_ingress:
  # pics serves its guest surface (share pages + portfolio, no owner routes at all) on 8001; the
  # owner app is on the Pi's LAN/tailnet port (pics_port) and is never forwarded here.
  - hostname: pics.angad.me
    service: "http://pics:{{ pics_public_port }}"
  - hostname: immich.slashtechno.com
    service: "http://immich_server:2283"
  - hostname: git.slashtechno.com
    service: "http://gitea:3000"
  - hostname: copyparty.slashtechno.com
    service: "http://copyparty:3923"
  - hostname: s3.slashtechno.com
    service: "http://garage-cors-proxy:3900"
  - hostname: garage.slashtechno.com
    service: "http://garage-webui:3909"

# --- Garage S3 ---
garage_version: v2.3.0
garage_rpc_secret: "{{ vault_garage_rpc_secret }}"
garage_s3_port: 3900
garage_rpc_port: 3901
garage_web_port: 3902
garage_admin_port: 3903
garage_replication_factor: 1   # 1 = single node, no replication
garage_webui_user: "{{ vault_garage_webui_user }}"
garage_cors_allowed_origins:
  - "*"

# --- Direct Ethernet link (Pi <-> laptop, bypasses wifi for fast transfers) ---
# Plug a cable straight from the Pi's eth0 into a laptop. Static IP, no gateway,
# so it can't route internet traffic. See README.md#direct-ethernet-link.
direct_link_enabled: true
direct_link_iface: eth0
direct_link_ip: 10.10.20.1        # Pi's address on the link
direct_link_peer_ip: 10.10.20.2   # handed to the laptop automatically via dnsmasq
direct_link_prefix: 30            # /30 = just these two addresses, nothing else fits

# --- Backup status dashboard ---
# Read-only web UI for restic backup status/snapshots (Tailscale-only, no auth).
# Destructive actions only ever render an SSH command to copy and run yourself;
# the app never executes anything.
backup_status_port: 8091
