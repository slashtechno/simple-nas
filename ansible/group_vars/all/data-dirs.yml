---
# Data directories, listed per service in services.yml, which teardown.yml and the backup coverage check read.
# Same rules as defaults.yml: tracked defaults for every host; override in vars.yml, never edit here.

# To move a service to another drive, set its variable in host_vars/<host>/vars.yml (docs/storage.md#move-one-services-data).
# Databases and configs are on the fast drive, bulk data on the primary; with both roles on one drive the split changes nothing.

# The compose stacks you create in Dockge: one directory each, holding a compose.yaml and its data.
dockge_stacks_dir: "{{ fast_drive }}/stacks"

# Dockge's own database (users, settings).
dockge_data_dir: "{{ fast_drive }}/docker/dockge"

# Tinyauth's sessions.
tinyauth_data_dir: "{{ fast_drive }}/docker/tinyauth"

# Dozzle's per-user settings; little is lost without them.
dozzle_data_dir: "{{ fast_drive }}/docker/dozzle"

# Scrutiny's collector and web UI configuration.
scrutiny_config_dir: "{{ fast_drive }}/docker/scrutiny/config"

# Scrutiny's SMART history; left out of the backup because the collector writes it again.
scrutiny_influx_dir: "{{ fast_drive }}/docker/scrutiny/influxdb"

# Caddy's certificates and state. Losing it means certificates are issued again.
caddy_data_dir: "{{ fast_drive }}/docker/caddy"

# Immich's photos (primary drive).
immich_upload_location: "{{ primary_drive }}/photos"

# Immich's Postgres data directory (fast drive).
immich_db_data_location: "{{ fast_drive }}/docker/immich_postgres"

# The files Copyparty serves (primary drive).
copyparty_files_dir: "{{ primary_drive }}/files"

# Copyparty's configuration (fast drive).
copyparty_config_dir: "{{ fast_drive }}/docker/copyparty_config"

# Copyparty's thumbnails, databases and transcode cache (fast drive). Under docker/, so the encrypted_folders
# recipe in docs/encryption.md covers it.
copyparty_hist_dir: "{{ fast_drive }}/docker/copyparty-hist"

# Where the /fast volume lives.
copyparty_fast_dir: "{{ fast_drive }}/fast"

# Directory behind /collab (primary drive).
copyparty_collab_dir: "{{ primary_drive }}/collab"

# Gitea's repositories and database (fast drive).
gitea_data_dir: "{{ fast_drive }}/docker/gitea"

# The Gitea runner's registration (.runner); on the fast drive so it is backed up.
gitea_runner_data_dir: "{{ fast_drive }}/docker/gitea_runner"

# ntfy's message history and user database; little is lost without it.
ntfy_data_dir: "{{ fast_drive }}/docker/ntfy"

# Container-internal port of pics' guest pages (never published): the tunnel points here, in cloudflared_ingress. Only pics_port is
# published on the host (LAN and tailnet). Container ports cannot collide with other services' ports.
pics_public_port: 8001

# pics' data directory (fast drive).
pics_data_dir: "{{ fast_drive }}/docker/pics"

# Where pics keeps its photos (primary drive). Copyparty serves them to pics only, as the volume /apps/pics/photos
# (and the trash as /apps/pics/trash), so they are not part of copyparty_files_dir and the admin's file listing.
pics_photos_dir: "{{ primary_drive }}/apps/pics/photos"

# Where pics moves deleted photos (primary drive); the only pics volume where files can be deleted.
pics_trash_dir: "{{ primary_drive }}/apps/pics/trash"

# Homebridge's configuration and pairings (fast drive).
homebridge_config_dir: "{{ fast_drive }}/docker/homebridge"

# Garage's metadata and data (fast drive).
garage_data_dir: "{{ fast_drive }}/docker/garage"

# Crafty's servers and configuration (fast drive).
crafty_data_dir: "{{ fast_drive }}/docker/crafty"
