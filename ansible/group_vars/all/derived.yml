---
# Values worked out from the shared settings and your vars.yml, and lists fixed by the roles (the backup scripts and cron
# jobs). Not settings: change the inputs, not these.
# Here, not in a role, because several roles and teardown.yml read them.

# Files the common, network and zram roles write outside our directories; teardown.yml removes them.
journald_dropin: /etc/systemd/journald.conf.d/50-journal-storage.conf
cloud_init_network_dropin: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
# The kernel arguments the pi role adds to pi_cmdline_file, and teardown.yml takes out again.
pi_cmdline_args: [cgroup_enable=memory, cgroup_memory=1]
zram_swap_dropin: /etc/rpi/swap.conf.d/50-zram.conf
zram_generator_dropin: /etc/systemd/zram-generator.conf.d/50-zram.conf

# The zone IDs of the cloudflare_zones domains that zone_name equals or ends with after a dot (not any domain that merely
# appears inside it: example.com must not match ample.com). Set zone_name where you read this; exactly one ID is a match.
# Example: cloudflare_zones {example.com: abc123} and zone_name git.example.com give [abc123]; zone_name notexample.com gives [].
cloudflare_zone_ids_of_name: >-
  {%- set ids = [] -%}
  {%- for zone in cloudflare_zones | dict2items -%}
  {%- if zone_name == zone.key or zone_name.endswith('.' ~ zone.key) -%}
  {%- set _ = ids.append(zone.value) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ ids }}

# geerlingguy.docker writes this one variable to /etc/docker/daemon.json. A dict set in a host's
# host_vars replaces the same dict from group_vars instead of merging, so the options owners edit
# stay separate settings in vars.yml and are combined here.
docker_daemon_options: >-
  {{ {'log-driver': 'json-file', 'log-opts': docker_log_opts}
     | combine({'data-root': docker_data_root} if docker_data_root | length > 0 else {}) }}

# The mount point of each drive role that a `drives` entry claims. A role nobody claims is absent.
# Code that works without a role asks `'fast' in drive_mounts`; code that needs one reads
# fast_drive / primary_drive / backup_drive, which fail with a message naming the missing role.
# Nothing builds a path from an unclaimed role, so no service can write to the root of the filesystem.
# `subelements` pairs every drive with each of its roles; the dict is role -> mount point of that drive.
# Example: drives with roles [fast] on /mnt/fast and [primary, backup] on /mnt/big give {fast: /mnt/fast, primary: /mnt/big, backup: /mnt/big}.
drive_mounts: >-
  {%- set mounts = {} -%}
  {%- for drive in drives -%}
  {%- for role in drive.roles | default([]) -%}
  {%- set _ = mounts.update({role: drive.mount}) -%}
  {%- endfor -%}
  {%- endfor -%}
  {{ mounts }}
# The `drives` entries that have a `uuid`: the ones mounted through fstab. An entry without one is only a folder.
mounted_drives: "{{ drives | selectattr('uuid', 'defined') | list }}"
# The mount point of each drive that holds service data (role fast or primary) and is mounted by uuid.
# The backup scripts refuse to run unless these are mounted, so they never save a snapshot of an empty folder.
# A drive with only the backup role is not listed: the scripts check it on their own.
# Example: the same drives give [/mnt/fast, /mnt/big].
data_drive_mounts: >-
  {%- set mounts = [] -%}
  {%- for drive in mounted_drives -%}
  {%- if drive.roles | default([]) | intersect(['fast', 'primary']) | length > 0 and drive.mount not in mounts -%}
  {%- set _ = mounts.append(drive.mount) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ mounts }}
# Where the unlock page and the host talk (roles/unlock_page): a socket only root can use.
unlock_page_socket_dir: /run/unlock-page
# The names of the containers that the last lock stopped, which the next unlock starts again (00-containers.sh). Kept on the root
# drive: a reboot while locked must not forget them.
encryption_stopped_file: "{{ scripts_dir }}/.stopped-for-lock"
# Each encrypted folder with the hidden folder next to it that holds its encrypted files.
# Example: encrypted_folders [/mnt/primary/photos/] gives [{mount: /mnt/primary/photos, cipher: /mnt/primary/.photos.gocryptfs}].
encrypted_pairs: >-
  {%- set pairs = [] -%}
  {%- for folder in encrypted_folders -%}
  {%- set path = folder | regex_replace('/+$', '') -%}
  {%- set _ = pairs.append({'mount': path, 'cipher': (path | dirname) ~ '/.' ~ (path | basename) ~ '.gocryptfs'}) -%}
  {%- endfor -%}
  {{ pairs }}
# Mount point of the drive with the fast role (read-only; derived from `drives`).
fast_drive: >-
  {{ drive_mounts.fast | mandatory('Host ' ~ inventory_hostname ~ ' uses the fast drive role, but no entry in its
  `drives` has roles: [fast]. Add it in host_vars/' ~ inventory_hostname ~ '/vars.yml (examples: docs/storage.md#examples).') }}
# Mount point of the drive with the primary role (derived from `drives`).
primary_drive: >-
  {{ drive_mounts.primary | mandatory('Host ' ~ inventory_hostname ~ ' uses the primary drive role, but no entry in its
  `drives` has roles: [primary]. Add it in host_vars/' ~ inventory_hostname ~ '/vars.yml (examples: docs/storage.md#examples).') }}
# Mount point of the drive with the backup role (derived from `drives`).
backup_drive: >-
  {{ drive_mounts.backup | mandatory('Host ' ~ inventory_hostname ~ ' uses the backup drive role, but no entry in its
  `drives` has roles: [backup]. Add it in host_vars/' ~ inventory_hostname ~ '/vars.yml (examples: docs/storage.md#examples).') }}

# What the backup role installs into scripts_dir, and the cron jobs it creates. The role installs and removes exactly these
# and teardown.yml removes all of them, so a new file or job is added here and nowhere else (the render test checks each name
# appears in the role's tasks). Scripts are mode 0755, lists 0644.
backup_shared_scripts: [backup-services.sh, restore-services.sh]
backup_local_scripts: [backup-restic-local.sh, restic-check.sh]
backup_local_lists: [restic-excludes-local.txt]
backup_local_cron_jobs: [backup-local, restic-check]
backup_cloud_scripts: [backup-restic-cloud.sh]
backup_cloud_lists: [backup-paths.txt, restic-excludes-cloud.txt]
backup_cloud_cron_jobs: [backup-cloud]
# The restic the backup scripts run: with backup_read_all_files, a copy with the capability to read any file (roles/backup/tasks/main.yml),
# which teardown removes.
restic_binary: "{{ restic_copy_path if backup_read_all_files | bool else '/usr/bin/restic' }}"
restic_copy_path: /usr/local/bin/restic-backup

# The cron job the encryption role creates, which alerts after boot while a folder is locked (docs/encryption.md#alert-while-locked).
# remove.yml, which teardown.yml also runs, removes it.
encryption_alert_cron_job: unlock-alert-boot

# Lists worked out from the services in services.yml and this host's switches.
# The entries with a web UI, in the order above.
web_services: "{{ services | selectattr('icon', 'defined') | list }}"

# The keys of the entries whose <key>_enabled is true on this host (lookup reads a setting named from the key, which a
# filter cannot). Example: immich_enabled and caddy_enabled true give [immich, caddy].
enabled_service_keys: >-
  {%- set on = [] -%}
  {%- for service in services if lookup('ansible.builtin.vars', service.key ~ '_enabled') | bool -%}
  {%- set _ = on.append(service.key) -%}
  {%- endfor -%}
  {{ on }}

# The keys of the services Tinyauth sits in front of: those without own_login or a fixed port (services.yml), plus Copyparty when its
# single sign-on is on. Tinyauth's cookie covers one parent domain, so these are served under the first private domain only.
# Example: [dockge, dozzle, scrutiny] on a host with Tinyauth, [] on one without.
protected_service_keys: >-
  {{ [] if not (tinyauth_enabled | bool) else
     (web_services | rejectattr('own_login', 'defined') | rejectattr('port', 'defined') | map(attribute='key') | list)
     + (['copyparty'] if copyparty_sso_enabled | bool else []) }}

# The keys of the enabled entries marked dump_required: their live database is left out of the backup, so the deploy
# checks their dump script is installed (roles/backup/tasks/checks.yml).
# Example: [immich] on a host that runs Immich, [] on one that does not.
dump_service_keys: >-
  {{ services | selectattr('key', 'in', enabled_service_keys) | selectattr('dump_required', 'defined')
     | selectattr('dump_required') | map(attribute='key') | list }}

# The keys of the enabled entries with oidc whose <key>_sso_enabled is true: the apps Tinyauth is an OpenID Connect
# provider for on this host.
# Example: [gitea, immich] on a host with both switched on and signing in through Tinyauth.
oidc_service_keys: >-
  {%- set on = [] -%}
  {%- for service in services if service.oidc is defined and lookup('ansible.builtin.vars', service.key ~ '_enabled') | bool
      and lookup('ansible.builtin.vars', service.key ~ '_sso_enabled') | bool -%}
  {%- set _ = on.append(service.key) -%}
  {%- endfor -%}
  {{ on }}

# The enabled entries with a copyparty field: the apps that get a Copyparty account and volumes on this host.
copyparty_clients: "{{ services | selectattr('key', 'in', enabled_service_keys) | selectattr('copyparty', 'defined') | list }}"

# The address of the Tinyauth login page; Tinyauth and every OIDC client (Immich, Gitea, pics) read it.
tinyauth_url: "https://{{ tinyauth_subdomain }}.{{ caddy_private_domains[0] }}"

# The alert senders that alert.sh sends for: backup jobs and the connectivity watchdog (system) and unlock.sh (unlock). Scrutiny and
# pics send themselves, from their own containers.
script_alert_senders: [system, unlock]

# The address and login of each alert sender, from its *_alert_to name and ntfy_destinations ("" gives url "" and token ""). A name that
# is not in ntfy_destinations, or a destination with no url, stops the deploy. The roles read alert_targets.<sender>.url and .token. Never print it: it holds tokens.
alert_targets: >-
  {%- set senders = {'system': system_alert_to, 'scrutiny': scrutiny_alert_to, 'pics': pics_alert_to, 'unlock': unlock_alert_to} -%}
  {%- set out = {} -%}
  {%- for sender, name in senders.items() -%}
  {%- if name | length > 0 -%}
  {%- set dest = ntfy_destinations[name]
        | default(undef(hint=sender ~ '_alert_to names a destination that ntfy_destinations does not have')) -%}
  {%- set url = dest['url'] if 'url' in dest else undef(hint=sender ~ '_alert_to names a destination with no url') -%}
  {%- set _ = out.update({sender: {'url': url, 'token': dest.get('token', '')}}) -%}
  {%- else -%}
  {%- set _ = out.update({sender: {'url': '', 'token': ''}}) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ out }}
