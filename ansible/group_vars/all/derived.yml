# Values computed from the settings in vars.yml. Tracked, and not meant to be edited.

# geerlingguy.docker writes this one variable to /etc/docker/daemon.json. A dict set in a host's
# host_vars replaces the same dict from group_vars instead of merging, so the options owners edit
# stay separate settings in vars.yml and are combined here.
docker_daemon_options: >-
  {{ {'log-driver': 'json-file', 'log-opts': docker_log_opts}
     | combine({'data-root': docker_data_root} if docker_data_root | length > 0 else {}) }}

# The mount point of the drive that fills each role, or "" when no drive claims it.
# A role that needs a drive checks it is set (the storage role does for a NAS).
drive_mounts: >-
  {%- set _m = {'fast': '', 'primary': '', 'backup': ''} -%}
  {%- for _d in drives -%}
  {%- for _r in _d.roles | default([]) -%}
  {%- set _ = _m.update({_r: _d.mount}) -%}
  {%- endfor -%}{%- endfor -%}
  {{ _m }}
# Drives that fill no role, as listed in `drives`. Copyparty exposes these under /drives.
extra_drives: >-
  {%- set _x = [] -%}
  {%- for _d in drives if not (_d.roles | default([])) -%}
  {%- set _ = _x.append(_d) -%}
  {%- endfor -%}
  {{ _x }}
fast_drive: "{{ drive_mounts.fast }}"
primary_drive: "{{ drive_mounts.primary }}"
backup_drive: "{{ drive_mounts.backup }}"
