---
# Every image version in one place. How to update one, and what a floating
# tag does: ansible/README.md#update-service-images

# Immich: the server and machine-learning images must use the same version. Release notes https://github.com/immich-app/immich/releases
immich_version: v3.1.0
immich_server_image: "ghcr.io/immich-app/immich-server:{{ immich_version }}"
immich_machine_learning_image: "ghcr.io/immich-app/immich-machine-learning:{{ immich_version }}"
# Postgres and Valkey are pinned by digest: change only when Immich's notes say so.
immich_postgres_image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
immich_valkey_image: docker.io/valkey/valkey:8@sha256:81db6d39e1bba3b3ff32bd3a1b19a6d69690f94a3954ec131277b9a26b95b3aa

# Copyparty (RAW thumbnails): https://github.com/9001/copyparty/releases
copyparty_base_image: copyparty/iv:1.20.26

# Garage: https://garagehq.deuxfleurs.fr/_releases.html
garage_image: dxflrs/garage:v2.4.1
garage_caddy_image: "caddy:{{ caddy_version }}-alpine"
garage_webui_image: khairul169/garage-webui:1.1.0

# Crafty: https://gitlab.com/crafty-controller/crafty-4/-/releases
crafty_image: registry.gitlab.com/crafty-controller/crafty-4:4.11.0

# Gitea and its runner: https://github.com/go-gitea/gitea/releases
gitea_image: gitea/gitea:1.27.3
gitea_runner_image: docker.io/gitea/act_runner:0.6.1

# Homebridge, the HomeKit bridge: https://github.com/homebridge/homebridge/releases
homebridge_image: homebridge/homebridge:2026-08-28

# restic, for the backup-status dashboard (built on the host)
restic_image: restic/restic:0.19.1
# The base image of the backup-status dashboard and the unlock page (both built on the host)
python_image: python:3.14.9-slim

# Cloudflare Tunnel: https://github.com/cloudflare/cloudflared/releases (needs 2025.4.0+ for --token-file)
cloudflared_image: cloudflare/cloudflared:2026.10.3

# Homepage (start page): https://github.com/gethomepage/homepage/releases
homepage_image: ghcr.io/gethomepage/homepage:v2.6.0

# Dockge (ad-hoc app manager): https://github.com/louislam/dockge/releases. Only `nightly` moves.
dockge_image: louislam/dockge:1.5.0
# Caddy reverse proxy, built on the host from three parts (roles/caddy/files/Dockerfile):
# Caddy itself (https://github.com/caddyserver/caddy/releases), caddy-docker-proxy (routes by container label:
# https://github.com/lucaslorentz/caddy-docker-proxy/releases) and the Cloudflare DNS plugin (https://github.com/caddy-dns/cloudflare/tags).
caddy_version: 2.11.7
caddy_docker_proxy_version: 2.13.1
caddy_cloudflare_dns_version: 0.2.4

# ntfy (failure alerts): https://github.com/binwiederhier/ntfy/releases
ntfy_image: binwiederhier/ntfy:v2.33.1

# Tinyauth (login in front of the web services): https://github.com/tinyauthapp/tinyauth/releases
tinyauth_image: ghcr.io/tinyauthapp/tinyauth:v5.2.0

# Dozzle (container logs): https://github.com/amir20/dozzle/releases
dozzle_image: amir20/dozzle:v11.4.0

# Scrutiny (disk SMART dashboard), the Starosdev fork of AnalogJ/scrutiny: https://github.com/Starosdev/scrutiny/releases
# Image tags have no "v". A release tags its image a few minutes after the GitHub release.
scrutiny_image: ghcr.io/starosdev/scrutiny:1.79.1-omnibus

# pics: git branch, tag or commit of the private repo. `main` builds the latest commit on each deploy; set a tag or commit when a stable build matters.
pics_version: main

# Zellij terminal multiplexer: https://github.com/zellij-org/zellij/releases
# Static (musl) builds. The sha256 is of the .tar.gz, as GitHub shows it on the release page.
zellij_version: v0.45.1
zellij_sha256:
  aarch64: 05f0802afadd53f8db9514e7cae53c9ae8432fed1b35b8294aa816ee3044a16b
  x86_64: 40bcc2e03f5d5ae8e054e39f676081fe12ab70871506996ba595834c3718eefc
