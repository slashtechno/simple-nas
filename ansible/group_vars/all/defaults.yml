---
# Defaults for every host. Tracked, and the same for everyone who copies this repo.
# Change a value for your hosts in vars.yml next to this file, or per host in host_vars/<host>/vars.yml; never edit it here.
# A value of `{{ undef(hint=...) }}` has no sensible default: set it in vars.yml, or the deploy stops and prints the hint.
# Secrets go in a vault.yml next to this file, never here. Vault names are in vault.yml.example.

# Timezone for the host and its containers. List names with `timedatectl list-timezones`.
timezone: UTC
# Where compose projects and helper scripts are deployed on the host.
services_dir: /opt/services
# Where the helper and backup scripts are deployed.
scripts_dir: "{{ services_dir }}/scripts"
# --- Which services run on a host ---
# Every service is off until a host switches it on: set `<name>_enabled: true` in
# host_vars/<host>/vars.yml, and false again to stop deploying it.
# A service that is already deployed keeps running; remove it with `ansible-playbook teardown.yml --limit <host> --tags <name>`.
# What each service needs (drive roles, vault entries) is in docs/services.md.

# Immich photo library with machine learning.
immich_enabled: false
# Copyparty file server (web UI, WebDAV, optional SFTP).
copyparty_enabled: false
# Gitea git hosting and its Actions runner.
gitea_enabled: false
# Homebridge, a HomeKit bridge.
homebridge_enabled: false
# pics, the photo sharing app.
pics_enabled: false
# Garage S3 object store with its web UI and CORS proxy; needs post-deploy init (docs/services.md#garage-s3).
garage_enabled: false
# Crafty Controller, a Minecraft server manager; needs RAM headroom (docs/services.md#crafty-minecraft-servers).
crafty_enabled: false
# ntfy push-notification server (docs/services.md#ntfy-failure-alerts).
ntfy_enabled: false
# Cloudflare Tunnel that publishes the hostnames in cloudflared_ingress.
cloudflared_enabled: false
# Dockge, a web UI for your own compose stacks.
dockge_enabled: false
# Caddy reverse proxy that routes by container label.
caddy_enabled: false
# Daily backup to the drive with the `backup` role, plus a weekly integrity check.
backup_local_enabled: false
# Weekly backup to restic_cloud_repository.
backup_cloud_enabled: false
# Read-only web dashboard of backup status and snapshots; needs backup_local_enabled.
backup_status_enabled: false

# Mount drives through fstab (the storage role). Set false on a host whose drives are already mounted.
storage_enabled: true
# This host's drives. Empty by default; a host that has drives lists them in host_vars/<host>/vars.yml
# (explained in host_vars/vars.yml.example).
drives: []
# Mount USB drives and card readers when they are plugged in (not drives listed in `drives`).
# Mounted at /run/media/system/<label>; Copyparty shows them under /drives (docs/storage.md).
usb_automount_enabled: false
# false: plugged-in drives are read-only. true: Copyparty can change and delete files on them.
usb_automount_writable: false
# Name of the shared Docker network the services join.
docker_network: services
# Docker image pull policy. Allowed: missing, always. Default: missing.
# "always" pulls newer images on every run, see ansible/README.md#update-service-images.
docker_pull_policy: missing
# Log rotation for every container: json-file keeps 3 files of 10m per container. Docker's default
# never rotates, and logs fill the root drive. Allowed: json-file options (strings).
# CAUTION: applies only to containers created after the change; recreate the rest with
# `docker compose up -d --force-recreate` in each project.
docker_log_opts:
  max-size: "10m"
  max-file: "3"

# Where Docker and containerd keep images, layers and anonymous volumes. Empty keeps their default
# (/var/lib/docker and /var/lib/containerd, on the root drive). Set it per host in
# host_vars/<host>/vars.yml to a directory on a mounted drive, e.g. "/mnt/t7/docker-root".
# Docker is held back until that drive is mounted (systemd RequiresMountsFor), so it cannot
# fill the root drive under an empty mount point. The procedure and tests: docs/storage.md.
# CAUTION: changing it hides existing images and containers until they are pulled/created again.
docker_data_root: ""


# --- Backups (docs/backups.md) ---
# The backup role runs on a host with `backup_local_enabled` or `backup_cloud_enabled` set to true. Local needs a
# drive with the `backup` role; cloud needs `restic_cloud_repository`. Without local backup, logs and service
# dumps live in /var/lib/backup-work on the root drive.

# One dump script per service with a live database.
service_dump_scripts_dir: "{{ scripts_dir }}/dump.d"
# Local repository; used only when a backup drive is claimed.
restic_repo_path: "{{ backup_drive }}/restic-repo"
# Offsite repository. The URL scheme picks the backend (docs/backups.md#offsite-repository-restic_cloud_repository):
# "rclone:gdrive:/path" for Google Drive, "sftp:user@host:/path" for SFTP. The deploy fails if it cannot be
# initialised. Set it per host in host_vars (each host needs its own path: hosts sharing a repository would
# prune each other's snapshots).
restic_cloud_repository: ""
# File holding the restic repository password, written from vault_restic_password.
restic_password_file: "/home/{{ ansible_user }}/.restic-password"
# Where backup logs and service dumps live: on the backup drive with a local backup, else on the root drive.
backup_work_dir: "{{ drive_mounts.backup if backup_local_enabled | bool else '/var/lib/backup-work' }}"
# Where the backup logs are written.
backup_logs_dir: "{{ backup_work_dir }}/logs"
# restic forget options for the local repository: snapshots kept per day, week and month.
restic_local_retention: "--keep-daily 7 --keep-weekly 4 --keep-monthly 1"
# restic forget options for the offsite repository: snapshots kept per week and month.
restic_cloud_retention: "--keep-weekly 12 --keep-monthly 6"
# rclone's default Google Drive client is shared by all rclone users, so a burst of small uploads can
# fail with 403 RATE_LIMIT_EXCEEDED. This throttle avoids that; no custom OAuth client (docs/backups.md).
restic_cloud_rclone_args: "serve restic --stdio --tpslimit=10"

# --- Data directories (teardown.yml also reads them) ---
# One variable per service. To move a service to another drive, set its variable in host_vars/<host>/vars.yml
# (procedure: docs/storage.md#move-one-services-data). Keep the new path under a drive that has a role, or the
# default backup (restic_local_rules) does not cover it. A variable that uses a drive role fails with a
# message naming the role if no entry in `drives` claims it, but only on a host that enables the service.
# Random-IO data (databases, configs) is on the fast drive; bulk data (photos, files) is on the primary.
# When both roles are the same drive, the split changes nothing on disk.

# The compose stacks you create in Dockge: one directory each, holding a compose.yaml and its data.
dockge_stacks_dir: "{{ fast_drive }}/stacks"
# Dockge's own database (users, settings).
dockge_data_dir: "{{ fast_drive }}/docker/dockge"
# Caddy's certificates and state. Losing it means certificates are issued again.
caddy_data_dir: "{{ fast_drive }}/docker/caddy"
# Immich's photos (primary drive).
immich_upload_location: "{{ primary_drive }}/photos"
# Immich's Postgres data directory (fast drive).
immich_db_data_location: "{{ fast_drive }}/docker/immich_postgres"
# The files Copyparty serves (primary drive).
copyparty_files_dir: "{{ primary_drive }}/files"
# Copyparty's configuration (fast drive).
copyparty_config_dir: "{{ fast_drive }}/docker/copyparty_config"
copyparty_hist_dir: "{{ fast_drive }}/copyparty-hist"   # thumbnails/dbs/transcode cache (see copyparty role)
# Add a /fast volume to Copyparty (SSD scratch and working space). Useful only when the fast and primary
# roles are on different drives; with one drive it would just be a folder of /. See docs/storage.md.
copyparty_fast_enabled: false
# Where the /fast volume lives.
copyparty_fast_dir: "{{ fast_drive }}/fast"
# Gitea's repositories and database (fast drive).
gitea_data_dir: "{{ fast_drive }}/docker/gitea"
gitea_runner_data_dir: "{{ fast_drive }}/docker/gitea_runner"   # runner registration (.runner); on the fast drive so it is backed up
ntfy_data_dir: "{{ fast_drive }}/docker/ntfy"   # message history and the user database; rebuilt from the compose file, so little is lost without it
# pics' data directory (fast drive).
pics_data_dir: "{{ fast_drive }}/docker/pics"
# Homebridge's configuration and pairings (fast drive).
homebridge_config_dir: "{{ fast_drive }}/docker/homebridge"
# Garage's metadata and data (fast drive).
garage_data_dir: "{{ fast_drive }}/docker/garage"
# Crafty's servers and configuration (fast drive).
crafty_data_dir: "{{ fast_drive }}/docker/crafty"

# --- Failure alerts (roles/backup/templates/alert.sh.j2) ---
# File on the host holding vault_ntfy_token, read by alert.sh.
ntfy_token_file: "{{ services_dir }}/ntfy-token"

# --- Cloudflare Tunnel (roles/cloudflared; a server that runs one sets cloudflared_enabled: true and its own cloudflared_ingress) ---
# Public hostnames this host's tunnel serves. Empty here; a host that runs a tunnel lists its own in host_vars/<host>/vars.yml.
# One entry per hostname, exactly two keys: hostname and service (the internal Docker address). No `path:`.
# The hostname must contain one domain from cloudflared_zones. A hostname may appear on only one host; the deploy fails otherwise.
cloudflared_ingress: []

# --- Copyparty ---
# Every service that publishes a host port is reachable at http://<host-tailscale-name>:<port> from
# any device on your tailnet. That needs nothing extra: no `tailscale serve`, no funnel. The funnel
# (roles/tailscale_funnel/defaults/main.yml) only gives Copyparty a public ts.net name; pics' guest
# pages go through the Cloudflare tunnel (a cloudflared_ingress entry that points at pics_public_port).

copyparty_collab_dir: "{{ primary_drive }}/collab"   # shared directory for friends
# Host port of Copyparty's web UI and WebDAV.
copyparty_port: 3923

# Accounts for apps that talk to Copyparty. Each gets its own volume at
# /<folder>, stored in copyparty_files_dir/<folder>; the admin gets A on it
# too. Two entries can't share a folder. Passwords go in the vault.
# Example, a photo app: no d on photos, so without delete Copyparty also refuses overwrites (it renames
# instead) and the app can't destroy a photo; it may delete only in its own photos-trash volume.
#   - user: photos
#     pass: "{{ vault_copyparty_photos_pass }}"
#     volumes:
#       - { folder: photos, perms: rwm }
#       - { folder: photos-trash, perms: rwmd }
copyparty_service_accounts: []

# --- Computed values (not edited) ---
# Worked out from the settings above and in vars.yml. Change the inputs, not these.

# geerlingguy.docker writes this one variable to /etc/docker/daemon.json. A dict set in a host's
# host_vars replaces the same dict from group_vars instead of merging, so the options owners edit
# stay separate settings in vars.yml and are combined here.
docker_daemon_options: >-
  {{ {'log-driver': 'json-file', 'log-opts': docker_log_opts}
     | combine({'data-root': docker_data_root} if docker_data_root | length > 0 else {}) }}

# The mount point of each drive role that a `drives` entry claims. A role nobody claims is absent.
# Code that works without a role asks `'fast' in drive_mounts`; code that needs one reads
# fast_drive / primary_drive / backup_drive, which fail with a message naming the missing role.
# Nothing builds a path from an unclaimed role, so no service can write to the root of the filesystem.
# How it is built: `{% for %}` loops over the drives and each drive's roles, and `_m.update({role: mount})`
# fills a dictionary. `{%- set _ = ... -%}` is the usual way to call a method in Jinja, because a plain
# `{{ }}` would print its result; the `-` trims the blank lines the tags would leave.
drive_mounts: >-
  {%- set _m = {} -%}
  {%- for _d in drives -%}
  {%- for _r in _d.roles | default([]) -%}
  {%- set _ = _m.update({_r: _d.mount}) -%}
  {%- endfor -%}{%- endfor -%}
  {{ _m }}
fast_drive: >-
  {{ drive_mounts.fast | mandatory('Host ' ~ inventory_hostname ~ ' uses the fast drive role, but no entry in its
  `drives` has roles: [fast]. Add it in host_vars/' ~ inventory_hostname ~ '/vars.yml (examples: docs/storage.md#examples).') }}
primary_drive: >-
  {{ drive_mounts.primary | mandatory('Host ' ~ inventory_hostname ~ ' uses the primary drive role, but no entry in its
  `drives` has roles: [primary]. Add it in host_vars/' ~ inventory_hostname ~ '/vars.yml (examples: docs/storage.md#examples).') }}
backup_drive: >-
  {{ drive_mounts.backup | mandatory('Host ' ~ inventory_hostname ~ ' uses the backup drive role, but no entry in its
  `drives` has roles: [backup]. Add it in host_vars/' ~ inventory_hostname ~ '/vars.yml (examples: docs/storage.md#examples).') }}

