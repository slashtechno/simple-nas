---
# Defaults for every host. Tracked, and the same for everyone who copies this repo.
# Change a value for your hosts in vars.yml next to this file, or per host in host_vars/<host>/vars.yml; never edit it here.
# A value of `{{ undef(hint=...) }}` has no sensible default: set it in vars.yml, or the deploy stops and prints the hint.
# Secrets go in a vault.yml next to this file, never here. Vault names are in vault.yml.example.

# Timezone for the host and the containers whose image reads TZ. List names with `timedatectl list-timezones`.
timezone: UTC
# Where compose projects are deployed on the host.
services_dir: /opt/services
# Where the helper and backup scripts are deployed.
scripts_dir: "{{ services_dir }}/scripts"
# --- Which services run on a host ---
# Tailscale is installed by default; set false on a host that reaches the network another way.
tailscale_enabled: true
# Every service is off until a host sets `<name>_enabled: true`; to remove one see teardown.yml (ansible/README.md, docs/services.md).

# Immich photo library with machine learning.
immich_enabled: false
# Immich's login also accepts a Tinyauth login (docs/auth-reference.md#sign-in-with-tinyauth-oidc).
immich_sso_enabled: false
# Copyparty file server (web UI, WebDAV).
copyparty_enabled: false
# Copyparty's browser name behind the Tinyauth login; apps and the published port keep their own passwords (docs/services.md#copyparty-accounts-and-volumes).
copyparty_sso_enabled: false
# Gitea git hosting and its Actions runner.
gitea_enabled: false
# Gitea's login also accepts a Tinyauth login (docs/auth-reference.md#sign-in-with-tinyauth-oidc).
gitea_sso_enabled: false
# Homebridge, a HomeKit bridge.
homebridge_enabled: false
# pics, the photo sharing app.
pics_enabled: false
# pics' owner login also accepts a Tinyauth login (docs/auth-reference.md#sign-in-with-tinyauth-oidc). Needs pics_oidc_owner.
pics_sso_enabled: false
# Garage S3 object store with its web UI and CORS proxy; needs post-deploy init (docs/services.md#garage-s3).
garage_enabled: false
# Crafty Controller, a Minecraft server manager; needs RAM headroom (docs/services.md#crafty-minecraft-servers).
crafty_enabled: false
# ntfy push-notification server (docs/services.md#ntfy-failure-alerts).
ntfy_enabled: false
# Cloudflare Tunnel that publishes the hostnames in cloudflared_ingress.
cloudflared_enabled: false
# Tinyauth, a login page that Caddy puts in front of every service with a Caddy name, except those marked own_login in
# services.yml (docs/services.md#tinyauth-login). Here, not in the tinyauth role, because Caddy and Homepage read it.
tinyauth_enabled: false
# Dozzle, a read-only web view of the logs of every container on the host (docs/services.md#dozzle-container-logs).
dozzle_enabled: false
# Scrutiny, a web dashboard of each drive's SMART health (docs/services.md#scrutiny-drive-health).
scrutiny_enabled: false
# Dockge, a web UI for your own compose stacks.
dockge_enabled: false
# Homepage, a start page with a link to every enabled service (docs/services.md#homepage).
homepage_enabled: false
# Caddy reverse proxy that routes by container label.
caddy_enabled: false
# Daily backup to the drive with the `backup` role, plus a weekly integrity check.
backup_local_enabled: false
# Weekly backup to restic_cloud_repository (what it copies: docs/backups.md).
backup_cloud_enabled: false
# Read-only web dashboard of backup status and snapshots; needs backup_local_enabled.
backup_status_enabled: false

# Absolute paths of folders to store encrypted with gocryptfs, each a folder a service already uses. Listing one switches encryption on (docs/encryption.md).
encrypted_folders: []

# Mount drives through fstab (the storage role). Set false on a host whose drives are already mounted.
storage_enabled: true
# This host's drives. Empty by default; a host that has drives lists them in host_vars/<host>/vars.yml
# (explained in host_vars/vars.yml.example).
drives: []
# Mount USB drives and card readers when they are plugged in (not drives listed in `drives`).
# Mounted at /run/media/system/<label>; Copyparty shows them under /drives (docs/storage.md).
usb_automount_enabled: false
# false: plugged-in drives are read-only. true: Copyparty can change and delete files on them.
usb_automount_writable: false
# Name of the shared Docker network the services join.
docker_network: services
# Docker image pull policy. Allowed: missing, always. Default: missing.
# "always" pulls newer images on every run, see ansible/README.md#update-service-images.
docker_pull_policy: missing
# Log rotation for every container: json-file keeps 3 files of 10m per container. Docker's default
# never rotates, and logs fill the root drive. Allowed: json-file options (strings).
# CAUTION: applies only to containers created after the change; recreate the rest with
# `docker compose up -d --force-recreate` in each project.
docker_log_opts:
  max-size: "10m"
  max-file: "3"

# Where Docker and containerd keep images and layers. Empty keeps /var/lib/docker on the root drive; set it per host to a
# directory on a mounted drive (docs/storage.md#dockers-own-storage).
# CAUTION: changing it hides existing images and containers until they are pulled/created again.
docker_data_root: ""


# --- Backups (docs/backups.md) ---
# The local backup needs a drive with the `backup` role; the cloud backup needs `restic_cloud_repository`.

# One dump script per service with a live database.
service_dump_scripts_dir: "{{ scripts_dir }}/dump.d"
# Local repository; used only when a backup drive is claimed.
restic_repo_path: "{{ backup_drive }}/restic-repo"
# Offsite repository, set per host (docs/backups.md#offsite-repository-restic_cloud_repository). The URL scheme picks the backend:
# "rclone:gdrive:/path" for Google Drive, "sftp:user@host:/path" for SFTP.
restic_cloud_repository: ""
# File holding the restic repository password, written from vault_restic_password.
restic_password_file: "/home/{{ ansible_user }}/.restic-password"
# Where backup logs and service dumps live: on the backup drive with a local backup, else on the root drive.
backup_work_dir: "{{ drive_mounts.backup if backup_local_enabled | bool else '/var/lib/backup-work' }}"
# Where the backup logs are written.
backup_logs_dir: "{{ backup_work_dir }}/logs"
# restic forget options for the local repository: snapshots kept per day, week and month.
restic_local_retention: "--keep-daily 7 --keep-weekly 4 --keep-monthly 1"
# restic forget options for the offsite repository: snapshots kept per week and month.
restic_cloud_retention: "--keep-weekly 12 --keep-monthly 6"
# rclone's default Google Drive client is shared by all rclone users, so a burst of small uploads can
# fail with 403 RATE_LIMIT_EXCEEDED. This throttle avoids that; no custom OAuth client (docs/backups.md).
# Leave it alone unless you see that error.
restic_cloud_rclone_args: "serve restic --stdio --tpslimit=10"

# --- Data directories (listed per service in services.yml, which teardown.yml and the backup coverage check read) ---
# To move a service to another drive, set its variable in host_vars/<host>/vars.yml (docs/storage.md#move-one-services-data).
# Databases and configs are on the fast drive, bulk data on the primary; with both roles on one drive the split changes nothing.

# The compose stacks you create in Dockge: one directory each, holding a compose.yaml and its data.
dockge_stacks_dir: "{{ fast_drive }}/stacks"
# Dockge's own database (users, settings).
dockge_data_dir: "{{ fast_drive }}/docker/dockge"
# Tinyauth's sessions.
tinyauth_data_dir: "{{ fast_drive }}/docker/tinyauth"
# Dozzle's per-user settings; little is lost without them.
dozzle_data_dir: "{{ fast_drive }}/docker/dozzle"
# Scrutiny's collector and web UI configuration.
scrutiny_config_dir: "{{ fast_drive }}/docker/scrutiny/config"
# Scrutiny's SMART history; left out of the backup because the collector writes it again.
scrutiny_influx_dir: "{{ fast_drive }}/docker/scrutiny/influxdb"
# Caddy's certificates and state. Losing it means certificates are issued again.
caddy_data_dir: "{{ fast_drive }}/docker/caddy"
# Immich's photos (primary drive).
immich_upload_location: "{{ primary_drive }}/photos"
# Immich's Postgres data directory (fast drive).
immich_db_data_location: "{{ fast_drive }}/docker/immich_postgres"
# The files Copyparty serves (primary drive).
copyparty_files_dir: "{{ primary_drive }}/files"
# Copyparty's configuration (fast drive).
copyparty_config_dir: "{{ fast_drive }}/docker/copyparty_config"
# Copyparty's thumbnails, databases and transcode cache (fast drive). Under docker/, so the encrypted_folders
# recipe in docs/encryption.md covers it.
copyparty_hist_dir: "{{ fast_drive }}/docker/copyparty-hist"
# Add a /fast volume to Copyparty (SSD scratch and working space). Useful only when the fast and primary
# roles are on different drives; with one drive it would just be a folder of /. See docs/storage.md.
copyparty_fast_enabled: false
# Where the /fast volume lives.
copyparty_fast_dir: "{{ fast_drive }}/fast"
# Turns on /collab, a shared Copyparty folder for friends. Needs vault_copyparty_collab_users
# (vault.yml.example); the folder is created, mounted and checked for backup only when this is true.
copyparty_collab_enabled: false
# Directory behind /collab (primary drive).
copyparty_collab_dir: "{{ primary_drive }}/collab"
# Gitea's repositories and database (fast drive).
gitea_data_dir: "{{ fast_drive }}/docker/gitea"
# The Gitea runner's registration (.runner); on the fast drive so it is backed up.
gitea_runner_data_dir: "{{ fast_drive }}/docker/gitea_runner"
# ntfy's message history and user database; little is lost without it.
ntfy_data_dir: "{{ fast_drive }}/docker/ntfy"
# pics' data directory (fast drive).
pics_data_dir: "{{ fast_drive }}/docker/pics"
# Where pics keeps its photos and its trash (primary drive). Copyparty serves them to pics only, as the volumes
# /apps/pics/photos and /apps/pics/trash, so they are not part of copyparty_files_dir and the admin's file listing.
pics_photos_dir: "{{ primary_drive }}/apps/pics/photos"
pics_trash_dir: "{{ primary_drive }}/apps/pics/trash"
# Homebridge's configuration and pairings (fast drive).
homebridge_config_dir: "{{ fast_drive }}/docker/homebridge"
# Garage's metadata and data (fast drive).
garage_data_dir: "{{ fast_drive }}/docker/garage"
# Crafty's servers and configuration (fast drive).
crafty_data_dir: "{{ fast_drive }}/docker/crafty"

# --- Failure alerts (roles/common/templates/alert.sh.j2; ntfy_server and ntfy_alert_url are in roles/common/defaults/main.yml) ---
# File on the host holding vault_ntfy_token, read by alert.sh. Here because teardown.yml removes it.
ntfy_token_file: "{{ services_dir }}/ntfy-token"

# --- Cloudflare account (roles/cloudflared and roles/caddy; teardown does not read it) ---
# API token, from the vault. It needs Zone:DNS:Edit on every zone below; the tunnel also needs Account:Cloudflare Tunnel:Edit.
cloudflare_api_token: "{{ vault_cloudflared_api_token }}"
# Account ID, from the vault.
cloudflare_account_id: "{{ vault_cloudflared_account_id }}"
# Domain -> zone ID. Zone IDs aren't secret. Set them in group_vars/all/vars.yml (shape in vars.yml.example).
cloudflare_zones: {}
# Cloudflare's API. Not a setting to change.
cloudflare_api_url: https://api.cloudflare.com/client/v4

# --- Cloudflare Tunnel (roles/cloudflared; a server that runs one sets cloudflared_enabled: true and its own cloudflared_ingress) ---
# Public hostnames this host's tunnel serves, as {hostname, service} entries; a host that runs the tunnel lists its own (docs/services.md#cloudflare-add-a-public-hostname).
cloudflared_ingress: []

# --- Direct Ethernet link (roles/network; teardown.yml also reads it; docs/networking.md#direct-ethernet-link) ---
# A cable straight from this host to a laptop: a static address on the host, no gateway, and a dnsmasq that hands the
# laptop its address on that port only. The port must be idle, not the one the host is managed over.
direct_link_enabled: false
# The host's network port for the cable (`ip link` lists them). A Raspberry Pi's wired port is eth0; on an x64
# machine it is named like enp3s0, so set it there.
direct_link_iface: eth0
# The host's address on the link.
direct_link_ip: 10.10.20.1
# The address handed to the laptop.
direct_link_peer_ip: 10.10.20.2
# Prefix length; 30 leaves room for just these two addresses.
direct_link_prefix: 30

# Check every 2 minutes that the host can open TCP connections to the internet, and reconnect its network connection
# when it cannot (docs/networking.md#connectivity-watchdog). Needs NetworkManager to reconnect.
connectivity_watchdog_enabled: false

# --- Host ports of the web UIs ---
# Set here because the Homepage links to them. Each listens on every interface: http://<host-tailscale-name>:<port>
# (HTTPS: docs/caddy-reference.md). Set one to "" to publish no host port; the service is then
# reachable only through its Caddy name, which the deploy checks is set up.
# Immich's web UI and API (the mobile app connects here).
immich_port: 2283
# Copyparty's web UI and WebDAV.
copyparty_port: 3923
# Gitea's web UI.
gitea_port: 3000
# pics' owner pages (the guest pages never use a host port).
pics_port: 8100
# Dockge asks for an account on first visit. The published port skips Tinyauth, so Dockge keeps its own login while one is set; "" makes Tinyauth its only one.
dockge_port: 5001
# ntfy's web UI and API. Nothing is readable or writable without the login: ntfy_* auth defaults to deny-all.
ntfy_port: 8090
# Tinyauth's login page. Its address is https, so it needs a Caddy name; "" publishes no host port.
tinyauth_port: ""
# Dozzle's web UI. CAUTION: a published port skips the login, and Dozzle trusts the user Tinyauth names in a header (docs/services.md#tinyauth-login).
dozzle_port: ""
# Scrutiny's web UI. "" publishes no host port.
scrutiny_port: ""
# The read-only backup dashboard: no login of its own. Behind Tinyauth by default; a host without Tinyauth must set a port and accepts that anyone on the network can read backup status and file paths.
backup_status_port: ""
# The Homepage start page: no login of its own. Behind Tinyauth by default; a host without Tinyauth must set a port and accepts that anyone on the network can open it.
homepage_port: ""
# Crafty's panel (HTTPS); the container always listens on 8443.
crafty_port: 28443

# --- Names of the web UIs under the private domain ---
# With caddy_private_domains set, Caddy serves each service switched on at https://<name>.<private domain>
# (docs/caddy-reference.md#names-for-apps-caddy_private_domains). Set one to "" and that service gets no name.
# Immich's name.
immich_subdomain: immich
# Copyparty's name.
copyparty_subdomain: copyparty
# Gitea builds its links from gitea_root_url, a single address, so it has no name by default. To give it one,
# set gitea_root_url to that address and gitea_subdomain to its first label (the Homepage then links to it).
gitea_subdomain: ""
# pics' owner pages.
pics_subdomain: pics
# Crafty's panel.
crafty_subdomain: crafty
# Dockge's name.
dockge_subdomain: dockge
# ntfy's name; its own base URL (ntfy_base_url) is the address phones use.
ntfy_subdomain: ntfy
# The backup dashboard's name.
backup_status_subdomain: backups
# Tinyauth's login page.
tinyauth_subdomain: auth
# Dozzle's name.
dozzle_subdomain: logs
# Scrutiny's name.
scrutiny_subdomain: disks
# Homepage's name.
homepage_subdomain: home
# This host's private domains; each must contain a domain from cloudflare_zones. Here, not in the caddy role, because the
# Homepage on another host reads it. What the deploy creates for them (DNS-only records, certificates): docs/caddy-reference.md#web-addresses-and-https.
caddy_private_domains: []
