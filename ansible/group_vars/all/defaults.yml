---
# Defaults for every host. Tracked, and the same for everyone who copies this repo.
# Change a value for your hosts in vars.yml next to this file, or per host in host_vars/<host>/vars.yml; never edit it here.
# A value of `{{ undef(hint=...) }}` has no sensible default: set it in vars.yml, or the deploy stops and prints the hint.
# Secrets go in a vault.yml next to this file, never here. Vault names are in vault.yml.example.
# Shared settings are split by topic: this file holds the general ones and the defaults-<topic>.yml files beside it hold the rest.
# A setting is in exactly one of them (`just settings` lists all).

# Timezone for the host and the containers whose image reads TZ. List names with `timedatectl list-timezones`.
timezone: UTC

# Where compose projects are deployed on the host.
services_dir: /opt/services

# Where the helper and backup scripts are deployed. The recovery commands in the docs and `just unlock`, `lock` and `encryption-status`
# assume the default.
scripts_dir: "{{ services_dir }}/scripts"

# Absolute paths of folders to store encrypted with gocryptfs, each a folder a service already uses. Listing one switches encryption on (docs/encryption.md).
encrypted_folders: []

# This host's drives. Empty by default; a host that has drives lists them in host_vars/<host>/vars.yml
# (explained in host_vars/vars.yml.example).
drives: []

# false: plugged-in drives are read-only. true: Copyparty can change and delete files on them.
usb_automount_writable: false

# Name of the shared Docker network the services join.
docker_network: services

# Docker image pull policy. Allowed: missing, always. Default: missing.
# "always" pulls newer images on every run, see ansible/README.md#update-service-images.
docker_pull_policy: missing

# Whether a deploy recreates containers whose compose definition did not change (services deployed through roles/compose_service). Allowed: auto, always. Default: auto.
# "always" is for a change outside the compose file, such as the memory cgroup (docs/memory.md#memory-limits).
docker_recreate: auto

# The Raspberry Pi firmware's kernel command line: one line of arguments (the pi role edits it, teardown.yml reverts it).
pi_cmdline_file: /boot/firmware/cmdline.txt

# Log rotation for every container: json-file keeps 3 files of 10m per container. Docker's default
# never rotates, and logs fill the root drive. Allowed: json-file options (strings).
# CAUTION: applies only to containers created after the change; recreate the rest with
# `docker compose up -d --force-recreate` in each project.
docker_log_opts:
  max-size: "10m"
  max-file: "3"

# Where journald keeps the system log: persistent (on disk, kept across reboots, so a host that froze or reset leaves a
# record) or volatile (in memory only, which spares the root drive the writes). Raspberry Pi OS defaults to
# volatile. Other values are in `man journald.conf`.
journal_storage: persistent

# Where Docker and containerd keep images and layers. Empty keeps /var/lib/docker on the root drive; set it per host to a
# directory on a mounted drive (docs/storage.md#dockers-own-storage).
# CAUTION: changing it hides existing images and containers until they are pulled/created again.
docker_data_root: ""

# unlock.sh runs every `<name>.sh` here as root, in name order, after mounting the encrypted folders. The deploy writes only
# 00-containers.sh (restarts the containers that use an unlocked folder); the scripts you add start any other software and are never touched (docs/encryption.md).
encryption_hooks_dir: "{{ scripts_dir }}/after-unlock.d"

# Copyparty folders for people who are not admins, such as [collab]: each is served at /<name>, as a folder of that name inside
# copyparty_shared_dir. Who may use one is in vault_copyparty_accounts (vault.yml.example). The directory is created, mounted and
# checked for backup only when this list is not empty.
copyparty_shared_folders: []

# The topic the ntfy server this repo runs accepts alerts on (its access token is limited to it). A destination for this server ends its url with it.
ntfy_topic: alerts

# The ntfy topics alerts can go to, by name: {name: {url, token}}. Put it in group_vars/all/vars.yml (a host's own value replaces it whole, so list every name that host needs). The url is the full address of a topic, such as
# "http://pinas:8090/alerts" (the ntfy this repo runs, over the tailnet) or "https://ntfy.sh/<your-topic>". The token is the login;
# leave it out for a topic with no login. A topic name on a public server works like a password: keep it in the vault and write
# "{{ vault_<name> }}" as the url. Use https:// or a tailnet address, because the token travels in the request.
# Every destination needs a url. A vault name used here must exist on the hosts that send to it (docs/services.md#ntfy-failure-alerts).
ntfy_destinations: {}
# Which destination each alert goes to: a name from ntfy_destinations. "" sends nothing, which is the default for all four. Write "", not
# an empty value. The system log (`journalctl -t backup`, `-t connectivity`, `-t unlock`) gets the alerts of the scripts in any case.
# Failed backup jobs and the connectivity watchdog (alert.sh).
system_alert_to: ""
# Scrutiny's drive alerts.
scrutiny_alert_to: ""
# The pics app's drive alerts.
pics_alert_to: ""
# The locked-folder alert after a reboot (unlock.sh).
unlock_alert_to: ""
# Folder on the host with one token file per alert that alert.sh sends (named after the sender). Here because teardown.yml removes
# it and the backup leaves it out.
alert_token_dir: "{{ services_dir }}/alert-tokens"

# File on the host holding the Cloudflare tunnel token, mounted into the tunnel's container. Here because the backup
# role leaves it out (the container's user owns it, mode 400).
cloudflared_token_file: "{{ services_dir }}/cloudflared/token"

# Who may use a service: {service key: [Tinyauth user names]}. A service not listed is open to every user in
# vault_tinyauth_users; which services accept a list is in docs/auth-reference.md#who-may-use-what.
# Example: {dozzle: [alice], pics: [alice, bob]}
service_users: {}
