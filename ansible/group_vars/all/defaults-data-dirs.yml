---
# Data directories, listed per service in services.yml, which teardown.yml and the backup coverage check read.
# Same rules as defaults.yml: tracked defaults for every host; override in vars.yml, never edit here.

# To move a service to another drive, set its variable in host_vars/<host>/vars.yml (docs/storage.md#move-one-services-data).
# One rule: a service's own state is in appdata_dir/<key> (fast drive), its bulk data in bulk_dir/<key> (primary drive),
# and the owner's own files in a plainly named folder (stacks, fast, files, collab). A part of a service is a subfolder
# of its folder. Multi-word folder names use hyphens. With both roles on one drive the split changes nothing.

# The parent of each service's own state (databases, configs, sessions) on the fast drive. List it in encrypted_folders
# to encrypt all of it (docs/encryption.md#which-folders-to-list). The storage role creates it.
appdata_dir: "{{ fast_drive }}/appdata"
# The parent of each service's bulk data (photos, object blocks, game worlds) on the primary drive. List it in
# encrypted_folders to encrypt all of it. The storage role creates it. A host that runs a service with bulk data needs the primary role.
bulk_dir: "{{ primary_drive }}/bulk"

# The owner's own folders sit directly on a drive and are never deleted by teardown.
# The compose stacks you create in Dockge: one directory each, holding a compose.yaml and its data.
dockge_stacks_dir: "{{ fast_drive }}/stacks"
# The files Copyparty serves (primary drive).
copyparty_files_dir: "{{ primary_drive }}/files"
# Where the /scratch volume lives (fast drive).
copyparty_scratch_dir: "{{ fast_drive }}/scratch"
# Directory behind /collab (primary drive).
copyparty_collab_dir: "{{ primary_drive }}/collab"

# Dockge's own database (users, settings).
dockge_data_dir: "{{ appdata_dir }}/dockge"

# Tinyauth's sessions.
tinyauth_data_dir: "{{ appdata_dir }}/tinyauth"

# Dozzle's per-user settings; little is lost without them.
dozzle_data_dir: "{{ appdata_dir }}/dozzle"

# Scrutiny's collector and web UI configuration.
scrutiny_config_dir: "{{ appdata_dir }}/scrutiny/config"

# Scrutiny's SMART history; left out of the backup because the collector writes it again.
scrutiny_influx_dir: "{{ appdata_dir }}/scrutiny/influxdb"

# Caddy's certificates and state. Losing it means certificates are issued again.
caddy_data_dir: "{{ appdata_dir }}/caddy"

# Immich's photos.
immich_photos_dir: "{{ bulk_dir }}/immich"

# Immich's Postgres data directory.
immich_postgres_dir: "{{ appdata_dir }}/immich"

# Copyparty's configuration.
copyparty_config_dir: "{{ appdata_dir }}/copyparty/config"

# Copyparty's thumbnails, databases and transcode cache; left out of the backup because they are made again.
copyparty_hist_dir: "{{ appdata_dir }}/copyparty/hist"

# Gitea's repositories and database.
gitea_data_dir: "{{ appdata_dir }}/gitea/data"

# The Gitea runner's registration (.runner); in appdata so it is backed up.
gitea_runner_data_dir: "{{ appdata_dir }}/gitea/runner"

# ntfy's message history and user database; little is lost without it.
ntfy_data_dir: "{{ appdata_dir }}/ntfy"

# pics' data directory.
pics_data_dir: "{{ appdata_dir }}/pics"

# Where pics keeps its photos. Copyparty serves them to pics only, as the volume /apps/pics/photos
# (and the trash as /apps/pics/trash), so they are not part of copyparty_files_dir and the admin's file listing.
pics_photos_dir: "{{ bulk_dir }}/pics/photos"

# Where pics moves deleted photos; the only pics volume where files can be deleted.
pics_trash_dir: "{{ bulk_dir }}/pics/trash"

# Homebridge's configuration and pairings.
homebridge_data_dir: "{{ appdata_dir }}/homebridge"

# Garage's metadata (which objects and buckets exist). A live database: left out of the backup, the dump carries it.
garage_meta_dir: "{{ appdata_dir }}/garage"

# Garage's object blocks, plain files.
garage_blocks_dir: "{{ bulk_dir }}/garage"

# Crafty's servers, worlds and configuration.
crafty_data_dir: "{{ bulk_dir }}/crafty"
