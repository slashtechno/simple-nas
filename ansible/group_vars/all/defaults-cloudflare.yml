---
# Cloudflare account and tunnel (roles/cloudflared and roles/caddy; teardown does not read them).
# Same rules as defaults.yml: tracked defaults for every host; override in vars.yml, never edit here.

# API token, from the vault. It needs Zone:DNS:Edit on every zone below; the tunnel also needs Account:Cloudflare Tunnel:Edit.
cloudflare_api_token: "{{ vault_cloudflared_api_token }}"

# The token Caddy gets on the host for its DNS challenge (a certificate for each private domain), from the vault. It is read only
# on a host with caddy_private_domains. Caddy needs only Zone:DNS:Edit on the zone of caddy_private_domains, so a token with that
# alone keeps a thief of the host from editing other zones or tunnels. The same token as above also works. Teardown does not read it.
caddy_dns_api_token: "{{ vault_caddy_dns_api_token }}"

# Account ID, from the vault.
cloudflare_account_id: "{{ vault_cloudflared_account_id }}"

# Domain -> zone ID. Zone IDs aren't secret. Set them in group_vars/all/vars.yml (shape in vars.yml.example).
cloudflare_zones: {}

# Cloudflare's API. Not a setting to change.
cloudflare_api_url: https://api.cloudflare.com/client/v4

# Public hostnames this host's tunnel serves, as {hostname, service} entries; a host that runs the tunnel lists its own (docs/services.md#cloudflare-add-a-public-hostname).
cloudflared_ingress: []
