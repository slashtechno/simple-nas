# THESE ARE THE REPO OWNER'S OWN SETTINGS (domains, SSH key, drive UUIDs). If you copied this repo, replace every
# value with yours, starting from ../vars.yml.example; see "Using this repo for your own hosts" in ansible/README.md.
# Settings for this one host. Options are explained in ../vars.yml.example and group_vars/all/vars.yml.example.

# An ad-hoc app host: Dockge for compose stacks, Caddy for names. Stacks live in a folder on the root drive
# (docs/storage.md#using-the-root-drive-for-fast-or-primary). It runs no backup: pinas owns the offsite
# repository, and two hosts must never back up into one.
dockge_enabled: true
caddy_enabled: true

# --- Drives ---
drives:
  - { mount: /srv/apps, roles: [fast] }
