# THESE ARE THE REPO OWNER'S OWN SETTINGS (domains, SSH key, drive UUIDs). If you copied this repo, replace every
# value with yours, starting from ../vars.yml.example; see "Using this repo for your own hosts" in ansible/README.md.
# Settings for this one host. Options are explained in ../vars.yml.example.

# Direct Ethernet link (Pi <-> laptop, bypasses wifi for fast transfers)
# Plug a cable straight from the Pi's eth0 into a laptop. Static IP, no gateway,
# so it can't route internet traffic. See docs/networking.md#direct-ethernet-link.
direct_link_enabled: true
direct_link_iface: eth0
direct_link_ip: 10.10.20.1        # Pi's address on the link
direct_link_peer_ip: 10.10.20.2   # handed to the laptop automatically via dnsmasq
direct_link_prefix: 30            # /30 = just these two addresses, nothing else fits

# --- Drives ---
# What each drive is for is explained in ../vars.yml.example. The T7 fills fast and primary.
drives:
  - uuid: "302ffde9-9f40-45d0-a392-a6bcc655edb7"   # Samsung PSSD T7 → /mnt/t7
    mount: /mnt/t7
    fstype: ext4
    options: defaults,nofail
    roles: [fast, primary]   # one SSD fills both roles (docs/plans/drive-migration.md)
  - uuid: "7fdfb249-0d0e-46c9-af00-813ff465c77d"   # ST3500418AS → /mnt/backup
    mount: /mnt/backup
    fstype: ext4
    options: defaults,nofail
    roles: [backup]
