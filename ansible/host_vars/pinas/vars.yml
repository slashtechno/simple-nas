# THESE ARE THE REPO OWNER'S OWN SETTINGS (domains, SSH key, drive UUIDs). If you copied this repo, replace every
# value with yours, starting from ../vars.yml.example; see "Using this repo for your own hosts" in ansible/README.md.
# Settings for this one host. Options are explained in ../vars.yml.example and group_vars/all/vars.yml.example.

# --- Services ---
immich_enabled: true
copyparty_enabled: true
# The folders Copyparty serves, and who may use each (the logins are in vault_copyparty_accounts): /files for the admins, /collab for the
# friends, and pics' two folders (docs/services.md#copyparty-folders-and-logins).
copyparty_folders:
  files: {}
  collab: {access: "{{ vault_copyparty_collab_access }}"}   # who may use /collab is in the vault, with the user names
  pics-photos: {dir: "{{ pics_photos_dir }}", access: {pics: rwm}}
  pics-trash: {dir: "{{ pics_trash_dir }}", access: {pics: rwmd}}
gitea_enabled: true
homebridge_enabled: true
cloudflared_enabled: true
pics_enabled: true
garage_enabled: true    # needs post-deploy init (see docs/services.md#garage-s3)
crafty_enabled: true   # Minecraft server manager (Crafty Controller); needs RAM headroom, see docs/services.md#crafty-minecraft-servers
# No second copy of any video: Immich is a mirror and photo dump here, and the copies were 38 GB of HDR phone video.
immich_transcode_policy: disabled
# A backlog of smart search or face detection can otherwise take all the RAM (docs/memory.md#memory-limits).
immich_machine_learning_memory_limit: 1g
crafty_memory_limit: 2g   # all servers together; applies after the container is recreated post-reboot (docs/memory.md#memory-limits)
backup_local_enabled: true   # daily backup to the `backup` drive
usb_automount_enabled: true   # plug in a card or drive and it shows up under /drives in Copyparty
backup_status_enabled: true   # read-only web dashboard for backup status/snapshots
homepage_enabled: true   # start page with a tile for every service on every host
caddy_enabled: true   # names with real certificates for the services here
tinyauth_enabled: true   # a login in front of every web service here that has no login of its own: https://auth.pinas.slashtechno.com
dozzle_enabled: true   # container logs: https://dozzle.pinas.slashtechno.com
scrutiny_enabled: true   # drive health: https://scrutiny.pinas.slashtechno.com
# One Tinyauth login opens these (docs/auth-reference.md#sign-in-with-tinyauth-oidc, docs/services.md#copyparty-folders-and-logins).
immich_sso_enabled: true
immich_extra_origins: ["https://immich.slashtechno.com"]   # the tunnel hostname
gitea_sso_enabled: true
pics_sso_enabled: true
# Who may open pics (each is a full owner). The user names are in the vault (vault_pics_users).
service_users: {pics: "{{ vault_pics_users }}"}
# Names under pinas.slashtechno.com reach this host over the tailnet only, with Let's Encrypt certificates (docs/caddy-reference.md#web-addresses-and-https).
caddy_private_domains: [pinas.slashtechno.com]
# The root of the server: https://pinas.slashtechno.com opens the start page.
caddy_sites: {pinas.slashtechno.com: {import: tinyauth_forwarder, reverse_proxy: "homepage:3000"}}
homepage_host: pinas.slashtechno.com   # Homepage refuses any address but this one, the inventory name and the tailnet name

# 4 GB of RAM: compressed swap (docs/memory.md#swap). The Pi's memory cgroup is on by default (pi_enabled: auto).
zram_enabled: true
# Job concurrency in Immich, set on every deploy (docs/memory.md#immich).
immich_job_concurrency: {thumbnailGeneration: 1, metadataExtraction: 1, smartSearch: 1, faceDetection: 1, videoConversion: 1}

# Direct Ethernet link, a cable from the Pi to a laptop (explained in group_vars/all/defaults-direct-link.yml).
direct_link_enabled: true

# --- Drives ---
# What each drive is for is explained in ../vars.yml.example. The T7 fills fast and primary.
drives:
  - uuid: "302ffde9-9f40-45d0-a392-a6bcc655edb7"   # Samsung PSSD T7 → /mnt/t7
    mount: /mnt/t7
    fstype: ext4
    options: defaults,nofail
    roles: [fast, primary]   # one SSD fills both roles (docs/storage.md#examples)
    reserved_percent: 1      # Postgres, running as another user, fails once free space falls below the 5% default (docs/storage.md#reserved-space)
  - uuid: "d3c015db-9c24-4da3-a127-4ae02ef498b6"   # Seagate IronWolf Pro 6TB → /mnt/backup
    mount: /mnt/backup
    fstype: ext4
    options: defaults,nofail
    roles: [backup]
    reserved_percent: 1   # ext4 holds 5% back by default: 300 GB of this drive (docs/storage.md#reserved-space)

# Weekly offsite copy to Google Drive (docs/backups.md).
backup_cloud_enabled: true
restic_cloud_repository: "rclone:gdrive:/pi-nas-backups"

# --- Cloudflare Tunnel ---
# vault_cloudflared_api_token and vault_cloudflared_account_id are in group_vars/all/vault.yml,
# cloudflare_zones in group_vars/all/vars.yml: every host that runs a tunnel uses them.

# One entry per public hostname, with exactly two keys: hostname, and service (the internal Docker
# address). No `path:`. The hostname must contain one domain from cloudflare_zones (group_vars/all/vars.yml). Where a service
# has a private surface, it publishes two ports and the tunnel points at the guest one.
cloudflared_ingress:
  # pics' guest surface: share pages and the portfolio, with no owner routes in it. The owner app
  # stays on the Pi's LAN/tailnet port (pics_port); this file never forwards it.
  - hostname: pics.angad.me
    service: "http://pics:{{ pics_public_port }}"
  - hostname: immich.slashtechno.com
    service: "http://immich_server:2283"
  - hostname: git.slashtechno.com
    service: "http://gitea:3000"
  - hostname: copyparty.slashtechno.com
    service: "http://copyparty:3923"
  - hostname: s3.slashtechno.com
    # Caddy CORS proxy sits on 3900; it handles OPTIONS preflights and injects
    # Access-Control-Allow-Origin before forwarding to Garage internally.
    service: "http://garage-cors-proxy:3900"
