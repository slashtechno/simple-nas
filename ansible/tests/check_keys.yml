---
# Included by render.yml once per vars.yml. Fails if the file has a key that no example or role default
# declares, which is how a misspelled setting is caught.
- name: Read the keys of {{ real_file }}
  ansible.builtin.include_vars:
    file: "{{ real_file }}"
    name: real_vars

- name: Start the list of known keys
  ansible.builtin.set_fact:
    known_keys: []

- name: Add the keys of each example and role defaults file
  ansible.builtin.set_fact:
    known_keys: "{{ known_keys + (lookup('ansible.builtin.file', item) | from_yaml | default({}, true)).keys() | list }}"
  loop: "{{ [repo + '/group_vars/all/defaults.yml', repo + '/group_vars/all/vars.yml.example', repo + '/host_vars/vars.yml.example'] + defaults_files }}"

- name: Every key in {{ real_file | basename }} must be declared somewhere
  ansible.builtin.assert:
    that: (real_vars.keys() | list | difference(known_keys)) | length == 0
    fail_msg: "In {{ real_file }} but declared in no example or role defaults: {{ real_vars.keys() | list | difference(known_keys) }}"
