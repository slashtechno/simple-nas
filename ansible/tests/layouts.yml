---
# Checks each drive layout in tests/inventory.yml (the `layouts` hosts) against the example vars: the paths it resolves
# to, and that a role nobody claimed fails with a message naming it. Run by `just _test` after tests/render.yml.
# One host per drive layout. Only the all/ examples are loaded, so no host's own settings leak in.
- name: Check each drive layout
  hosts: layouts
  become: false
  gather_facts: false
  vars:
    repo: "{{ playbook_dir }}/.."
    ansible_user: pi
  tasks:
    - name: Load the shared defaults
      ansible.builtin.include_vars:
        dir: "{{ repo }}/group_vars/all"
        files_matching: "{{ shared_defaults_regex }}"

    - name: Load the all/ examples and the Backup, Common and Copyparty defaults
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "{{ repo }}/roles/backup/defaults/main.yml"
        - "{{ repo }}/roles/common/defaults/main.yml"
        - "{{ repo }}/roles/copyparty/defaults/main.yml"
        - "{{ repo }}/roles/tinyauth/defaults/main.yml"
        - "{{ repo }}/group_vars/all/derived.yml"
        - "{{ repo }}/group_vars/all/vars.yml.example"
        - "{{ repo }}/group_vars/all/vault.yml.example"
        - "{{ repo }}/group_vars/all/versions.yml"
        - "{{ repo }}/group_vars/all/services.yml"

    # After include_vars, which would reset drives to the example's empty list.
    - name: Give the host its fixture drives
      ansible.builtin.set_fact:
        drives: "{{ fixture_drives }}"

    # Every host loops over whole entries (site.yml's web check, Caddy, Homepage, teardown), so an entry must not need a
    # drive role to render: a host with no fast or primary drive still has to get through them.
    - name: Looping over every service entry needs no drive role
      ansible.builtin.debug:
        msg: "{{ item }}"
        verbosity: 4
      loop: "{{ services + web_services }}"
      loop_control:
        label: "{{ item.key }}"

    # The flags follow the fixture: local when it claims a backup drive, cloud when it says so.
    - name: Turn the backups on as the fixture says
      ansible.builtin.set_fact:
        backup_local_enabled: "{{ 'backup' not in expect.unclaimed }}"
        backup_cloud_enabled: "{{ expect.cloud | default(false) }}"
        restic_cloud_repository: "{{ 'rclone:gdrive:/test' if expect.cloud | default(false) else '' }}"

    - name: Add the fixture's own backup rules
      ansible.builtin.set_fact:
        restic_local_rules: "{{ restic_local_rules + expect.rules }}"
      when: expect.rules is defined

    - name: Encrypt the fixture's folders
      ansible.builtin.set_fact:
        encrypted_folders: "{{ expect.encrypted | default([]) }}"

    - name: Enable the fixture's services
      ansible.builtin.set_fact:
        "{{ item }}_enabled": true
      loop: "{{ expect.services | default([]) }}"

    - name: The paths follow the claimed roles
      vars:
        fixture_paths: "{{ expect.rules | default([]) | reject('match', '^- ') | list }}"
      ansible.builtin.assert:
        that:
          - restic_local_rules | reject('match', '^- ') | list == expect.local_paths + fixture_paths
          - restic_cache_dir == expect.cache_dir

    - name: Read each drive role
      ansible.builtin.set_fact:
        role_probe: "{{ lookup('vars', item ~ '_drive') }}"
      loop: [fast, primary, backup]
      register: role_probes
      ignore_errors: true   # noqa: ignore-errors (an unclaimed role is meant to fail here)

    - name: An unclaimed role fails with a message that names it; a claimed one does not fail
      ansible.builtin.assert:
        that:
          - (item.failed | default(false)) == (item.item in expect.unclaimed)
          - not item.failed | default(false) or item.item in item.msg
      loop: "{{ role_probes.results }}"
      loop_control:
        label: "{{ item.item }}"

    # Every layout renders the backup templates. A host without a backup drive skips the local-only ones,
    # which need the drive's path, and backs up its own data to the cloud instead.
    - name: Render the backup templates
      block:
        - name: Find the backup templates
          ansible.builtin.find:
            paths: "{{ repo }}/roles/backup/templates"
            patterns: ["*.j2"]
          register: backup_templates

        - name: Create the output directory
          ansible.builtin.file:
            path: "{{ out_dir }}/layouts/{{ inventory_hostname }}"
            state: directory
            mode: "0755"

        - name: Render them
          ansible.builtin.template:
            src: "{{ item.path }}"
            dest: "{{ out_dir }}/layouts/{{ inventory_hostname }}/{{ item.path | basename | regex_replace('\\.j2$', '') }}"
            mode: "0644"
          vars:
            local_only: '/(backup-restic-local\.sh|restic-check\.sh|restic-excludes-local\.txt)\.j2$'
          loop: >-
            {{ backup_templates.files if backup_local_enabled | bool
               else backup_templates.files | rejectattr('path', 'search', local_only) | list }}
          loop_control:
            label: "{{ item.path | basename }}"

        - name: Read the offsite script and path list
          ansible.builtin.slurp:
            src: "{{ out_dir }}/layouts/{{ inventory_hostname }}/{{ item }}"
          loop: [backup-restic-cloud.sh, backup-paths.txt, restic-excludes-cloud.txt]
          register: cloud_files

        # The offsite script refuses to run unless every data drive is mounted, and the backup drive when it is local.
        - name: The offsite backup follows the layout
          vars:
            offsite_script: "{{ cloud_files.results[0].content | b64decode }}"
            offsite_paths: "{{ cloud_files.results[1].content | b64decode }}"
            offsite_excludes: "{{ cloud_files.results[2].content | b64decode }}"
            # Every directory an enabled service leaves out of the backup (no_backup), and every folder inside its data
            # directories it leaves out (no_backup_in).
            enabled: "{{ services | selectattr('key', 'in', enabled_service_keys) | list }}"
            left_out: >-
              {%- set out = query('ansible.builtin.vars', *(enabled | map(attribute='no_backup', default=[]) | flatten | select | list)) | list -%}
              {%- for entry in enabled | map(attribute='no_backup_in', default={}) -%}
              {%- for setting, folder in entry.items() -%}
              {%- set _ = out.append(lookup('ansible.builtin.vars', setting) ~ '/' ~ folder) -%}
              {%- endfor -%}
              {%- endfor -%}
              {{ out }}
          ansible.builtin.assert:
            that:
              - >-
                offsite_script | regex_findall('if ! mountpoint -q \\S+/\\.; then') | length
                == data_drive_mounts | length + (1 if backup_local_enabled | bool else 0) + encrypted_folders | length
              - "not offsite_paths is search('(?m)^- ')"
              - left_out | select('in', offsite_excludes) | list | length == left_out | length

        - name: Read the local exclude list
          ansible.builtin.slurp:
            src: "{{ out_dir }}/layouts/{{ inventory_hostname }}/restic-excludes-local.txt"
          register: local_excludes_file
          when: backup_local_enabled | bool

        - name: The local exclude list carries the host's own rules
          vars:
            fixture_excludes: "{{ expect.rules | default([]) | select('match', '^- ') | map('regex_replace', '^- ', '') | list }}"
            local_excludes: "{{ local_excludes_file.content | b64decode }}"
          ansible.builtin.assert:
            that: "fixture_excludes | select('in', local_excludes) | list | length == fixture_excludes | length"
          when: backup_local_enabled | bool

        - name: The repository is left out of the local backup
          vars:
            local_excludes: "{{ local_excludes_file.content | b64decode }}"
          ansible.builtin.assert:
            that:
              - "restic_repo_path in local_excludes"
          when: backup_local_enabled | bool

        - name: Every service's data is inside a locally backed-up path
          ansible.builtin.import_tasks: ../roles/backup/tasks/check_coverage.yml
          when: backup_local_enabled | bool

        # Every service with data turned on, on each layout that has a fast and a primary role (a layout without one cannot
        # resolve the paths). On a single drive the fast and primary folders are one folder, which is where a part could collide.
        - name: No data directory is the same as, or inside, another
          ansible.builtin.include_tasks: ../check_data_dirs.yml
          vars:
            enabled_service_keys: "{{ services | selectattr('data', 'defined') | map(attribute='key') | list }}"
          when: "'fast' in drive_mounts and 'primary' in drive_mounts"

        - name: A data directory inside another is refused
          when: "'fast' in drive_mounts and 'primary' in drive_mounts"
          block:
            - name: Put Immich's photos inside its Postgres folder
              ansible.builtin.include_tasks: ../check_data_dirs.yml
              vars:
                enabled_service_keys: [immich]
                immich_photos_dir: "{{ immich_postgres_dir }}/photos"
            - name: The check must have failed
              ansible.builtin.fail:
                msg: check_data_dirs.yml accepted a data directory inside another
          rescue:
            - name: Only the data directory check may fail here, naming both settings
              ansible.builtin.assert:
                that:
                  - "'immich_photos_dir' in ansible_failed_result.msg"
                  - "'immich_postgres_dir' in ansible_failed_result.msg"

        - name: A data directory outside every backed-up path is refused
          when: backup_local_enabled | bool
          block:
            # include_tasks, not import_tasks: the vars below must override the host's values at run time, which a static import does not do.
            - name: Move Immich's photos to an uncovered path
              ansible.builtin.include_tasks: ../roles/backup/tasks/check_coverage.yml
              vars:
                immich_enabled: true
                immich_photos_dir: /not-backed-up/photos
            - name: The coverage check must have failed
              ansible.builtin.fail:
                msg: check_coverage.yml accepted a directory outside restic_local_rules
          rescue:
            - name: Only the coverage check may fail here
              ansible.builtin.assert:
                that: "'/not-backed-up/photos' in ansible_failed_result.msg"

        - name: An encrypted folder outside every backed-up path is refused
          when: backup_local_enabled | bool
          block:
            - name: Encrypt a folder on a drive the backup does not cover
              ansible.builtin.include_tasks: ../roles/backup/tasks/check_coverage.yml
              vars:
                encrypted_pairs: [{mount: /not-backed-up/vault, cipher: /not-backed-up/.vault.gocryptfs}]
                encrypted_folders: [/not-backed-up/vault]
            - name: The coverage check must have failed
              ansible.builtin.fail:
                msg: check_coverage.yml accepted an encrypted folder outside restic_local_rules
          rescue:
            - name: Only the coverage check may fail here
              ansible.builtin.assert:
                that: "'/not-backed-up/vault' in ansible_failed_result.msg"

        - name: Add a "- <directory>" rule for a directory left out on purpose
          ansible.builtin.set_fact:
            rules_with_opt_out: "{{ restic_local_rules + ['- /not-backed-up/photos'] }}"
          when: backup_local_enabled | bool

        # include_tasks for the same reason as above.
        - name: That rule makes the coverage check accept the directory
          ansible.builtin.include_tasks: ../roles/backup/tasks/check_coverage.yml
          vars:
            immich_enabled: true
            immich_photos_dir: /not-backed-up/photos
            restic_local_rules: "{{ rules_with_opt_out }}"
          when: backup_local_enabled | bool

        - name: The local exclude list skips the restic password and the rclone token
          ansible.builtin.assert:
            that:
              - (restic_password_file ~ '*') in (local_excludes_file.content | b64decode)   # also the copy a deploy keeps
              - "'/.config/rclone' in (local_excludes_file.content | b64decode)"
          when: backup_local_enabled | bool

        # The dashboard reads one status file per job; each script writes it at the start and on exit.
        - name: The scripts write the status files the dashboard reads
          vars:
            out: "{{ out_dir }}/layouts/{{ inventory_hostname }}"
            app: "{{ lookup('ansible.builtin.file', repo ~ '/roles/backup_status/files/app.py') }}"
            cloud_script: "{{ lookup('ansible.builtin.file', out ~ '/backup-restic-cloud.sh') }}"
          ansible.builtin.assert:
            that:
              - "(backup_logs_dir ~ '/restic-cloud.status.json') in cloud_script"
              - "'restic-cloud.status.json' in app"
              - "'trap ' in cloud_script and 'write_status failed null null' in cloud_script"
              # rclone reads its remote from rclone_config_dir, which a host can move into an encrypted folder.
              - "('RCLONE_CONFIG=\"${RCLONE_CONFIG:-' ~ rclone_config_dir ~ '/rclone.conf}\"') in cloud_script"
              - "'=== Complete' not in app"
            quiet: true

        - name: The local and check scripts write their status files too
          vars:
            out: "{{ out_dir }}/layouts/{{ inventory_hostname }}"
            app: "{{ lookup('ansible.builtin.file', repo ~ '/roles/backup_status/files/app.py') }}"
          ansible.builtin.assert:
            that:
              - "(backup_logs_dir ~ '/restic-local.status.json') in lookup('ansible.builtin.file', out ~ '/backup-restic-local.sh')"
              - "(backup_logs_dir ~ '/restic-check.status.json') in lookup('ansible.builtin.file', out ~ '/restic-check.sh')"
              - "'restic-local.status.json' in app and 'restic-check.status.json' in app"
              # The dashboard reads the logs directory through this read-only mount.
              - "(backup_logs_dir ~ ':/data/logs:ro') in lookup('ansible.builtin.file', out_dir ~ '/backup_status/docker-compose.yml')"
            quiet: true
          when: backup_local_enabled | bool

        - name: Send nothing unless a destination is named
          ansible.builtin.assert:
            that: system_alert_to == ''
            quiet: true

        # Rendered with and without a system alert destination (tests/test_alert_sh.py runs the script). The shell check runs on every output.
        # set_fact, not task vars: include_vars set the alert settings and outranks them. Keep this last.
        - name: Render alert.sh with no ntfy topic
          ansible.builtin.template:
            src: "{{ repo }}/roles/common/templates/alert.sh.j2"
            dest: "{{ out_dir }}/layouts/{{ inventory_hostname }}/alert.sh"
            mode: "0644"

        - name: Turn on ntfy alerts for this host
          ansible.builtin.set_fact:
            ntfy_destinations:
              local: {url: "http://localhost:8090/alerts", token: "tk_layouts"}
            system_alert_to: local

        - name: Render alert.sh with an ntfy topic set
          ansible.builtin.template:
            src: "{{ repo }}/roles/common/templates/alert.sh.j2"
            dest: "{{ out_dir }}/layouts/{{ inventory_hostname }}/alert-with-ntfy.sh"
            mode: "0644"

        - name: Read both alert.sh renders
          ansible.builtin.slurp:
            src: "{{ out_dir }}/layouts/{{ inventory_hostname }}/{{ item }}"
          loop: [alert.sh, alert-with-ntfy.sh]
          register: alert_scripts

        - name: Only the ntfy render sends anything, and never lets a failed send fail the job
          ansible.builtin.assert:
            that:
              - >-
                "system) url='';" in (alert_scripts.results[0].content | b64decode)
              - "'system) url=http://localhost:8090/alerts;' in (alert_scripts.results[1].content | b64decode)"
              - "(alert_token_dir ~ '/system') in (alert_scripts.results[1].content | b64decode)"
              - "'the alert could not be sent to ntfy' in (alert_scripts.results[1].content | b64decode)"

        # A hosted topic with no login: an empty token gives a script with no Authorization header.
        - name: Leave the ntfy token out
          ansible.builtin.set_fact:
            ntfy_destinations:
              local: {url: "http://localhost:8090/alerts"}

        - name: Render alert.sh with no token
          ansible.builtin.template:
            src: "{{ repo }}/roles/common/templates/alert.sh.j2"
            dest: "{{ out_dir }}/layouts/{{ inventory_hostname }}/alert-no-token.sh"
            mode: "0644"

        - name: Without a token the script sends no Authorization header
          ansible.builtin.assert:
            that:
              - >-
                "system) url=http://localhost:8090/alerts; token_file='' ;;"
                in lookup('ansible.builtin.file', out_dir ~ '/layouts/' ~ inventory_hostname ~ '/alert-no-token.sh')
            quiet: true
