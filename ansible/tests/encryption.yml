---
# Each way an entry in `encrypted_folders` can be wrong must fail the deploy with a message naming it, and a good list
# must pass (roles/encryption/tasks/check.yml). Run by `just _test`.
- name: Check the encrypted folder asserts
  hosts: render-full
  become: false
  gather_facts: false
  vars:
    repo: "{{ playbook_dir }}/.."
    ansible_user: pi
  tasks:
    - name: Load the shared defaults and the derived values
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "{{ repo }}/group_vars/all/defaults.yml"
        - "{{ repo }}/group_vars/all/derived.yml"
        - "{{ repo }}/roles/encryption/defaults/main.yml"

    - name: A good list passes
      ansible.builtin.include_tasks: ../roles/encryption/tasks/check.yml
      vars:
        encrypted_folders: [/mnt/data/photos/, /mnt/data/appdata]
        unlock_page_public_key: ssh-ed25519 AAAAC3Nza unlock-page

    - name: The same folders pass when the page does not run on this host
      ansible.builtin.include_tasks: ../roles/encryption/tasks/check.yml
      vars:
        encrypted_folders: [/mnt/data/appdata]
        unlock_page_enabled: false
        caddy_data_dir: /mnt/data/appdata/caddy
        tinyauth_data_dir: /mnt/data/appdata/tinyauth

    - name: A bad list is refused, and the message names the problem
      ansible.builtin.include_tasks: expect_encryption_failure.yml
      vars:
        encrypted_folders: "{{ case.folders }}"
        docker_data_root: "{{ case.docker_data_root | default('') }}"
        unlock_page_enabled: "{{ case.page | default(false) }}"
        caddy_data_dir: /mnt/data/appdata/caddy
        tinyauth_data_dir: /mnt/data/appdata/tinyauth
        unlock_page_public_key: "{{ case.key | default('') }}"
        expect: "{{ case.expect }}"
      loop:
        - {folders: [photos], expect: must be an absolute path}
        - {folders: [/], expect: must be an absolute path}
        - {folders: [/mnt/data/photos, /mnt/data/photos], expect: listed twice}
        - {folders: [/mnt/data, /mnt/data/photos], expect: holds another listed folder}
        - {folders: [/opt], expect: /opt/services/scripts}
        - {folders: [/opt/services], expect: /opt/services/scripts}
        - {folders: [/home], expect: /home/pi}
        - {folders: [/var], expect: /var/lib}
        - {folders: [/var/lib/docker], expect: /var/lib/docker}
        - {folders: [/mnt/docker], docker_data_root: /mnt/docker/data, expect: /mnt/docker/data}
        # The unlock page on this host: a folder that holds Caddy's or Tinyauth's data would lock the page out of its own login.
        - {folders: [/mnt/data/appdata], page: true, expect: /mnt/data/appdata/caddy}
        - {folders: [/mnt/data/appdata], page: true, expect: /mnt/data/appdata/tinyauth}
        - {folders: [/opt/services/unlock-page], page: true, expect: /opt/services/unlock-page}
        - {folders: [/mnt/data/photos], key: "not a key", expect: unlock_page_public_key}
        - {folders: [/mnt/data/photos], key: "ssh-ed25519 AAAA x\nssh-ed25519 BBBB y", expect: unlock_page_public_key}
      loop_control:
        loop_var: case
        label: "{{ case.folders }}"
