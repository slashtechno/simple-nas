---
# Renders every role template against the example vars and checks the result.
# Runs on your machine only (no Pi, no vault): `just _test` runs this, then
# shellchecks the rendered scripts. It catches:
#   - a template using a variable that isn't defined in the shared defaults files, vars.yml.example,
#     vault.yml.example, versions.yml, services.yml or the role's defaults/
#   - a key in a vars.yml (group_vars/all, host_vars/<host>) that no example or role defaults
#     file declares
#   - template syntax errors
# The Homepage lists every host in `servers`, so the second host needs its settings before the first renders.
- name: Prepare the second server
  hosts: render-peer
  become: false
  gather_facts: false
  tasks:
    - name: Load the shared defaults
      ansible.builtin.include_vars:
        dir: "{{ playbook_dir }}/../group_vars/all"
        files_matching: "{{ shared_defaults_regex }}"

    - name: Load the values worked out from them
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/all/derived.yml"

    - name: Turn on two services
      ansible.builtin.set_fact:
        dockge_enabled: true
        ntfy_enabled: true

# The roles pair a hostname with its Cloudflare zone through cloudflare_zone_ids_of_name (derived.yml). This host
# renders nothing else, so it can have its own zones.
- name: Check zone matching
  hosts: render-peer
  become: false
  gather_facts: false
  tasks:
    - name: Give the host test zones
      ansible.builtin.set_fact:
        cloudflare_zones: {example.com: id-1, ample.com: id-2, me.com: id-3}

    - name: A hostname matches only a zone it equals or ends with after a dot
      vars:
        zone_name: "{{ item.name }}"
      ansible.builtin.assert:
        that: cloudflare_zone_ids_of_name == item.zones
        quiet: true
      loop:
        - {name: x.example.com, zones: [id-1]}
        - {name: example.com, zones: [id-1]}
        - {name: a.b.ample.com, zones: [id-2]}
        - {name: notexample.com, zones: []}
        - {name: home.com, zones: []}

- name: Render all role templates against the example vars
  hosts: render-full
  become: false
  gather_facts: false
  vars:
    repo: "{{ playbook_dir }}/.."
    # Normally set by the inventory or by a task at deploy time.
    ansible_user: pi
    ansible_facts: {mounts: []}   # gathered on a real host
  tasks:
    - name: Find every role's defaults and templates
      ansible.builtin.find:
        paths: "{{ repo }}/roles"
        patterns: ["main.yml", "*.j2"]
        recurse: true
      register: found

    - name: Split into defaults and constants files (roles/*/defaults and roles/*/vars) and templates
      ansible.builtin.set_fact:
        defaults_files: "{{ found.files | map(attribute='path') | select('search', '/(defaults|vars)/main.yml$') | sort }}"
        template_files: "{{ found.files | map(attribute='path') | select('search', '/templates/[^/]*\\.j2$') | sort }}"
        shared_defaults_files: "{{ query('ansible.builtin.fileglob', repo ~ '/group_vars/all/*.yml') | select('search', shared_defaults_regex) | sort }}"

    # A glob that silently matches nothing would make this whole test pass while testing nothing.
    - name: Make sure the search found something
      ansible.builtin.assert:
        that:
          - defaults_files | length > 0
          - template_files | length > 0
          - shared_defaults_files | length > 0

    - name: Load the example vars, the vault example, the versions (role defaults load first, because they have the lowest precedence)
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop: >-
        {{ defaults_files + shared_defaults_files
           + [repo + '/group_vars/all/derived.yml',
              repo + '/group_vars/all/vars.yml.example',
              repo + '/group_vars/all/versions.yml',
              repo + '/group_vars/all/services.yml',
              repo + '/host_vars/vars.yml.example',
              repo + '/host_vars/vault.yml.example',
              repo + '/group_vars/all/vault.yml.example'] }}

    # Every service on, so every template renders. Branches behind other settings (Copyparty's folders, extra ports
    # and volumes, USB volumes; Crafty Bedrock; the Gitea runner; the optional Pics lines) are
    # switched on in the tasks after this one, and the render step asserts their lines reached the output.
    - name: Enable every service
      ansible.builtin.set_fact:
        "{{ item }}_enabled": true
      loop: "{{ services | map(attribute='key') | list + ['backup_local', 'backup_cloud'] }}"

    - name: The default folder list is one folder for the admins' files
      ansible.builtin.assert:
        that:
          - "copyparty_folders == {'files': {}}"
        quiet: true

    - name: Turn on Copyparty's optional volumes and listeners
      ansible.builtin.set_fact:
        # one list of logins: the admin and the people and the app have a password, owner signs in through Tinyauth only
        vault_copyparty_accounts: "{{ vault_copyparty_accounts + [{'user': 'owner', 'admin': true}] }}"
        # people and an app in one model: friend1 and friend2 write in collab, friend1 only reads team, and pics has its two folders
        copyparty_folders:
          files: {root: true, access: {friend2: r}}
          collab: {access: {friend1: rwmd, friend2: rwmd}}
          team: {access: {friend2: A, friend1: r}}
          # * is everyone and @acct is every login: both render as logins
          public: {access: {"*": r, "@acct": w}}
          # a dir written out: set_fact resolves it now, before this test host has a primary drive
          services/pics/photos: {dir: /mnt/primary/appdata/pics/photos, access: {pics: rwm}}
          services/pics/trash: {dir: /mnt/primary/appdata/pics/trash, access: {pics: rwmd}}
        copyparty_extra_conf: "[global]\n  sftp: 3922"
        copyparty_extra_ports: ["3922:3922"]
        copyparty_extra_volumes: ["/mnt/fast/shared:/fast:ro"]
        usb_automount_enabled: true

    - name: Turn on the optional settings that change a template
      ansible.builtin.set_fact:
        crafty_bedrock_enabled: true
        homepage_links: [{name: Example, href: "https://example.com", description: "a: b", icon: mdi-star, monitor: true}]
        vault_gitea_runner_token: "runner$token"
        vault_ntfy_token: "tk_a$b"
        pics_artist: Render Test
        pics_links: [{text: example.com, url: "https://example.com", watermark: true}]
        caddy_private_domains: [pi4.example.com, second.example.com]
        caddy_sites:
          homepage.pi4.example.com: {reverse_proxy: "homepage:3000"}
          "gh.pi4.example.com": {redir: "https://github.com{uri}"}
        vault_tinyauth_users: [{name: owner, password: "pass$word", email: "owner@real.example"}, {name: second, password: second, totp: JBSWY3DPEHPK3PXP}]
        tinyauth_environment: {TINYAUTH_OAUTH_PROVIDERS_GITHUB_CLIENTSECRET: "s$ecret"}
        immich_port: ""
        immich_extra_origins: ["https://photos.example.org"]
        pics_extra_origins: ["http://nas:8100"]
        copyparty_port: ""
        # Copyparty's single sign-on, with a $ in the secret to check the compose escaping.
        copyparty_sso_enabled: true
        vault_copyparty_idp_key: "idp$key"
        # Gitea's and Immich's sign-in through Tinyauth, with a $ in each secret to check the escaping.
        gitea_sso_enabled: true
        immich_sso_enabled: true
        pics_sso_enabled: true
        service_users: {pics: [owner, second], dozzle: [owner], backup_status: [owner]}
        vault_pics_oidc_secret: "pics$secret"
        vault_gitea_oidc_secret: "gitea$secret"
        vault_immich_oidc_secret: "immich$secret"
        dockge_port: ""
        scrutiny_devices: [/dev/sdb]   # the render test replaces the host's smartctl scan
        cloudflare_api_token: render-test-token
        caddy_dns_api_token: render-dns-token   # Caddy's token is its own setting, not the account token
        encrypted_folders: [/mnt/primary/immich/]   # the trailing slash is tolerated


    - name: Send every alert to the ntfy on this host
      ansible.builtin.set_fact:
        ntfy_destinations:
          home: {url: "http://pi4:8090/alerts", token: "{{ vault_ntfy_token }}"}
        system_alert_to: home
        scrutiny_alert_to: home
        pics_alert_to: home
        unlock_alert_to: home
    - name: Turn on the offsite backup
      ansible.builtin.set_fact:
        restic_cloud_repository: "rclone:gdrive:/render-full-backups"

    - name: Read site.yml
      ansible.builtin.slurp:
        src: "{{ repo }}/site.yml"
      register: site_yml

    # An undeclared flag would make the role silently skip (or fail) instead of being off by default.
    - name: Every flag site.yml tests is declared in group_vars/all/defaults-flags.yml
      ansible.builtin.assert:
        that: "(item ~ '_enabled') in lookup('ansible.builtin.file', repo + '/group_vars/all/defaults-flags.yml') | from_yaml"
        fail_msg: "site.yml tests {{ item }}_enabled, which group_vars/all/defaults-flags.yml does not declare."
      loop: "{{ site_yml.content | b64decode | regex_findall('(\\w+)_enabled') | unique }}"

    # After include_vars, which would reset drives to the example's empty list.
    - name: Claim every drive role on its own drive
      ansible.builtin.set_fact:
        drives:
          - {uuid: "4444-DDDD", mount: /mnt/fast, roles: [fast]}
          - {uuid: "5555-EEEE", mount: /mnt/primary, roles: [primary]}
          - {uuid: "6666-FFFF", mount: /mnt/backup, fstype: ext4, options: "defaults,nofail", roles: [backup]}

    # Written out, not derived: the drives above claim fast and primary on their own drives.
    - name: The data drives are the fast and primary drives, not the backup drive
      ansible.builtin.assert:
        that: data_drive_mounts == ['/mnt/fast', '/mnt/primary']
        quiet: true

    # geerlingguy.docker writes this dict to /etc/docker/daemon.json on every host, so a typo here breaks Docker.
    # set_fact, not task vars: include_vars set docker_data_root and outranks them. The value is put back after.
    - name: Keep the Docker data root the test started with
      ansible.builtin.set_fact:
        docker_data_root_before: "{{ docker_data_root }}"

    - name: The Docker daemon options carry data-root only when docker_data_root is set
      ansible.builtin.set_fact:
        docker_data_root: ""

    - name: Check the options without a data root
      ansible.builtin.assert:
        that:
          - docker_daemon_options['log-driver'] == 'json-file'
          - docker_daemon_options['log-opts'] == docker_log_opts
          - "'data-root' not in docker_daemon_options"
        quiet: true

    - name: Set a data root
      ansible.builtin.set_fact:
        docker_data_root: /mnt/fast/docker-root

    - name: Check the options with a data root
      ansible.builtin.assert:
        that: docker_daemon_options['data-root'] == '/mnt/fast/docker-root'
        quiet: true

    - name: Put the Docker data root back
      ansible.builtin.set_fact:
        docker_data_root: "{{ docker_data_root_before }}"

    # Each service is written down in group_vars/all/services.yml, and these checks name the line another file is
    # missing. Roles that are not a service are listed here on purpose.
    - name: Find the roles
      ansible.builtin.find:
        paths: "{{ repo }}/roles"
        file_type: directory
        depth: 1
      register: role_dirs

    - name: Every role is a service in services.yml or a role that is not a service
      vars:
        not_services:
          - backup
          - cloudflare_zone_records
          - common
          - compose_service
          - connectivity_watchdog
          - encryption
          - github_clone
          - network
          - pi
          - storage
          - tailscale
          - zram
        role_dir_names: "{{ role_dirs.files | map(attribute='path') | map('basename') | list }}"
        unlisted: "{{ role_dir_names | difference(services | map(attribute='key') | list) | difference(not_services) }}"
      ansible.builtin.assert:
        that: unlisted | length == 0
        fail_msg: >-
          roles/{{ unlisted | join(', roles/') }} is neither a service in group_vars/all/services.yml (add an entry)
          nor a role listed in not_services in tests/render.yml.
        quiet: true

    - name: Every service is deployed by site.yml with its tag and its flag
      vars:
        site_tasks: "{{ (site_yml.content | b64decode | from_yaml)[0].tasks }}"
        deploys: "{{ site_tasks | selectattr('tags', 'defined') | selectattr('tags', 'contains', item.key) | list }}"
      ansible.builtin.assert:
        that:
          - deploys | length == 1
          - deploys[0]['ansible.builtin.import_role'].name == item.key
          - deploys[0].when == item.key ~ '_enabled | bool'
        fail_msg: >-
          site.yml needs one task for {{ item.key }}: import_role name {{ item.key }}, tags [{{ item.key }}],
          when: {{ item.key }}_enabled | bool
        quiet: true
      loop: "{{ services }}"
      loop_control:
        label: "{{ item.key }}"

    # The vault names are written out in services.yml, so tools/check_vars.py checks they are documented; the switch
    # name is built from the key, so check it here.
    - name: A service with oidc has its sso switch in the shared defaults files
      vars:
        shared_defaults: "{{ query('ansible.builtin.file', *shared_defaults_files) | map('from_yaml') | list | combine }}"
      ansible.builtin.assert:
        that: item.key ~ '_sso_enabled' in shared_defaults
        fail_msg: "{{ item.key }} has oidc, so {{ item.key }}_sso_enabled must be in the shared defaults files."
        quiet: true
      loop: "{{ services | selectattr('oidc', 'defined') | list }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Every service has its flag, and a web service its port and subdomain, in the shared defaults files
      vars:
        shared_defaults: "{{ query('ansible.builtin.file', *shared_defaults_files) | map('from_yaml') | list | combine }}"
        # Garage's web UI and the unlock page have no port setting: Tinyauth is their only way in.
        needed: >-
          {{ [item.key ~ '_enabled']
             + ([item.key ~ '_port'] if item.icon is defined and item.port is not defined and item.key not in ['garage', 'unlock_page'] else [])
             + ([item.key ~ '_subdomain'] if item.icon is defined and item.port is not defined else []) }}
      ansible.builtin.assert:
        that: needed | difference(shared_defaults.keys()) | length == 0
        fail_msg: the shared defaults files in group_vars/all/ need {{ needed | difference(shared_defaults.keys()) }} (with a comment above each).
        quiet: true
      loop: "{{ services }}"
      loop_control:
        label: "{{ item.key }}"

    # The expected keys are written out by hand, so a dump_required dropped from an entry by mistake fails here; update them when one is added.
    - name: Only the enabled services that need a dump are in dump_service_keys
      ansible.builtin.assert:
        that: dump_service_keys | sort == (['garage', 'gitea', 'immich'] | select('in', enabled_service_keys) | list | sort)
        fail_msg: dump_service_keys must be the enabled entries with dump_required in services.yml; update the list in tests/render.yml
        quiet: true

    - name: Every service has a row in docs/services.md
      ansible.builtin.assert:
        that: "('roles/' ~ item.key) in lookup('ansible.builtin.file', repo + '/../docs/services.md')"
        fail_msg: docs/services.md needs a row naming `roles/{{ item.key }}` in its table.
        quiet: true
      loop: "{{ services }}"
      loop_control:
        label: "{{ item.key }}"

    # A data entry that names a setting nobody defines fails here with "undefined"; one that resolves to a
    # relative path would make the backup coverage check and teardown act on the wrong place.
    - name: Every data directory of every service is an absolute path
      vars:
        dirs: "{{ ((item.data | default([])) + (item.no_backup | default([])) + (item.keep | default([]))) | select | list }}"
        paths: "{{ query('ansible.builtin.vars', *dirs) }}"
      ansible.builtin.assert:
        that: paths | reject('match', '^/') | list | length == 0
        fail_msg: "{{ item.key }} has data directories that are not absolute paths: {{ paths }}"
        quiet: true
      loop: "{{ services }}"
      loop_control:
        label: "{{ item.key }}"

    # services.yml and defaults-data-dirs.yml must name the same settings. A setting missing from services.yml is skipped by
    # the backup coverage check and by teardown. A data directory defined in a role's defaults is not visible to them.
    - name: Every data directory setting is named in services.yml, and every name there has a default
      vars:
        defined: >-
          {{ (lookup('ansible.builtin.file', repo ~ '/group_vars/all/defaults-data-dirs.yml') | from_yaml).keys()
             | difference(['fast_appdata_dir', 'primary_appdata_dir']) | list }}
        named: >-
          {{ lookup('ansible.builtin.file', repo ~ '/group_vars/all/services.yml') | regex_replace('(?m)^\s*#.*$', '')
             | regex_findall('[a-z0-9_]+_(?:dir|location)\b') | unique | list }}
      ansible.builtin.assert:
        that:
          - defined | difference(named) == []
          - named | difference(defined) == []
        fail_msg: >-
          defaults-data-dirs.yml and services.yml differ: only in defaults {{ defined | difference(named) }},
          only in services.yml {{ named | difference(defined) }}
        quiet: true

    # The layout rule (defaults-data-dirs.yml): a service's folder is {{ fast_appdata_dir }}/<key> or {{ primary_appdata_dir }}/<key>, with
    # parts as subfolders. Only the owner's own folders are named plainly. Read as raw text, so a path is not resolved.
    - name: Every data directory is under fast_appdata_dir or primary_appdata_dir in its service's folder, or is an owner folder
      vars:
        owner_folders: [dockge_stacks_dir, copyparty_shared_dir]
        # The service key is the first word of the setting name; a service key with an underscore needs a rule here first.
        service_folder: "{{ item.key.split('_')[0] }}"
        under_parent: "{{ item.value is match('^\\{\\{ (fast|primary)_appdata_dir \\}\\}/' ~ service_folder ~ '(/[a-z0-9-]+)?$') }}"
      ansible.builtin.assert:
        that: item.key in owner_folders or under_parent
        fail_msg: >-
          {{ item.key }}: {{ item.value }} breaks the layout rule. Use {{ '{{ fast_appdata_dir }}' }}/{{ service_folder }}[/part]
          or {{ '{{ primary_appdata_dir }}' }}/{{ service_folder }}[/part]; a new owner folder is added to owner_folders here.
        quiet: true
      loop: >-
        {{ (lookup('ansible.builtin.file', repo ~ '/group_vars/all/defaults-data-dirs.yml') | from_yaml) | dict2items
           | rejectattr('key', 'in', ['fast_appdata_dir', 'primary_appdata_dir']) | list }}
      loop_control:
        label: "{{ item.key }}"

    - name: No role's defaults define a data directory setting
      vars:
        defined: "{{ (lookup('ansible.builtin.file', repo ~ '/group_vars/all/defaults-data-dirs.yml') | from_yaml).keys() | list }}"
        role_keys: "{{ (lookup('ansible.builtin.file', item) | from_yaml | default({}, true)).keys() | list }}"
      ansible.builtin.assert:
        that: role_keys | intersect(defined) == []
        fail_msg: "{{ item }} defines {{ role_keys | intersect(defined) }}: data directory settings belong in group_vars/all/defaults-data-dirs.yml"
        quiet: true
      loop: "{{ query('ansible.builtin.fileglob', repo ~ '/roles/*/defaults/main.yml') }}"
      loop_control:
        label: "{{ item | dirname | dirname | basename }}"

    # teardown.yml builds each service's data_paths from the same entries: the stacks are the owner's and stay, the
    # database and hist directories that the backup skips go.
    - name: Teardown deletes the right directories
      vars:
        by_key: "{{ dict(services | map(attribute='key') | zip(services)) }}"
        names: "{{ ((by_key[item.key].data | default([])) + (by_key[item.key].no_backup | default([]))) | select | list }}"
        deleted: "{{ query('ansible.builtin.vars', *names) }}"
      ansible.builtin.assert:
        that:
          - item.key != 'dockge' or deleted == [dockge_data_dir]
          - item.key != 'copyparty' or copyparty_hist_dir in deleted
          # collab names no dir, so it lives in copyparty_shared_dir, which is then a data directory
          - item.key != 'copyparty' or copyparty_shared_dir in deleted
          - item.key != 'immich' or immich_postgres_dir in deleted
          - deleted | length == deleted | unique | length
        quiet: true
      loop: "{{ services }}"
      loop_control:
        label: "{{ item.key }}"

    # The two lists teardown.yml prints before it asks for confirmation: the same expressions as its delete_paths and keep_paths.
    - name: Teardown names what it deletes and what stays
      vars:
        selected_services: "{{ services | selectattr('key', 'in', ['dockge', 'copyparty']) | list }}"
        delete_names: >-
          {{ (selected_services | map(attribute='data', default=[]) | flatten + selected_services | map(attribute='no_backup', default=[]) | flatten)
             | select | list }}
        delete_paths: "{{ query('ansible.builtin.vars', *delete_names) | map('regex_replace', '/+$', '') | list }}"
        keep_paths: "{{ query('ansible.builtin.vars', *(selected_services | map(attribute='keep', default=[]) | flatten | select | list)) }}"
      ansible.builtin.assert:
        that:
          - dockge_data_dir in delete_paths
          - copyparty_hist_dir in delete_paths
          - dockge_stacks_dir not in delete_paths
          - keep_paths == [dockge_stacks_dir]
        quiet: true

    # teardown.yml refuses remove_data when a data folder is, or holds, an encrypted folder (docs/encryption.md#turning-it-off).
    # The same selection of data settings and the same comparison, with the folder above pics' photos listed with a trailing slash.
    - name: List the folder above pics' photos as encrypted, with a trailing slash
      ansible.builtin.set_fact:
        encrypted_folders: ["{{ pics_photos_dir | dirname }}/"]

    - name: Teardown finds pics' photos inside it
      vars:
        selected: "{{ services | selectattr('key', 'in', ['pics']) | list }}"
        names: "{{ (selected | map(attribute='data', default=[]) | flatten + selected | map(attribute='no_backup', default=[]) | flatten) | select | list }}"
        paths: "{{ query('ansible.builtin.vars', *names) | map('regex_replace', '/+$', '') | list }}"
      ansible.builtin.assert:
        that: item[0] == item[1] or item[0].startswith(item[1] ~ '/') or item[1].startswith(item[0] ~ '/')
        quiet: true
      loop: "{{ paths | product(encrypted_pairs | map(attribute='mount') | list) | list }}"
      loop_control:
        label: "{{ item[0] }}"
      when: item[0] == pics_photos_dir

    - name: Put the encrypted folder of the fixture back
      ansible.builtin.set_fact:
        encrypted_folders: [/mnt/primary/immich/]

    - name: Every service's compose directory is the one its role deploys to
      vars:
        deployed_by: >-
          {{ lookup("ansible.builtin.pipe", "grep -rlE 'services_dir }}/" ~ item.compose ~ "([^a-z0-9_-]|$)|compose_service_name: " ~ item.compose
             ~ "([^a-z0-9_-]|$)' " ~ repo ~ "/roles " ~ repo ~ "/site.yml || true") }}
      ansible.builtin.assert:
        that: deployed_by | length > 0
        fail_msg: "No role or site.yml deploys {{ item.key }} to {{ services_dir }}/{{ item.compose }}: fix `compose` in services.yml."
        quiet: true
      loop: "{{ services | selectattr('compose', 'defined') | list }}"
      loop_control:
        label: "{{ item.key }}"

    # Tinyauth's client id is the service key (roles/tinyauth/templates/docker-compose.yml.j2); each app is told the same
    # id in its own role, and a changed id orphans the accounts linked to it.
    - name: Each app uses its service key as its Tinyauth client id
      vars:
        app_id_lines:
          pics: ["roles/pics/templates/pics.env.j2", "HUB_OIDC_CLIENT_ID='pics'"]
          immich: ["roles/immich/tasks/main.yml", "'clientId': 'immich'"]
          gitea: ["roles/gitea/tasks/sso.yml", "--key gitea"]
      ansible.builtin.assert:
        that:
          - app_id_lines.keys() | list | sort == services | selectattr('oidc', 'defined') | map(attribute='key') | list | sort
          - app_id_lines[item.key][1] in lookup('ansible.builtin.file', repo + '/' + app_id_lines[item.key][0])
        quiet: true
      loop: "{{ services | selectattr('oidc', 'defined') | list }}"
      loop_control:
        label: "{{ item.key }}"

    # A copy of the repo with no vars.yml of its own has none to check.
    - name: Find every vars.yml (shared and per host)
      ansible.builtin.find:
        paths: ["{{ repo }}/group_vars", "{{ repo }}/host_vars"]
        patterns: ["vars.yml"]
        recurse: true
      register: host_vars_found

    # include_tasks, not import_tasks: each file in the loop is checked with its own variables.
    - name: Every key in each vars.yml must also be in its example
      ansible.builtin.include_tasks: check_keys.yml
      loop: "{{ host_vars_found.files | map(attribute='path') | list }}"
      loop_control:
        loop_var: real_file

    # teardown.yml removes the names in these lists. The roles install the scripts and lists from them directly; the cron
    # jobs and the two shared scripts are written out in the tasks, so each name must appear there.
    - name: Every backup cron job and shared script in derived.yml is named in the backup role's tasks
      vars:
        backup_role_tasks: >-
          {{ lookup('ansible.builtin.file', repo ~ '/roles/backup/tasks/main.yml')
             ~ lookup('ansible.builtin.file', repo ~ '/roles/backup/tasks/local.yml')
             ~ lookup('ansible.builtin.file', repo ~ '/roles/backup/tasks/cloud.yml') }}
      ansible.builtin.assert:
        that: >-
          (backup_shared_scripts + backup_local_cron_jobs + backup_cloud_cron_jobs)
          | reject('in', backup_role_tasks) | list | length == 0
        fail_msg: A name in the backup_* lists of group_vars/all/derived.yml is not in roles/backup/tasks; teardown would remove the wrong thing.
        quiet: true

    - name: Work out which services Caddy names
      ansible.builtin.import_tasks: "{{ playbook_dir }}/../roles/caddy/tasks/web_sites.yml"

    - name: Create one output directory per role
      ansible.builtin.file:
        path: "{{ out_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ template_files | map('dirname') | map('dirname') | map('basename') | unique | list }}"

    - name: Render every template into {{ out_dir }}
      ansible.builtin.template:
        src: "{{ item }}"
        dest: "{{ out_dir }}/{{ item | dirname | dirname | basename }}/{{ item | basename | regex_replace('\\.j2$', '') }}"
        mode: "0644"
      loop: "{{ template_files }}"
      loop_control:
        label: "{{ item | dirname | dirname | basename }}/{{ item | basename }}"

    # Compose rejects a service whose `environment:`, `volumes:`, `labels:` or `ports:` key has no value, which is what a
    # template leaves behind when its last entry is removed.
    - name: Every rendered compose file has a value under each service's environment, volumes, labels and ports
      ansible.builtin.assert:
        that: >-
          (lookup('ansible.builtin.file', out_dir ~ '/' ~ item.0 ~ '/docker-compose.yml') | from_yaml).services.values()
          | map(attribute=item.1, default='x') | select('none') | list | length == 0
        quiet: true
      loop: >-
        {{ template_files | select('search', '/docker-compose.yml.j2$') | map('dirname') | map('dirname') | map('basename')
        | product(['environment', 'volumes', 'labels', 'ports']) | list }}

    # The watchdog must probe every configured address, never reboot or name a network port, and alert with its own tag.
    - name: The connectivity watchdog script probes, reconnects and alerts as designed
      vars:
        watchdog: "{{ lookup('ansible.builtin.file', out_dir ~ '/connectivity_watchdog/connectivity-watchdog.sh') }}"
      ansible.builtin.assert:
        that:
          - connectivity_probe_addresses | length > 0
          - connectivity_probe_addresses | reject('in', watchdog) | list | length == 0
          - "'/dev/tcp/' in watchdog"
          - "'nmcli connection down' in watchdog and 'nmcli connection up' in watchdog"
          - "'connectivity restored' in watchdog and 'alert.sh' in watchdog"
          - "'systemctl' not in watchdog and 'shutdown' not in watchdog and '/sbin/reboot' not in watchdog"
          - "'wlan0' not in watchdog and 'eth0' not in watchdog"
        quiet: true

    # Caddy numbers its sites by their position in the list, so the checks find a site by its address, not its number.
    - name: Read Caddy's labels, and the label number of each site address
      ansible.builtin.set_fact:
        caddy_labels: "{{ (lookup('ansible.builtin.file', out_dir ~ '/caddy/docker-compose.yml') | from_yaml).services.caddy.labels }}"
    - name: Look up each site address
      vars:
        sites: "{{ caddy_labels | dict2items | selectattr('key', 'match', '^caddy_[0-9]+$') | list }}"
      ansible.builtin.set_fact:
        caddy_site: "{{ dict(sites | map(attribute='value') | zip(sites | map(attribute='key'))) }}"

    # The optional branches above only count as tested if their lines reach the output.
    - name: The optional template branches rendered
      vars:
        tinyauth_compose: "{{ lookup('ansible.builtin.file', out_dir ~ '/tinyauth/docker-compose.yml') }}"
        setup_sh: "{{ lookup('ansible.builtin.file', out_dir ~ '/encryption/setup-encrypted-folder.sh') }}"
        unlock_sh: "{{ lookup('ansible.builtin.file', out_dir ~ '/encryption/unlock.sh') }}"
        hook_sh: "{{ lookup('ansible.builtin.file', out_dir ~ '/encryption/00-containers.sh') }}"
      ansible.builtin.assert:
        that:
          - "'19132:19132/udp' in lookup('ansible.builtin.file', out_dir ~ '/crafty/docker-compose.yml')"
          # Encryption: unlock.sh makes the locked folder immutable, mounts with -allow_other and never -nonempty;
          # the backups refuse a locked folder and skip its encrypted copy.
          - "'.immich.gocryptfs' in setup_sh"
          - "'unlock_folder /mnt/primary/immich /mnt/primary/.immich.gocryptfs' in unlock_sh"
          - "'/mnt/primary/..gocryptfs' not in unlock_sh"
          - "'/after-unlock.d' in unlock_sh"
          - "'00-containers.sh -n' in unlock_sh"
          # Lock: only the three arguments the page's key can send are accepted; --lock stops the containers through the hook, which
          # records them for the next unlock, then unmounts each folder.
          - "'\"\" | --status | --lock | --alert) ;;' in unlock_sh"
          - "'\"${1:-}\" = \"--lock\"' in unlock_sh and 'mountpoint -q /mnt/primary/immich/. && MOUNTED_NOW' in unlock_sh"
          - "'00-containers.sh --stop' in unlock_sh and 'umount \"$mount\"' in unlock_sh"
          - "(encryption_stopped_file ~ ' ') not in hook_sh and 'STOPPED_FILE=' ~ encryption_stopped_file in hook_sh"
          - "'docker stop \"$name\"' in hook_sh and 'docker start \"$name\"' in hook_sh"
          # A lock that failed on a busy folder leaves containers stopped and the folders mounted: the next unlock must still start them,
          # and only after the loop that restarts the running ones.
          # The unlock page stores no key and no passphrase: it mounts the socket's folder read-only, and the request script on the host
          # compares one word with three fixed strings, running nothing it received.
          - "(unlock_page_socket_dir ~ ':/run/unlock:ro') in lookup('ansible.builtin.file', out_dir ~ '/unlock_page/docker-compose.yml')"
          - "('ListenStream=' ~ unlock_page_socket_dir ~ '/unlock.sock') in lookup('ansible.builtin.file', out_dir ~ '/unlock_page/unlock-page.socket')"
          - "'SocketMode=0600' in lookup('ansible.builtin.file', out_dir ~ '/unlock_page/unlock-page.socket')"
          - "('[ -s ' ~ encryption_stopped_file ~ ' ]') in unlock_sh"
          - "hook_sh.index('Restarting $name') < hook_sh.index('Starting $name')"
          # The page has no login of its own: Tinyauth in front of its name is the login.
          - "caddy_labels[caddy_site['unlock.pi4.example.com'] ~ '.import'] == 'tinyauth_forwarder'"
          # The hook skips the empty line docker inspect ends with; without this it matches every container.
          - "'[ -n \"$source\" ] || continue' in hook_sh"
          - "('chown ' ~ ansible_user ~ ' \"$cipher/gocryptfs.conf\"') in unlock_sh"
          - "'chattr +i \"$mount\"' in unlock_sh"
          - "'gocryptfs -allow_other \"$cipher\" \"$mount\"' in unlock_sh"
          - "'-nonempty' not in unlock_sh | regex_replace('Never -nonempty', '')"
          - "'mountpoint -q /mnt/primary/immich/.' in lookup('ansible.builtin.file', out_dir ~ '/backup/backup-restic-local.sh')"
          # A lock must not unmount folders under a backup: both backup scripts and unlock.sh --lock use one lock on the scripts folder.
          - "'flock 9' in lookup('ansible.builtin.file', out_dir ~ '/backup/backup-restic-local.sh')"
          # Every backup script runs the copy of restic that can read any file, never the packaged binary.
          - "'/usr/local/bin/restic-backup \"$@\"' in lookup('ansible.builtin.file', out_dir ~ '/backup/backup-restic-local.sh')"
          - "'/usr/bin/restic' not in lookup('ansible.builtin.file', out_dir ~ '/backup/backup-restic-local.sh')"
          - "'flock 9' in lookup('ansible.builtin.file', out_dir ~ '/backup/backup-restic-cloud.sh')"
          - "'flock -n 9' in unlock_sh"
          - >-
            '/mnt/primary/.immich.gocryptfs/*\n!/mnt/primary/.immich.gocryptfs/gocryptfs.conf'
            in lookup('ansible.builtin.file', out_dir ~ '/backup/restic-excludes-local.txt')
          - "cloudflared_token_file in lookup('ansible.builtin.file', out_dir ~ '/backup/restic-excludes-cloud.txt')"
          # The restic copy reads root-only scripts, so they need no exclude.
          - "alert_token_dir in lookup('ansible.builtin.file', out_dir ~ '/backup/restic-excludes-cloud.txt')"
          - >-
            '/mnt/primary/.immich.gocryptfs/*\n!/mnt/primary/.immich.gocryptfs/gocryptfs.conf'
            in lookup('ansible.builtin.file', out_dir ~ '/backup/restic-excludes-cloud.txt')
          - "caddy_labels[caddy_site['homepage.pi4.example.com'] ~ '.reverse_proxy'] == 'homepage:3000'"
          - "'immich.pi4.example.com immich.second.example.com' in caddy_site"
          - "(caddy_site['crafty.pi4.example.com'] ~ '.reverse_proxy.transport.tls_insecure_skip_verify') in caddy_labels"
          - "caddy_labels[caddy_site['gh.pi4.example.com'] ~ '.redir'] == 'https://github.com{uri}'"
          - "'http://render-full' in caddy_site"
          - "caddy_labels[caddy_site['*.pi4.example.com'] ~ '.respond'] == '404'"
          - "caddy_labels[caddy_site['*.second.example.com'] ~ '.respond'] == '404'"
          - "caddy_labels[caddy_site['dockge.pi4.example.com'] ~ '.import'] == 'tinyauth_forwarder'"
          - "caddy_labels[caddy_site['copyparty.pi4.example.com'] ~ '.import'] == 'tinyauth_forwarder'"
          - "caddy_labels[caddy_site['copyparty.pi4.example.com'] ~ '.reverse_proxy.header_up'] == 'idp$$key 1'"
          - "'copyparty.second.example.com' not in (caddy_site.keys() | join(' '))"
          - "'idp-h-usr: remote-user' in lookup('ansible.builtin.file', out_dir ~ '/copyparty/copyparty.conf')"
          - "'idp-h-key: idp$key' in lookup('ansible.builtin.file', out_dir ~ '/copyparty/copyparty.conf')"
          - "'auth-ord: idp,pw' in lookup('ansible.builtin.file', out_dir ~ '/copyparty/copyparty.conf')"
          # Admin access to the five folders, read-only on /drives. The folder with root: true is the volume at /, and has no /<name> address.
          - "lookup('ansible.builtin.file', out_dir ~ '/copyparty/copyparty.conf').count('    A: owner') == 6"
          - >-
            '\n[/]\n  /vol/files\n  accs:\n    A: yourusername\n    A: owner\n    r: friend2\n'
            in lookup('ansible.builtin.file', out_dir ~ '/copyparty/copyparty.conf')
          - "'[/files]' not in lookup('ansible.builtin.file', out_dir ~ '/copyparty/copyparty.conf')"
          - "'    r: owner' in lookup('ansible.builtin.file', out_dir ~ '/copyparty/copyparty.conf').split('[/drives]')[1]"
          # A folder is its own volume at /vol/<name>: the admins have full access, each login in its access gets the letters written there.
          - >-
            '[/collab]\n  /vol/collab\n  accs:\n    A: yourusername\n    A: owner\n    rwmd: friend1\n    rwmd: friend2\n'
            in lookup('ansible.builtin.file', out_dir ~ '/copyparty/copyparty.conf')
          - "'  friend1: ' in lookup('ansible.builtin.file', out_dir ~ '/copyparty/copyparty.conf')"
          # The admin login has a password. A login with no pass is not an account: only the Tinyauth header can name it.
          - "'  yourusername: ' in lookup('ansible.builtin.file', out_dir ~ '/copyparty/copyparty.conf')"
          - "'  owner: ' not in lookup('ansible.builtin.file', out_dir ~ '/copyparty/copyparty.conf')"
          - >-
            '[/public]\n  /vol/public\n  accs:\n    A: yourusername\n    A: owner\n    r: *\n    w: @acct\n\n'
            in lookup('ansible.builtin.file', out_dir ~ '/copyparty/copyparty.conf')
          # One login can have different letters in different folders: friend1 only reads team, and A gives friend2 everything there.
          - >-
            '[/team]\n  /vol/team\n  accs:\n    A: yourusername\n    A: owner\n    A: friend2\n    r: friend1\n\n'
            in lookup('ansible.builtin.file', out_dir ~ '/copyparty/copyparty.conf')
          # No dir: inside copyparty_shared_dir. A dir: that directory.
          - "(copyparty_shared_dir ~ '/files:/vol/files:rw') in lookup('ansible.builtin.file', out_dir ~ '/copyparty/docker-compose.yml')"
          - "(copyparty_shared_dir ~ '/collab:/vol/collab:rw') in lookup('ansible.builtin.file', out_dir ~ '/copyparty/docker-compose.yml')"
          - "'/mnt/primary/appdata/pics/photos:/vol/services/pics/photos:rw' in lookup('ansible.builtin.file', out_dir ~ '/copyparty/docker-compose.yml')"
          # An app is a login like any other: pics has no delete in the photos and has it in the trash.
          - >-
            '[/services/pics/photos]\n  /vol/services/pics/photos\n  accs:\n    A: yourusername\n    A: owner\n    rwm: pics\n'
            in lookup('ansible.builtin.file', out_dir ~ '/copyparty/copyparty.conf')
          # services and services/pics are no folders, so each is a read-only volume for the logins in its children's access.
          - >-
            '[/services]\n  /vol/services\n  accs:\n    r: yourusername\n    r: owner\n    r: pics\n  flags:\n    -e2d\n'
            in lookup('ansible.builtin.file', out_dir ~ '/copyparty/copyparty.conf')
          - >-
            '[/services/pics]\n  /vol/services/pics\n  accs:\n    r: yourusername\n    r: owner\n    r: pics\n  flags:\n    -e2d\n'
            in lookup('ansible.builtin.file', out_dir ~ '/copyparty/copyparty.conf')
          - "'    rwmd: pics\n' in lookup('ansible.builtin.file', out_dir ~ '/copyparty/copyparty.conf')"
          - "'  pics: ' in lookup('ansible.builtin.file', out_dir ~ '/copyparty/copyparty.conf')"
          - "'/apps' not in lookup('ansible.builtin.file', out_dir ~ '/copyparty/copyparty.conf')"
          - "'- /mnt/fast/shared:/fast:ro' in lookup('ansible.builtin.file', out_dir ~ '/copyparty/docker-compose.yml')"
          - "'\"3922:3922\"' in lookup('ansible.builtin.file', out_dir ~ '/copyparty/docker-compose.yml')"
          - "\"COPYPARTY_ROOT='/services/pics/photos'\" in lookup('ansible.builtin.file', out_dir ~ '/pics/pics.env')"
          - "\"COPYPARTY_TRASH_ROOT='/services/pics/trash'\" in lookup('ansible.builtin.file', out_dir ~ '/pics/pics.env')"
          - "'dockge.second.example.com' not in (caddy_site.keys() | join(' '))"
          - "(caddy_site['immich.pi4.example.com immich.second.example.com'] ~ '.import') not in caddy_labels"
          - "(caddy_site['crafty.pi4.example.com'] ~ '.import') in caddy_labels"
          - "caddy_labels[caddy_site['(tinyauth_forwarder)'] ~ '.forward_auth.uri'] == '/api/auth/caddy'"
          - "'TINYAUTH_AUTH_USERS: ' ~ \"'owner:$$2b$$\" in lookup('ansible.builtin.file', out_dir ~ '/tinyauth/docker-compose.yml')"
          - "'TINYAUTH_AUTH_USERATTRIBUTES_OWNER_EMAIL: \"owner@real.example\"' in lookup('ansible.builtin.file', out_dir ~ '/tinyauth/docker-compose.yml')"
          - "'USERATTRIBUTES_SECOND' not in lookup('ansible.builtin.file', out_dir ~ '/tinyauth/docker-compose.yml')"
          # A GitHub login is limited by the emails of the listed users, globally and per limited app.
          - "'TINYAUTH_OAUTH_WHITELIST: \"owner@real.example\"' in tinyauth_compose"
          - "'TINYAUTH_APPS_DOZZLE_OAUTH_WHITELIST: \"owner@real.example\"' in tinyauth_compose"
          - "'TINYAUTH_APPS_BACKUP-STATUS_OAUTH_WHITELIST: \"owner@real.example\"' in tinyauth_compose"
          - "':JBSWY3DPEHPK3PXP\\'' in lookup('ansible.builtin.file', out_dir ~ '/tinyauth/docker-compose.yml')"
          - "'pass$word' not in lookup('ansible.builtin.file', out_dir ~ '/tinyauth/docker-compose.yml')"
          - "'TINYAUTH_APPURL: \"https://auth.pi4.example.com\"' in lookup('ansible.builtin.file', out_dir ~ '/tinyauth/docker-compose.yml')"
          - "'TINYAUTH_OAUTH_PROVIDERS_GITHUB_CLIENTSECRET: \"s$$ecret\"' in lookup('ansible.builtin.file', out_dir ~ '/tinyauth/docker-compose.yml')"
          # A client per app that signs in through Tinyauth, with the app's own redirect URIs and the secret escaped.
          - "'TINYAUTH_OIDC_CLIENTS_GITEA_CLIENTID: \"gitea\"' in tinyauth_compose"
          - "\"TINYAUTH_OIDC_CLIENTS_GITEA_CLIENTSECRET: 'gitea$$secret'\" in tinyauth_compose"
          - "'TINYAUTH_OIDC_CLIENTS_GITEA_TRUSTEDREDIRECTURIS: \"https://git.pi4.example.com/user/oauth2/tinyauth/callback\"' in tinyauth_compose"
          - "'TINYAUTH_OIDC_CLIENTS_IMMICH_CLIENTID: \"immich\"' in tinyauth_compose"
          - "\"TINYAUTH_OIDC_CLIENTS_IMMICH_CLIENTSECRET: 'immich$$secret'\" in tinyauth_compose"
          - >-
            ('TINYAUTH_OIDC_CLIENTS_IMMICH_TRUSTEDREDIRECTURIS: "https://immich.pi4.example.com/auth/login,'
            ~ 'https://immich.pi4.example.com/user-settings,https://immich.second.example.com/auth/login,'
            ~ 'https://immich.second.example.com/user-settings,https://photos.example.org/auth/login,'
            ~ 'https://photos.example.org/user-settings,app.immich:///oauth-callback"')
            in tinyauth_compose
          - "'TINYAUTH_OIDC_CLIENTS_PICS_CLIENTID: \"pics\"' in tinyauth_compose"
          - "\"TINYAUTH_OIDC_CLIENTS_PICS_CLIENTSECRET: 'pics$$secret'\" in tinyauth_compose"
          - >-
            ('TINYAUTH_OIDC_CLIENTS_PICS_TRUSTEDREDIRECTURIS: "https://pics.pi4.example.com/api/auth/oidc/callback,'
            ~ 'https://pics.second.example.com/api/auth/oidc/callback,http://nas:8100/api/auth/oidc/callback"') in tinyauth_compose
          - "\"HUB_OIDC_ISSUER='https://auth.pi4.example.com'\" in lookup('ansible.builtin.file', out_dir ~ '/pics/pics.env')"
          - "'HUB_OIDC_REDIRECT_URL' not in lookup('ansible.builtin.file', out_dir ~ '/pics/pics.env')"
          - "\"HUB_OIDC_USERS='owner second'\" in lookup('ansible.builtin.file', out_dir ~ '/pics/pics.env')"
          # service_users: the app id has dashes, the host is matched exactly, an unlisted service has no rule
          - "'TINYAUTH_APPS_BACKUP-STATUS_USERS_ALLOW: \"owner\"' in tinyauth_compose"
          - "'TINYAUTH_APPS_DOZZLE_CONFIG_DOMAIN: \"dozzle.pi4.example.com\"' in tinyauth_compose"
          - "'TINYAUTH_APPS_CRAFTY' not in tinyauth_compose"
          - "\"HUB_OIDC_CLIENT_SECRET='pics$secret'\" in lookup('ansible.builtin.file', out_dir ~ '/pics/pics.env')"
          # Caddy answers the login page's name inside the Docker network, so the app containers can read its settings.
          - >-
            (lookup('ansible.builtin.file', out_dir ~ '/caddy/docker-compose.yml') | from_yaml).services.caddy.networks.services.aliases
            == ['auth.pi4.example.com', 'auth.second.example.com']
          - "'GITEA__oauth2_client__OPENID_CONNECT_SCOPES: \"openid email profile\"' in lookup('ansible.builtin.file', out_dir ~ '/gitea/docker-compose.yml')"
          - "'GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: \"false\"' in lookup('ansible.builtin.file', out_dir ~ '/gitea/docker-compose.yml')"
          - "'DOZZLE_AUTH_PROVIDER: forward-proxy' in lookup('ansible.builtin.file', out_dir ~ '/dozzle/docker-compose.yml')"
          - "'/var/run/docker.sock:/var/run/docker.sock:ro' in lookup('ansible.builtin.file', out_dir ~ '/dozzle/docker-compose.yml')"
          - "'ports:' not in lookup('ansible.builtin.file', out_dir ~ '/dozzle/docker-compose.yml')"
          # Dockge's port is empty here, which makes Tinyauth its only login; the role writes that switch into
          # Dockge's database at run time (roles/dockge/tasks/own_login.yml), where no template test reaches.
          - "'ports:' not in lookup('ansible.builtin.file', out_dir ~ '/dockge/docker-compose.yml')"
          - "'SYS_RAWIO' in lookup('ansible.builtin.file', out_dir ~ '/scrutiny/docker-compose.yml')"
          - "'- /dev/sdb:/dev/sdb' in lookup('ansible.builtin.file', out_dir ~ '/scrutiny/docker-compose.yml')"
          - "'8086' not in lookup('ansible.builtin.file', out_dir ~ '/scrutiny/docker-compose.yml')"
          # The destination's url and token reach both apps in their own URL syntax; the compose file escapes the `$`.
          - >-
            'SCRUTINY_NOTIFY_URLS: "ntfy://:tk_a$$b@pi4:8090/alerts?scheme=http"'
            in lookup('ansible.builtin.file', out_dir ~ '/scrutiny/docker-compose.yml')
          - "\"HUB_ALERT_URLS='ntfy://tk_a$b@pi4:8090/alerts'\" in lookup('ansible.builtin.file', out_dir ~ '/pics/pics.env')"
          - "'2283' not in lookup('ansible.builtin.file', out_dir ~ '/immich/docker-compose.yml')"
          - "'git.pi4.example.com git.second.example.com' in lookup('ansible.builtin.file', out_dir ~ '/caddy/docker-compose.yml')"
          - "'CLOUDFLARE_API_TOKEN: \"render-dns-token\"' in lookup('ansible.builtin.file', out_dir ~ '/caddy/docker-compose.yml')"
          - "'render-test-token' not in lookup('ansible.builtin.file', out_dir ~ '/caddy/docker-compose.yml')"
          - "'caddy.acme_dns: cloudflare' in lookup('ansible.builtin.file', out_dir ~ '/caddy/docker-compose.yml')"
          - "'NTFY_BEHIND_PROXY' in lookup('ansible.builtin.file', out_dir ~ '/ntfy/docker-compose.yml')"
          - "'NTFY_UPSTREAM_BASE_URL' in lookup('ansible.builtin.file', out_dir ~ '/ntfy/docker-compose.yml')"
          - "'gitea-runner:' in lookup('ansible.builtin.file', out_dir ~ '/gitea/docker-compose.yml')"
          - "'runner$$token' in lookup('ansible.builtin.file', out_dir ~ '/gitea/docker-compose.yml')"
          - "garage_meta_dir in lookup('ansible.builtin.file', out_dir ~ '/backup/restic-excludes-local.txt')"
          - "(caddy_data_dir ~ '/caddy') in lookup('ansible.builtin.file', out_dir ~ '/backup/restic-excludes-local.txt')"
          - "(copyparty_config_dir ~ '/copyparty') in lookup('ansible.builtin.file', out_dir ~ '/backup/restic-excludes-local.txt')"
          - "(tinyauth_data_dir ~ '/oidc') in lookup('ansible.builtin.file', out_dir ~ '/backup/restic-excludes-local.txt')"
          - "(gitea_data_dir ~ '/ssh') in lookup('ansible.builtin.file', out_dir ~ '/backup/restic-excludes-local.txt')"
          - "(crafty_data_dir ~ '/backups') in lookup('ansible.builtin.file', out_dir ~ '/backup/restic-excludes-local.txt')"
          - "'--fsck=' in lookup('ansible.builtin.file', out_dir ~ '/storage/98-usb-automount.rules')"
          - >-
            drives | map(attribute='uuid') | map('lower') | reject('in', lookup('ansible.builtin.file', out_dir ~ '/storage/98-usb-automount.rules')) | list
            | length == 0
          - >-
            drives | map(attribute='uuid') | map('upper') | reject('in', lookup('ansible.builtin.file', out_dir ~ '/storage/98-usb-automount.rules')) | list
            | length == 0
          - "(direct_link_ip ~ '/' ~ direct_link_prefix | string) in lookup('ansible.builtin.file', out_dir ~ '/network/direct-link-netplan.yaml')"
          - "'HUB_ALERT_URLS' in lookup('ansible.builtin.file', out_dir ~ '/pics/pics.env')"
          - "'homepage.pi4.example.com,homepage.second.example.com,' in lookup('ansible.builtin.file', out_dir ~ '/homepage/docker-compose.yml')"
          - "'ports:' not in lookup('ansible.builtin.file', out_dir ~ '/homepage/docker-compose.yml')"
          - "(',' ~ homepage_host ~ '\"') in lookup('ansible.builtin.file', out_dir ~ '/homepage/docker-compose.yml')"
          - >-
            (lookup('ansible.builtin.file', out_dir ~ '/homepage/services.yaml') | from_yaml | map('dict2items') | map('first') | map(attribute='key') | list)
            == ['render-full', 'render-peer', 'Links']
          - >-
            (lookup('ansible.builtin.file', out_dir ~ '/homepage/services.yaml') | from_yaml)[0]['render-full']
            | length == (web_services | map(attribute='key') | select('in', enabled_service_keys) | list | length)
          - >-
            (lookup('ansible.builtin.file', out_dir ~ '/homepage/services.yaml') | from_yaml)[0]['render-full'] | map('dict2items') | map('first')
            | selectattr('key', 'in', ['Immich', 'Gitea', 'Crafty']) | map(attribute='value') | map(attribute='href') | list
            == ['https://immich.pi4.example.com', 'https://git.pi4.example.com', 'https://crafty.pi4.example.com']
          - >-
            (lookup('ansible.builtin.file', out_dir ~ '/homepage/services.yaml') | from_yaml)[1]['render-peer'] | map('dict2items') | map('first')
            | map(attribute='value') | map(attribute='href') | list == ['http://peer.example.com:5001', 'http://peer.example.com:8090']
          # With two hosts, the host is in each tile's description (the Homepage search shows no group).
          - >-
            (lookup('ansible.builtin.file', out_dir ~ '/homepage/services.yaml') | from_yaml)[1]['render-peer'] | map('dict2items') | map('first')
            | map(attribute='value') | map(attribute='description') | select('search', ' · render-peer$') | list | length == 2
          - >-
            (lookup('ansible.builtin.file', out_dir ~ '/homepage/services.yaml') | from_yaml)[2].Links[0].Example.description == 'a: b'
          - >-
            (lookup('ansible.builtin.file', out_dir ~ '/homepage/services.yaml') | from_yaml)[2].Links[0].Example.icon == 'mdi-star'
          - >-
            (lookup('ansible.builtin.file', out_dir ~ '/homepage/services.yaml') | from_yaml)[2].Links[0].Example.siteMonitor == 'https://example.com'
          - "'HUB_ARTIST' in lookup('ansible.builtin.file', out_dir ~ '/pics/pics.env')"
          - "'HUB_LINKS=' in lookup('ansible.builtin.file', out_dir ~ '/pics/pics.env')"
        quiet: true

    # Copyparty's own login is the default: no IdP lines in its config and nothing in front of its Caddy name.
    - name: Make a directory for the render without Copyparty's single sign-on
      ansible.builtin.file:
        path: "{{ out_dir }}/sso-off"
        state: directory
        mode: "0755"

    - name: Turn Copyparty's single sign-on off
      ansible.builtin.set_fact:
        copyparty_sso_enabled: false

    - name: Work out which services Caddy names without it
      ansible.builtin.import_tasks: "{{ playbook_dir }}/../roles/caddy/tasks/web_sites.yml"

    - name: Render Copyparty's config and Caddy's compose without it
      ansible.builtin.template:
        src: "{{ repo }}/roles/{{ item }}"
        dest: "{{ out_dir }}/sso-off/{{ item | basename | regex_replace('\\.j2$', '') }}"
        mode: "0644"
      loop:
        - copyparty/templates/copyparty.conf.j2
        - caddy/templates/docker-compose.yml.j2

    - name: Read the two renders
      ansible.builtin.slurp:
        src: "{{ out_dir }}/sso-off/{{ item }}"
      loop: [copyparty.conf, docker-compose.yml]
      register: sso_off

    - name: Without it, Copyparty has no IdP lines and its Caddy name is not behind the login
      vars:
        conf: "{{ sso_off.results[0].content | b64decode }}"
        labels: "{{ (sso_off.results[1].content | b64decode | from_yaml).services.caddy.labels }}"
        sites: "{{ labels | dict2items | selectattr('key', 'match', '^caddy_[0-9]+$') | list }}"
        site: "{{ dict(sites | map(attribute='value') | zip(sites | map(attribute='key'))) }}"
        copyparty_hosts: "copyparty.pi4.example.com copyparty.second.example.com"
      ansible.builtin.assert:
        that:
          - "'idp-h-usr' not in conf"
          - "'idp-h-key' not in conf"
          - "'auth-ord' not in conf"
          - "copyparty_hosts in site"
          - "(site[copyparty_hosts] ~ '.import') not in labels"
          - "(site[copyparty_hosts] ~ '.reverse_proxy.header_up') not in labels"
        quiet: true

    # set_fact outranks task vars, so the setting is emptied for one render and put back.
    - name: Render Copyparty's config and compose file with no folder
      ansible.builtin.set_fact:
        copyparty_folders_kept: "{{ copyparty_folders }}"
        copyparty_folders: {}

    - name: Write them
      ansible.builtin.template:
        src: "{{ repo }}/roles/copyparty/{{ item.src }}"
        dest: "{{ out_dir }}/sso-off/{{ item.dest }}"
        mode: "0644"
      loop:
        - {src: templates/copyparty.conf.j2, dest: copyparty-no-folders.conf}
        - {src: templates/docker-compose.yml.j2, dest: copyparty-no-folders-compose.yml}

    - name: With no folder, there is no folder volume and no mount
      ansible.builtin.assert:
        that:
          - "'[/collab' not in lookup('ansible.builtin.file', out_dir ~ '/sso-off/copyparty-no-folders.conf')"
          - "'[/drives]' in lookup('ansible.builtin.file', out_dir ~ '/sso-off/copyparty-no-folders.conf')"
          - "':/vol/' not in lookup('ansible.builtin.file', out_dir ~ '/sso-off/copyparty-no-folders-compose.yml')"
          - "'[/services' not in lookup('ansible.builtin.file', out_dir ~ '/sso-off/copyparty-no-folders.conf')"
          # The logins stay: the admin can still sign in and open /drives.
          - "'  yourusername: ' in lookup('ansible.builtin.file', out_dir ~ '/sso-off/copyparty-no-folders.conf')"
        quiet: true

    - name: Put the folders back
      ansible.builtin.set_fact:
        copyparty_folders: "{{ copyparty_folders_kept }}"

    # ntfy_ios_push is on by default (checked above); false keeps the upstream line out of the server's compose file.
    - name: Turn iOS push off
      ansible.builtin.set_fact:
        ntfy_ios_push: false

    - name: Render the ntfy server's compose file with iOS push off
      ansible.builtin.template:
        src: "{{ repo }}/roles/ntfy/templates/docker-compose.yml.j2"
        dest: "{{ out_dir }}/sso-off/ntfy-no-ios-push.yml"
        mode: "0644"

    - name: The upstream line is gone
      ansible.builtin.assert:
        that:
          - "'NTFY_UPSTREAM_BASE_URL' not in lookup('ansible.builtin.file', out_dir ~ '/sso-off/ntfy-no-ios-push.yml')"
        quiet: true

    - name: Put iOS push back on
      ansible.builtin.set_fact:
        ntfy_ios_push: true

    # A hosted ntfy with no login: https, no token. set_fact outranks task vars; the values are put back afterwards.
    - name: Use a hosted ntfy topic with no token
      ansible.builtin.set_fact:
        ntfy_destinations:
          public: {url: "https://ntfy.sh/my-topic"}
        system_alert_to: ""
        scrutiny_alert_to: public
        pics_alert_to: public
        unlock_alert_to: ""

    - name: Render the two apps' files with it
      ansible.builtin.template:
        src: "{{ repo }}/roles/{{ item }}"
        dest: "{{ out_dir }}/sso-off/hosted-{{ item | basename | regex_replace('\\.j2$', '') }}"
        mode: "0644"
      loop:
        - scrutiny/templates/docker-compose.yml.j2
        - pics/templates/pics.env.j2

    - name: The hosted topic keeps its https scheme and carries no token
      ansible.builtin.assert:
        that:
          - "'SCRUTINY_NOTIFY_URLS: \"ntfy://ntfy.sh/my-topic?scheme=https\"' in lookup('ansible.builtin.file', out_dir ~ '/sso-off/hosted-docker-compose.yml')"
          - "\"HUB_ALERT_URLS='ntfys://ntfy.sh/my-topic'\" in lookup('ansible.builtin.file', out_dir ~ '/sso-off/hosted-pics.env')"
        quiet: true

    # With both senders off, neither file mentions an alert address.
    - name: Switch the two apps' alerts off
      ansible.builtin.set_fact:
        scrutiny_alert_to: ""
        pics_alert_to: ""

    - name: Render the two apps' files with alerts off
      ansible.builtin.template:
        src: "{{ repo }}/roles/{{ item }}"
        dest: "{{ out_dir }}/sso-off/off-{{ item | basename | regex_replace('\\.j2$', '') }}"
        mode: "0644"
      loop:
        - scrutiny/templates/docker-compose.yml.j2
        - pics/templates/pics.env.j2

    - name: Neither file has an alert address
      ansible.builtin.assert:
        that:
          - "'SCRUTINY_NOTIFY_URLS' not in lookup('ansible.builtin.file', out_dir ~ '/sso-off/off-docker-compose.yml')"
          - "'HUB_ALERT_URLS' not in lookup('ansible.builtin.file', out_dir ~ '/sso-off/off-pics.env')"
        quiet: true

    - name: Put the ntfy settings back
      ansible.builtin.set_fact:
        ntfy_destinations:
          home: {url: "http://pi4:8090/alerts", token: "{{ vault_ntfy_token }}"}
        system_alert_to: home
        scrutiny_alert_to: home
        pics_alert_to: home
        unlock_alert_to: home

    # Each sender names its own destination; a destination with no token means no login.
    - name: Give each sender its own ntfy
      ansible.builtin.set_fact:
        ntfy_destinations:
          scrutiny-topic: {url: "https://ntfy.example.org/scrutiny", token: "tk_scrutiny"}
          pics-topic: {url: "https://ntfy.sh/pics-topic"}
          system-topic: {url: "https://ntfy.sh/host-topic"}
          unlock-topic: {url: "https://ntfy.sh/unlock-topic", token: "tk_unlock"}
        scrutiny_alert_to: scrutiny-topic
        pics_alert_to: pics-topic
        system_alert_to: system-topic
        unlock_alert_to: unlock-topic

    - name: Render the senders' files with them
      ansible.builtin.template:
        src: "{{ repo }}/roles/{{ item }}"
        dest: "{{ out_dir }}/sso-off/own-{{ item | basename | regex_replace('\\.j2$', '') }}"
        mode: "0644"
      loop:
        - scrutiny/templates/docker-compose.yml.j2
        - pics/templates/pics.env.j2
        - common/templates/alert.sh.j2

    - name: Each sender uses its own URL and token
      ansible.builtin.assert:
        that:
          - >-
            'SCRUTINY_NOTIFY_URLS: "ntfy://:tk_scrutiny@ntfy.example.org/scrutiny?scheme=https"'
            in lookup('ansible.builtin.file', out_dir ~ '/sso-off/own-docker-compose.yml')
          - "\"HUB_ALERT_URLS='ntfys://ntfy.sh/pics-topic'\" in lookup('ansible.builtin.file', out_dir ~ '/sso-off/own-pics.env')"
          # alert.sh has one branch per sender, with its own address and its own token file (only the unlock destination has a token).
          - "'https://ntfy.sh/host-topic' in lookup('ansible.builtin.file', out_dir ~ '/sso-off/own-alert.sh')"
          - "'https://ntfy.sh/unlock-topic' in lookup('ansible.builtin.file', out_dir ~ '/sso-off/own-alert.sh')"
          - "(alert_token_dir ~ '/unlock') in lookup('ansible.builtin.file', out_dir ~ '/sso-off/own-alert.sh')"
          - "(alert_token_dir ~ '/system') not in lookup('ansible.builtin.file', out_dir ~ '/sso-off/own-alert.sh')"
        quiet: true

    # With backup_read_all_files off the scripts run the packaged restic, not the copy that has the capability.
    - name: Turn backup_read_all_files off
      ansible.builtin.set_fact:
        backup_read_all_files: false

    - name: The restic setting follows backup_read_all_files
      ansible.builtin.assert:
        that:
          - restic_binary == '/usr/bin/restic'
          - restic_copy_path != restic_binary
        quiet: true

    - name: Turn backup_read_all_files back on
      ansible.builtin.set_fact:
        backup_read_all_files: true

    # With no destination named, alert.sh only writes to the system log (tests/test_alert_sh.py runs it).
    # set_fact, not task vars: the set_fact above outranks them. The next task puts the shared values back.
    - name: Turn the script senders off
      ansible.builtin.set_fact:
        system_alert_to: ""
        unlock_alert_to: ""

    - name: Render alert.sh with no destinations
      ansible.builtin.template:
        src: "{{ repo }}/roles/common/templates/alert.sh.j2"
        dest: "{{ out_dir }}/sso-off/own-alert-off.sh"
        mode: "0644"

    - name: Put the senders back on the shared ntfy
      ansible.builtin.set_fact:
        ntfy_destinations:
          home: {url: "http://pi4:8090/alerts", token: "{{ vault_ntfy_token }}"}
        scrutiny_alert_to: home
        pics_alert_to: home
        system_alert_to: home
        unlock_alert_to: home

    # A name that is not in ntfy_destinations stops the deploy, and the message names the setting.
    - name: A sender naming no destination fails
      block:
        - name: Name a destination that does not exist
          ansible.builtin.set_fact:
            scrutiny_alert_to: nowhere

        - name: Read the sender's address
          ansible.builtin.debug:
            msg: "{{ alert_targets.scrutiny.url }}"
          no_log: true
      rescue:
        - name: The failure names scrutiny_alert_to
          ansible.builtin.assert:
            that: "'scrutiny_alert_to names a destination' in ansible_failed_result.msg"
            quiet: true
      always:
        - name: Put the sender back on home
          ansible.builtin.set_fact:
            scrutiny_alert_to: home

    # A destination with no url stops the deploy too, instead of turning its sender off.
    - name: A destination with no url fails
      block:
        - name: Give a destination a token and no url
          ansible.builtin.set_fact:
            ntfy_destinations:
              home: {url: "http://pi4:8090/alerts", token: "{{ vault_ntfy_token }}"}
              broken: {token: "tk_x"}
            scrutiny_alert_to: broken

        - name: Read the sender's address
          ansible.builtin.debug:
            msg: "{{ alert_targets.scrutiny.url }}"
          no_log: true
      rescue:
        - name: The failure names scrutiny_alert_to and the missing url
          ansible.builtin.assert:
            that: "'scrutiny_alert_to names a destination with no url' in ansible_failed_result.msg"
            quiet: true
      always:
        - name: Put the destinations back
          ansible.builtin.set_fact:
            ntfy_destinations:
              home: {url: "http://pi4:8090/alerts", token: "{{ vault_ntfy_token }}"}
            scrutiny_alert_to: home

    # A service whose entry has tile_url links to that setting's address; the default (checked above) equals its Caddy name.
    - name: Give Gitea a public address of its own
      ansible.builtin.set_fact:
        gitea_root_url_before: "{{ gitea_root_url }}"
        gitea_root_url: https://git.example.org/

    - name: Render the Homepage tiles with it
      ansible.builtin.template:
        src: "{{ repo }}/roles/homepage/templates/services.yaml.j2"
        dest: "{{ out_dir }}/homepage-public-url.yaml"
        mode: "0644"

    - name: Only Gitea's tile moves to the public address
      ansible.builtin.assert:
        that:
          - >-
            (lookup('ansible.builtin.file', out_dir ~ '/homepage-public-url.yaml') | from_yaml)[0]['render-full'] | map('dict2items') | map('first')
            | selectattr('key', 'in', ['Immich', 'Gitea', 'Crafty']) | map(attribute='value') | map(attribute='href') | list
            == ['https://immich.pi4.example.com', 'https://git.example.org', 'https://crafty.pi4.example.com']
        quiet: true

    - name: Put Gitea's address back
      ansible.builtin.set_fact:
        gitea_root_url: "{{ gitea_root_url_before }}"

    # The two OIDC logins off: no client at Tinyauth, no login source settings for Gitea and no config file for Immich.
    # The login page keeps its name inside the network, because that follows tinyauth_enabled, not these two.
    - name: Make a directory for the render without the two OIDC logins
      ansible.builtin.file:
        path: "{{ out_dir }}/oidc-off/{{ item }}"
        state: directory
        mode: "0755"
      loop: [tinyauth, caddy, gitea, immich, pics]

    - name: Turn the two OIDC logins off
      ansible.builtin.set_fact:
        gitea_sso_enabled: false
        immich_sso_enabled: false
        pics_sso_enabled: false

    - name: Render the four templates that carry them
      ansible.builtin.template:
        src: "{{ repo }}/roles/{{ item }}/templates/docker-compose.yml.j2"
        dest: "{{ out_dir }}/oidc-off/{{ item }}/docker-compose.yml"
        mode: "0644"
      loop: [tinyauth, caddy, gitea, immich]

    - name: Render pics' settings file without its OIDC login
      ansible.builtin.template:
        src: "{{ repo }}/roles/pics/templates/pics.env.j2"
        dest: "{{ out_dir }}/oidc-off/pics/pics.env"
        mode: "0644"

    - name: Without them, nothing asks Tinyauth for a login or Immich for its config file
      vars:
        tinyauth_compose: "{{ lookup('ansible.builtin.file', out_dir ~ '/oidc-off/tinyauth/docker-compose.yml') }}"
        caddy_compose: "{{ lookup('ansible.builtin.file', out_dir ~ '/oidc-off/caddy/docker-compose.yml') }}"
        gitea_compose: "{{ lookup('ansible.builtin.file', out_dir ~ '/oidc-off/gitea/docker-compose.yml') }}"
      ansible.builtin.assert:
        that:
          - "'TINYAUTH_OIDC_CLIENTS' not in tinyauth_compose"
          - "'GITEA__oauth2_client__' not in gitea_compose"
          - "'HUB_OIDC' not in lookup('ansible.builtin.file', out_dir ~ '/oidc-off/pics/pics.env')"
          # The login page keeps its name inside the network whatever apps sign in through it.
          - "'auth.pi4.example.com' in caddy_compose"
        quiet: true

    # Without Tinyauth there is no login page for the network to resolve and nothing to sign in through it.
    - name: Turn Tinyauth off too
      ansible.builtin.set_fact:
        tinyauth_enabled: false

    - name: Work out which services Caddy names without Tinyauth
      ansible.builtin.import_tasks: "{{ playbook_dir }}/../roles/caddy/tasks/web_sites.yml"

    - name: Render Caddy's compose without Tinyauth
      ansible.builtin.template:
        src: "{{ repo }}/roles/caddy/templates/docker-compose.yml.j2"
        dest: "{{ out_dir }}/oidc-off/caddy/docker-compose.yml"
        mode: "0644"

    - name: Without Tinyauth, Caddy has no name inside the network
      vars:
        caddy_compose: "{{ lookup('ansible.builtin.file', out_dir ~ '/oidc-off/caddy/docker-compose.yml') }}"
      ansible.builtin.assert:
        that:
          - "'aliases:' not in caddy_compose"
          - "'auth.pi4.example.com' not in caddy_compose"
        quiet: true

    # With the snippet gone, a site that imports it would make Caddy reject its whole config, and the deploy would
    # still report success. The role's check must stop that and name both settings.
    - name: Give the host a site that imports Tinyauth's snippet
      ansible.builtin.set_fact:
        caddy_sites:
          app.pi4.example.com: {import: tinyauth_forwarder, reverse_proxy: "dockge:5001"}

    - name: That site without Tinyauth fails the Caddy check
      block:
        - name: Run the Caddy check
          ansible.builtin.import_tasks: "{{ playbook_dir }}/../roles/caddy/tasks/check_sites.yml"
        - name: The check must have failed
          ansible.builtin.fail:
            msg: the Caddy check accepted a tinyauth_forwarder import while tinyauth_enabled is false
      rescue:
        - name: The message names both settings the snippet needs
          ansible.builtin.assert:
            that:
              - "'tinyauth_enabled' in ansible_failed_result | to_json"
              - "'caddy_private_domains' in ansible_failed_result | to_json"
            quiet: true
