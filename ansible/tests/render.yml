---
# Renders every role template against the example vars and checks the result.
# Runs on your machine only (no Pi, no vault): `just test` runs this, then
# shellchecks the rendered scripts. It catches:
#   - a template using a variable that isn't defined in vars.yml.example,
#     vault.yml.example, versions.yml or the role's defaults/
#   - a key in a vars.yml (group_vars/all, group_vars/nas, host_vars/<host>) that is missing from
#     its example file
#   - template syntax errors
#   - a backup or cloudflared template that needs a NAS-only variable on a general server (second play)
# The hosts come from tests/inventory.yml, so group_names inside the templates is real.
- name: Render all role templates against the example vars
  hosts: render-nas
  become: false
  gather_facts: false
  vars:
    repo: "{{ playbook_dir }}/.."
    # Normally set by the inventory or by a task at deploy time.
    ansible_user: pi
    ansible_mounts: []   # a fact, gathered on a real host
    garage_is_first_deploy: false
  tasks:
    - name: Find every role's defaults and templates
      ansible.builtin.find:
        paths: "{{ repo }}/roles"
        patterns: ["main.yml", "*.j2"]
        recurse: true
      register: found

    - name: Split into defaults files and templates
      ansible.builtin.set_fact:
        defaults_files: "{{ found.files | map(attribute='path') | select('search', '/defaults/main.yml$') | sort }}"
        template_files: "{{ found.files | map(attribute='path') | select('search', '/templates/[^/]*\\.j2$') | sort }}"

    # A glob that silently matches nothing would make this whole test pass while testing nothing.
    - name: Make sure the search found something
      ansible.builtin.assert:
        that:
          - defaults_files | length > 0
          - template_files | length > 0

    - name: Load the example vars, the vault example, the versions, the derived values and every role's defaults
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop: >-
        {{ [repo + '/group_vars/all/vars.yml.example',
            repo + '/group_vars/all/versions.yml',
            repo + '/group_vars/all/derived.yml',
            repo + '/group_vars/nas/vars.yml.example',
            repo + '/host_vars/vars.yml.example',
            repo + '/group_vars/nas/vault.yml.example',
            repo + '/group_vars/all/vault.yml.example'] + defaults_files }}

    - name: Find every host's vars.yml
      ansible.builtin.find:
        paths: "{{ repo }}/host_vars"
        patterns: ["vars.yml"]
        recurse: true
      register: host_vars_found

    - name: Every key in each vars.yml must also be in its example
      ansible.builtin.include_tasks: check_keys.yml
      loop: "{{ [repo + '/group_vars/all/vars.yml', repo + '/group_vars/nas/vars.yml'] + (host_vars_found.files | map(attribute='path') | list) }}"
      loop_control:
        loop_var: real_file

    - name: Create one output directory per role
      ansible.builtin.file:
        path: "{{ out_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ template_files | map('dirname') | map('dirname') | map('basename') | unique | list }}"

    - name: Render every template into {{ out_dir }}
      ansible.builtin.template:
        src: "{{ item }}"
        dest: "{{ out_dir }}/{{ item | dirname | dirname | basename }}/{{ item | basename | regex_replace('\\.j2$', '') }}"
        mode: "0644"
      loop: "{{ template_files }}"
      loop_control:
        label: "{{ item | dirname | dirname | basename }}/{{ item | basename }}"

# A general server has no group_vars/nas, so only the all/ examples are loaded. A backup template that
# uses a NAS-only variable outside {% if 'nas' in group_names %} fails here as undefined.
- name: Render the backup and cloudflared templates for a general server
  hosts: render-general
  become: false
  gather_facts: false
  vars:
    repo: "{{ playbook_dir }}/.."
    ansible_user: pi
  tasks:
    - name: Load the all/ examples and the backup role's defaults
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "{{ repo }}/group_vars/all/vars.yml.example"
        - "{{ repo }}/group_vars/all/vault.yml.example"
        - "{{ repo }}/group_vars/all/versions.yml"
        - "{{ repo }}/group_vars/all/derived.yml"

    # After include_vars, which would reset drives to the example's empty list.
    - name: Give the host a fast folder on the microSD and a backup drive
      ansible.builtin.set_fact:
        drives:
          - {mount: /srv/apps, roles: [fast]}
          - {uuid: "1111-AAAA", mount: /mnt/backup, fstype: ext4, options: "defaults,nofail", roles: [backup]}

    - name: Find the templates of the roles that run on general servers
      ansible.builtin.find:
        paths: "{{ repo }}/roles/{{ item }}/templates"
        patterns: ["*.j2"]
      loop: [backup, cloudflared]
      register: general_templates

    - name: Create the output directories
      ansible.builtin.file:
        path: "{{ out_dir }}/general/{{ item }}"
        state: directory
        mode: "0755"
      loop: [backup, cloudflared]

    - name: Render them
      ansible.builtin.template:
        src: "{{ item.1.path }}"
        dest: "{{ out_dir }}/general/{{ item.0.item }}/{{ item.1.path | basename | regex_replace('\\.j2$', '') }}"
        mode: "0644"
      loop: "{{ general_templates.results | subelements('files') }}"
      loop_control:
        label: "{{ item.1.path | basename }}"

    - name: The general-server paths follow the fast drive, and the default backup covers them
      ansible.builtin.assert:
        that:
          - dockge_stacks_dir == '/srv/apps/stacks'
          - dockge_data_dir == '/srv/apps/docker/dockge'
          - caddy_data_dir == '/srv/apps/docker/caddy'
          - restic_local_paths == ['/srv/apps']
          - restic_cache_dir == '/srv/apps/restic-cache'

    # Rendered with and without ntfy_alert_url: without it the script must contain no curl, so a host
    # that does not use ntfy only writes to the system log. The shell check runs on both outputs.
    # set_fact, not task vars: include_vars set ntfy_alert_url and outranks them. Keep this last.
    - name: Turn on ntfy alerts for this host
      ansible.builtin.set_fact:
        ntfy_alert_url: http://localhost:8090/alerts

    - name: Render alert.sh with an ntfy topic set
      ansible.builtin.template:
        src: "{{ repo }}/roles/backup/templates/alert.sh.j2"
        dest: "{{ out_dir }}/general/backup/alert-with-ntfy.sh"
        mode: "0644"

    - name: Read both alert.sh renders
      ansible.builtin.slurp:
        src: "{{ out_dir }}/general/backup/{{ item }}"
      loop: [alert.sh, alert-with-ntfy.sh]
      register: alert_scripts

    - name: Only the ntfy render sends anything, and never lets a failed send fail the job
      ansible.builtin.assert:
        that:
          - "'curl' not in (alert_scripts.results[0].content | b64decode)"
          - "'curl' in (alert_scripts.results[1].content | b64decode)"
          - "'--max-time' in (alert_scripts.results[1].content | b64decode)"
          - "'|| true' in (alert_scripts.results[1].content | b64decode)"
