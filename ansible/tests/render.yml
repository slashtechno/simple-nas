---
# Renders every role template against the example vars and checks the result.
# Runs on your machine only (no Pi, no vault): `just test` runs this, then
# shellchecks the rendered scripts. It catches:
#   - a template using a variable that isn't defined in defaults.yml, vars.yml.example,
#     vault.yml.example, versions.yml, web_services.yml or the role's defaults/
#   - a key in a vars.yml (group_vars/all, host_vars/<host>) that no example or role defaults
#     file declares
#   - template syntax errors
#   - a drive layout (tests/inventory.yml) that resolves to the wrong paths, or a role nobody
#     claimed that does not fail with a message naming it
# The Homepage lists every host in `servers`, so the second host needs its settings before the first renders.
- name: Prepare the second server
  hosts: render-peer
  become: false
  gather_facts: false
  tasks:
    - name: Load the shared defaults
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/all/defaults.yml"

    - name: Turn on two services
      ansible.builtin.set_fact:
        dockge_enabled: true
        ntfy_enabled: true

- name: Render all role templates against the example vars
  hosts: render-full
  become: false
  gather_facts: false
  vars:
    repo: "{{ playbook_dir }}/.."
    # Normally set by the inventory or by a task at deploy time.
    ansible_user: pi
    ansible_mounts: []   # a fact, gathered on a real host
  tasks:
    - name: Find every role's defaults and templates
      ansible.builtin.find:
        paths: "{{ repo }}/roles"
        patterns: ["main.yml", "*.j2"]
        recurse: true
      register: found

    - name: Split into defaults and constants files (roles/*/defaults and roles/*/vars) and templates
      ansible.builtin.set_fact:
        defaults_files: "{{ found.files | map(attribute='path') | select('search', '/(defaults|vars)/main.yml$') | sort }}"
        template_files: "{{ found.files | map(attribute='path') | select('search', '/templates/[^/]*\\.j2$') | sort }}"

    # A glob that silently matches nothing would make this whole test pass while testing nothing.
    - name: Make sure the search found something
      ansible.builtin.assert:
        that:
          - defaults_files | length > 0
          - template_files | length > 0

    - name: Load the example vars, the vault example, the versions (role defaults load first, because they have the lowest precedence)
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop: >-
        {{ defaults_files
           + [repo + '/group_vars/all/defaults.yml',
              repo + '/group_vars/all/vars.yml.example',
              repo + '/group_vars/all/versions.yml',
              repo + '/group_vars/all/web_services.yml',
              repo + '/host_vars/vars.yml.example',
              repo + '/host_vars/vault.yml.example',
              repo + '/group_vars/all/vault.yml.example'] }}

    # Every service on, so every template renders. Branches behind other settings (Copyparty's collab, SFTP,
    # /fast and USB volumes; Crafty Bedrock; ntfy iOS push; the Gitea runner; the optional Pics lines) are
    # switched on in the tasks after this one, and the render step asserts their lines reached the output.
    - name: Enable every service
      ansible.builtin.set_fact:
        "{{ item }}_enabled": true
      loop: [immich, copyparty, gitea, homebridge, pics, garage, crafty, ntfy, cloudflared, dockge, homepage, caddy, backup_local, backup_cloud, backup_status]

    - name: Turn on Copyparty's optional volumes and listeners
      ansible.builtin.set_fact:
        copyparty_collab_enabled: true
        copyparty_sftp_enabled: true
        copyparty_fast_enabled: true
        usb_automount_enabled: true

    - name: Turn on the optional settings that add lines to a template
      ansible.builtin.set_fact:
        crafty_bedrock_enabled: true
        homepage_links: [{name: Example, href: "https://example.test", description: "a: b", icon: mdi-star, monitor: true}]
        ntfy_ios_push: true
        vault_gitea_runner_token: "runner$token"
        vault_pics_alert_urls: "ntfy://example"
        pics_artist: Render Test
        pics_website: https://example.test
        pics_instagram: render_test
        caddy_private_domains: [caddy.example.test, second.example.test]
        caddy_sites: {home.caddy.example.test: "homepage:3000"}
        caddy_search_domains: [example.test]
        gitea_subdomain: ""
        cloudflare_api_token: render-test-token

    - name: Turn on the offsite backup
      ansible.builtin.set_fact:
        restic_cloud_repository: "rclone:gdrive:/render-full-backups"

    - name: Read site.yml
      ansible.builtin.slurp:
        src: "{{ repo }}/site.yml"
      register: site_yml

    # An undeclared flag would make the role silently skip (or fail) instead of being off by default.
    - name: Every flag site.yml tests is declared in group_vars/all/defaults.yml
      ansible.builtin.assert:
        that: "(item ~ '_enabled') in lookup('ansible.builtin.file', repo + '/group_vars/all/defaults.yml') | from_yaml"
        fail_msg: "site.yml tests {{ item }}_enabled, which group_vars/all/defaults.yml does not declare."
      loop: "{{ site_yml.content | b64decode | regex_findall('when: (\\w+)_enabled') }}"

    # After include_vars, which would reset drives to the example's empty list.
    - name: Claim every drive role on its own drive
      ansible.builtin.set_fact:
        drives:
          - {uuid: "4444-DDDD", mount: /mnt/fast, fstype: ext4, options: "defaults,nofail", roles: [fast]}
          - {uuid: "5555-EEEE", mount: /mnt/primary, fstype: ext4, options: "defaults,nofail", roles: [primary]}
          - {uuid: "6666-FFFF", mount: /mnt/backup, fstype: ext4, options: "defaults,nofail", roles: [backup]}

    # Written out, not derived: the drives above claim fast and primary on their own drives.
    - name: The data drives are the fast and primary drives, not the backup drive
      ansible.builtin.assert:
        that: data_drive_mounts == ['/mnt/fast', '/mnt/primary']
        quiet: true

    - name: Find every host's vars.yml
      ansible.builtin.find:
        paths: "{{ repo }}/host_vars"
        patterns: ["vars.yml"]
        recurse: true
      register: host_vars_found

    - name: Every key in each vars.yml must also be in its example
      ansible.builtin.include_tasks: check_keys.yml
      loop: "{{ [repo + '/group_vars/all/vars.yml'] + (host_vars_found.files | map(attribute='path') | list) }}"
      loop_control:
        loop_var: real_file

    - name: Create one output directory per role
      ansible.builtin.file:
        path: "{{ out_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ template_files | map('dirname') | map('dirname') | map('basename') | unique | list }}"

    - name: Render every template into {{ out_dir }}
      ansible.builtin.template:
        src: "{{ item }}"
        dest: "{{ out_dir }}/{{ item | dirname | dirname | basename }}/{{ item | basename | regex_replace('\\.j2$', '') }}"
        mode: "0644"
      loop: "{{ template_files }}"
      loop_control:
        label: "{{ item | dirname | dirname | basename }}/{{ item | basename }}"

    # Compose rejects a service whose `environment:` or `volumes:` key has no value, which is what a template
    # leaves behind when its last entry is removed.
    - name: Every rendered compose file has a value under each service's environment and volumes
      ansible.builtin.assert:
        that: >-
          (lookup('ansible.builtin.file', out_dir ~ '/' ~ item ~ '/docker-compose.yml') | from_yaml).services.values()
          | map(attribute=key, default='x') | select('none') | list | length == 0
        quiet: true
      vars:
        key: environment
      loop: "{{ template_files | select('search', '/docker-compose.yml.j2$') | map('dirname') | map('dirname') | map('basename') | list }}"

    # The optional branches above only count as tested if their lines reach the output.
    - name: The optional template branches rendered
      ansible.builtin.assert:
        that:
          - "'19132:19132/udp' in lookup('ansible.builtin.file', out_dir ~ '/crafty/docker-compose.yml')"
          - "'caddy_7.reverse_proxy: \"homepage:3000\"' in lookup('ansible.builtin.file', out_dir ~ '/caddy/docker-compose.yml')"
          - "'caddy_0: \"immich.caddy.example.test immich.second.example.test\"' in lookup('ansible.builtin.file', out_dir ~ '/caddy/docker-compose.yml')"
          - "'caddy_3.reverse_proxy.transport.tls_insecure_skip_verify' in lookup('ansible.builtin.file', out_dir ~ '/caddy/docker-compose.yml')"
          - "'caddy_8: \"http://caddy http://*.caddy\"' in lookup('ansible.builtin.file', out_dir ~ '/caddy/docker-compose.yml')"
          - "'caddy_9.redir: \"https://{host}.example.test{uri}\"' in lookup('ansible.builtin.file', out_dir ~ '/caddy/docker-compose.yml')"
          - "'git.caddy.example.test' not in lookup('ansible.builtin.file', out_dir ~ '/caddy/docker-compose.yml')"
          - "'caddy.acme_dns: cloudflare' in lookup('ansible.builtin.file', out_dir ~ '/caddy/docker-compose.yml')"
          - "'NTFY_UPSTREAM_BASE_URL' in lookup('ansible.builtin.file', out_dir ~ '/ntfy/docker-compose.yml')"
          - "'gitea-runner:' in lookup('ansible.builtin.file', out_dir ~ '/gitea/docker-compose.yml')"
          - "'runner$$token' in lookup('ansible.builtin.file', out_dir ~ '/gitea/docker-compose.yml')"
          - "(garage_data_dir ~ '/meta') in lookup('ansible.builtin.file', out_dir ~ '/backup/restic-excludes-local.txt')"
          - >-
            drives | map(attribute='uuid') | map('lower') | reject('in', lookup('ansible.builtin.file', out_dir ~ '/storage/98-usb-automount.rules')) | list
            | length == 0
          - >-
            drives | map(attribute='uuid') | map('upper') | reject('in', lookup('ansible.builtin.file', out_dir ~ '/storage/98-usb-automount.rules')) | list
            | length == 0
          - "(direct_link_ip ~ '/' ~ direct_link_prefix | string) in lookup('ansible.builtin.file', out_dir ~ '/network/direct-link-netplan.yaml')"
          - "'HUB_ALERT_URLS' in lookup('ansible.builtin.file', out_dir ~ '/pics/pics.env')"
          - "(inventory_hostname ~ ':' ~ homepage_port) in lookup('ansible.builtin.file', out_dir ~ '/homepage/docker-compose.yml')"
          - "(',' ~ homepage_host ~ '\"') in lookup('ansible.builtin.file', out_dir ~ '/homepage/docker-compose.yml')"
          - >-
            (lookup('ansible.builtin.file', out_dir ~ '/homepage/services.yaml') | from_yaml | map('dict2items') | map('first') | map(attribute='key') | list)
            == ['render-full', 'render-peer', 'Links']
          - >-
            (lookup('ansible.builtin.file', out_dir ~ '/homepage/services.yaml') | from_yaml)[0]['render-full'] | length == 9
          - >-
            (lookup('ansible.builtin.file', out_dir ~ '/homepage/services.yaml') | from_yaml)[0]['render-full'] | map('dict2items') | map('first')
            | selectattr('key', 'in', ['Immich', 'Gitea', 'Crafty']) | map(attribute='value') | map(attribute='href') | list
            == ['https://immich.caddy.example.test', 'http://full.example.test:3000', 'https://crafty.caddy.example.test']
          - >-
            (lookup('ansible.builtin.file', out_dir ~ '/homepage/services.yaml') | from_yaml)[1]['render-peer'] | map('dict2items') | map('first')
            | map(attribute='value') | map(attribute='href') | list == ['http://peer.example.test:5001', 'http://peer.example.test:8090']
          - >-
            (lookup('ansible.builtin.file', out_dir ~ '/homepage/services.yaml') | from_yaml)[2].Links[0].Example.description == 'a: b'
          - >-
            (lookup('ansible.builtin.file', out_dir ~ '/homepage/services.yaml') | from_yaml)[2].Links[0].Example.icon == 'mdi-star'
          - >-
            (lookup('ansible.builtin.file', out_dir ~ '/homepage/services.yaml') | from_yaml)[2].Links[0].Example.siteMonitor == 'https://example.test'
          - "'HUB_ARTIST' in lookup('ansible.builtin.file', out_dir ~ '/pics/pics.env')"
          - "'HUB_WEBSITE' in lookup('ansible.builtin.file', out_dir ~ '/pics/pics.env')"
          - "'HUB_INSTAGRAM' in lookup('ansible.builtin.file', out_dir ~ '/pics/pics.env')"
        quiet: true

# One host per drive layout. Only the all/ examples are loaded, so no host's own settings leak in.
- name: Check each drive layout
  hosts: layouts
  become: false
  gather_facts: false
  vars:
    repo: "{{ playbook_dir }}/.."
    ansible_user: pi
  tasks:
    - name: Load the all/ examples and the Backup and Copyparty defaults
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "{{ repo }}/roles/backup/defaults/main.yml"
        - "{{ repo }}/roles/copyparty/defaults/main.yml"
        - "{{ repo }}/group_vars/all/defaults.yml"
        - "{{ repo }}/group_vars/all/vars.yml.example"
        - "{{ repo }}/group_vars/all/vault.yml.example"
        - "{{ repo }}/group_vars/all/versions.yml"

    # After include_vars, which would reset drives to the example's empty list.
    - name: Give the host its fixture drives
      ansible.builtin.set_fact:
        drives: "{{ fixture_drives }}"

    # The flags follow the fixture: local when it claims a backup drive, cloud when it says so.
    - name: Turn the backups on as the fixture says
      ansible.builtin.set_fact:
        backup_local_enabled: "{{ 'backup' not in expect.unclaimed }}"
        backup_cloud_enabled: "{{ expect.cloud | default(false) }}"
        restic_cloud_repository: "{{ 'rclone:gdrive:/test' if expect.cloud | default(false) else '' }}"

    - name: Add the fixture's own backup rules
      ansible.builtin.set_fact:
        restic_local_rules: "{{ restic_local_rules + expect.rules }}"
      when: expect.rules is defined

    - name: Enable the fixture's services
      ansible.builtin.set_fact:
        "{{ item }}_enabled": true
      loop: "{{ expect.services | default([]) }}"

    - name: The paths follow the claimed roles
      vars:
        fixture_paths: "{{ expect.rules | default([]) | reject('match', '^- ') | list }}"
      ansible.builtin.assert:
        that:
          - restic_local_rules | reject('match', '^- ') | list == expect.local_paths + fixture_paths
          - restic_cache_dir == expect.cache_dir

    - name: Read each drive role
      ansible.builtin.set_fact:
        role_probe: "{{ lookup('vars', item ~ '_drive') }}"
      loop: [fast, primary, backup]
      register: role_probes
      ignore_errors: true   # noqa: ignore-errors (an unclaimed role is meant to fail here)

    - name: An unclaimed role fails with a message that names it; a claimed one does not fail
      ansible.builtin.assert:
        that:
          - (item.failed | default(false)) == (item.item in expect.unclaimed)
          - not item.failed | default(false) or item.item in item.msg
      loop: "{{ role_probes.results }}"
      loop_control:
        label: "{{ item.item }}"

    # Every layout renders the backup templates. A host without a backup drive skips the local-only ones,
    # which need the drive's path, and backs up its own data to the cloud instead.
    - name: Render the backup templates
      block:
        - name: Find the backup templates
          ansible.builtin.find:
            paths: "{{ repo }}/roles/backup/templates"
            patterns: ["*.j2"]
          register: backup_templates

        - name: Create the output directory
          ansible.builtin.file:
            path: "{{ out_dir }}/layouts/{{ inventory_hostname }}"
            state: directory
            mode: "0755"

        - name: Render them
          ansible.builtin.template:
            src: "{{ item.path }}"
            dest: "{{ out_dir }}/layouts/{{ inventory_hostname }}/{{ item.path | basename | regex_replace('\\.j2$', '') }}"
            mode: "0644"
          vars:
            local_only: '/(backup-restic-local\.sh|restic-check\.sh|restic-excludes-local\.txt)\.j2$'
          loop: >-
            {{ backup_templates.files if backup_local_enabled | bool
               else backup_templates.files | rejectattr('path', 'search', local_only) | list }}
          loop_control:
            label: "{{ item.path | basename }}"

        - name: Read the offsite script and path list
          ansible.builtin.slurp:
            src: "{{ out_dir }}/layouts/{{ inventory_hostname }}/{{ item }}"
          loop: [backup-restic-cloud.sh, backup-paths.txt, restic-excludes-cloud.txt]
          register: cloud_files

        # The offsite script refuses to run unless every data drive is mounted, and the backup drive when it is local.
        - name: The offsite backup follows the layout
          vars:
            offsite_script: "{{ cloud_files.results[0].content | b64decode }}"
            offsite_paths: "{{ cloud_files.results[1].content | b64decode }}"
            offsite_excludes: "{{ cloud_files.results[2].content | b64decode }}"
          ansible.builtin.assert:
            that:
              - >-
                offsite_script | regex_findall('if ! mountpoint -q \\S+/\\.; then') | length
                == data_drive_mounts | length + (1 if backup_local_enabled | bool else 0)
              - "not offsite_paths is search('(?m)^- ')"
              - "'immich' not in expect.services | default([]) or immich_db_data_location in offsite_excludes"

        - name: Read the local exclude list
          ansible.builtin.slurp:
            src: "{{ out_dir }}/layouts/{{ inventory_hostname }}/restic-excludes-local.txt"
          register: local_excludes_file
          when: backup_local_enabled | bool

        - name: The local exclude list carries the host's own rules
          vars:
            fixture_excludes: "{{ expect.rules | default([]) | select('match', '^- ') | map('regex_replace', '^- ', '') | list }}"
            local_excludes: "{{ local_excludes_file.content | b64decode }}"
          ansible.builtin.assert:
            that: "fixture_excludes | select('in', local_excludes) | list | length == fixture_excludes | length"
          when: backup_local_enabled | bool

        - name: Every service's data is inside a locally backed-up path
          ansible.builtin.import_tasks: ../roles/backup/tasks/check_coverage.yml
          when: backup_local_enabled | bool

        - name: A data directory outside every backed-up path is refused
          when: backup_local_enabled | bool
          block:
            # include_tasks, not import_tasks: the vars below must override the host's values at run time, which a static import does not do.
            - name: Move Immich's photos to an uncovered path
              ansible.builtin.include_tasks: ../roles/backup/tasks/check_coverage.yml
              vars:
                immich_enabled: true
                immich_upload_location: /not-backed-up/photos
            - name: The coverage check must have failed
              ansible.builtin.fail:
                msg: check_coverage.yml accepted a directory outside restic_local_rules
          rescue:
            - name: Only the coverage check may fail here
              ansible.builtin.assert:
                that: "'/not-backed-up/photos' in ansible_failed_result.msg"

        - name: Add a "- <directory>" rule for a directory left out on purpose
          ansible.builtin.set_fact:
            rules_with_opt_out: "{{ restic_local_rules + ['- /not-backed-up/photos'] }}"
          when: backup_local_enabled | bool

        # include_tasks for the same reason as above.
        - name: That rule makes the coverage check accept the directory
          ansible.builtin.include_tasks: ../roles/backup/tasks/check_coverage.yml
          vars:
            immich_enabled: true
            immich_upload_location: /not-backed-up/photos
            restic_local_rules: "{{ rules_with_opt_out }}"
          when: backup_local_enabled | bool

        - name: The local exclude list skips the restic password and the rclone token
          ansible.builtin.assert:
            that:
              - restic_password_file in (local_excludes_file.content | b64decode)
              - "'/.config/rclone' in (local_excludes_file.content | b64decode)"
          when: backup_local_enabled | bool

        # Rendered with and without ntfy_alert_url: without it the script must contain no curl, so a host
        # that does not use ntfy only writes to the system log. The shell check runs on both outputs.
        # set_fact, not task vars: include_vars set ntfy_alert_url and outranks them. Keep this last.
        - name: Turn on ntfy alerts for this host
          ansible.builtin.set_fact:
            ntfy_alert_url: http://localhost:8090/alerts

        - name: Render alert.sh with an ntfy topic set
          ansible.builtin.template:
            src: "{{ repo }}/roles/backup/templates/alert.sh.j2"
            dest: "{{ out_dir }}/layouts/{{ inventory_hostname }}/alert-with-ntfy.sh"
            mode: "0644"

        - name: Read both alert.sh renders
          ansible.builtin.slurp:
            src: "{{ out_dir }}/layouts/{{ inventory_hostname }}/{{ item }}"
          loop: [alert.sh, alert-with-ntfy.sh]
          register: alert_scripts

        - name: Only the ntfy render sends anything, and never lets a failed send fail the job
          ansible.builtin.assert:
            that:
              - "'curl' not in (alert_scripts.results[0].content | b64decode)"
              - "'curl' in (alert_scripts.results[1].content | b64decode)"
              - "'--max-time' in (alert_scripts.results[1].content | b64decode)"
              - "'|| true' in (alert_scripts.results[1].content | b64decode)"
